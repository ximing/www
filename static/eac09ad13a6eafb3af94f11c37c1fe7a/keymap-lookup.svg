<svg xmlns="http://www.w3.org/2000/svg" width="940" height="600" viewBox="0 0 940 600" role="img" aria-labelledby="title"><title id="title">keydownHandler 的查找路径：一次按键最多查三次表，全部落空返回 false</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#182230}.t{font-size:14px;font-weight:700}.h{font-size:13px;font-weight:700}.b{font-size:12px;fill:#334155}.n{font-size:12px;fill:#526176}.o{font-size:11px;fill:#0891b2;font-weight:700}</style><rect width="940" height="600" rx="18" fill="#f8fafc"/><text x="40" y="34" class="t">keydownHandler 的查找路径：一次按键最多查三次表</text><g><rect x="300" y="48" width="340" height="64" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="316" y="72" class="h">keydown 到达 handleKeyDown</text><text x="316" y="90" class="n">keyName(event) 算出键名，优先取 event.key</text><text x="316" y="106" class="n">map 在插件创建时已由 normalize 归一化好</text></g><line x1="470" y1="112" x2="470" y2="136" stroke="#94a3b8" stroke-width="2"/><path d="M470 136 L465 126 L475 126 Z" fill="#94a3b8"/><g><rect x="300" y="140" width="340" height="72" rx="8" fill="#e0f2fe" stroke="#0891b2" stroke-width="1.5"/><text x="316" y="162" class="h">查找 1：modifiers(name, event) 拼前缀直接查</text><text x="316" y="180" class="b">修饰前缀固定顺序 Alt-Ctrl-Meta-Shift-</text><text x="316" y="196" class="n">规格一侧归一化用同一顺序，两边才能对上</text></g><line x1="470" y1="212" x2="470" y2="240" stroke="#94a3b8" stroke-width="2"/><path d="M470 240 L465 230 L475 230 Z" fill="#94a3b8"/><text x="482" y="230" class="n">未命中或命令返回 false</text><g><rect x="300" y="244" width="340" height="72" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="316" y="266" class="h">查找 2：单字符且按着 Shift，去掉 Shift- 再查</text><text x="316" y="284" class="b">Shift-= 产出 +，规格写 + 时靠这次命中</text><text x="316" y="300" class="n">规格约定 Shift 产出的字符不写 Shift- 前缀</text></g><line x1="470" y1="316" x2="470" y2="344" stroke="#94a3b8" stroke-width="2"/><path d="M470 344 L465 334 L475 334 Z" fill="#94a3b8"/><text x="482" y="334" class="n">仍未命中</text><g><rect x="300" y="348" width="340" height="88" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="316" y="370" class="h">查找 3：带 Alt/Ctrl/Meta，按 keyCode 反查原名</text><text x="316" y="388" class="b">base[event.keyCode] 与 keyName 结果不同才查</text><text x="316" y="404" class="b">应对修饰键下键盘布局换字符的情况</text><text x="316" y="422" class="n">Windows 上 Ctrl+Alt 视为 AltGr，跳过这次查找</text></g><line x1="470" y1="436" x2="470" y2="464" stroke="#94a3b8" stroke-width="2"/><path d="M470 464 L465 454 L475 454 Z" fill="#94a3b8"/><text x="482" y="454" class="n">三次落空</text><g><rect x="300" y="468" width="340" height="72" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="316" y="490" class="h">return false</text><text x="316" y="508" class="b">交给后面的插件、 captureKeyDown 兜底</text><text x="316" y="524" class="n">再拦不住放行给浏览器，DOM 变化靠读回对齐</text></g><line x1="640" y1="176" x2="696" y2="252" stroke="#94a3b8" stroke-width="2"/><path d="M696 252 L684 249 L690 240 Z" fill="#94a3b8"/><line x1="640" y1="280" x2="696" y2="278" stroke="#94a3b8" stroke-width="2"/><path d="M696 278 L686 273 L686 283 Z" fill="#94a3b8"/><line x1="640" y1="392" x2="696" y2="304" stroke="#94a3b8" stroke-width="2"/><path d="M696 304 L684 305 L688 295 Z" fill="#94a3b8"/><g><rect x="700" y="232" width="200" height="88" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="716" y="256" class="h">命中且命令返回 true</text><text x="716" y="276" class="n">命令内部 dispatch 了</text><text x="716" y="292" class="n">transaction，view 负责</text><text x="716" y="308" class="n">preventDefault</text></g><text x="40" y="160" class="o">归一化只做一次</text><text x="40" y="180" class="n">规格表的别名、任意修饰顺序、Mod 平台</text><text x="40" y="196" class="n">抽象都在插件创建时折进标准键名，运</text><text x="40" y="212" class="n">行期每次按键的查找是一次属性访问</text><text x="40" y="260" class="o">兜底只覆盖单字符键</text><text x="40" y="280" class="n">Enter、方向键、F2 这类功能键</text><text x="40" y="296" class="n">只有查找 1 一次机会</text><text x="40" y="430" class="o">命令返回 false 的含义</text><text x="40" y="450" class="n">绑定了但当前不执行，例如选区</text><text x="40" y="466" class="n">里没有目标节点。查找继续向</text><text x="40" y="482" class="n">后传递，按键不算被消费</text></svg>
