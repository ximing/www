<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="430" fill="#ffffff"/>

  <rect x="20" y="16" width="640" height="66" rx="6" fill="#eef2ff" stroke="#6366f1"/>
  <text x="340" y="36" font-size="13" fill="#1e1b4b" text-anchor="middle">服务器渲染（renderToString / Fizz）</text>
  <text x="340" y="54" font-size="11" fill="#4338ca" text-anchor="middle">useOpaqueIdentifier() 返回 'R:0'：渲染实例自己的 uniqueID++（Fizz 为 nextOpaqueID++）</text>
  <text x="340" y="70" font-size="11" fill="#4338ca" text-anchor="middle">HTML 输出：&lt;label for="R:0"&gt; 与 &lt;input id="R:0"&gt;</text>

  <line x1="340" y1="82" x2="340" y2="104" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="20" y="108" width="640" height="66" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="340" y="128" font-size="13" fill="#0f172a" text-anchor="middle">hydration：mountOpaqueIdentifier 走 getIsHydrating 分支</text>
  <text x="340" y="146" font-size="11" fill="#64748b" text-anchor="middle">返回不透明对象：toString / valueOf 被替换成 readValue，读取即抛错</text>
  <text x="340" y="162" font-size="11" fill="#64748b" text-anchor="middle">DOM 保留服务器的 R:0，getValueForAttribute 遇到该对象直接放行，不比对</text>

  <line x1="240" y1="174" x2="175" y2="204" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="174" x2="505" y2="204" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="20" y="208" width="310" height="116" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="175" y="230" font-size="12" fill="#78350f" text-anchor="middle">Legacy 模式（ReactDOM.hydrate）</text>
  <text x="175" y="250" font-size="11" fill="#92400e" text-anchor="middle">挂载时挂一个 passive effect</text>
  <text x="175" y="268" font-size="11" fill="#92400e" text-anchor="middle">commit 后 setId(makeId())</text>
  <text x="175" y="286" font-size="11" fill="#92400e" text-anchor="middle">state 换成 'r:0'，重渲染改写属性</text>
  <text x="175" y="306" font-size="11" fill="#92400e" text-anchor="middle">时机：hydration 完成后立即升级</text>

  <rect x="350" y="208" width="310" height="116" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="505" y="230" font-size="12" fill="#0f172a" text-anchor="middle">Concurrent 模式（createRoot 注水）</text>
  <text x="505" y="250" font-size="11" fill="#64748b" text-anchor="middle">不挂 effect，id 长期保持不透明对象</text>
  <text x="505" y="268" font-size="11" fill="#64748b" text-anchor="middle">某次更新里 diffProperties 遇到它</text>
  <text x="505" y="286" font-size="11" fill="#64748b" text-anchor="middle">调 toString()：setId 入队 + 抛错</text>
  <text x="505" y="306" font-size="11" fill="#64748b" text-anchor="middle">同步重试的第二遍渲染带上 'r:0'</text>

  <line x1="175" y1="324" x2="175" y2="356" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="505" y1="324" x2="505" y2="356" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="20" y="360" width="640" height="52" rx="6" fill="#ecfdf5" stroke="#059669"/>
  <text x="340" y="382" font-size="12" fill="#065f46" text-anchor="middle">一致性约束只有一条：同一个 hook 的所有引用在同一次提交里一起换新 id</text>
  <text x="340" y="400" font-size="11" fill="#047857" text-anchor="middle">label 与 input 同时从 R:0 变为 r:0，关联不会断</text>
</svg>
