<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <text x="380" y="34" font-size="15" fill="#4a4a4e" text-anchor="middle" font-weight="600">Enter 键的命令链：chainCommands 的短路求值</text>
  <text x="380" y="54" font-size="12" fill="#8a8a8e" text-anchor="middle">按顺序调用，第一个返回 true 的命令执行并终止整条链</text>

  <!-- newlineInCode -->
  <rect x="60" y="80" width="420" height="64" rx="6" fill="#f7f7f8" stroke="#c8c8cc" stroke-width="1.5"/>
  <text x="80" y="106" font-size="13" fill="#2a6db0" font-weight="600">newlineInCode</text>
  <text x="80" y="128" font-size="12" fill="#4a4a4e">条件：光标在 code 节点内（代码块），插入换行字符</text>

  <line x1="270" y1="144" x2="270" y2="172" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="284" y="162" font-size="11" fill="#8a8a8e">false</text>

  <!-- createParagraphNear -->
  <rect x="60" y="176" width="420" height="64" rx="6" fill="#f7f7f8" stroke="#c8c8cc" stroke-width="1.5"/>
  <text x="80" y="202" font-size="13" fill="#2a6db0" font-weight="600">createParagraphNear</text>
  <text x="80" y="224" font-size="12" fill="#4a4a4e">条件：选中的是块节点，在其前面或后面建一个空段落</text>

  <line x1="270" y1="240" x2="270" y2="268" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="284" y="258" font-size="11" fill="#8a8a8e">false</text>

  <!-- liftEmptyBlock -->
  <rect x="60" y="272" width="420" height="64" rx="6" fill="#f7f7f8" stroke="#c8c8cc" stroke-width="1.5"/>
  <text x="80" y="298" font-size="13" fill="#2a6db0" font-weight="600">liftEmptyBlock</text>
  <text x="80" y="320" font-size="12" fill="#4a4a4e">条件：光标在空文本块里，split 出父容器或 lift 一层</text>

  <line x1="270" y1="336" x2="270" y2="364" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="284" y="354" font-size="11" fill="#8a8a8e">false</text>

  <!-- splitBlock -->
  <rect x="60" y="368" width="420" height="64" rx="6" fill="#eef4fb" stroke="#2a6db0" stroke-width="1.5"/>
  <text x="80" y="394" font-size="13" fill="#2a6db0" font-weight="600">splitBlock</text>
  <text x="80" y="416" font-size="12" fill="#4a4a4e">兜底：分裂当前文本块，块尾回车新块取默认类型</text>

  <!-- true side -->
  <line x1="480" y1="112" x2="560" y2="112" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="480" y1="208" x2="560" y2="208" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="480" y1="304" x2="560" y2="304" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="480" y1="400" x2="560" y2="400" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="566" y="80" width="140" height="352" rx="6" fill="#f7f7f8" stroke="#c8c8cc" stroke-width="1.5"/>
  <text x="636" y="106" font-size="12" fill="#4a4a4e" text-anchor="middle" font-weight="600">true：执行</text>
  <g font-size="11" fill="#8a8a8e">
    <text x="636" y="140" text-anchor="middle">dispatch 事务</text>
    <text x="636" y="162" text-anchor="middle">scrollIntoView</text>
    <text x="636" y="196" text-anchor="middle">view 收到 true</text>
    <text x="636" y="218" text-anchor="middle">preventDefault</text>
    <text x="636" y="252" text-anchor="middle">后续命令</text>
    <text x="636" y="274" text-anchor="middle">不再求值</text>
  </g>
  <line x1="586" y1="300" x2="686" y2="300" stroke="#c8c8cc" stroke-width="1"/>
  <g font-size="11" fill="#8a8a8e">
    <text x="636" y="330" text-anchor="middle">全部 false：</text>
    <text x="636" y="352" text-anchor="middle">事件继续传播</text>
    <text x="636" y="374" text-anchor="middle">交给下一个</text>
    <text x="636" y="396" text-anchor="middle">keymap 或浏览器</text>
  </g>
</svg>
