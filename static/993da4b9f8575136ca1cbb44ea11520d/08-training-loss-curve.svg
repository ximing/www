  <!-- 图例 -->
  <circle cx="345" cy="612" r="5" fill="#58a6ff"/>
  <text x="357" y="616" fill="#c9d1d9" font-size="11">搭建</text>
  <circle cx="435" cy="612" r="5" fill="#f85149"/>
  <text x="447" y="616" fill="#c9d1d9" font-size="11">调试修复</text>
  <circle cx="555" cy="612" r="5" fill="#3fb950"/>
  <text x="567" y="616" fill="#c9d1d9" font-size="11">里程碑</text>

  <text x="500" y="650" text-anchor="middle" fill="#8b949e" font-size="11">调试全部发生在试跑阶段；d285cce 清零日志后由 e08a80b 正式开跑，上方曲线即这次 run 的结果</text>
