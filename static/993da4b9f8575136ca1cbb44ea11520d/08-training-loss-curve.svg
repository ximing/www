  <text x="80" y="460" fill="#c9d1d9" font-size="12">调试时间线（commit 日期 2023-04-15 ~ 05-18）</text>

  <line x1="80" y1="500" x2="940" y2="500" stroke="#30363d" stroke-width="2"/>
  <text x="76" y="522" fill="#8b949e" font-size="10">04-15</text>
  <text x="944" y="522" text-anchor="end" fill="#8b949e" font-size="10">05-18</text>

  <!-- 92cd515 建仓库（上） -->
  <circle cx="80" cy="500" r="6" fill="#58a6ff"/>
  <text x="80" y="468" text-anchor="middle" fill="#8b949e" font-size="10">92cd515</text>
  <text x="80" y="482" text-anchor="middle" fill="#c9d1d9" font-size="11">建仓库</text>

