<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999999"></path>
    </marker>
    <linearGradient id="edgeHot" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f4c04a"></stop>
      <stop offset="100%" stop-color="#d64545"></stop>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="720" height="460" fill="#12161c"></rect>

  <!-- edges -->
  <g stroke-linecap="round">
    <line x1="150" y1="90" x2="360" y2="220" stroke="#d64545" stroke-width="6" marker-end="url(#arrow)"></line>
    <line x1="360" y1="220" x2="590" y2="120" stroke="#e07b39" stroke-width="4" marker-end="url(#arrow)"></line>
    <line x1="360" y1="220" x2="590" y2="300" stroke="#d64545" stroke-width="7" marker-end="url(#arrow)"></line>
    <line x1="360" y1="220" x2="160" y2="330" stroke="#4a90d9" stroke-width="2.5" marker-end="url(#arrow)"></line>
    <line x1="590" y1="300" x2="470" y2="400" stroke="#4a90d9" stroke-width="2" marker-end="url(#arrow)"></line>
    <line x1="150" y1="90" x2="360" y2="60" stroke="#4a90d9" stroke-width="2" marker-end="url(#arrow)"></line>
  </g>

  <!-- flow dots along the hottest edge (call chain: 下单 -> 订单核心) -->
  <g fill="#ffffff">
    <circle cx="204" cy="116" r="4"></circle>
    <circle cx="258" cy="142" r="4"></circle>
    <circle cx="312" cy="168" r="4"></circle>
  </g>
  <g fill="#ffffff" opacity="0.85">
    <circle cx="420" cy="248" r="3.5"></circle>
    <circle cx="480" cy="271" r="3.5"></circle>
    <circle cx="540" cy="284" r="3.5"></circle>
  </g>

  <!-- nodes -->
  <g>
    <circle cx="150" cy="90" r="30" fill="#e07b39"></circle>
    <text x="150" y="95" text-anchor="middle" font-size="13" fill="#12161c">下单</text>
  </g>

  <g>
    <circle cx="360" cy="220" r="38" fill="#d64545"></circle>
    <text x="360" y="216" text-anchor="middle" font-size="13" fill="#ffffff">订单核心</text>
    <text x="360" y="232" text-anchor="middle" font-size="10" fill="#ffffff">QPS 最高</text>
  </g>

  <g>
    <circle cx="590" cy="120" r="24" fill="#f4c04a"></circle>
    <text x="590" y="125" text-anchor="middle" font-size="12" fill="#12161c">库存</text>
  </g>

  <g>
    <circle cx="590" cy="300" r="30" fill="#e07b39"></circle>
    <text x="590" y="305" text-anchor="middle" font-size="12" fill="#12161c">支付</text>
  </g>

  <g>
    <circle cx="160" cy="330" r="20" fill="#4a90d9"></circle>
    <text x="160" y="335" text-anchor="middle" font-size="11" fill="#ffffff">用户</text>
  </g>

  <g>
    <circle cx="470" cy="400" r="18" fill="#4a90d9"></circle>
    <text x="470" y="405" text-anchor="middle" font-size="11" fill="#ffffff">对账</text>
  </g>

  <!-- legend -->
  <g font-size="11" fill="#c9ccd1">
    <text x="20" y="30">节点颜色 = 服务当前 QPS（越红越高）</text>
    <text x="20" y="48">连线颜色/粗细 = 两服务间调用 QPS</text>
    <text x="20" y="66">小白点沿线移动 = 调用方向</text>
  </g>
</svg>
