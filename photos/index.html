      // 导航高亮(方案 §6.2):SiteChrome 加了 transition:persist,岛 props 跨页
      // 不更新,Gatsby 的 activeClassName/partiallyActive 机制同步作废;改由本
      // 脚本按 location.pathname 对 Header 输出的 a[data-nav-to] 增删高亮类。
      // 两套规则复刻 Header 现状:
      // - 桌面(a.nav-link,原 Header.tsx:128-136):加 nav-link-active;
      //   "/" 精确匹配,其余前缀匹配(partiallyActive={link.to !== "/"})。
      // - 移动(#mobile-menu a,原 Header.tsx:250-263):加 text-accent
      //   bg-accent-subtle;仅精确匹配(移动 Link 未传 partiallyActive)。
      // astro:page-load 首屏与每次换页都触发,一处监听覆盖两种场景。
      // 首屏时序坑:page-load 可能先于 SiteChrome 岛的 React hydration,
      // 此时加的高亮类会被 hydration 按 vdom 抹掉(实测);astro-island 水合
      // 完成时派发 astro:hydrate,补挂一次性监听重放一遍。本脚本内容跨页
      // 逐字相同,ClientRouter 对其去重只执行一次,监听不会累积。
      function updateNavHighlight() {
        var path = location.pathname;
        document
          .querySelectorAll("a.nav-link[data-nav-to]")
          .forEach(function (a) {
            var to = a.getAttribute("data-nav-to");
            var active = to === "/" ? path === "/" : path.indexOf(to) === 0;
            a.classList.toggle("nav-link-active", active);
          });
        document
          .querySelectorAll("#mobile-menu a[data-nav-to]")
          .forEach(function (a) {
            var to = a.getAttribute("data-nav-to");
            var active = path === to;
            a.classList.toggle("text-accent", active);
            a.classList.toggle("bg-accent-subtle", active);
          });
      }
      document.addEventListener("astro:page-load", updateNavHighlight);
      var chromeIsland = document.querySelector(
        'astro-island[data-astro-transition-persist="chrome"]'
      );
      if (chromeIsland) {
        chromeIsland.addEventListener("astro:hydrate", updateNavHighlight, {
          once: true,
        });
      }
    </script><script type="module" src="/_astro/BaseLayout.astro_astro_type_script_index_0_lang.DjG2Mx9T.js"></script><script type="text/javascript" async src="https://s4.cnzz.com/z_stat.php?id=1278634919&web_id=1278634919"></script></body></html>
