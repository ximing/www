<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">Harness 驱动的需求交付闭环</title><desc id="desc">人工定义需求和技术方案，Agent 实现代码，通过规则、Hooks、编译和运行时工具获得反馈，修复后重复验证，最终人工确认交付。</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#182230}.title{font-size:29px;font-weight:700}.label{font-size:21px;font-weight:700}.sub{font-size:17px;fill:#526176}.small{font-size:16px;fill:#526176}</style><rect width="1200" height="640" rx="20" fill="#f8fafc"/><text x="48" y="54" class="title">Harness 驱动的需求交付闭环</text><rect x="45" y="86" width="1110" height="100" rx="18" fill="#e0f2fe" stroke="#38bdf8" stroke-width="3"/><text x="75" y="129" class="label">人：定义目标与边界</text><text x="75" y="160" class="sub">PRD · 设计稿 · API · 技术方案 · 交付条件</text><path d="M600 187v48" stroke="#64748b" stroke-width="5"/><path d="m588 225 12 20 12-20" fill="none" stroke="#64748b" stroke-width="5"/><rect x="55" y="245" width="205" height="130" rx="18" fill="#ede9fe" stroke="#8b5cf6" stroke-width="3"/><text x="103" y="292" class="label">Agent 实现</text><text x="79" y="325" class="sub">读取方案、规则与</text><text x="89" y="350" class="sub">领域上下文</text><rect x="345" y="245" width="205" height="130" rx="18" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/><text x="393" y="292" class="label">Hooks 门禁</text><text x="375" y="325" class="sub">规范、依赖、类型</text><text x="389" y="350" class="sub">与编译检查</text><rect x="635" y="245" width="205" height="130" rx="18" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/><text x="690" y="292" class="label">运行时调试</text><text x="666" y="325" class="sub">工具调用、日志、</text><text x="675" y="350" class="sub">状态与异常信息</text><rect x="925" y="245" width="205" height="130" rx="18" fill="#fee2e2" stroke="#ef4444" stroke-width="3"/><text x="978" y="292" class="label">验证结果</text><text x="963" y="325" class="sub">测试、行为与</text><text x="979" y="350" class="sub">交付条件</text><g fill="none" st