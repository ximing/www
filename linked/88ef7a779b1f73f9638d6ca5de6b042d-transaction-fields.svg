<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <!-- Transform parent -->
  <rect x="30" y="90" width="220" height="220" fill="#f3ecdf" stroke="#a5854a"/>
  <text x="140" y="112" text-anchor="middle" font-size="13" fill="#6b4c22">Transform（父类）</text>
  <text x="42" y="138" font-size="11" fill="#6b4c22">doc（当前文档）</text>
  <text x="42" y="158" font-size="11" fill="#6b4c22">steps[] / docs[] / mapping</text>
  <text x="42" y="178" font-size="11" fill="#6b4c22">before / docChanged</text>
  <text x="42" y="198" font-size="11" fill="#6b4c22">step() / replace / insert</text>
  <text x="42" y="218" font-size="11" fill="#6b4c22">addMark / removeMark ...</text>
  <text x="42" y="246" font-size="10" fill="#777">只管文档修改与位置映射</text>
  <text x="42" y="262" font-size="10" fill="#777">对选区、格式意图无感知</text>

  <!-- inheritance arrow -->
  <line x1="330" y1="200" x2="250" y2="200" stroke="#666" stroke-width="1" marker-end="url(#arr2)"/>
  <text x="290" y="192" text-anchor="middle" font-size="11" fill="#555">extends</text>

  <!-- Transaction -->
  <rect x="330" y="40" width="360" height="330" fill="#e8eef7" stroke="#4a6fa5" stroke-width="2"/>
  <text x="510" y="62" text-anchor="middle" font-size="13" fill="#2c4a73">Transaction 新增的状态语义</text>

  <rect x="344" y="76" width="332" height="56" fill="#fdfdfd" stroke="#4a6fa5"/>
  <text x="356" y="96" font-size="11" fill="#2c4a73">time: number</text>
  <text x="356" y="114" font-size="10" fill="#777">构造时取 Date.now()，setTime 可改，history 撤销分组用</text>

  <rect x="344" y="140" width="332" height="56" fill="#fdfdfd" stroke="#4a6fa5"/>
  <text x="356" y="160" font-size="11" fill="#2c4a73">curSelection / curSelectionFor</text>
  <text x="356" y="178" font-size="10" fill="#777">选区惰性映射：读 selection 时才映射新加的 step</text>

  <rect x="344" y="204" width="332" height="56" fill="#fdfdfd" stroke="#4a6fa5"/>
  <text x="356" y="224" font-size="11" fill="#2c4a73">storedMarks</text>
  <text x="356" y="242" font-size="10" fill="#777">下一次输入的格式意图；任何 step 或 setSelection 都会清空</text>

  <rect x="344" y="268" width="332" height="56" fill="#fdfdfd" stroke="#4a6fa5"/>
  <text x="356" y="288" font-size="11" fill="#2c4a73">meta: {[key]: any}</text>
  <text x="356" y="306" font-size="10" fill="#777">setMeta/getMeta，键可以是字符串、Plugin 或 PluginKey</text>

  <rect x="344" y="332" width="332" height="26" fill="#fdfdfd" stroke="#4a6fa5"/>
  <text x="356" y="349" font-size="11" fill="#2c4a73">updated 位图：SEL = 1 / MARKS = 2 / SCROLL = 4</text>
</svg>
