<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <text x="40" y="24" font-size="12" fill="#555">flatten 的位置记账：doc(p("one &lt;a&gt;two ", em("three&lt;b&gt; four"))) 摊平后的标签位置</text>

  <text x="40" y="52" font-size="12" font-family="SF Mono, Menlo, monospace" fill="#333">doc(p("one &lt;a&gt;two ", em("three&lt;b&gt; four")))</text>

  <!-- p node bar: pos 0..20, scale 26px/unit, origin x=60, y=70 -->
  <g font-size="11" text-anchor="middle">
    <rect x="60" y="70" width="26" height="40" fill="#e8e8e8" stroke="#999"/>
    <text x="73" y="94" fill="#777">&#10216;p&#10217;</text>
    <rect x="86" y="70" width="208" height="40" fill="#f5f5f5" stroke="#999"/>
    <text x="190" y="94" fill="#555">text "one two "</text>
    <rect x="294" y="70" width="260" height="40" fill="#dce8f7" stroke="#999"/>
    <text x="424" y="94" fill="#2c4a73">text "three four"（带 em mark）</text>
    <rect x="554" y="70" width="26" height="40" fill="#e8e8e8" stroke="#999"/>
    <text x="567" y="94" fill="#777">&#10216;/p&#10217;</text>
  </g>

  <!-- position ticks -->
  <g stroke="#bbb" stroke-width="1">
    <line x1="60" y1="110" x2="60" y2="120"/>
    <line x1="86" y1="110" x2="86" y2="120"/>
    <line x1="112" y1="110" x2="112" y2="116"/>
    <line x1="138" y1="110" x2="138" y2="116"/>
    <line x1="164" y1="110" x2="164" y2="116"/>
    <line x1="190" y1="110" x2="190" y2="120"/>
    <line x1="216" y1="110" x2="216" y2="116"/>
    <line x1="242" y1="110" x2="242" y2="116"/>
    <line x1="268" y1="110" x2="268" y2="116"/>
    <line x1="294" y1="110" x2="294" y2="120"/>
    <line x1="320" y1="110" x2="320" y2="116"/>
    <line x1="346" y1="110" x2="346" y2="116"/>
    <line x1="372" y1="110" x2="372" y2="116"/>
    <line x1="398" y1="110" x2="398" y2="116"/>
    <line x1="424" y1="110" x2="424" y2="120"/>
    <line x1="450" y1="110" x2="450" y2="116"/>
    <line x1="476" y1="110" x2="476" y2="116"/>
    <line x1="502" y1="110" x2="502" y2="116"/>
    <line x1="528" y1="110" x2="528" y2="116"/>
    <line x1="554" y1="110" x2="554" y2="120"/>
    <line x1="580" y1="110" x2="580" y2="120"/>
  </g>
  <g font-size="10" fill="#777" text-anchor="middle" font-family="SF Mono, Menlo, monospace">
    <text x="60" y="132">0</text>
    <text x="86" y="132">1</text>
    <text x="190" y="132">5</text>
    <text x="294" y="132">9</text>
    <text x="424" y="132">14</text>
    <text x="554" y="132">19</text>
    <text x="580" y="132">20</text>
  </g>

  <!-- tag arrows -->
  <line x1="190" y1="70" x2="190" y2="52" stroke="#c0392b" stroke-width="1"/>
  <circle cx="190" cy="70" r="3" fill="#c0392b"/>
  <text x="196" y="58" font-size="11" fill="#c0392b">tag a = 5（"one " 之后）</text>

  <line x1="424" y1="70" x2="424" y2="52" stroke="#c0392b" stroke-width="1"/>
  <circle cx="424" cy="70" r="3" fill="#c0392b"/>
  <text x="430" y="58" font-size="11" fill="#c0392b">tag b = 14（"three" 之后）</text>

  <!-- tag bookkeeping -->
  <rect x="60" y="160" width="520" height="72" fill="#fafafa" stroke="#ccc"/>
  <g font-size="12" fill="#333" font-family="SF Mono, Menlo, monospace">
    <text x="76" y="184">p 内部坐标：tag = {a: 4, b: 13}</text>
    <text x="76" y="206">并入 doc 时 +1（跳过 p 的开标签 token）</text>
    <text x="76" y="226">doc.tag = {a: 5, b: 14}</text>
  </g>

  <g font-size="11" fill="#777">
    <text x="40" y="262">可见字符各占 1 个位置，尖括号标签不进文本、不占位置，多个标签可记在同一位置。</text>
    <text x="40" y="282">em 是 mark 不是节点，它的产物经 flat 展开，不引入包裹 token，位置连续。</text>
    <text x="40" y="302">字符串里只含标签时不产生文本节点，因此标签可以落在两个块节点之间。</text>
  </g>
</svg>
