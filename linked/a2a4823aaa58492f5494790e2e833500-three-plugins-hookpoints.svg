<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a7d44"/>
    </marker>
  </defs>

  <!-- dispatch -->
  <rect x="30" y="18" width="300" height="44" fill="#e8eef7" stroke="#4a6fa5"/>
  <text x="180" y="37" text-anchor="middle" font-size="12" fill="#2c4a73">dispatchTransaction(tr)</text>
  <text x="180" y="53" text-anchor="middle" font-size="10" fill="#777">view 把事务交进来，调 state.apply(tr)</text>

  <line x1="180" y1="62" x2="180" y2="82" stroke="#666" stroke-width="1" marker-end="url(#arr)"/>

  <!-- stage 1: filter -->
  <rect x="30" y="84" width="300" height="56" fill="#e8eef7" stroke="#4a6fa5" stroke-width="2"/>
  <text x="180" y="106" text-anchor="middle" font-size="12" fill="#2c4a73">① filterTransaction(tr, state)</text>
  <text x="180" y="124" text-anchor="middle" font-size="10" fill="#555">任一插件返回 false，整笔事务作废</text>

  <line x1="180" y1="140" x2="180" y2="160" stroke="#666" stroke-width="1" marker-end="url(#arr)"/>

  <!-- stage 2: applyInner -->
  <rect x="30" y="162" width="300" height="56" fill="#e8eef7" stroke="#4a6fa5" stroke-width="2"/>
  <text x="180" y="184" text-anchor="middle" font-size="12" fill="#2c4a73">② applyInner：逐字段 apply</text>
  <text x="180" y="202" text-anchor="middle" font-size="10" fill="#555">doc / selection / 各插件 StateField.apply</text>

  <line x1="180" y1="218" x2="180" y2="238" stroke="#666" stroke-width="1" marker-end="url(#arr)"/>

  <!-- stage 3: append loop -->
  <rect x="30" y="240" width="300" height="56" fill="#e8eef7" stroke="#4a6fa5" stroke-width="2"/>
  <text x="180" y="262" text-anchor="middle" font-size="12" fill="#2c4a73">③ appendTransaction 循环</text>
  <text x="180" y="280" text-anchor="middle" font-size="10" fill="#555">追加的事务同样要过 filterTransaction</text>

  <line x1="180" y1="296" x2="180" y2="316" stroke="#666" stroke-width="1" marker-end="url(#arr)"/>

  <!-- new state -->
  <rect x="30" y="318" width="300" height="44" fill="#e8eef7" stroke="#4a6fa5"/>
  <text x="180" y="337" text-anchor="middle" font-size="12" fill="#2c4a73">新 EditorState</text>
  <text x="180" y="353" text-anchor="middle" font-size="10" fill="#777">view.updateState(newState)</text>

  <line x1="180" y1="362" x2="180" y2="382" stroke="#666" stroke-width="1" marker-end="url(#arr)"/>

  <!-- stage 4: plugin views -->
  <rect x="30" y="384" width="300" height="56" fill="#e8eef7" stroke="#4a6fa5" stroke-width="2"/>
  <text x="180" y="406" text-anchor="middle" font-size="12" fill="#2c4a73">④ 各 PluginView.update(view, prevState)</text>
  <text x="180" y="424" text-anchor="middle" font-size="10" fill="#555">destroy 在 view 销毁或插件集合变化时调用</text>

  <!-- plugin 2: readonly -->
  <rect x="420" y="84" width="310" height="56" fill="#f3ecdf" stroke="#a5854a" stroke-width="2"/>
  <text x="436" y="106" font-size="12" fill="#6b4c22">插件二 · 只读开关</text>
  <text x="436" y="124" font-size="10" fill="#777">只读时对所有 docChanged 的事务返回 false</text>
  <line x1="330" y1="112" x2="418" y2="112" stroke="#3a7d44" stroke-width="1.2" marker-end="url(#arrG)"/>

  <!-- plugin 1: char count -->
  <rect x="420" y="162" width="310" height="56" fill="#f3ecdf" stroke="#a5854a" stroke-width="2"/>
  <text x="436" y="184" font-size="12" fill="#6b4c22">插件一 · 字符统计</text>
  <text x="436" y="202" font-size="10" fill="#777">StateField.apply 里用 newState.doc 重算字数</text>
  <line x1="330" y1="190" x2="418" y2="190" stroke="#3a7d44" stroke-width="1.2" marker-end="url(#arrG)"/>

  <!-- plugin 3: selection reporter -->
  <rect x="420" y="384" width="310" height="56" fill="#f3ecdf" stroke="#a5854a" stroke-width="2"/>
  <text x="436" y="406" font-size="12" fill="#6b4c22">插件三 · 选区上报</text>
  <text x="436" y="424" font-size="10" fill="#777">update 里用 selection.eq 去重后对外上报</text>
  <line x1="330" y1="412" x2="418" y2="412" stroke="#3a7d44" stroke-width="1.2" marker-end="url(#arrG)"/>

  <!-- note -->
  <text x="420" y="300" font-size="10" fill="#777">三个插件各挂在一个环节上，</text>
  <text x="420" y="316" font-size="10" fill="#777">同一笔 dispatch 里依次被调到。</text>
</svg>
