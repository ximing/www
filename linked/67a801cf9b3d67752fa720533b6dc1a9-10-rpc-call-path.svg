<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 540" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrBlu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrGrn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="1020" height="540" rx="8" fill="#f8fafc"/>
  <text x="24" y="34" font-size="16" font-weight="600" fill="#1f2937">一次 RPC 调用的完整路径与各环节失败形态</text>
  <text x="24" y="55" font-size="12" fill="#64748b">本地调用只经过"方法执行"一步；远程调用多出代理、序列化、网络、线程池四层，每层失败语义不同</text>

  <!-- 角色分区背景 -->
  <rect x="16" y="74" width="470" height="300" rx="6" fill="#eff6ff" opacity="0.55"/>
  <text x="32" y="94" font-size="13" font-weight="600" fill="#1d4ed8">Consumer 调用方</text>
  <rect x="514" y="74" width="490" height="300" rx="6" fill="#f0fdf4" opacity="0.6"/>
  <text x="530" y="94" font-size="13" font-weight="600" fill="#16a34a">Provider 提供方</text>

  <!-- 网络分界 -->
  <rect x="488" y="110" width="24" height="74" rx="3" fill="#fef3c7" stroke="#ca8a04" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="500" y="150" font-size="10" fill="#92400e" text-anchor="middle" transform="rotate(-90 500 150)">网络</text>

  <!-- ============ 六个环节 ============ -->
  <!-- ① 动态代理 -->
  <rect x="30" y="112" width="138" height="72" rx="5" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="99" y="134" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle">① 动态代理</text>
  <text x="99" y="152" font-size="10" fill="#475569" text-anchor="middle">stub 拦截方法调用</text>
  <text x="99" y="168" font-size="10" fill="#475569" text-anchor="middle">组装请求对象</text>

  <!-- ② 序列化 -->
  <rect x="184" y="112" width="138" height="72" rx="5" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="253" y="134" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle">② 序列化</text>
  <text x="253" y="152" font-size="10" fill="#475569" text-anchor="middle">对象 → 字节流</text>
  <text x="253" y="168" font-size="10" fill="#475569" text-anchor="middle">按协议编码字段</text>

  <!-- ③ 网络发送 -->
  <rect x="338" y="112" width="138" height="72" rx="5" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="407" y="134" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle">③ 网络发送</text>
  <text x="407" y="152" font-size="10" fill="#475569" text-anchor="middle">Netty IO 线程写</text>
  <text x="407" y="168" font-size="10" fill="#475569" text-anchor="middle">socket 发出</text>

  <!-- ④ 线程池接收 -->
  <rect x="524" y="112" width="138" height="72" rx="5" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <text x="593" y="134" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle">④ 线程池接收</text>
  <text x="593" y="152" font-size="10" fill="#475569" text-anchor="middle">IO 线程投递业务池</text>
  <text x="593" y="168" font-size="10" fill="#475569" text-anchor="middle">竞争共享线程</text>

  <!-- ⑤ 反序列化 -->
  <rect x="678" y="112" width="138" height="72" rx="5" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <text x="747" y="134" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle">⑤ 反序列化</text>
  <text x="747" y="152" font-size="10" fill="#475569" text-anchor="middle">字节流 → 对象</text>
  <text x="747" y="168" font-size="10" fill="#475569" text-anchor="middle">按字段编号还原</text>

  <!-- ⑥ 业务执行 -->
  <rect x="832" y="112" width="138" height="72" rx="5" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <text x="901" y="134" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle">⑥ 业务执行</text>
  <text x="901" y="152" font-size="10" fill="#475569" text-anchor="middle">调用真实实现</text>
  <text x="901" y="168" font-size="10" fill="#475569" text-anchor="middle">返回结果</text>

  <!-- 正向调用箭头 -->
  <line x1="168" y1="148" x2="182" y2="148" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="322" y1="148" x2="336" y2="148" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="476" y1="148" x2="522" y2="148" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="662" y1="148" x2="676" y2="148" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="816" y1="148" x2="830" y2="148" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- 响应返回箭头 -->
  <path d="M 901 184 Q 901 210 500 210 Q 99 210 99 184" fill="none" stroke="#16a34a" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#arrGrn)"/>
  <text x="500" y="228" font-size="10" fill="#16a34a" text-anchor="middle">响应原路返回：序列化 → 网络 → 反序列化 → 代理返回调用方</text>

  <!-- ============ 失败形态标注 ============ -->
  <text x="24" y="262" font-size="12" font-weight="600" fill="#dc2626">各环节失败形态</text>

  <rect x="30" y="274" width="138" height="86" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="0.8"/>
  <text x="38" y="292" font-size="10" fill="#dc2626" font-weight="600">① 代理层</text>
  <text x="38" y="308" font-size="9.5" fill="#7f1d1d">· 服务版本不匹配</text>
  <text x="38" y="322" font-size="9.5" fill="#7f1d1d">· 注册中心无提供者</text>
  <text x="38" y="336" font-size="9.5" fill="#7f1d1d">· 跨语言类型无映射</text>
  <text x="38" y="350" font-size="9" fill="#9ca3af">配置性错误，编译期不报</text>

  <rect x="184" y="274" width="138" height="86" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="0.8"/>
  <text x="192" y="292" font-size="10" fill="#dc2626" font-weight="600">② 序列化层</text>
  <text x="192" y="308" font-size="9.5" fill="#7f1d1d">· 不支持的类型</text>
  <text x="192" y="322" font-size="9.5" fill="#7f1d1d">· 循环引用</text>
  <text x="192" y="336" font-size="9.5" fill="#7f1d1d">· 类版本不一致</text>
  <text x="192" y="350" font-size="9" fill="#9ca3af">大对象序列化耗时长</text>

  <rect x="338" y="274" width="138" height="86" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="0.8"/>
  <text x="346" y="292" font-size="10" fill="#dc2626" font-weight="600">③ 网络层</text>
  <text x="346" y="308" font-size="9.5" fill="#7f1d1d">· 连接超时</text>
  <text x="346" y="322" font-size="9.5" fill="#7f1d1d">· 半开连接</text>
  <text x="346" y="336" font-size="9.5" fill="#7f1d1d">· 请求已发响应未回</text>
  <text x="346" y="350" font-size="9" fill="#9ca3af">本地调用不存在的状态</text>

  <rect x="524" y="274" width="138" height="86" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="0.8"/>
  <text x="532" y="292" font-size="10" fill="#dc2626" font-weight="600">④ 线程池层</text>
  <text x="532" y="308" font-size="9.5" fill="#7f1d1d">· 线程池满</text>
  <text x="532" y="322" font-size="9.5" fill="#7f1d1d">· 拒绝策略触发</text>
  <text x="532" y="336" font-size="9.5" fill="#7f1d1d">· 慢接口拖累同机接口</text>
  <text x="532" y="350" font-size="9" fill="#9ca3af">共享池，非调用方独占</text>

  <rect x="678" y="274" width="138" height="86" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="0.8"/>
  <text x="686" y="292" font-size="10" fill="#dc2626" font-weight="600">⑤ 反序列化层</text>
  <text x="686" y="308" font-size="9.5" fill="#7f1d1d">· 字段编号复用读串</text>
  <text x="686" y="322" font-size="9.5" fill="#7f1d1d">· 类型不匹配</text>
  <text x="686" y="336" font-size="9.5" fill="#7f1d1d">· 字段缺失</text>
  <text x="686" y="350" font-size="9" fill="#9ca3af">编号复用不报错，读串</text>

  <rect x="832" y="274" width="138" height="86" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="0.8"/>
  <text x="840" y="292" font-size="10" fill="#dc2626" font-weight="600">⑥ 业务执行</text>
  <text x="840" y="308" font-size="9.5" fill="#7f1d1d">· 业务异常</text>
  <text x="840" y="322" font-size="9.5" fill="#7f1d1d">· 执行超时</text>
  <text x="840" y="336" font-size="9.5" fill="#7f1d1d">· 下游依赖失败</text>
  <text x="840" y="350" font-size="9" fill="#9ca3af">框架只负责抛回，不处理</text>

  <!-- ============ 本地调用对照 ============ -->
  <rect x="30" y="394" width="940" height="64" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="44" y="416" font-size="12" font-weight="600" fill="#334155">本地调用 vs 远程调用</text>
  <text x="44" y="436" font-size="10.5" fill="#475569">本地调用：调用方线程栈直接执行，不超时、不失败一半、不序列化、不竞争远端线程池</text>
  <text x="44" y="452" font-size="10.5" fill="#475569">远程调用：上述六层任一失败都包装成异常抛回调用方；异常码区分连不上 / 超时 / 序列化失败 / 线程池拒绝，调用方需分别处理</text>

  <text x="500" y="520" font-size="10" fill="#94a3b8" text-anchor="middle">多数 RPC 框架网络层建立在 Netty 之上（见本系列第 4 篇）</text>
</svg>
