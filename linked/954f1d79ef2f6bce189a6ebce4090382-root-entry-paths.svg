<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Menlo, Consolas, monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <text x="190" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Legacy 入口</text>
  <text x="570" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Concurrent 入口</text>

  <rect x="40" y="45" width="300" height="46" rx="6" fill="#fdf2f2" stroke="#c0392b"/>
  <text x="190" y="64" text-anchor="middle" fill="#333">ReactDOM.render(element, container, cb)</text>
  <text x="190" y="82" text-anchor="middle" fill="#888" font-size="11">dev 下打废弃警告，行为等同 React 17</text>

  <rect x="40" y="115" width="300" height="34" rx="6" fill="#f7f7f7" stroke="#999"/>
  <text x="190" y="137" text-anchor="middle" fill="#333">legacyRenderSubtreeIntoContainer</text>

  <rect x="40" y="173" width="300" height="46" rx="6" fill="#f7f7f7" stroke="#999"/>
  <text x="190" y="192" text-anchor="middle" fill="#333">createContainer(container, LegacyRoot)</text>
  <text x="190" y="210" text-anchor="middle" fill="#888" font-size="11">HostRoot fiber 的 mode = NoMode</text>

  <rect x="40" y="243" width="300" height="46" rx="6" fill="#f7f7f7" stroke="#999"/>
  <text x="190" y="262" text-anchor="middle" fill="#333">首挂载包一层 flushSync 同步完成</text>
  <text x="190" y="280" text-anchor="middle" fill="#888" font-size="11">requestUpdateLane 直接返回 SyncLane</text>

  <rect x="420" y="45" width="300" height="46" rx="6" fill="#eef6fd" stroke="#2471a3"/>
  <text x="570" y="64" text-anchor="middle" fill="#333">createRoot(container).render(children)</text>
  <text x="570" y="82" text-anchor="middle" fill="#888" font-size="11">不支持第二个 callback 参数</text>

  <rect x="420" y="115" width="300" height="34" rx="6" fill="#f7f7f7" stroke="#999"/>
  <text x="570" y="137" text-anchor="middle" fill="#333">createContainer(container, ConcurrentRoot)</text>

  <rect x="420" y="173" width="300" height="46" rx="6" fill="#f7f7f7" stroke="#999"/>
  <text x="570" y="192" text-anchor="middle" fill="#333">HostRoot fiber 的 mode 带 ConcurrentMode</text>
  <text x="570" y="210" text-anchor="middle" fill="#888" font-size="11">事件外的更新拿 DefaultLane</text>

  <rect x="420" y="243" width="300" height="46" rx="6" fill="#f7f7f7" stroke="#999"/>
  <text x="570" y="262" text-anchor="middle" fill="#333">updateContainer 直接调度，不包 flushSync</text>
  <text x="570" y="280" text-anchor="middle" fill="#888" font-size="11">scheduleCallback 走 Scheduler，不做时间切片</text>

  <rect x="230" y="315" width="300" height="34" rx="6" fill="#eaf7ea" stroke="#27ae60"/>
  <text x="380" y="337" text-anchor="middle" fill="#333">ReactFiberReconciler.new.js updateContainer</text>

  <line x1="190" y1="91" x2="190" y2="115" stroke="#555" marker-end="url(#arrow)"/>
  <line x1="190" y1="149" x2="190" y2="173" stroke="#555" marker-end="url(#arrow)"/>
  <line x1="190" y1="219" x2="190" y2="243" stroke="#555" marker-end="url(#arrow)"/>
  <line x1="190" y1="289" x2="300" y2="315" stroke="#555" marker-end="url(#arrow)"/>
  <line x1="570" y1="91" x2="570" y2="115" stroke="#555" marker-end="url(#arrow)"/>
  <line x1="570" y1="149" x2="570" y2="173" stroke="#555" marker-end="url(#arrow)"/>
  <line x1="570" y1="219" x2="570" y2="243" stroke="#555" marker-end="url(#arrow)"/>
  <line x1="570" y1="289" x2="460" y2="315" stroke="#555" marker-end="url(#arrow)"/>
</svg>
