<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title"><title id="title">ir × dr 的三种位置关系</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#182230}.h{font-size:26px;font-weight:700}.s{font-size:17px;fill:#475569}.b{font-size:19px;font-weight:700}.r{font-size:19px;font-weight:700;fill:#dc2626}</style><rect width="1200" height="340" rx="18" fill="#f8fafc"/><text x="40" y="52" class="h">a 的插入区间 [i, i+a) 与 b 删除一行的三种位置关系</text><text x="52" y="96" class="r">b: dr</text><path d="M80 104v96" stroke="#ef4444" stroke-width="4"/><rect x="120" y="120" width="150" height="60" rx="10" fill="#e0f2fe" stroke="#38bdf8" stroke-width="3"/><text x="150" y="108" class="b">a: ir</text><text x="143" y="156" class="s">[i, i+a)</text><text x="60" y="240" class="s">b 在 a 的区间左边</text><text x="60" y="272" class="b">a.i 减 1</text><rect x="520" y="120" width="150" height="60" rx="10" fill="#e0f2fe" stroke="#38bdf8" stroke-width="3"/><text x="550" y="108" class="b">a: ir</text><text x="543" y="156" class="s">[i, i+a)</text><text x="702" y="96" class="r">b: dr</text><path d="M730 104v96" stroke="#ef4444" stroke-width="4"/><text x="520" y="240" class="s">b 在 a 的区间右边</text><text x="520" y="272" class="b">b.i 加 a.a</text><rect x="920" y="120" width="150" height="60" rx="10" fill="#e0f2fe" stroke="#38bdf8" stroke-width="3"/><text x="950" y="108" class="b">a: ir</text><text x="943" y="156" class="s">[i, i+a)</text><text x="963" y="96" class="r">b: dr</text><path d="M995 104v96" stroke="#ef4444" stroke-width="4"/><text x="920" y="240" class="s">b 落在插入区间内部</text><text x="920" y="272" class="b">b.i 加 a.a</text></svg>
