<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="465" viewBox="0 0 1200 465" role="img" aria-labelledby="title desc"><title id="title">工具输出、缓存与失败处理</title><desc id="desc">Claude Code 在请求路径管理工具输出和缓存状态，Pi harness 保证会话写入队列在单次失败后仍可继续。</desc><defs><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.h{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.b{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#34415a}.s{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#667085}.pi{fill:#eaf2ff;stroke:#6b9df5;stroke-width:2}.cc{fill:#fff2e7;stroke:#e99a58;stroke-width:2}.n{fill:#f7f8fa;stroke:#d0d5dd;stroke-width:1.5}.a{stroke:#98a2b3;stroke-width:2;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#98a2b3"/></marker></defs><rect width="1200" height="465" rx="24" fill="#fff"/><text x="48" y="52" class="t">工具输出、缓存与失败：请求侧资源管理和会话写入可靠性</text><text x="48" y="95" class="h">Pi agent-core harness：写入队列可在单次失败后继续</text><rect x="48" y="118" width="510" height="296" rx="16" class="pi"/><rect x="78" y="164" width="110" height="60" rx="10" class="n"/><text x="95" y="199" class="b">append #1</text><path d="M188 194H223" class="a"/><rect x="223" y="164" width="110" height="60" rx="10" class="n"/><text x="241" y="199" class="b">失败</text><path d="M333 194H368" class="a"/><rect x="368" y="164" width="130" height="60" rx="10" class="n"/><text x="388" y="199" class="b">append #2</text><text x="78" y="268" class="s">appendTail 吸收本次成功或失败结果，后续追加不会永远停在失败 promise 后。</text><rect x="100" y="314" width="406" height="55" rx="10" class="n"/><text x="122" y="347" class="b">compaction：保持 tool call / tool result 的成对完整性</text><text x="644" y="95" class="h">Claude Code：工具输出与 prompt cache 在 query 路径处理</text><rect x="644" y="118" width="508" height="296" rx="16" class="cc"/><rect x="674" y="154" width="116" height="60" rx="10" class="n"/><text x="687" y="189" class="b">大工具输出</text><path d="M790 184H818" class="a"/><rect x="818" y="154" width="118" height="60" rx="10" class="n"/><text x="835" y="189" class="b">外置 + 替换</text><path d="M936 184H964" class="a"/><rect x="964" y="154" width="158" height="60" rx="10" class="n"/><text x="982" y="179" class="b">content replacement</text><text x="993" y="201" class="s">resume 重放</text><rect x="674" y="258" width="448" height="62" rx="10" class="n"/><text x="697" y="285" class="b">cache-break detection：比较 cache read token 与请求侧状态</text><text x="697" y="307" class="s">cached microcompact 的预期删除不算 break；compact 后重置基线</text><rect x="674" y="344" width="448" height="45" rx="10" class="n"/><text x="695" y="372" class="b">413 → reactive compact；连续 autocompact 失败三次后熔断</text></svg>