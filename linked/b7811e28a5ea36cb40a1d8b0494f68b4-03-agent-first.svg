<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title"><title id="title">从面向人到面向 Agent 的工程资产</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#182230}.h{font-size:28px;font-weight:700}.s{font-size:18px;fill:#475569}.b{font-size:20px;font-weight:600}</style><rect width="1200" height="430" rx="18" fill="#f8fafc"/><text x="115" y="65" class="h">Human-Centric</text><text x="770" y="65" class="h">Agent-First</text><rect x="55" y="95" width="420" height="275" rx="20" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/><rect x="725" y="95" width="420" height="275" rx="20" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/><text x="95" y="150" class="b">长文档、GUI、会议纪要</text><text x="95" y="195" class="b">隐性经验与口头约定</text><text x="95" y="240" class="b">人工拼接碎片化上下文</text><text x="95" y="305" class="s">依赖人的理解与判断</text><path d="M500 230H700" stroke="#64748b" stroke-width="6"/><path d="m685 214 24 16-24 16" fill="none" stroke="#64748b" stroke-width="6"/><text x="765" y="150" class="b">Schema、规则、ADR、元数据</text><text x="765" y="195" class="b">CLI、API、受控工具接口</text><text x="765" y="240" class="b">按目录与任务逐层加载</text><text x="765" y="305" class="s">机器可读、可发现、可执行</text></svg>