<svg xmlns="http://www.w3.org/2000/svg" width="940" height="380" viewBox="0 0 940 380" role="img" aria-labelledby="title"><title id="title">state 选区与 DOM 选区的双向同步路径</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#182230}.t{font-size:14px;font-weight:700}.h{font-size:13px;font-weight:700}.b{font-size:12px;fill:#334155}.n{font-size:12px;fill:#526176}.o{font-size:11px;fill:#0891b2;font-weight:700}</style><rect width="940" height="380" rx="18" fill="#f8fafc"/><text x="40" y="34" class="t">选区的双向同步：写出与读回</text><text x="40" y="56" class="o">主动写：state → DOM</text><g><rect x="40" y="66" width="180" height="92" rx="8" fill="#e0f2fe" stroke="#0891b2" stroke-width="1.5"/><text x="54" y="88" class="h">state.selection</text><text x="54" y="108" class="b">TextSelection ·</text><text x="54" y="124" class="b">NodeSelection</text><text x="54" y="144" class="n">anchor / head 是文档位置</text></g><line x1="220" y1="112" x2="244" y2="112" stroke="#94a3b8" stroke-width="2"/><path d="M244 112 L234 107 L234 117 Z" fill="#94a3b8"/><g><rect x="250" y="66" width="196" height="92" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="264" y="88" class="h">selectionToDOM</text><text x="264" y="108" class="b">syncNodeSelection 先行</text><text x="264" y="126" class="b">editorOwnsSelection 闸门</text><text x="264" y="144" class="n">期间断开 selectionchange</text></g><line x1="446" y1="112" x2="470" y2="112" stroke="#94a3b8" stroke-width="2"/><path d="M470 112 L460 107 L460 117 Z" fill="#94a3b8"/><g><rect x="476" y="66" width="200" height="92" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="490" y="88" class="h">docView.setSelection</text><text x="490" y="108" class="b">domFromPos 换算两端</text><text x="490" y="126" class="b">等价则跳过不重设</text><text x="490" y="144" class="n">collapse + extend / Range</text></g><line x1="676" y1="112" x2="700" y2="112" stroke="#94a3b8" stroke-width="2"/><path d="M700 112 L690 107 L690 117 Z" fill="#94a3b8"/><g><rect x="706" y="66" width="194" height="92" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="720" y="88" class="h">DOM Selection</text><text x="720" y="108" class="b">anchorNode / anchorOffset</text><text x="720" y="126" class="b">focusNode / focusOffset</text><text x="720" y="144" class="n">浏览器持有，随时会变</text></g><text x="706" y="196" class="o">被动读：DOM → state</text><g><rect x="706" y="206" width="194" height="92" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="720" y="228" class="h">selectionchange</text><text x="720" y="248" class="b">hasFocusAndSelection 闸门</text><text x="720" y="266" class="b">50ms 抑制窗口则回写</text><text x="720" y="284" class="n">flush 里比对 currentSelection</text></g><line x1="700" y1="252" x2="676" y2="252" stroke="#94a3b8" stroke-width="2"/><path d="M676 252 L686 247 L686 257 Z" fill="#94a3b8"/><g><rect x="476" y="206" width="194" height="92" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="490" y="228" class="h">selectionFromDOM</text><text x="490" y="248" class="b">posFromDOM 读 head / anchor</text><text x="490" y="266" class="b">原子节点识别 NodeSelection</text><text x="490" y="284" class="n">selectionBetween 构造选区</text></g><line x1="470" y1="252" x2="446" y2="252" stroke="#94a3b8" stroke-width="2"/><path d="M446 252 L456 247 L456 257 Z" fill="#94a3b8"/><g><rect x="250" y="206" width="190" height="92" rx="8" fill="#e0f2fe" stroke="#0891b2" stroke-width="1.5"/><text x="264" y="228" class="h">tr.setSelection</text><text x="264" y="248" class="b">dispatchTransaction</text><text x="264" y="266" class="b">pointer meta / scrollIntoView</text><text x="264" y="284" class="n">apply 出新的 state</text></g><line x1="140" y1="206" x2="140" y2="164" stroke="#94a3b8" stroke-width="2"/><path d="M140 164 L135 174 L145 174 Z" fill="#94a3b8"/><line x1="250" y1="252" x2="140" y2="252" stroke="#94a3b8" stroke-width="2"/><text x="40" y="340" class="n">两个方向各有闸门：写 DOM 前 disconnectSelection，防止自己的写入被读回；读 DOM 前比对 currentSelection 缓存，防止把没变化的选区重复写进 state。</text></svg>
