<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title"><title id="title">Mark 的存储方式：扁平挂在文本节点上，与假想嵌套节点的对照</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#182230}.t{font-size:14px;font-weight:700}.h{font-size:13px;font-weight:700}.b{font-size:12px;fill:#334155}.n{font-size:12px;fill:#526176}.o{font-size:11px;fill:#0891b2;font-weight:700}.w{font-size:11px;fill:#dc2626;font-weight:700}</style><rect width="900" height="620" rx="18" fill="#f8fafc"/><text x="40" y="34" class="t">Mark 的存储方式：strong 覆盖 "abc"，em 覆盖 "cde"，两个区间在 "c" 上重叠</text><text x="60" y="72" class="h">ProseMirror 的表示：paragraph 下三个文本节点，marks 存在各自的数组里</text><g><rect x="60" y="88" width="780" height="150" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="76" y="112" class="h">Node · type: paragraph</text><g><rect x="90" y="128" width="210" height="90" rx="8" fill="#ecfccb" stroke="#65a30d" stroke-width="1.5"/><text x="106" y="152" class="h">TextNode · text: "ab"</text><text x="106" y="174" class="b">marks: [strong]</text></g><g><rect x="345" y="128" width="210" height="90" rx="8" fill="#ecfccb" stroke="#65a30d" stroke-width="1.5"/><text x="361" y="152" class="h">TextNode · text: "c"</text><text x="361" y="174" class="b">marks: [em, strong]</text></g><g><rect x="600" y="128" width="210" height="90" rx="8" fill="#ecfccb" stroke="#65a30d" stroke-width="1.5"/><text x="616" y="152" class="h">TextNode · text: "de"</text><text x="616" y="174" class="b">marks: [em]</text></g></g><text x="60" y="266" class="n">重叠字符 "c" 所在的节点带两个 mark；加格式只是在范围内重建途经的文本节点，树的形状不变</text><text x="60" y="316" class="h">假想嵌套节点：两个格式的区间交叉，一棵树放不下</text><g><rect x="60" y="332" width="780" height="160" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="120" y="372" class="b" font-size="16" letter-spacing="14">a b c d e</text><line x1="118" y1="392" x2="438" y2="392" stroke="#65a30d" stroke-width="2.5"/><line x1="118" y1="384" x2="118" y2="392" stroke="#65a30d" stroke-width="2.5"/><line x1="438" y1="384" x2="438" y2="392" stroke="#65a30d" stroke-width="2.5"/><text x="258" y="416" class="o">strong: [0, 3)</text><line x1="278" y1="432" x2="598" y2="432" stroke="#0891b2" stroke-width="2.5"/><line x1="278" y1="424" x2="278" y2="432" stroke="#0891b2" stroke-width="2.5"/><line x1="598" y1="424" x2="598" y2="432" stroke="#0891b2" stroke-width="2.5"/><text x="418" y="456" class="o">em: [2, 5)</text><text x="640" y="372" class="w">em 横跨 strong 的右边界</text><text x="640" y="392" class="w">无法表达成父子嵌套</text></g><text x="60" y="530" class="n">嵌套方案里 em 要么完整落在 strong 内、要么在外；[2, 5) 两种都不是</text><text x="60" y="556" class="n">要塞进树只能沿格式边界切分节点，每改一次格式树就重组一次，区间操作退化成结构调整</text><text x="60" y="592" class="n">扁平 marks 的代价：相邻节点重复存同一集合（用共享数组与单例 mark 摊薄）；换来任意区间可表示、修改不动树形</text></svg>
