<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title"><title id="title">ParseContext 的节点栈与 open 指针：enterInner、closeExtra、sync、findPlace 四个操作</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#182230}.t{font-size:14px;font-weight:700}.h{font-size:13px;font-weight:700}.b{font-size:12px;fill:#334155}.n{font-size:12px;fill:#526176}.o{font-size:11px;fill:#0891b2;font-weight:700}</style><rect width="900" height="440" rx="18" fill="#f8fafc"/><text x="40" y="36" class="t">ParseContext：nodes 栈与 open 指针</text><text x="30" y="70" class="h">栈快照（解析进行到 blockquote 内第二个段落）</text><text x="30" y="128" class="n">nodes[3]</text><rect x="120" y="100" width="350" height="56" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/><text x="136" y="124" class="b">已结束的 p，等待 closeExtra 回收</text><text x="136" y="142" class="n">open 之上的栈位不是垃圾，finish 后并入父层</text><text x="30" y="200" class="n">nodes[2]</text><rect x="120" y="172" width="350" height="56" rx="8" fill="#e0f2fe" stroke="#0891b2" stroke-width="1.5"/><text x="136" y="196" class="b">p ｜ content: [text "foo"]</text><text x="136" y="214" class="n">当前写入层</text><text x="30" y="216" class="o">open = 2</text><text x="30" y="232" class="o">top = nodes[open]</text><text x="30" y="272" class="n">nodes[1]</text><rect x="120" y="244" width="350" height="56" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="136" y="268" class="b">blockquote ｜ content: []</text><text x="30" y="344" class="n">nodes[0]</text><rect x="120" y="316" width="350" height="56" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="136" y="340" class="b">doc（顶层，parseSlice 时 type 为空）</text><text x="520" y="70" class="h">四个栈操作</text><text x="520" y="104" class="h">enterInner(type, attrs, marks)</text><text x="520" y="124" class="n">push 一个 NodeContext，open += 1；新层收不下的</text><text x="520" y="142" class="n">mark 继续往内层传</text><text x="520" y="182" class="h">closeExtra()</text><text x="520" y="202" class="n">open 之上的节点逐个 finish，结果并入父层</text><text x="520" y="220" class="n">content，栈截断到 open + 1</text><text x="520" y="260" class="h">sync(to)</text><text x="520" y="280" class="n">open 回退到目标 NodeContext 所在层；preserve</text><text x="520" y="298" class="n">Whitespace 生效中时沿途层补置保留位</text><text x="520" y="338" class="h">findPlace(node)</text><text x="520" y="358" class="n">从 open 向下找能容纳新节点的层，必要时用</text><text x="520" y="376" class="n">findWrapping 补包裹节点；每穿一个 solid 层罚 2 分</text><text x="40" y="416" class="n">NodeContext 记录 type / attrs / marks / content / match / solid / options（空白保留与 OPEN_LEFT 位标记）</text></svg>
