<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title"><title id="title">Node 与 Fragment 的结构：doc(paragraph("hi"), image)</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#182230}.t{font-size:14px;font-weight:700}.h{font-size:13px;font-weight:700}.b{font-size:12px;fill:#334155}.n{font-size:12px;fill:#526176}.o{font-size:11px;fill:#0891b2;font-weight:700}</style><rect width="900" height="500" rx="18" fill="#f8fafc"/><text x="40" y="34" class="t">Node 与 Fragment 的结构：doc(paragraph("hi"), image)</text><g><rect x="60" y="56" width="330" height="92" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="76" y="80" class="h">Node</text><text x="76" y="100" class="b">type: doc</text><text x="76" y="118" class="b">attrs: {} · marks: []</text><text x="76" y="136" class="b">content: Fragment ─→</text></g><g><rect x="520" y="56" width="330" height="92" rx="8" fill="#e0f2fe" stroke="#0891b2" stroke-width="1.5"/><text x="536" y="80" class="h">Fragment</text><text x="536" y="100" class="b">content: [paragraph, image]</text><text x="536" y="118" class="b">size: 5（= 4 + 1，构造时缓存）</text><text x="536" y="136" class="n">childCount: 2</text></g><line x1="390" y1="102" x2="512" y2="102" stroke="#94a3b8" stroke-width="2"/><path d="M512 102 L500 97 L500 107 Z" fill="#94a3b8"/><g><rect x="60" y="216" width="330" height="72" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="76" y="242" class="h">Node · type: paragraph</text><text x="76" y="264" class="b">nodeSize = 2 + content.size = 4</text></g><g><rect x="520" y="216" width="330" height="72" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="536" y="242" class="h">Node · type: image（叶节点）</text><text x="536" y="264" class="b">nodeSize = 1</text></g><line x1="600" y1="148" x2="300" y2="210" stroke="#94a3b8" stroke-width="2"/><path d="M300 210 L311 203 L314 214 Z" fill="#94a3b8"/><text x="330" y="188" class="o">offset 0</text><line x1="760" y1="148" x2="700" y2="210" stroke="#94a3b8" stroke-width="2"/><path d="M700 210 L712 206 L711 217 Z" fill="#94a3b8"/><text x="716" y="188" class="o">offset 4</text><g><rect x="60" y="356" width="330" height="72" rx="8" fill="#e0f2fe" stroke="#0891b2" stroke-width="1.5"/><text x="76" y="382" class="h">Fragment</text><text x="76" y="402" class="b">content: [text "hi"] · size: 2</text><text x="76" y="420" class="n">childCount: 1</text></g><line x1="225" y1="288" x2="225" y2="348" stroke="#94a3b8" stroke-width="2"/><path d="M225 348 L220 336 L230 336 Z" fill="#94a3b8"/><g><rect x="520" y="356" width="330" height="72" rx="8" fill="#ecfccb" stroke="#65a30d" stroke-width="1.5"/><text x="536" y="382" class="h">TextNode · text: "hi"</text><text x="536" y="402" class="b">nodeSize = text.length = 2</text></g><line x1="390" y1="392" x2="512" y2="392" stroke="#94a3b8" stroke-width="2"/><path d="M512 392 L500 387 L500 397 Z" fill="#94a3b8"/><text x="60" y="472" class="n">doc.nodeSize = 2 + 5 = 7 · doc.childCount = 2　｜　paragraph.nodeSize = 4 · paragraph.childCount = 1</text></svg>
