<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">从 Session 历史到 provider 请求的上下文投影</title><desc id="desc">Pi 从当前 leaf 路径投影 Context，Claude Code 对 messagesForQuery 依次应用可选资源管理步骤。</desc><defs><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.h{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.b{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#34415a}.s{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#667085}.pi{fill:#eaf2ff;stroke:#6b9df5;stroke-width:2}.cc{fill:#fff2e7;stroke:#e99a58;stroke-width:2}.n{fill:#f7f8fa;stroke:#d0d5dd;stroke-width:1.5}.a{stroke:#98a2b3;stroke-width:2;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#98a2b3"/></marker></defs><rect width="1200" height="500" rx="24" fill="#fff"/><text x="48" y="52" class="t">Context 投影：Pi 选择路径，Claude Code 在请求前变换工作数组</text><text x="48" y="94" class="h">Pi agent-core harness</text><rect x="48" y="118" width="1104" height="120" rx="16" class="pi"/><rect x="77" y="148" width="175" height="60" rx="10" class="n"/><text x="98" y="183" class="b">完整 entry 日志</text><path d="M252 178H300" class="a"/><rect x="300" y="148" width="175" height="60" rx="10" class="n"/><text x="326" y="183" class="b">leaf 路径回溯</text><path d="M475 178H523" class="a"/><rect x="523" y="148" width="205" height="60" rx="10" class="n"/><text x="544" y="173" class="b">状态重放 + compaction</text><text x="575" y="195" class="s">entry transform</text><path d="M728 178H776" class="a"/><rect x="776" y="148" width="160" height="60" rx="10" class="n"/><text x="800" y="183" class="b">context.messages</text><path d="M936 178H984" class="a"/><rect x="984" y="148" width="138" height="60" rx="10" class="n"/><text x="1003" y="183" class="b">provider</text><text x="80" y="270" class="s">请求还会组合 harness 当前持有的 model、thinkingLevel、activeTools 与独立 system prompt。</text><text x="48" y="324" class="h">Claude Code</text><rect x="48" y="348" width="1104" height="112" rx="16" class="cc"/><rect x="72" y="375" width="140" height="58" rx="10" class="n"/><text x="92" y="409" class="b">transcript</text><path d="M212 404H238" class="a"/><rect x="238" y="375" width="150" height="58" rx="10" class="n"/><text x="251" y="409" class="b">tool result budget</text><path d="M388 404H414" class="a"/><rect x="414" y="375" width="142" height="58" rx="10" class="n"/><text x="438" y="409" class="b">snip / microcompact</text><path d="M556 404H582" class="a"/><rect x="582" y="375" width="142" height="58" rx="10" class="n"/><text x="607" y="409" class="b">collapse</text><path d="M724 404H750" class="a"/><rect x="750" y="375" width="150" height="58" rx="10" class="n"/><text x="773" y="409" class="b">autocompact</text><path d="M900 404H926" class="a"/><rect x="926" y="375" width="190" height="58" rx="10" class="n"/><text x="950" y="409" class="b">messagesForQuery</text><text x="72" y="450" class="s">各步骤由 feature、模型能力和运行状态控制，可能不执行或不改变消息。</text></svg>