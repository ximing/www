<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720" role="img" aria-labelledby="title"><title id="title">schema-basic 结构总览：block 组、inline 组与 marks</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#182230}.t{font-size:14px;font-weight:700}.h{font-size:13px;font-weight:700}.b{font-size:12px;fill:#334155}.n{font-size:12px;fill:#526176}.o{font-size:11px;fill:#0891b2;font-weight:700}.c{font-size:12px;fill:#334155;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style><rect width="900" height="720" rx="18" fill="#f8fafc"/><text x="40" y="34" class="t">schema-basic 结构总览：doc 引用 block 组，块级节点的内容再引用 inline 组，mark 默认对所有 inline 内容开放</text><g><rect x="330" y="58" width="240" height="54" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="398" y="81" class="h">doc</text><text x="380" y="100" class="c">content: "block+"</text></g><line x1="430" y1="112" x2="270" y2="146" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/><g><rect x="40" y="150" width="420" height="320" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="60" y="178" class="h">block 组（group: "block"）</text><text x="60" y="210" class="b">paragraph</text><text x="150" y="210" class="n">content: "inline*"</text><text x="60" y="228" class="o">最普通的文本块，Enter 分割的兜底类型</text><text x="60" y="262" class="b">blockquote</text><text x="150" y="262" class="n">content: "block+"　defining</text><text x="60" y="280" class="o">块级容器，自身在 block 组，可嵌套</text><text x="60" y="314" class="b">horizontal_rule</text><text x="180" y="314" class="n">无 content，叶节点</text><text x="60" y="332" class="o">可被 NodeSelection 整节点选中</text><text x="60" y="366" class="b">heading</text><text x="150" y="366" class="n">content: "inline*"　attrs: level　defining</text><text x="60" y="384" class="o">解析六条静态规则，序列化按 level 拼标签</text><text x="60" y="418" class="b">code_block</text><text x="150" y="418" class="n">content: "text*"　marks: ""　code　defining</text><text x="60" y="436" class="o">只要纯文本，节点层禁掉全部 mark</text></g><g><rect x="520" y="150" width="340" height="210" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="540" y="178" class="h">inline 组（group: "inline"）</text><text x="540" y="210" class="b">text</text><text x="620" y="210" class="n">纯文本，序列化走默认行为</text><text x="540" y="262" class="b">image</text><text x="620" y="262" class="n">内联叶节点　draggable</text><text x="540" y="280" class="o">attrs: src / alt / title，getAttrs 读取</text><text x="540" y="332" class="b">hard_break</text><text x="620" y="332" class="n">内联叶节点　selectable: false</text></g><line x1="460" y1="230" x2="514" y2="230" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/><text x="420" y="220" class="n" text-anchor="end">inline 内容引用</text><g><rect x="520" y="390" width="340" height="250" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="540" y="418" class="h">marks</text><text x="540" y="450" class="b">link</text><text x="620" y="450" class="n">attrs: href / title　inclusive: false</text><text x="540" y="502" class="b">em</text><text x="620" y="502" class="n">解析含 font-style=italic</text><text x="540" y="520" class="o">font-style=normal 时 clearMark 剥掉</text><text x="540" y="572" class="b">strong</text><text x="620" y="572" class="n">b 标签先查 font-weight 再认</text><text x="540" y="624" class="b">code</text><text x="620" y="624" class="n">code: true，标记代码字体</text></g><line x1="690" y1="360" x2="690" y2="384" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/><text x="700" y="378" class="n">inline 内容默认允许全部 mark</text><text x="40" y="510" class="n">excludes 三层实例：MarkSpec.excludes 默认排除同类型 mark；code_block 的 marks: "" 在节点层整体关闭；</text><text x="40" y="534" class="n">strong 的 getAttrs 返回 false 与 em 的 clearMark 在解析层拒绝或剥除</text><text x="40" y="586" class="h">不在本包的部分</text><text x="40" y="612" class="n">ordered_list / bullet_list / list_item 由 prosemirror-schema-list 提供，addListNodes 把它们追加进节点表，</text><text x="40" y="636" class="n">列表项的内容表达式由调用方传入，官方建议形如 "paragraph block*"</text><text x="40" y="690" class="n">成品导出：export const schema = new Schema({nodes, marks})，example-setup 与多数 demo 直接使用</text></svg>
