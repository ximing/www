<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470" role="img" aria-labelledby="title"><title id="title">Fiber 的链表树结构与 alternate 双缓冲</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#182230}.t{font-size:17px;font-weight:700}.n{font-size:15px;font-weight:700}.s{font-size:13px;fill:#526176}</style><rect width="860" height="470" rx="18" fill="#f8fafc"/><line x1="430" y1="40" x2="430" y2="430" stroke="#e2e8f0" stroke-width="2"/><text x="215" y="60" class="t" text-anchor="middle">链表表达的树结构</text><text x="645" y="60" class="t" text-anchor="middle">alternate 双缓冲</text><rect x="155" y="90" width="120" height="42" rx="10" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2.5"/><text x="215" y="116" class="n" text-anchor="middle">父 Fiber</text><rect x="35" y="230" width="110" height="42" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2.5"/><text x="90" y="256" class="n" text-anchor="middle">子 B</text><rect x="160" y="230" width="110" height="42" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2.5"/><text x="215" y="256" class="n" text-anchor="middle">子 C</text><rect x="285" y="230" width="110" height="42" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2.5"/><text x="340" y="256" class="n" text-anchor="middle">子 D</text><path d="M170 132 L95 230" fill="none" stroke="#64748b" stroke-width="2.5"/><path d="M103 224 L95 230 L105 232" fill="none" stroke="#64748b" stroke-width="2.5"/><text x="108" y="180" class="s">child</text><path d="M145 251 L160 251" fill="none" stroke="#64748b" stroke-width="2.5"/><path d="M154 246 L160 251 L154 256" fill="none" stroke="#64748b" stroke-width="2.5"/><path d="M270 251 L285 251" fill="none" stroke="#64748b" stroke-width="2.5"/><path d="M279 246 L285 251 L279 256" fill="none" stroke="#64748b" stroke-width="2.5"/><text x="152" y="240" class="s">sibling</text><path d="M228 230 L228 132" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6 5"/><path d="M223 140 L228 132 L233 140" fill="none" stroke="#f59e0b" stroke-width="2.5"/><text x="238" y="185" class="s">return</text><text x="215" y="330" class="s" text-anchor="middle">一棵只有一个孩子的父节点，其余孩子挂在 sibling 链表上</text><text x="215" y="352" class="s" text-anchor="middle">每个子节点用 return 指回父节点，遍历时不需要调用栈</text><rect x="462" y="100" width="150" height="48" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2.5"/><text x="537" y="121" class="n" text-anchor="middle">current</text><text x="537" y="140" class="s" text-anchor="middle">已上屏的树</text><rect x="678" y="100" width="150" height="48" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/><text x="753" y="121" class="n" text-anchor="middle">workInProgress</text><text x="753" y="140" class="s" text-anchor="middle">后台渲染中的树</text><path d="M612 124 L678 124" fill="none" stroke="#64748b" stroke-width="2.5"/><path d="M624 119 L612 124 L624 129 M666 119 L678 124 L666 129" fill="none" stroke="#64748b" stroke-width="2.5"/><text x="645" y="112" class="s" text-anchor="middle">alternate</text><text x="645" y="210" class="s" text-anchor="middle">两棵树的同名节点通过 alternate 互相引用</text><text x="645" y="232" class="s" text-anchor="middle">渲染在 workInProgress 上原地修改，不碰屏幕上的树</text><text x="645" y="254" class="s" text-anchor="middle">commit 完成后翻转，旧树成为下一轮的 workInProgress</text><text x="645" y="300" class="s" text-anchor="middle">（packages/react-reconciler/src/ReactFiber.new.js</text><text x="645" y="322" class="s" text-anchor="middle">的 createWorkInProgress）</text></svg>
