<svg xmlns="http://www.w3.org/2000/svg" width="840" height="600" viewBox="0 0 840 600" font-family="system-ui, sans-serif">
  <text x="420" y="34" text-anchor="middle" font-size="15" font-weight="600" fill="#27272a">steering 的注入边界：当前流完成后，下一次请求前生效</text>
  <text x="420" y="55" text-anchor="middle" font-size="11" fill="#71717a">示例：先让 agent 重构 auth.ts；模型生成过程中，用户补充“保留现有 export”</text>

  <rect x="28" y="82" width="130" height="468" rx="10" fill="#f4f4f5"/>
  <text x="93" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#52525b">用户</text>
  <line x1="93" y1="132" x2="93" y2="526" stroke="#d4d4d8" stroke-width="2"/>

  <rect x="178" y="82" width="240" height="468" rx="10" fill="#f4f4f5"/>
  <text x="298" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#52525b">runLoop / context</text>
  <line x1="298" y1="132" x2="298" y2="526" stroke="#d4d4d8" stroke-width="2"/>

  <rect x="438" y="82" width="160" height="468" rx="10" fill="#f4f4f5"/>
  <text x="518" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#52525b">LLM stream</text>
  <line x1="518" y1="132" x2="518" y2="526" stroke="#d4d4d8" stroke-width="2"/>

  <rect x="618" y="82" width="194" height="468" rx="10" fill="#f4f4f5"/>
  <text x="715" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#52525b">工具</text>
  <line x1="715" y1="132" x2="715" y2="526" stroke="#d4d4d8" stroke-width="2"/>

  <text x="25" y="152" font-size="10.5" fill="#a1a1aa">T0</text>
  <rect x="44" y="140" width="98" height="48" rx="7" fill="#ffffff"/>
  <text x="93" y="159" text-anchor="middle" font-size="10.5" fill="#27272a">“重构</text>
  <text x="93" y="175" text-anchor="middle" font-size="10.5" fill="#27272a">src/auth.ts”</text>
  <path d="M142 164 H278" fill="none" stroke="#a1a1aa" stroke-width="2"/>
  <path d="M273 159 L280 164 L273 169" fill="none" stroke="#a1a1aa" stroke-width="2"/>
  <rect x="212" y="140" width="172" height="48" rx="7" fill="#ffffff"/>
  <text x="298" y="160" text-anchor="middle" font-size="10.5" fill="#27272a">pending 注入 context</text>
  <text x="298" y="176" text-anchor="middle" font-size="10.5" fill="#71717a">turn 1 开始</text>

  <text x="25" y="233" font-size="10.5" fill="#a1a1aa">T1</text>
  <path d="M384 214 H498" fill="none" stroke="#a1a1aa" stroke-width="2"/>
  <path d="M493 209 L500 214 L493 219" fill="none" stroke="#a1a1aa" stroke-width="2"/>
  <rect x="456" y="195" width="124" height="72" rx="7" fill="#ffffff"/>
  <text x="518" y="217" text-anchor="middle" font-size="10.5" fill="#27272a">持续生成：</text>
  <text x="518" y="235" text-anchor="middle" font-size="10.5" fill="#27272a">分析 + read/edit</text>
  <text x="518" y="253" text-anchor="middle" font-size="10.5" fill="#71717a">tool calls</text>

  <text x="25" y="316" font-size="10.5" fill="#a1a1aa">T2</text>
  <rect x="41" y="292" width="104" height="54" rx="7" fill="#fef3c7"/>
  <text x="93" y="313" text-anchor="middle" font-size="10.5" fill="#92400e">“保留现有</text>
  <text x="93" y="330" text-anchor="middle" font-size="10.5" fill="#92400e">export”</text>
  <path d="M145 319 H278" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M273 314 L280 319 L273 324" fill="none" stroke="#b45309" stroke-width="2"/>
  <rect x="205" y="292" width="186" height="54" rx="7" fill="#fef3c7"/>
  <text x="298" y="313" text-anchor="middle" font-size="10.5" fill="#92400e">进入 steering 队列</text>
  <text x="298" y="330" text-anchor="middle" font-size="10.5" fill="#a16207">不 abort 当前 stream</text>
  <text x="518" y="319" text-anchor="middle" font-size="10.5" fill="#71717a">当前生成继续</text>

  <text x="25" y="394" font-size="10.5" fill="#a1a1aa">T3</text>
  <path d="M580 376 H695" fill="none" stroke="#a1a1aa" stroke-width="2"/>
  <path d="M690 371 L697 376 L690 381" fill="none" stroke="#a1a1aa" stroke-width="2"/>
  <rect x="635" y="357" width="160" height="38" rx="7" fill="#ffffff"/>
  <text x="715" y="381" text-anchor="middle" font-size="10.5" fill="#27272a">执行 turn 1 的 tool call</text>
  <text x="298" y="382" text-anchor="middle" font-size="10.5" fill="#71717a">assistant 完成，写入 toolResult</text>

  <text x="25" y="470" font-size="10.5" fill="#a1a1aa">T4</text>
  <rect x="205" y="440" width="186" height="58" rx="7" fill="#ffffff"/>
  <text x="298" y="462" text-anchor="middle" font-size="10.5" fill="#27272a">turn_end 后 poll steering</text>
  <text x="298" y="480" text-anchor="middle" font-size="10.5" fill="#71717a">取出“保留现有 export”</text>
  <path d="M384 469 H498" fill="none" stroke="#b45309" stroke-width="2"/>
  <path d="M493 464 L500 469 L493 474" fill="none" stroke="#b45309" stroke-width="2"/>
  <rect x="456" y="440" width="124" height="58" rx="7" fill="#fef3c7"/>
  <text x="518" y="462" text-anchor="middle" font-size="10.5" fill="#92400e">turn 2 请求</text>
  <text x="518" y="480" text-anchor="middle" font-size="10.5" fill="#92400e">携带新约束</text>

  <text x="420" y="580" text-anchor="middle" font-size="11" fill="#71717a">结果：已产生的流和工具批完整结算；后续模型调用会同时看到 turn 1 的结果与用户的 steering 消息。</text>
</svg>
