<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif">
  <!-- 屏幕一侧：编辑器区域 -->
  <rect x="30" y="40" width="300" height="170" rx="6" fill="#f7f7f8" stroke="#c8c8cc" stroke-width="1.5"/>
  <text x="44" y="62" font-size="12" fill="#8a8a8e">编辑器 DOM（屏幕坐标系）</text>
  <!-- 文本行 -->
  <rect x="48" y="76" width="230" height="12" rx="3" fill="#d9d9de"/>
  <rect x="48" y="100" width="184" height="12" rx="3" fill="#d9d9de"/>
  <rect x="48" y="124" width="252" height="12" rx="3" fill="#d9d9de"/>
  <rect x="48" y="148" width="140" height="12" rx="3" fill="#d9d9de"/>
  <rect x="48" y="172" width="205" height="12" rx="3" fill="#d9d9de"/>
  <!-- 光标竖线 -->
  <rect x="188" y="122" width="2.5" height="16" fill="#d64933"/>
  <!-- 坐标标注 -->
  <circle cx="189" cy="130" r="3" fill="#d64933"/>
  <text x="204" y="118" font-size="12" fill="#d64933">(left, top) → Rect</text>

  <!-- 文档一侧：一维 pos 轴 -->
  <line x1="430" y1="240" x2="730" y2="240" stroke="#4a4a4e" stroke-width="1.5"/>
  <g stroke="#4a4a4e" stroke-width="1">
    <line x1="430" y1="235" x2="430" y2="245"/>
    <line x1="490" y1="235" x2="490" y2="245"/>
    <line x1="550" y1="235" x2="550" y2="245"/>
    <line x1="610" y1="235" x2="610" y2="245"/>
    <line x1="670" y1="235" x2="670" y2="245"/>
    <line x1="730" y1="235" x2="730" y2="245"/>
  </g>
  <g font-size="11" fill="#8a8a8e" text-anchor="middle">
    <text x="430" y="260">0</text>
    <text x="490" y="260">1</text>
    <text x="550" y="260">2</text>
    <text x="610" y="260">…</text>
    <text x="670" y="260">n−1</text>
    <text x="730" y="260">n</text>
  </g>
  <text x="430" y="285" font-size="12" fill="#8a8a8e">文档模型：pos 是一维整数</text>
  <!-- pos 命中点 -->
  <circle cx="590" cy="240" r="4" fill="#d64933"/>
  <text x="582" y="224" font-size="12" fill="#d64933">pos</text>

  <!-- 双向箭头 -->
  <path d="M 596 226 C 560 90, 400 60, 205 108" fill="none" stroke="#2f6fb2" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="330" y="66" font-size="13" fill="#2f6fb2">coordsAtPos(view, pos, side)</text>

  <path d="M 175 150 C 320 210, 480 250, 582 246" fill="none" stroke="#3d8a4f" stroke-width="1.8" marker-end="url(#arrow2)"/>
  <text x="330" y="200" font-size="13" fill="#3d8a4f">posAtCoords(view, {left, top})</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6fb2"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3d8a4f"/>
    </marker>
  </defs>
</svg>
