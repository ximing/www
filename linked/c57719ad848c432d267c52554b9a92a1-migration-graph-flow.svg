<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title"><title id="title">Vue 转 React 迁移单元的图流程与四个分支出口</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#182230}.b{font-size:20px;font-weight:700}.s{font-size:18px;fill:#475569}</style><rect width="760" height="560" rx="18" fill="#f8fafc"/><path d="M220 82V112M220 170V200M220 258V288M220 346V376M220 434V464" stroke="#64748b" stroke-width="4"/><path d="m212 104 8 8 8-8m-8 90 8 8 8-8m-8 90 8 8 8-8m-8 90 8 8 8-8m-8 90 8 8 8-8" fill="none" stroke="#64748b" stroke-width="4"/><rect x="60" y="30" width="320" height="52" rx="16" fill="#e0f2fe" stroke="#38bdf8" stroke-width="3"/><rect x="60" y="118" width="320" height="52" rx="16" fill="#e0f2fe" stroke="#38bdf8" stroke-width="3"/><rect x="60" y="206" width="320" height="52" rx="16" fill="#e0f2fe" stroke="#38bdf8" stroke-width="3"/><rect x="60" y="294" width="320" height="52" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/><rect x="60" y="382" width="320" height="52" rx="16" fill="#e0f2fe" stroke="#38bdf8" stroke-width="3"/><rect x="60" y="470" width="320" height="52" rx="16" fill="#e0f2fe" stroke="#38bdf8" stroke-width="3"/><text x="220" y="63" class="b" text-anchor="middle">读取任务边界</text><text x="220" y="151" class="b" text-anchor="middle">调研契约与调用方</text><text x="220" y="239" class="b" text-anchor="middle">生成迁移假设和计划</text><text x="220" y="327" class="b" text-anchor="middle">校验计划是否触及风险边界</text><text x="220" y="415" class="b" text-anchor="middle">实施修改</text><text x="220" y="503" class="b" text-anchor="middle">执行静态与运行检查</text><path d="M380 496H425V94M425 94H446M425 210H446M425 326H446M425 442H446" fill="none" stroke="#64748b" stroke-width="4"/><path d="m430 84 16 10-16 10m0 106 16 10-16 10m0 106 16 10-16 10m0 106 16 10-16 10" fill="none" stroke="#64748b" stroke-width="4"/><rect x="450" y="50" width="270" height="88" rx="16" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/><text x="585" y="90" class="b" text-anchor="middle">通过</text><text x="585" y="120" class="s" text-anchor="middle">提交证据并结束</text><rect x="450" y="166" width="270" height="88" rx="16" fill="#ede9fe" stroke="#8b5cf6" stroke-width="3"/><text x="585" y="200" class="b" text-anchor="middle">失败</text><text x="585" y="226" class="s" text-anchor="middle">模型基于失败证据定位</text><text x="585" y="248" class="s" text-anchor="middle">并选择下一步</text><rect x="450" y="282" width="270" height="88" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/><text x="585" y="322" class="b" text-anchor="middle">高风险</text><text x="585" y="352" class="s" text-anchor="middle">中断，等待审批后恢复</text><rect x="450" y="398" width="270" height="88" rx="16" fill="#fee2e2" stroke="#ef4444" stroke-width="3"/><text x="585" y="438" class="b" text-anchor="middle">预算耗尽或证据不足</text><text x="585" y="468" class="s" text-anchor="middle">输出未完成状态</text></svg>
