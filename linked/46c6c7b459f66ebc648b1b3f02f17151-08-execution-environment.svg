<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono','Menlo','Monaco','Consolas',monospace" font-size="13">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#8b949e"/></marker>
  </defs>
  <rect width="700" height="400" fill="url(#bg)" rx="8"/>

  <text x="350" y="28" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="bold">执行环境与工具</text>
  <text x="350" y="46" text-anchor="middle" fill="#8b949e" font-size="11">Workspace · Tool Surface · Gateway · Observation</text>

  <rect x="40" y="62" width="300" height="30" rx="4" fill="#3a1a1a" stroke="#f85149" stroke-width="1"/>
  <text x="190" y="82" text-anchor="middle" fill="#f85149" font-size="12">问题：只有 Registry 和 Sandbox</text>

  <text x="55" y="110" fill="#8b949e" font-size="11">工作区未按仓库准备运行时和依赖</text>
  <text x="55" y="130" fill="#8b949e" font-size="11">工具调用没有超时、重试和幂等</text>
  <text x="55" y="150" fill="#8b949e" font-size="11">原始 stdout 直接进入上下文</text>
  <text x="55" y="170" fill="#8b949e" font-size="11">开发服务和浏览器没有生命周期</text>
  <text x="55" y="190" fill="#8b949e" font-size="11">磁盘状态无法按任务恢复</text>

  <text x="348" y="130" fill="#fd7e14" font-size="16" font-weight="bold">→</text>

  <rect x="360" y="62" width="300" height="30" rx="4" fill="#1a3a1a" stroke="#3fb950" stroke-width="1"/>
  <text x="510" y="82" text-anchor="middle" fill="#3fb950" font-size="12">解决：这一层实际要管的内容</text>

  <text x="375" y="110" fill="#8b949e" font-size="11">Workspace：检出、安装、基线、回收</text>
  <text x="375" y="130" fill="#8b949e" font-size="11">Isolation：文件、进程、网络、资源</text>
  <text x="375" y="150" fill="#8b949e" font-size="11">Tool Surface + Gateway</text>
  <text x="375" y="170" fill="#8b949e" font-size="11">Observation：裁剪、外置、结构化错误</text>
  <text x="375" y="190" fill="#8b949e" font-size="11">Process / Snapshot：服务与磁盘快照</text>

  <rect x="40" y="218" width="620" height="158" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="55" y="240" fill="#e6edf3" font-size="12" font-weight="bold">一次工具调用的路径</text>

  <rect x="55" y="258" width="120" height="48" rx="4" fill="#1a365d" stroke="#2a4a7f" stroke-width="1"/>
  <text x="115" y="278" text-anchor="middle" fill="#58a6ff" font-size="11">tool_call</text>
  <text x="115" y="294" text-anchor="middle" fill="#8b949e" font-size="10">模型发出动作</text>

  <line x1="175" y1="282" x2="198" y2="282" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="205" y="258" width="130" height="48" rx="4" fill="#3a2a1a" stroke="#5c4228" stroke-width="1"/>
  <text x="270" y="278" text-anchor="middle" fill="#d29922" font-size="11">Tool Gateway</text>
  <text x="270" y="294" text-anchor="middle" fill="#8b949e" font-size="10">校验 / 超时 / 幂等</text>

  <line x1="335" y1="282" x2="358" y2="282" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="365" y="258" width="150" height="48" rx="4" fill="#1a4731" stroke="#236b4a" stroke-width="1"/>
  <text x="440" y="278" text-anchor="middle" fill="#3fb950" font-size="11">Sandbox / Workspace</text>
  <text x="440" y="294" text-anchor="middle" fill="#8b949e" font-size="10">fs · bash · browser · git</text>

  <line x1="515" y1="282" x2="538" y2="282" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="545" y="258" width="100" height="48" rx="4" fill="#1a2a3a" stroke="#28425c" stroke-width="1"/>
  <text x="595" y="278" text-anchor="middle" fill="#58a6ff" font-size="11">观察</text>
  <text x="595" y="294" text-anchor="middle" fill="#8b949e" font-size="10">摘要 · 路径</text>

  <text x="55" y="332" fill="#8b949e" font-size="11">层① 的 allowed_paths 在 Gateway 和 Sandbox 落地。完整日志留在工作区，</text>
  <text x="55" y="350" fill="#8b949e" font-size="11">模型默认只看到 exit code、截断输出、结构化错误和产物引用。</text>
  <text x="55" y="368" fill="#484f58" font-size="11">何时调用、是否完成：层③ / 层⑦。会话从哪续跑：层③ / 层⑤。</text>
</svg>
