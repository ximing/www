<svg viewBox="0 0 1000 722" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono','Menlo','Monaco','Consolas',monospace" font-size="13">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrGray" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#8b949e"/></marker>
    <marker id="arrBlue" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#58a6ff"/></marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#3fb950"/></marker>
  </defs>

  <rect width="1000" height="722" fill="url(#bg)" rx="8"/>

  <text x="500" y="34" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="bold" font-family="'Segoe UI','SF Pro',sans-serif">自注意力的数据流：Q/K/V 打分、softmax、加权求和</text>
  <text x="500" y="54" text-anchor="middle" fill="#8b949e" font-size="12">以「我 爱 吃苹果」位置 3 为例：q3 对全部 k 打分，softmax 归一化为权重，对 v 加权求和得到该位置的新表示</text>

  <!-- ============ 输入词 ============ -->
  <rect x="95" y="110" width="150" height="30" rx="4" fill="#0d1117" stroke="#8b949e"/>
  <text x="170" y="129" text-anchor="middle" fill="#c9d1d9" font-size="12">我 · x1=[1,0]</text>
  <rect x="425" y="110" width="150" height="30" rx="4" fill="#0d1117" stroke="#8b949e"/>
  <text x="500" y="129" text-anchor="middle" fill="#c9d1d9" font-size="12">爱 · x2=[0,1]</text>
  <rect x="755" y="110" width="150" height="30" rx="4" fill="#0d1117" stroke="#58a6ff" stroke-width="2" filter="url(#glow)"/>
  <text x="830" y="129" text-anchor="middle" fill="#e6edf3" font-size="12">吃苹果 · x3=[1,1]</text>

  <!-- ============ K 行 ============ -->
  <rect x="58" y="200" width="100" height="26" rx="4" fill="#161b22" stroke="#d29922"/>
  <text x="108" y="217" text-anchor="middle" fill="#c9d1d9" font-size="11">k1 = [1,0]</text>
  <rect x="388" y="200" width="100" height="26" rx="4" fill="#161b22" stroke="#d29922"/>
  <text x="438" y="217" text-anchor="middle" fill="#c9d1d9" font-size="11">k2 = [0,1]</text>
  <rect x="718" y="200" width="100" height="26" rx="4" fill="#161b22" stroke="#d29922"/>
  <text x="768" y="217" text-anchor="middle" fill="#c9d1d9" font-size="11">k3 = [1,1]</text>

  <!-- token -> k 箭头 -->
  <line x1="130" y1="140" x2="110" y2="196" stroke="#8b949e" marker-end="url(#arrGray)"/>
  <line x1="460" y1="140" x2="440" y2="196" stroke="#8b949e" marker-end="url(#arrGray)"/>
  <line x1="790" y1="140" x2="770" y2="196" stroke="#8b949e" marker-end="url(#arrGray)"/>
  <text x="88" y="172" fill="#8b949e" font-size="10">× W_K</text>

  <!-- ============ V 行 ============ -->
  <rect x="182" y="270" width="100" height="26" rx="4" fill="#161b22" stroke="#3fb950"/>
  <text x="232" y="287" text-anchor="middle" fill="#c9d1d9" font-size="11">v1 = [1,0]</text>
  <rect x="512" y="270" width="100" height="26" rx="4" fill="#161b22" stroke="#3fb950"/>
  <text x="562" y="287" text-anchor="middle" fill="#c9d1d9" font-size="11">v2 = [0,1]</text>
  <rect x="842" y="270" width="100" height="26" rx="4" fill="#161b22" stroke="#3fb950"/>
  <text x="892" y="287" text-anchor="middle" fill="#c9d1d9" font-size="11">v3 = [1,1]</text>

  <!-- token -> v 箭头 -->
  <line x1="210" y1="140" x2="230" y2="266" stroke="#8b949e" marker-end="url(#arrGray)"/>
  <line x1="540" y1="140" x2="560" y2="266" stroke="#8b949e" marker-end="url(#arrGray)"/>
  <line x1="850" y1="140" x2="890" y2="266" stroke="#8b949e" marker-end="url(#arrGray)"/>
  <text x="240" y="200" fill="#8b949e" font-size="10">× W_V</text>

  <!-- ============ q3 ============ -->
  <rect x="880" y="200" width="100" height="26" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="2" filter="url(#glow)"/>
  <text x="930" y="217" text-anchor="middle" fill="#e6edf3" font-size="11">q3 = [1,1]</text>
  <line x1="870" y1="140" x2="918" y2="196" stroke="#58a6ff" marker-end="url(#arrBlue)"/>
  <text x="886" y="168" fill="#58a6ff" font-size="10">× W_Q</text>

  <!-- q3 -> k 打分连线 -->
  <line x1="885" y1="226" x2="818" y2="232" stroke="#58a6ff" stroke-width="2.5"/>
  <line x1="885" y1="226" x2="488" y2="238" stroke="#8b949e" stroke-dasharray="4,3"/>
  <line x1="885" y1="226" x2="158" y2="244" stroke="#8b949e" stroke-dasharray="4,3"/>
  <text x="108" y="262" text-anchor="middle" fill="#8b949e" font-size="10">0.71</text>
  <text x="438" y="262" text-anchor="middle" fill="#8b949e" font-size="10">0.71</text>
  <text x="768" y="262" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">1.41</text>
  <text x="930" y="262" text-anchor="middle" fill="#8b949e" font-size="10">s = q3·k / √d_k</text>

  <!-- ============ softmax ============ -->
  <line x1="500" y1="250" x2="500" y2="324" stroke="#8b949e" marker-end="url(#arrGray)"/>
  <text x="512" y="292" fill="#8b949e" font-size="10">三个打分 [0.71, 0.71, 1.41]</text>
  <rect x="420" y="330" width="160" height="30" rx="6" fill="#0d1117" stroke="#8b949e" stroke-width="1.5"/>
  <text x="500" y="349" text-anchor="middle" fill="#e6edf3" font-size="12">softmax</text>

  <!-- softmax -> α -->
  <line x1="470" y1="360" x2="140" y2="416" stroke="#8b949e" marker-end="url(#arrGray)"/>
  <line x1="500" y1="360" x2="465" y2="416" stroke="#8b949e" marker-end="url(#arrGray)"/>
  <line x1="530" y1="360" x2="788" y2="416" stroke="#58a6ff" marker-end="url(#arrBlue)"/>

  <!-- ============ α 权重 ============ -->
  <rect x="75" y="420" width="110" height="26" rx="4" fill="#161b22" stroke="#8b949e"/>
  <text x="130" y="437" text-anchor="middle" fill="#c9d1d9" font-size="11">α₃₁ = 0.25</text>
  <rect x="405" y="420" width="110" height="26" rx="4" fill="#161b22" stroke="#8b949e"/>
  <text x="460" y="437" text-anchor="middle" fill="#c9d1d9" font-size="11">α₃₂ = 0.25</text>
  <rect x="735" y="420" width="110" height="26" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="790" y="437" text-anchor="middle" fill="#e6edf3" font-size="11">α₃₃ = 0.50</text>

  <!-- α 接入 v 路径（乘） -->
  <line x1="185" y1="433" x2="228" y2="433" stroke="#8b949e"/>
  <line x1="515" y1="433" x2="558" y2="433" stroke="#8b949e"/>
  <line x1="845" y1="433" x2="888" y2="433" stroke="#8b949e"/>
  <circle cx="232" cy="433" r="3.5" fill="#3fb950"/>
  <circle cx="562" cy="433" r="3.5" fill="#3fb950"/>
  <circle cx="892" cy="433" r="3.5" fill="#3fb950"/>

  <!-- v 路径下行到求和 -->
  <path d="M 232 296 L 232 545 L 392 545" fill="none" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrGreen)"/>
  <path d="M 562 296 L 562 512" fill="none" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrGreen)"/>
  <path d="M 892 296 L 892 545 L 608 545" fill="none" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrGreen)"/>

  <!-- ============ 求和与输出 ============ -->
  <rect x="400" y="520" width="200" height="34" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <text x="500" y="541" text-anchor="middle" fill="#3fb950" font-size="12">o3 = Σ αi · vi</text>

  <line x1="500" y1="554" x2="500" y2="590" stroke="#58a6ff" marker-end="url(#arrBlue)"/>
  <rect x="365" y="595" width="270" height="34" rx="6" fill="#0d1117" stroke="#58a6ff" stroke-width="2" filter="url(#glow)"/>
  <text x="500" y="616" text-anchor="middle" fill="#e6edf3" font-size="12">o3 ≈ [0.75, 0.75]（位置 3 的新表示）</text>

  <!-- ============ 注 ============ -->
  <rect x="30" y="648" width="940" height="58" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="46" y="668" fill="#8b949e" font-size="10">W_Q、W_K、W_V 是可学习的线性映射；本例取单位阵简化，故 q = k = v = x；d_k = 2，√d_k ≈ 1.41</text>
  <text x="46" y="686" fill="#8b949e" font-size="10">打分 q3·k1 = 1，q3·k2 = 1，q3·k3 = 2，除以 1.41 得 0.71、0.71、1.41；softmax 得 α = (0.25, 0.25, 0.50)</text>
  <text x="46" y="703" fill="#8b949e" font-size="10">绿色 v 路径上的圆点表示乘上对应权重 αi：o3 = 0.25·v1 + 0.25·v2 + 0.50·v3 ≈ [0.75, 0.75]</text>
</svg>
