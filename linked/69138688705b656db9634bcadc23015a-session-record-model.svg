<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Pi harness 与 Claude Code 的持久化会话记录</title>
  <desc id="desc">左侧为 Pi harness 的 parentId entry 树，右侧为 Claude Code 的 transcript 主干和附属记录。</desc>
  <defs><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.h{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.b{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#34415a}.s{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#667085}.pi{fill:#eaf2ff;stroke:#6b9df5;stroke-width:2}.cc{fill:#fff2e7;stroke:#e99a58;stroke-width:2}.n{fill:#f7f8fa;stroke:#d0d5dd;stroke-width:1.5}.l{stroke:#98a2b3;stroke-width:2;fill:none}</style></defs>
  <rect width="1200" height="500" rx="24" fill="#fff"/><text x="48" y="52" class="t">持久化记录：Pi 统一保存 entry，Claude Code 保存 transcript 与附属记录</text>
  <text x="48" y="94" class="h">Pi agent-core harness</text><text x="648" y="94" class="h">Claude Code</text>
  <rect x="48" y="120" width="504" height="326" rx="16" class="pi"/><text x="74" y="153" class="h">一个 `SessionTreeEntry` 树</text><text x="74" y="179" class="s">每条记录带 id、parentId、timestamp</text>
  <path d="M172 235 L300 195 L428 235 M300 195 L300 323 M172 235 L172 365 M428 235 L428 365" class="l"/>
  <rect x="112" y="210" width="120" height="50" rx="10" class="n"/><text x="137" y="241" class="b">message</text><rect x="240" y="170" width="120" height="50" rx="10" class="n"/><text x="260" y="201" class="b">model_change</text><rect x="368" y="210" width="120" height="50" rx="10" class="n"/><text x="382" y="241" class="b">compaction</text><rect x="112" y="340" width="120" height="50" rx="10" class="n"/><text x="133" y="371" class="b">leaf</text><rect x="240" y="298" width="120" height="50" rx="10" class="n"/><text x="252" y="329" class="b">message</text><rect x="368" y="340" width="120" height="50" rx="10" class="n"/><text x="379" y="371" class="b">branch_summary</text>
  <text x="74" y="424" class="s">消息、配置变更、压缩和导航都进入同一 entry 模型。</text>
  <rect x="648" y="120" width="504" height="326" rx="16" class="cc"/><text x="674" y="153" class="h">transcript 主干 + 关联记录</text><text x="674" y="179" class="s">消息用 parentUuid 关联；其他状态另存为记录</text>
  <path d="M705 242 H1035" class="l"/><circle cx="730" cy="242" r="7" fill="#e99a58"/><circle cx="842" cy="242" r="7" fill="#e99a58"/><circle cx="954" cy="242" r="7" fill="#e99a58"/><circle cx="1035" cy="242" r="7" fill="#e99a58"/><text x="694" y="219" class="s">user</text><text x="802" y="219" class="s">assistant</text><text x="912" y="219" class="s">tool result</text><text x="1004" y="219" class="s">user</text>
  <rect x="676" y="292" width="142" height="54" rx="10" class="n"/><text x="693" y="324" class="b">file history</text><rect x="836" y="292" width="142" height="54" rx="10" class="n"/><text x="850" y="324" class="b">content replacement</text><rect x="996" y="292" width="126" height="54" rx="10" class="n"/><text x="1013" y="324" class="b">collapse</text>
  <path d="M747 249 V292 M907 249 V292 M1057 249 V292" class="l"/><text x="674" y="392" class="s">文件历史、工具输出替换和 collapse 等记录由不同恢复逻辑使用。</text>
</svg>