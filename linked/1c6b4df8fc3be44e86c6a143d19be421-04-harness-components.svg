<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title"><title id="title">Harness 的三个组成部分</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#182230}.h{font-size:28px;font-weight:700}.s{font-size:18px;fill:#475569}.c{font-size:23px;font-weight:700}</style><rect width="1200" height="360" rx="18" fill="#f8fafc"/><path d="M320 180H425M775 180H880" stroke="#94a3b8" stroke-width="5"/><path d="m414 168 20 12-20 12m355-24 20 12-20 12" fill="none" stroke="#94a3b8" stroke-width="5"/><rect x="40" y="75" width="280" height="210" rx="20" fill="#e0f2fe" stroke="#38bdf8" stroke-width="3"/><rect x="460" y="75" width="315" height="210" rx="20" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/><rect x="880" y="75" width="280" height="210" rx="20" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/><text x="105" y="145" class="c">Agent 可读性</text><text x="82" y="188" class="s">准确的上下文</text><text x="82" y="220" class="s">可发现的工程能力</text><text x="525" y="145" class="c">受控执行</text><text x="500" y="188" class="s">架构边界与权限隔离</text><text x="500" y="220" class="s">确定性的质量门禁</text><text x="943" y="145" class="c">反馈回路</text><text x="920" y="188" class="s">测试、日志与指标</text><text x="920" y="220" class="s">带证据的迭代修正</text><text x="435" y="335" class="h">让 Agent 在可理解、可约束、可验证的环境中工作</text></svg>