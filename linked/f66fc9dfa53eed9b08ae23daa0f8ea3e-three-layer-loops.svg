<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="title"><title id="title">通用 Coding Agent 的三层循环</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#182230}.n{font-size:16px;font-weight:700}.t{font-size:18px;font-weight:700}.s{font-size:15px;fill:#526176}</style><rect width="760" height="470" rx="18" fill="#f8fafc"/><g fill="none" stroke="#64748b" stroke-width="3"><path d="M380 74V112M370 102L380 112L390 102"/><path d="M380 196V234M370 224L380 234L390 224"/><path d="M380 318V356M370 346L380 356L390 346"/></g><rect x="230" y="30" width="300" height="44" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="3"/><rect x="100" y="112" width="560" height="84" rx="16" fill="#ede9fe" stroke="#8b5cf6" stroke-width="3"/><rect x="100" y="234" width="560" height="84" rx="16" fill="#e0f2fe" stroke="#38bdf8" stroke-width="3"/><rect x="100" y="356" width="560" height="84" rx="16" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/><text x="380" y="58" class="n" text-anchor="middle">Issue / 用户目标</text><text x="140" y="150" class="t">Plan Loop</text><text x="140" y="178" class="s">澄清目标、建立子任务、申请必要审批</text><text x="140" y="272" class="t">Task Loop</text><text x="140" y="300" class="s">对一个可验证单元调查、实施、验证、记录证据</text><text x="140" y="394" class="t">Tool Loop</text><text x="140" y="422" class="s">选择一个工具，处理一次结构化结果，更新状态</text></svg>