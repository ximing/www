<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="280" viewBox="0 0 1040 280" role="img" aria-labelledby="title"><title id="title">commit 阶段各子阶段与 useInsertionEffect 的执行位置（2021-09-16 master，a8cabb5648）</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#182230}.t{font-size:14px;font-weight:700}.h{font-size:13px;font-weight:700;fill:#ffffff}.b{font-size:11.5px;fill:#334155}.n{font-size:11px;fill:#64748b}.w{font-size:11.5px;fill:#ffffff}</style><rect width="1040" height="280" rx="18" fill="#f8fafc"/><text x="40" y="32" class="t">commit 阶段的执行顺序与 useInsertionEffect 的位置（2021-09-16 master，a8cabb5648）</text>
<g><rect x="40" y="56" width="200" height="130" rx="10" fill="#64748b"/><text x="140" y="80" class="h" text-anchor="middle">Before Mutation</text><text x="56" y="106" class="w">flush 上一轮遗留的</text><text x="56" y="124" class="w">passive effects</text><text x="56" y="148" class="w">类组件</text><text x="56" y="166" class="w">getSnapshotBeforeUpdate</text></g>
<g><rect x="272" y="56" width="360" height="130" rx="10" fill="#475569"/><text x="452" y="80" class="h" text-anchor="middle">Mutation 阶段（深度优先遍历）</text><text x="288" y="106" class="w">commitPlacement：插入 / 移动宿主节点</text><text x="288" y="124" class="w">HostComponent：属性、文本更新</text><rect x="288" y="136" width="328" height="40" rx="6" fill="#0891b2"/><text x="300" y="153" class="w">函数组件 commitWork 开头：</text><text x="300" y="169" class="w">insertion destroy → create（本图高亮）</text></g>
<g><rect x="664" y="56" width="180" height="130" rx="10" fill="#64748b"/><text x="754" y="80" class="h" text-anchor="middle">Layout 阶段</text><text x="680" y="106" class="w">ref attach</text><text x="680" y="124" class="w">layout effect create</text><text x="680" y="142" class="w">componentDidMount /</text><text x="680" y="158" class="w">componentDidUpdate</text></g>
<g><rect x="876" y="56" width="124" height="130" rx="10" fill="#94a3b8"/><text x="938" y="80" class="h" text-anchor="middle">Passive</text><text x="890" y="106" class="w">useEffect</text><text x="890" y="124" class="w">destroy / create</text><text x="890" y="148" class="w">Scheduler</text><text x="890" y="164" class="w">异步调度</text></g>
<g><path d="M244 121 L264 121" stroke="#94a3b8" stroke-width="2"/><path d="M264 121 L256 116 L256 126 Z" fill="#94a3b8"/><path d="M636 121 L656 121" stroke="#94a3b8" stroke-width="2"/><path d="M656 121 L648 116 L648 126 Z" fill="#94a3b8"/><path d="M848 121 L868 121" stroke="#94a3b8" stroke-width="2"/><path d="M868 121 L860 116 L860 126 Z" fill="#94a3b8"/></g>
<g><path d="M452 186 L452 210" stroke="#0891b2" stroke-width="2"/><path d="M452 210 L447 202 L457 202 Z" fill="#0891b2"/><text x="452" y="230" class="b" text-anchor="middle">此刻 DOM 变更已基本就位，ref 尚未 attach，layout effect 尚未执行：CSS-in-JS 在这里插入 style 标签</text></g>
<text x="40" y="262" class="n">对照：layout effect 的 destroy 在 Mutation 阶段随 commitWork 统一执行，create 推迟到 Layout 阶段；useEffect 整个推迟到绘制之后异步执行。</text></svg>
