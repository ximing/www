<svg xmlns="http://www.w3.org/2000/svg" width="940" height="330" viewBox="0 0 940 330" role="img" aria-labelledby="title"><title id="title">浏览器修改 DOM 之后，DOMObserver 与 readDOMChange 的读回路径</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#182230}.t{font-size:14px;font-weight:700}.h{font-size:13px;font-weight:700}.b{font-size:12px;fill:#334155}.n{font-size:12px;fill:#526176}.o{font-size:11px;fill:#0891b2;font-weight:700}</style><rect width="940" height="330" rx="18" fill="#f8fafc"/><text x="40" y="34" class="t">读回路径：DOM 变化到 transaction</text><g><rect x="40" y="56" width="156" height="86" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="54" y="78" class="h">浏览器改 DOM</text><text x="54" y="98" class="b">输入 · 删除 · 上屏</text><text x="54" y="116" class="n">contenteditable</text><text x="54" y="132" class="n">模型事先不知情</text></g><line x1="196" y1="99" x2="220" y2="99" stroke="#94a3b8" stroke-width="2"/><path d="M220 99 L210 94 L210 104 Z" fill="#94a3b8"/><g><rect x="226" y="56" width="164" height="86" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="240" y="78" class="h">MutationObserver</text><text x="240" y="98" class="b">record 推进 queue</text><text x="240" y="116" class="n">默认立即 flush()</text><text x="240" y="132" class="n">例外走 flushSoon 20ms</text></g><line x1="390" y1="99" x2="414" y2="99" stroke="#94a3b8" stroke-width="2"/><path d="M414 99 L404 94 L404 104 Z" fill="#94a3b8"/><g><rect x="420" y="56" width="164" height="86" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="434" y="78" class="h">flush()</text><text x="434" y="98" class="b">registerMutation 逐条</text><text x="434" y="116" class="n">聚合 from / to / typeOver</text><text x="434" y="132" class="n">docView.markDirty</text></g><line x1="584" y1="99" x2="608" y2="99" stroke="#94a3b8" stroke-width="2"/><path d="M608 99 L598 94 L598 104 Z" fill="#94a3b8"/><g><rect x="614" y="56" width="164" height="86" rx="8" fill="#e0f2fe" stroke="#0891b2" stroke-width="1.5"/><text x="628" y="78" class="h">readDOMChange</text><text x="628" y="98" class="b">parseBetween 重解析</text><text x="628" y="116" class="n">findDiffStart / End 求差</text><text x="628" y="132" class="n">按差异形状分流</text></g><line x1="778" y1="99" x2="802" y2="99" stroke="#94a3b8" stroke-width="2"/><path d="M802 99 L792 94 L792 104 Z" fill="#94a3b8"/><g><rect x="808" y="56" width="96" height="86" rx="8" fill="#e0f2fe" stroke="#0891b2" stroke-width="1.5"/><text x="822" y="78" class="h">transaction</text><text x="822" y="98" class="b">replace ·</text><text x="822" y="114" class="b">insertText ·</text><text x="822" y="130" class="b">addMark</text></g><text x="40" y="180" class="h">三道闸门：哪些变化不进读回</text><g><rect x="40" y="196" width="280" height="100" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="54" y="220" class="h">stop / start</text><text x="54" y="240" class="b">updateStateInner 写 DOM 前 stop</text><text x="54" y="258" class="b">写完再 start</text><text x="54" y="278" class="n">自己的 mutation 不进 queue</text></g><g><rect x="336" y="196" width="280" height="100" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="350" y="220" class="h">desc.ignoreMutation</text><text x="350" y="240" class="b">NodeView / widget 的自治区域</text><text x="350" y="258" class="b">返回 true 的记录不上报</text><text x="350" y="278" class="n">selection 类型走同一约定</text></g><g><rect x="632" y="196" width="272" height="100" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="646" y="220" class="h">composition 抑制</text><text x="646" y="240" class="b">组合期重画跳过</text><text x="646" y="258" class="b">CompositionViewDesc 占位</text><text x="646" y="278" class="n">compositionend 后延迟 flush</text></g></svg>
