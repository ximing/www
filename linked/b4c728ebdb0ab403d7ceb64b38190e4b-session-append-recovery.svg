<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
<title id="title">Pi harness 与 Claude Code 的追加和恢复流程</title><desc id="desc">左侧展示 Pi 的 appendTail、leaf 和索引恢复，右侧展示 Claude Code 的 transcript 写入、compact boundary 和恢复。</desc><defs><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.h{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.b{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#34415a}.s{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#667085}.pi{fill:#eaf2ff;stroke:#6b9df5;stroke-width:2}.cc{fill:#fff2e7;stroke:#e99a58;stroke-width:2}.n{fill:#f7f8fa;stroke:#d0d5dd;stroke-width:1.5}.a{stroke:#98a2b3;stroke-width:2;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#98a2b3"/></marker></defs><rect width="1200" height="510" rx="24" fill="#fff"/><text x="48" y="52" class="t">追加与恢复：两边都追加 JSONL，但确定当前视图的方式不同</text>
<text x="48" y="95" class="h">Pi agent-core harness</text><rect x="48" y="118" width="510" height="342" rx="16" class="pi"/><rect x="78" y="156" width="128" height="60" rx="10" class="n"/><text x="100" y="190" class="b">当前 leafId</text><path d="M206 186 H246" class="a"/><rect x="246" y="156" width="128" height="60" rx="10" class="n"/><text x="269" y="181" class="b">写入 entry</text><text x="267" y="202" class="s">parentId = leafId</text><path d="M374 186 H414" class="a"/><rect x="414" y="156" width="112" height="60" rx="10" class="n"/><text x="434" y="190" class="b">更新 leaf</text><text x="78" y="258" class="s">appendTail 串行化写入：失败不会永久阻塞后续追加。</text><path d="M300 285 V325" class="a"/><rect x="180" y="325" width="240" height="70" rx="10" class="n"/><text x="205" y="354" class="b">重启：ArraySessionIndex.replace()</text><text x="205" y="377" class="s">按日志建立 byId、entries 与 leaf</text><text x="78" y="428" class="s">普通 entry 推进 leaf；leaf entry 将 leaf 定位到 targetId。</text>
<text x="644" y="95" class="h">Claude Code</text><rect x="644" y="118" width="508" height="342" rx="16" class="cc"/><rect x="674" y="156" width="132" height="60" rx="10" class="n"/><text x="693" y="181" class="b">新消息集合</text><text x="687" y="202" class="s">UUID 去重</text><path d="M806 186 H846" class="a"/><rect x="846" y="156" width="142" height="60" rx="10" class="n"/><text x="862" y="181" class="b">insertMessageChain</text><text x="870" y="202" class="s">确定 parentUuid</text><path d="M988 186 H1028" class="a"/><rect x="1028" y="156" width="94" height="60" rx="10" class="n"/><text x="1046" y="190" class="b">JSONL</text><text x="674" y="258" class="s">compact boundary 切断旧前缀；保留段重连信息帮助恢复当前可继续视图。</text><path d="M900 285 V325" class="a"/><rect x="760" y="325" width="280" height="70" rx="10" class="n"/><text x="786" y="354" class="b">重启：loader + session restore</text><text x="786" y="377" class="s">恢复 transcript、file history、Todo、collapse 等</text><text x="674" y="428" class="s">sidechain 使用独立文件；恢复不等同于本轮请求投影。</text></svg>