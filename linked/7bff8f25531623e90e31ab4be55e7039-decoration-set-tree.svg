<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <!-- 左侧：文档结构 -->
  <rect x="20" y="20" width="300" height="350" fill="#f7f9fc" stroke="#4a6fa5" stroke-width="2"/>
  <text x="170" y="44" text-anchor="middle" font-size="13" fill="#2c4a73">doc</text>

  <!-- paragraph -->
  <rect x="40" y="58" width="260" height="140" fill="#ffffff" stroke="#4a8a5f" stroke-width="1.5"/>
  <text x="170" y="80" text-anchor="middle" font-size="12" fill="#2c5a3c">paragraph</text>

  <!-- text with inline decoration highlight -->
  <rect x="118" y="96" width="64" height="24" fill="#ffe9a8"/>
  <text x="66" y="114" font-size="14" fill="#333">你好，世界</text>
  <text x="150" y="140" text-anchor="middle" font-size="10" fill="#8a6d2e">inline 装饰（范围）</text>

  <!-- widget marker -->
  <rect x="210" y="98" width="10" height="20" fill="#c97a7a"/>
  <text x="215" y="140" text-anchor="middle" font-size="10" fill="#8a3c3c">widget（点位置）</text>

  <!-- image with node decoration -->
  <rect x="36" y="214" width="268" height="104" fill="none" stroke="#8a5a8a" stroke-width="2" stroke-dasharray="5,3"/>
  <rect x="44" y="222" width="252" height="88" fill="#ffffff" stroke="#666" stroke-width="1.5"/>
  <text x="170" y="272" text-anchor="middle" font-size="13" fill="#555">image</text>
  <text x="170" y="340" text-anchor="middle" font-size="10" fill="#6b3c6b">node 装饰（恰好包住一个节点）</text>

  <!-- 右侧：DecorationSet 树 -->
  <rect x="390" y="20" width="350" height="140" fill="#e8eef7" stroke="#4a6fa5" stroke-width="2"/>
  <text x="565" y="46" text-anchor="middle" font-size="13" fill="#2c4a73">DecorationSet（doc 层）</text>
  <text x="406" y="74" font-size="11" fill="#333">local: [ node 装饰 → image ]</text>
  <text x="406" y="98" font-size="11" fill="#333">children: [ 0, para.nodeSize, 子 DecorationSet ]</text>
  <text x="406" y="126" font-size="10" fill="#777">跨节点的装饰留在本层 local</text>

  <line x1="565" y1="164" x2="565" y2="216" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="390" y="220" width="350" height="140" fill="#e8eef7" stroke="#4a8a5f" stroke-width="2"/>
  <text x="565" y="246" text-anchor="middle" font-size="13" fill="#2c5a3c">DecorationSet（paragraph 层）</text>
  <text x="406" y="274" font-size="11" fill="#333">local: [ inline 装饰，widget ]</text>
  <text x="406" y="298" font-size="11" fill="#333">children: 空</text>
  <text x="406" y="326" font-size="10" fill="#777">完全落入子节点的装饰下沉到子集</text>

  <!-- 文档到树的对应虚线 -->
  <line x1="304" y1="266" x2="456" y2="74" stroke="#8a5a8a" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="300" y1="128" x2="470" y2="252" stroke="#4a8a5f" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- 底部注释 -->
  <text x="380" y="404" text-anchor="middle" font-size="11" fill="#555">buildTree 按文档结构递归分组：local 存本层装饰，children 每三项一组（子节点起、止偏移 + 子集）</text>
</svg>
