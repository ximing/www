<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc"><title id="title">Pi harness 与 Claude Code 的分支持久化单位</title><desc id="desc">Pi 在一个 Session 树中通过 leaf 导航并可追加 branch summary，Claude Code 的 slash branch 创建新的 session 文件。</desc><defs><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.h{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.b{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#34415a}.s{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#667085}.pi{fill:#eaf2ff;stroke:#6b9df5;stroke-width:2}.cc{fill:#fff2e7;stroke:#e99a58;stroke-width:2}.n{fill:#f7f8fa;stroke:#d0d5dd;stroke-width:1.5}.l{stroke:#98a2b3;stroke-width:2;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#98a2b3"/></marker></defs><rect width="1200" height="470" rx="24" fill="#fff"/><text x="48" y="52" class="t">分支：Pi 在同一 Session 中导航，Claude Code 复制到新 Session</text><text x="48" y="94" class="h">Pi agent-core harness：一个文件，多条可导航路径</text><rect x="48" y="118" width="510" height="300" rx="16" class="pi"/><path d="M110 205 H230 M230 205 L350 160 M230 205 L350 270 M350 270 H470" class="l"/><circle cx="110" cy="205" r="18" fill="#fff" stroke="#6b9df5" stroke-width="2"/><circle cx="230" cy="205" r="18" fill="#fff" stroke="#6b9df5" stroke-width="2"/><circle cx="350" cy="160" r="18" fill="#fff" stroke="#6b9df5" stroke-width="2"/><circle cx="350" cy="270" r="18" fill="#fff" stroke="#6b9df5" stroke-width="2"/><circle cx="470" cy="270" r="18" fill="#6b9df5"/><text x="91" y="244" class="s">root</text><text x="194" y="244" class="s">共同祖先</text><text x="311" y="126" class="s">旧 leaf</text><text x="314" y="312" class="s">目标节点</text><text x="447" y="312" class="s">新 leaf</text><rect x="290" y="342" width="170" height="45" rx="9" class="n"/><text x="307" y="370" class="b">branch_summary</text><path d="M350 288 V342" class="l"/><text x="74" y="400" class="s">导航可把旧 leaf 到共同祖先的区间摘要写进新路径。</text><text x="644" y="94" class="h">Claude Code：`/branch` 生成新 session 文件</text><rect x="644" y="118" width="508" height="300" rx="16" class="cc"/><rect x="680" y="162" width="175" height="120" rx="12" class="n"/><text x="705" y="196" class="b">原 Session JSONL</text><text x="700" y="223" class="s">选择 messageUuid</text><text x="700" y="248" class="s">保留主会话消息</text><path d="M855 222 H925" class="l"/><rect x="925" y="162" width="190" height="120" rx="12" class="n"/><text x="951" y="196" class="b">新 Session JSONL</text><text x="946" y="223" class="s">复制消息并重建</text><text x="946" y="248" class="s">parentUuid、sessionId</text><rect x="777" y="327" width="220" height="45" rx="9" class="n"/><text x="795" y="355" class="b">forkedFrom + replacements</text><path d="M1020 282 V327" class="l"/><text x="670" y="400" class="s">运行时 forked agent 是另一条隔离执行路径，可写入 sidechain。</text></svg>