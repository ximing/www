<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="400" viewBox="0 0 1080 400" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, sans-serif">
  <defs>
    <marker id="arr-slate" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- 三个权限区 -->
  <rect x="40" y="60" width="300" height="250" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <text x="190" y="94" font-size="15" font-weight="600" fill="#14532D" text-anchor="middle">只读区</text>

  <rect x="390" y="60" width="300" height="250" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="540" y="94" font-size="15" font-weight="600" fill="#92400E" text-anchor="middle">受限写区</text>

  <rect x="740" y="60" width="300" height="250" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="890" y="94" font-size="15" font-weight="600" fill="#991B1B" text-anchor="middle">外部副作用区</text>

  <!-- 跨区箭头 -->
  <line x1="340" y1="190" x2="382" y2="190" stroke="#475569" stroke-width="2" marker-end="url(#arr-slate)"/>
  <text x="365" y="178" font-size="12" fill="#475569" text-anchor="middle">显式条件</text>

  <line x1="690" y1="190" x2="732" y2="190" stroke="#475569" stroke-width="2" marker-end="url(#arr-slate)"/>
  <rect x="700" y="160" width="26" height="18" rx="3" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  <text x="713" y="173" font-size="11" fill="#DC2626" text-anchor="middle">闸</text>
  <text x="715" y="212" font-size="12" fill="#475569" text-anchor="middle">人工闸门</text>

  <!-- 区内节点 -->
  <rect x="70" y="140" width="240" height="56" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/>
  <text x="190" y="166" font-size="14" fill="#14532D" text-anchor="middle">读取 diff</text>
  <text x="190" y="188" font-size="14" fill="#14532D" text-anchor="middle">运行测试（只读）</text>

  <rect x="70" y="224" width="240" height="56" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/>
  <text x="190" y="250" font-size="14" fill="#14532D" text-anchor="middle">产出候选结论</text>
  <text x="190" y="272" font-size="12" fill="#16A34A" text-anchor="middle">报告、建议、patch 草案</text>

  <rect x="420" y="140" width="240" height="56" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  <text x="540" y="166" font-size="14" fill="#92400E" text-anchor="middle">写工作区</text>
  <text x="540" y="188" font-size="12" fill="#B45309" text-anchor="middle">worktree 隔离</text>

  <rect x="420" y="224" width="240" height="56" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  <text x="540" y="250" font-size="14" fill="#92400E" text-anchor="middle">更新 snapshot</text>
  <text x="540" y="272" font-size="12" fill="#B45309" text-anchor="middle">需幂等键，可重放</text>

  <rect x="770" y="140" width="240" height="56" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  <text x="890" y="166" font-size="14" fill="#991B1B" text-anchor="middle">部署 Preview</text>
  <text x="890" y="188" font-size="12" fill="#B91C1C" text-anchor="middle">消耗外部资源</text>

  <rect x="770" y="224" width="240" height="56" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  <text x="890" y="250" font-size="14" fill="#991B1B" text-anchor="middle">发布 npm</text>
  <text x="890" y="272" font-size="12" fill="#B91C1C" text-anchor="middle">不可逆，必须人工批准</text>

  <text x="540" y="362" font-size="14" font-weight="600" fill="#334155" text-anchor="middle">批准整张图启动，不等于批准每一次写入</text>
</svg>
