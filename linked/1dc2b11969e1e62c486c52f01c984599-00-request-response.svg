<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc">
  <title id="title">Jev 一次请求的输入和输出</title>
  <desc id="desc">一次 systemOne 请求包含 state 和一组 typed questions，Jev 并行返回每道题的结构化答案、概率和 confidence，再由代码组合。</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #182230; }
    .title { font-size: 24px; font-weight: 700; }
    .label { font-size: 18px; font-weight: 700; }
    .sub { font-size: 15px; fill: #526176; }
  </style>
  <rect width="1100" height="420" rx="18" fill="#f8fafc"/>
  <text x="40" y="46" class="title">一次 systemOne 调用</text>

  <rect x="40" y="78" width="300" height="300" rx="16" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
  <text x="64" y="118" class="label">state</text>
  <text x="64" y="152" class="sub">字符串、对象或数组</text>
  <text x="64" y="178" class="sub">只放这一次调用要用的事实</text>
  <text x="64" y="220" class="label">questions</text>
  <text x="64" y="254" class="sub">Choice / Score / Noul</text>
  <text x="64" y="280" class="sub">同一 state 上并行求值</text>
  <text x="64" y="306" class="sub">题与题互相不改对方上下文</text>

  <path d="M360 228h70" fill="none" stroke="#64748b" stroke-width="4"/>
  <path d="m418 216 18 12-18 12" fill="none" stroke="#64748b" stroke-width="4"/>

  <rect x="450" y="140" width="200" height="176" rx="16" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="500" y="198" class="label">Jev</text>
  <text x="478" y="232" class="sub">jev-latest</text>
  <text x="468" y="258" class="sub">约 100 ms</text>
  <text x="468" y="284" class="sub">不生成文本</text>

  <path d="M670 228h70" fill="none" stroke="#64748b" stroke-width="4"/>
  <path d="m728 216 18 12-18 12" fill="none" stroke="#64748b" stroke-width="4"/>

  <rect x="760" y="78" width="300" height="300" rx="16" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="784" y="118" class="label">answers</text>
  <text x="784" y="152" class="sub">choice / score / noul</text>
  <text x="784" y="178" class="sub">各选项概率分布</text>
  <text x="784" y="204" class="sub">Choice/Score 另有 confidence</text>
  <text x="784" y="246" class="label">代码组合</text>
  <text x="784" y="280" class="sub">阈值、加权、路由</text>
  <text x="784" y="306" class="sub">不确定就升级或回退</text>
</svg>
