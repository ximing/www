<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" role="img" aria-labelledby="title"><title id="title">Fitter 的三块状态：unplaced、frontier、placed，以及放置循环与 close 收尾</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#182230}.t{font-size:14px;font-weight:700}.h{font-size:13px;font-weight:700}.b{font-size:12px;fill:#334155}.n{font-size:12px;fill:#526176}.o{font-size:11px;fill:#0891b2;font-weight:700}</style><rect width="900" height="660" rx="18" fill="#f8fafc"/><text x="40" y="34" class="t">Fitter：把 slice 的内容逐个放进替换缺口</text><text x="40" y="56" class="n">主循环：findFittable 找到一对可放深度就 placeNodes 搬运；找不到就 openMore 再打开一层，仍不行就 dropNode 丢弃</text><text x="40" y="90" class="h">unplaced：还没放下的 slice</text><rect x="40" y="100" width="250" height="212" rx="8" fill="#e0f2fe" stroke="#0891b2" stroke-width="1.5"/><text x="56" y="122" class="n">content，openStart = 1，openEnd = 0</text><rect x="56" y="134" width="218" height="106" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><line x1="56" y1="134" x2="56" y2="240" stroke="#0891b2" stroke-width="3" stroke-dasharray="6 4"/><text x="70" y="156" class="b">blockquote（左缘打开）</text><rect x="72" y="166" width="120" height="32" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="82" y="187" class="b">p: "a"</text><rect x="56" y="254" width="120" height="32" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="66" y="275" class="b">p: "b"</text><line x1="296" y1="200" x2="352" y2="200" stroke="#94a3b8" stroke-width="2"/><path d="M352 200 L342 195 L342 205 Z" fill="#94a3b8"/><text x="324" y="186" class="o" text-anchor="middle">①</text><text x="360" y="90" class="h">frontier：缺口左缘的打开节点栈</text><rect x="360" y="100" width="230" height="212" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><rect x="376" y="118" width="198" height="54" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="386" y="139" class="b">[2] paragraph（栈顶）</text><text x="386" y="158" class="n">match：内容表达式匹配进度</text><rect x="376" y="182" width="198" height="54" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="386" y="203" class="b">[1] blockquote</text><text x="386" y="222" class="n">match：block* 匹配进度</text><rect x="376" y="246" width="198" height="54" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="386" y="267" class="b">[0] doc</text><text x="386" y="286" class="n">match：顶层内容匹配进度</text><line x1="596" y1="200" x2="652" y2="200" stroke="#94a3b8" stroke-width="2"/><path d="M652 200 L642 195 L642 205 Z" fill="#94a3b8"/><text x="624" y="186" class="o" text-anchor="middle">②</text><text x="660" y="90" class="h">placed：已放置的内容</text><rect x="660" y="100" width="200" height="212" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="674" y="122" class="n">$from 脊柱的空壳，逐层填入</text><rect x="672" y="132" width="176" height="166" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="686" y="154" class="b">blockquote</text><rect x="686" y="164" width="148" height="36" rx="6" fill="#bae6fd" stroke="#475569" stroke-width="1.5"/><text x="696" y="187" class="b">p: "x"（本轮放入）</text><text x="686" y="226" class="n">蓝色为本轮 placeNodes</text><text x="686" y="244" class="n">从 unplaced 搬来的节点</text><text x="40" y="346" class="n">① findFittable：沿 unplaced 左缘链与 frontier 各深度，先试 matchType 与 fillBefore（inject），第二趟才试 findWrapping（wrap）</text><text x="40" y="368" class="n">② placeNodes：关闭更深的 frontier 节点，按需打开 wrap 层，把匹配节点搬进 placed 并推进 match；搬不动的留给下一轮</text><line x1="40" y1="392" x2="860" y2="392" stroke="#e2e8f0" stroke-width="1.5"/><text x="40" y="420" class="h">③ 收尾：close($to) 把 frontier 与 $to 一侧对齐，产出 step</text><rect x="40" y="440" width="190" height="118" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="54" y="466" class="b">逐层关闭 frontier</text><text x="54" y="490" class="n">closeFrontierNode 用</text><text x="54" y="510" class="n">fillBefore 补齐节点</text><text x="54" y="530" class="n">还缺的结尾内容</text><line x1="236" y1="499" x2="272" y2="499" stroke="#94a3b8" stroke-width="2"/><path d="M272 499 L262 494 L262 504 Z" fill="#94a3b8"/><rect x="278" y="440" width="190" height="118" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="292" y="466" class="b">与 $to 对齐</text><text x="292" y="490" class="n">缺的层用 $to 一侧</text><text x="292" y="510" class="n">节点 openFrontierNode</text><text x="292" y="530" class="n">补开，校验余下内容</text><line x1="474" y1="499" x2="510" y2="499" stroke="#94a3b8" stroke-width="2"/><path d="M510 499 L500 494 L500 504 Z" fill="#94a3b8"/><rect x="516" y="440" width="160" height="118" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="530" y="466" class="b">归一化产出 Slice</text><text x="530" y="490" class="n">Slice(placed,</text><text x="530" y="510" class="n">openStart, openEnd)</text><text x="530" y="530" class="n">剥掉单侧空壳</text><line x1="682" y1="499" x2="718" y2="499" stroke="#94a3b8" stroke-width="2"/><path d="M718 499 L708 494 L708 504 Z" fill="#94a3b8"/><rect x="724" y="440" width="136" height="118" rx="8" fill="#e0f2fe" stroke="#0891b2" stroke-width="1.5"/><text x="738" y="466" class="b">生成 step</text><text x="738" y="490" class="n">ReplaceStep</text><text x="738" y="510" class="n">或 mustMoveInline</text><text x="738" y="530" class="n">时 ReplaceAroundStep</text><text x="40" y="596" class="n">placed 的打开深度隐含在两处：左缘在 $from，右缘在 frontier；fit 收尾时换算成 Slice 的 openStart 与 openEnd</text><text x="40" y="620" class="n">mustMoveInline：$to 后面紧跟着能接进新文本块的行内内容时，改用 ReplaceAroundStep 把这段内容保留并搬进来</text></svg>
