<svg xmlns="http://www.w3.org/2000/svg" width="800" height="310" viewBox="0 0 800 310" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <text x="15" y="22" font-size="13" fill="#2c4a73" font-weight="bold">序列化：to_markdown.ts</text>

  <rect x="15" y="36" width="150" height="66" fill="#e8eef7" stroke="#4a6fa5" stroke-width="2"/>
  <text x="90" y="62" text-anchor="middle" font-size="12" fill="#2c4a73">ProseMirror 文档</text>
  <text x="90" y="82" text-anchor="middle" font-size="10" fill="#555">Node 树</text>

  <line x1="165" y1="69" x2="213" y2="69" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="220" y="36" width="150" height="66" fill="#f5eeda" stroke="#8a7a4a" stroke-width="2"/>
  <text x="295" y="58" text-anchor="middle" font-size="12" fill="#6b5a2e">MarkdownSerializer</text>
  <text x="295" y="76" text-anchor="middle" font-size="10" fill="#555">nodes 渲染函数表</text>
  <text x="295" y="92" text-anchor="middle" font-size="10" fill="#555">marks 开闭串规格表</text>

  <line x1="370" y1="69" x2="418" y2="69" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="425" y="36" width="150" height="66" fill="#f5eeda" stroke="#8a7a4a" stroke-width="2"/>
  <text x="500" y="58" text-anchor="middle" font-size="11" fill="#6b5a2e">MarkdownSerializerState</text>
  <text x="500" y="76" text-anchor="middle" font-size="10" fill="#555">out / delim / closed</text>
  <text x="500" y="92" text-anchor="middle" font-size="10" fill="#555">active mark 栈</text>

  <line x1="575" y1="69" x2="623" y2="69" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="630" y="36" width="150" height="66" fill="#e8eef7" stroke="#4a6fa5" stroke-width="2"/>
  <text x="705" y="62" text-anchor="middle" font-size="12" fill="#2c4a73">Markdown 文本</text>
  <text x="705" y="82" text-anchor="middle" font-size="10" fill="#555">CommonMark</text>

  <text x="15" y="152" font-size="13" fill="#2c4a73" font-weight="bold">解析：from_markdown.ts</text>

  <rect x="15" y="166" width="125" height="66" fill="#e8eef7" stroke="#4a6fa5" stroke-width="2"/>
  <text x="77" y="192" text-anchor="middle" font-size="12" fill="#2c4a73">Markdown 文本</text>
  <text x="77" y="212" text-anchor="middle" font-size="10" fill="#555">字符串输入</text>

  <line x1="140" y1="199" x2="168" y2="199" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="175" y="166" width="125" height="66" fill="#e8eef7" stroke="#4a6fa5" stroke-width="2"/>
  <text x="237" y="192" text-anchor="middle" font-size="12" fill="#2c4a73">markdown-it</text>
  <text x="237" y="212" text-anchor="middle" font-size="10" fill="#555">线性 token 流</text>

  <line x1="300" y1="199" x2="328" y2="199" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="335" y="166" width="125" height="66" fill="#f5eeda" stroke="#8a7a4a" stroke-width="2"/>
  <text x="397" y="188" text-anchor="middle" font-size="12" fill="#6b5a2e">tokenHandlers</text>
  <text x="397" y="206" text-anchor="middle" font-size="10" fill="#555">由 ParseSpec 表</text>
  <text x="397" y="222" text-anchor="middle" font-size="10" fill="#555">预生成</text>

  <line x1="460" y1="199" x2="488" y2="199" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="495" y="166" width="125" height="66" fill="#f5eeda" stroke="#8a7a4a" stroke-width="2"/>
  <text x="557" y="188" text-anchor="middle" font-size="11" fill="#6b5a2e">MarkdownParseState</text>
  <text x="557" y="206" text-anchor="middle" font-size="10" fill="#555">节点栈帧 content</text>
  <text x="557" y="222" text-anchor="middle" font-size="10" fill="#555">活动 marks 集合</text>

  <line x1="620" y1="199" x2="648" y2="199" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="655" y="166" width="125" height="66" fill="#e8eef7" stroke="#4a6fa5" stroke-width="2"/>
  <text x="717" y="192" text-anchor="middle" font-size="12" fill="#2c4a73">ProseMirror 文档</text>
  <text x="717" y="212" text-anchor="middle" font-size="10" fill="#555">Node 树</text>

  <text x="15" y="286" font-size="10" fill="#777">蓝框：数据；黄框：配置表与状态机。两条管线共用 schema，互不相干。</text>
</svg>
