<svg viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono','Menlo','Monaco','Consolas',monospace" font-size="13">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
  </defs>

  <rect width="1000" height="680" fill="url(#bg)" rx="8"/>

  <text x="500" y="34" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="bold" font-family="'Segoe UI','SF Pro',sans-serif">simple-gpt 训练 loss 曲线与调试时间线</text>
  <text x="500" y="55" text-anchor="middle" fill="#8b949e" font-size="12">正式 run：4 层 4 头 128 维，2500 步，数据为 logs/train.log 全量 11 个点</text>

  <!-- ============ 上半：loss 曲线 ============ -->
  <text x="80" y="92" fill="#8b949e" font-size="11">loss</text>

  <!-- 网格线与 y 轴刻度（loss 3~10） -->
  <line x1="80" y1="133" x2="940" y2="133" stroke="#21262d" stroke-width="1"/>
  <text x="70" y="137" text-anchor="end" fill="#8b949e" font-size="10">10</text>
  <line x1="80" y1="165.9" x2="940" y2="165.9" stroke="#21262d" stroke-width="1"/>
  <text x="70" y="169.9" text-anchor="end" fill="#8b949e" font-size="10">9</text>
  <line x1="80" y1="198.9" x2="940" y2="198.9" stroke="#21262d" stroke-width="1"/>
  <text x="70" y="202.9" text-anchor="end" fill="#8b949e" font-size="10">8</text>
  <line x1="80" y1="231.8" x2="940" y2="231.8" stroke="#21262d" stroke-width="1"/>
  <text x="70" y="235.8" text-anchor="end" fill="#8b949e" font-size="10">7</text>
  <line x1="80" y1="264.7" x2="940" y2="264.7" stroke="#21262d" stroke-width="1"/>
  <text x="70" y="268.7" text-anchor="end" fill="#8b949e" font-size="10">6</text>
  <line x1="80" y1="297.7" x2="940" y2="297.7" stroke="#21262d" stroke-width="1"/>
  <text x="70" y="301.7" text-anchor="end" fill="#8b949e" font-size="10">5</text>
  <line x1="80" y1="330.6" x2="940" y2="330.6" stroke="#21262d" stroke-width="1"/>
  <text x="70" y="334.6" text-anchor="end" fill="#8b949e" font-size="10">4</text>
  <line x1="80" y1="363.5" x2="940" y2="363.5" stroke="#21262d" stroke-width="1"/>
  <text x="70" y="367.5" text-anchor="end" fill="#8b949e" font-size="10">3</text>

  <!-- x 轴 -->
  <line x1="80" y1="380" x2="940" y2="380" stroke="#30363d" stroke-width="1.5"/>
  <text x="80" y="398" text-anchor="middle" fill="#8b949e" font-size="10">0</text>
  <text x="252" y="398" text-anchor="middle" fill="#8b949e" font-size="10">500</text>
  <text x="424" y="398" text-anchor="middle" fill="#8b949e" font-size="10">1000</text>
  <text x="596" y="398" text-anchor="middle" fill="#8b949e" font-size="10">1500</text>
  <text x="768" y="398" text-anchor="middle" fill="#8b949e" font-size="10">2000</text>
  <text x="940" y="398" text-anchor="middle" fill="#8b949e" font-size="10">2500</text>
  <text x="510" y="418" text-anchor="middle" fill="#8b949e" font-size="11">训练步数 step</text>

  <!-- warmup 标记 -->
  <line x1="149" y1="100" x2="149" y2="380" stroke="#8b949e" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="156" y="110" fill="#8b949e" font-size="10">warmup 200 步</text>

  <!-- 图例 -->
  <line x1="756" y1="92" x2="782" y2="92" stroke="#58a6ff" stroke-width="2.5"/>
  <text x="788" y="96" fill="#c9d1d9" font-size="11">train</text>
  <line x1="836" y1="92" x2="862" y2="92" stroke="#f778ba" stroke-width="2.5"/>
  <text x="868" y="96" fill="#c9d1d9" font-size="11">val</text>

  <!-- 起点标注 -->
  <text x="200" y="132" fill="#c9d1d9" font-size="11">初始 loss 10.84 ≈ ln(50257) ≈ 10.82</text>
  <text x="200" y="148" fill="#8b949e" font-size="10">起点等于对词表均匀乱猜，第一个 sanity check 通过</text>

  <!-- 终点标注 -->
  <text x="540" y="332" fill="#c9d1d9" font-size="11">终点 train 2.70 / val 2.84</text>
  <text x="540" y="348" fill="#8b949e" font-size="10">val 始终略高；train 末段微翘：数据量见顶，轻微过拟合，收手</text>

  <!-- train 曲线 -->
  <polyline points="80,105.3 166,325.6 252,356 338,365.2 424,368.1 510,370.4 596,371.1 682,372.1 768,373.4 854,373.7 940,373.4" fill="none" stroke="#58a6ff" stroke-width="2.5"/>
  <circle cx="80" cy="105.3" r="3" fill="#58a6ff"/>
  <circle cx="166" cy="325.6" r="3" fill="#58a6ff"/>
  <circle cx="252" cy="356" r="3" fill="#58a6ff"/>
  <circle cx="338" cy="365.2" r="3" fill="#58a6ff"/>
  <circle cx="424" cy="368.1" r="3" fill="#58a6ff"/>
  <circle cx="510" cy="370.4" r="3" fill="#58a6ff"/>
  <circle cx="596" cy="371.1" r="3" fill="#58a6ff"/>
  <circle cx="682" cy="372.1" r="3" fill="#58a6ff"/>
  <circle cx="768" cy="373.4" r="3" fill="#58a6ff"/>
  <circle cx="854" cy="373.7" r="3" fill="#58a6ff"/>
  <circle cx="940" cy="373.4" r="3" fill="#58a6ff"/>

  <!-- val 曲线 -->
  <polyline points="80,105.3 166,324 252,352.3 338,361.5 424,363.8 510,365.5 596,366.8 682,368.5 768,368.5 854,368.8 940,368.8" fill="none" stroke="#f778ba" stroke-width="2.5"/>
  <circle cx="80" cy="105.3" r="3" fill="#f778ba"/>
  <circle cx="166" cy="324" r="3" fill="#f778ba"/>
  <circle cx="252" cy="352.3" r="3" fill="#f778ba"/>
  <circle cx="338" cy="361.5" r="3" fill="#f778ba"/>
  <circle cx="424" cy="363.8" r="3" fill="#f778ba"/>
  <circle cx="510" cy="365.5" r="3" fill="#f778ba"/>
  <circle cx="596" cy="366.8" r="3" fill="#f778ba"/>
  <circle cx="682" cy="368.5" r="3" fill="#f778ba"/>
  <circle cx="768" cy="368.5" r="3" fill="#f778ba"/>
  <circle cx="854" cy="368.8" r="3" fill="#f778ba"/>
  <circle cx="940" cy="368.8" r="3" fill="#f778ba"/>
</svg>
