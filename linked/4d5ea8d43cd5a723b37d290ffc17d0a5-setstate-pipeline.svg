<svg xmlns="http://www.w3.org/2000/svg" width="980" height="600" viewBox="0 0 980 600" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="980" height="600" fill="#ffffff"/>

  <!-- 顶部链：更新入口 -->
  <g font-size="13" text-anchor="middle">
    <rect x="20" y="24" width="280" height="48" rx="8" fill="#eef4ff" stroke="#4a7ddb" stroke-width="1.5"/>
    <text x="160" y="44" fill="#1f3a6e" font-weight="600">setState / dispatch</text>
    <text x="160" y="62" fill="#5b6b8c" font-size="11">组件内触发更新</text>

    <rect x="350" y="24" width="280" height="48" rx="8" fill="#eef4ff" stroke="#4a7ddb" stroke-width="1.5"/>
    <text x="490" y="44" fill="#1f3a6e" font-weight="600">requestUpdateLane</text>
    <text x="490" y="62" fill="#5b6b8c" font-size="11">按事件优先级取一个 lane</text>

    <rect x="680" y="24" width="280" height="48" rx="8" fill="#eef4ff" stroke="#4a7ddb" stroke-width="1.5"/>
    <text x="820" y="44" fill="#1f3a6e" font-weight="600">scheduleUpdateOnFiber</text>
    <text x="820" y="62" fill="#5b6b8c" font-size="11">markRootUpdated，lane 挂到 root</text>

    <line x1="300" y1="48" x2="348" y2="48" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="630" y1="48" x2="678" y2="48" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- 调度决策 -->
  <g font-size="13" text-anchor="middle">
    <rect x="350" y="112" width="280" height="52" rx="8" fill="#fff7e6" stroke="#d99a2b" stroke-width="1.5"/>
    <text x="490" y="133" fill="#7a5410" font-weight="600">ensureRootIsScheduled</text>
    <text x="490" y="151" fill="#8a6d33" font-size="11">getNextLanes 选出 nextLanes，决定走哪条路</text>
    <line x1="820" y1="72" x2="820" y2="96" stroke="#555" stroke-width="1.5"/>
    <line x1="820" y1="96" x2="490" y2="96" stroke="#555" stroke-width="1.5"/>
    <line x1="490" y1="96" x2="490" y2="110" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- 左列：Sync 路径 -->
  <g font-size="12.5" text-anchor="middle">
    <text x="230" y="196" fill="#b03434" font-size="13" font-weight="700">Sync 路径（newCallbackPriority === SyncLane）</text>
    <rect x="40" y="208" width="380" height="46" rx="8" fill="#fdeeee" stroke="#c15454" stroke-width="1.5"/>
    <text x="230" y="228" fill="#7a2222" font-weight="600">scheduleSyncCallback 进内部同步队列</text>
    <text x="230" y="245" fill="#8c5656" font-size="11">scheduleMicrotask(flushSyncCallbacks)</text>

    <rect x="40" y="268" width="380" height="46" rx="8" fill="#fdeeee" stroke="#c15454" stroke-width="1.5"/>
    <text x="230" y="288" fill="#7a2222" font-weight="600">微任务里 performSyncWorkOnRoot</text>
    <text x="230" y="305" fill="#8c5656" font-size="11">renderRootSync，一口气算完整棵树</text>

    <rect x="40" y="328" width="380" height="46" rx="8" fill="#fdeeee" stroke="#c15454" stroke-width="1.5"/>
    <text x="230" y="348" fill="#7a2222" font-weight="600">workLoopSync</text>
    <text x="230" y="365" fill="#8c5656" font-size="11">while 循环不检查让出，不可中断</text>

    <line x1="440" y1="140" x2="230" y2="140" stroke="#555" stroke-width="1.5"/>
    <line x1="230" y1="140" x2="230" y2="206" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="230" y1="254" x2="230" y2="266" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="230" y1="314" x2="230" y2="326" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- 右列：Concurrent 路径 -->
  <g font-size="12.5" text-anchor="middle">
    <text x="750" y="196" fill="#2c6e46" font-size="13" font-weight="700">Concurrent 路径（transition / retry 等 lane）</text>
    <rect x="560" y="208" width="380" height="46" rx="8" fill="#eaf6ee" stroke="#3f9d63" stroke-width="1.5"/>
    <text x="750" y="228" fill="#1e5233" font-weight="600">scheduleCallback 按 lanesToEventPriority 映射</text>
    <text x="750" y="245" fill="#4e7a5e" font-size="11">任务进 Scheduler 的 taskQueue 小顶堆</text>

    <rect x="560" y="268" width="380" height="46" rx="8" fill="#eaf6ee" stroke="#3f9d63" stroke-width="1.5"/>
    <text x="750" y="288" fill="#1e5233" font-weight="600">MessageChannel 宏任务驱动 workLoop</text>
    <text x="750" y="305" fill="#4e7a5e" font-size="11">shouldYieldToHost 每 5ms 让出主线程</text>

    <rect x="560" y="328" width="380" height="58" rx="8" fill="#eaf6ee" stroke="#3f9d63" stroke-width="1.5"/>
    <text x="750" y="348" fill="#1e5233" font-weight="600">performConcurrentWorkOnRoot</text>
    <text x="750" y="365" fill="#4e7a5e" font-size="11">workLoopConcurrent 切片执行，没算完返回续体</text>
    <text x="750" y="380" fill="#4e7a5e" font-size="11">（continuation），下一轮宏任务接着跑</text>

    <path d="M 962 357 A 18 18 0 1 1 950 332" fill="none" stroke="#3f9d63" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="966" y="404" fill="#3f9d63" font-size="10" text-anchor="end">续体循环</text>

    <line x1="630" y1="140" x2="750" y2="140" stroke="#555" stroke-width="1.5"/>
    <line x1="750" y1="140" x2="750" y2="206" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="750" y1="254" x2="750" y2="266" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="750" y1="314" x2="750" y2="326" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- 汇合：commit 与绘制 -->
  <g font-size="13" text-anchor="middle">
    <rect x="350" y="448" width="280" height="52" rx="8" fill="#f2ecfb" stroke="#7c53c4" stroke-width="1.5"/>
    <text x="490" y="469" fill="#452a7a" font-weight="600">commitRoot</text>
    <text x="490" y="487" fill="#6a5a8c" font-size="11">mutation 改 DOM，layout effects 同步执行</text>

    <rect x="680" y="448" width="280" height="52" rx="8" fill="#f2ecfb" stroke="#7c53c4" stroke-width="1.5"/>
    <text x="820" y="469" fill="#452a7a" font-weight="600">浏览器绘制</text>
    <text x="820" y="487" fill="#6a5a8c" font-size="11">finishedWork 树成为 current，用户看到新界面</text>

    <line x1="230" y1="374" x2="230" y2="474" stroke="#555" stroke-width="1.5"/>
    <line x1="230" y1="474" x2="348" y2="474" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="750" y1="386" x2="750" y2="474" stroke="#555" stroke-width="1.5"/>
    <line x1="750" y1="474" x2="632" y2="474" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="630" y1="474" x2="678" y2="474" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <text x="490" y="548" text-anchor="middle" fill="#888" font-size="12">一次 setState 从触发到上屏的完整链路（master @ 2021-06-24，.new fork）</text>
</svg>
