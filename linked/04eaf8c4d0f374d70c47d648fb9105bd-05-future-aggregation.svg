<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="780" height="560" rx="8" fill="#f8fafc"/>
  <text x="30" y="34" font-size="16" font-weight="600" fill="#1f2937">串行调用 vs Future 并发聚合：同一个聚合接口的时间线对照</text>

  <!-- 左：串行 -->
  <rect x="30" y="55" width="340" height="270" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="200" y="82" font-size="14" font-weight="600" fill="#1f2937" text-anchor="middle">串行调用</text>
  <text x="200" y="100" font-size="11" fill="#64748b" text-anchor="middle">（一个请求线程依次调所有下游）</text>

  <text x="45" y="135" font-size="11.5" fill="#475569">请求线程</text>
  <!-- 时间轴 -->
  <line x1="90" y1="170" x2="356" y2="170" stroke="#cbd5e1" stroke-width="1" marker-end="url(#arr)"/>

  <!-- 串行块：比例 0.55px/ms，A80=44 B150=82 C60=33 D200=110 -->
  <rect x="90" y="145" width="44" height="30" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="134" y="145" width="82" height="30" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
  <rect x="216" y="145" width="33" height="30" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="249" y="145" width="110" height="30" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>

  <text x="112" y="192" font-size="10.5" fill="#2563eb" text-anchor="middle">列表 80ms</text>
  <text x="175" y="192" font-size="10.5" fill="#b45309" text-anchor="middle">配额 150ms</text>
  <text x="232" y="192" font-size="10.5" fill="#2563eb" text-anchor="middle">回收站</text>
  <text x="304" y="192" font-size="10.5" fill="#b91c1c" text-anchor="middle">最近动态 200ms</text>

  <line x1="90" y1="212" x2="359" y2="212" stroke="#dc2626" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="90" y="230" font-size="11.5" fill="#b91c1c">总耗时 ≈ 80+150+60+200 = 490ms</text>
  <text x="90" y="252" font-size="11.5" fill="#b91c1c">RT = 所有下游之和</text>
  <text x="90" y="272" font-size="11.5" fill="#b91c1c">下游每多一个，RT 就加一份</text>
  <text x="90" y="300" font-size="11" fill="#64748b">临时处理：砍掉非必要字段，减少下游数量</text>

  <!-- 右：并发聚合 -->
  <rect x="410" y="55" width="340" height="270" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="580" y="82" font-size="14" font-weight="600" fill="#1f2937" text-anchor="middle">Future 并发聚合</text>
  <text x="580" y="100" font-size="11" fill="#64748b" text-anchor="middle">（先全部 submit，再逐个 get 带超时收结果）</text>

  <!-- 主线程行 -->
  <text x="425" y="135" font-size="11.5" fill="#475569">请求线程</text>
  <rect x="470" y="120" width="30" height="22" rx="4" fill="#e2e8f0" stroke="#475569" stroke-width="1"/>
  <text x="485" y="135" font-size="10" fill="#475569" text-anchor="middle">提交</text>
  <line x1="500" y1="131" x2="640" y2="131" stroke="#475569" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="570" y="122" font-size="10" fill="#475569" text-anchor="middle">get(超时) 等待汇总</text>
  <rect x="640" y="120" width="26" height="22" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="653" y="135" font-size="10" fill="#15803d" text-anchor="middle">返回</text>

  <!-- 聚合池 4 个子任务，起点对齐 x=470，比例同左 -->
  <text x="425" y="172" font-size="11.5" fill="#475569">聚合线程池</text>
  <rect x="470" y="158" width="44" height="20" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="525" y="172" font-size="10.5" fill="#2563eb">列表 80ms</text>

  <rect x="470" y="186" width="82" height="20" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
  <text x="563" y="200" font-size="10.5" fill="#b45309">配额 150ms</text>

  <rect x="470" y="214" width="33" height="20" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="514" y="228" font-size="10.5" fill="#2563eb">回收站 60ms</text>

  <rect x="470" y="242" width="110" height="20" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="592" y="256" font-size="10.5" fill="#b91c1c">最近动态 200ms（最慢）</text>

  <!-- 最慢任务结束位置对齐线 -->
  <line x1="580" y1="148" x2="580" y2="270" stroke="#dc2626" stroke-width="1" stroke-dasharray="4 3"/>

  <text x="425" y="296" font-size="11.5" fill="#15803d">总耗时 ≈ 最慢下游 200ms + 汇总开销</text>
  <text x="425" y="314" font-size="11.5" fill="#15803d">RT 与下游数量脱钩</text>

  <!-- 底：要点 -->
  <rect x="30" y="345" width="720" height="190" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="50" y="370" font-size="13" font-weight="600" fill="#475569">要点</text>
  <text x="50" y="394" font-size="12" fill="#475569">· submit 不阻塞、get 才阻塞：必须先一口气提交全部任务，再逐个收结果——边提交边等等于改回串行；</text>
  <text x="50" y="416" font-size="12" fill="#475569">· 并发聚合存在短板效应：整体耗时由最慢的那个下游决定，慢下游的权重被放大；</text>
  <text x="50" y="438" font-size="12" fill="#475569">· 因此每个 Future.get 必须带超时：任一字段超时即降级返回，不能让一个下游把整个接口拖死；</text>
  <text x="50" y="460" font-size="12" fill="#475569">· CountDownLatch 与 Future 分工：只要「全部完成」的信号用 latch，要收集每个结果用 Future；</text>
  <text x="50" y="482" font-size="12" fill="#475569">· 聚合子任务要用独立的聚合线程池，与业务线程池分开——否则子任务会把业务池占满，隔离白做；</text>
  <text x="50" y="504" font-size="12" fill="#475569">· get 超时后任务仍在跑：cancel(true) 未必停得下来，真正的防线是下游调用自身的超时。</text>
</svg>
