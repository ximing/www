<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">线上智能巡检系统架构</title><desc id="desc">四类事件源（监控告警 webhook、HTTP 回调、cron 定时任务、IM 人工消息）汇入统一事件队列，巡检 Agent 循环消费事件，通过 MCP 工具层访问 git 仓库、变更记录、日志等只读诊断系统定位问题，可逆动作自动执行，高危动作转人工待办，全部状态外置落库。</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#182230}.title{font-size:29px;font-weight:700}.label{font-size:21px;font-weight:700}.sub{font-size:17px;fill:#526176}.small{font-size:16px;fill:#526176}</style><rect width="1200" height="720" rx="20" fill="#f8fafc"/><text x="48" y="54" class="title">线上智能巡检系统架构</text><text x="45" y="100" class="label">事件源</text><g stroke-width="3"><rect x="45" y="112" width="250" height="96" rx="14" fill="#e0f2fe" stroke="#38bdf8"/><rect x="45" y="222" width="250" height="96" rx="14" fill="#e0f2fe" stroke="#38bdf8"/><rect x="45" y="332" width="250" height="96" rx="14" fill="#e0f2fe" stroke="#38bdf8"/><rect x="45" y="442" width="250" height="96" rx="14" fill="#e0f2fe" stroke="#38bdf8"/></g><text x="65" y="150" class="label">监控告警 webhook</text><text x="65" y="178" class="sub">接口异常 · JS Error</text><text x="65" y="200" class="sub">性能指标越限</text><text x="65" y="260" class="label">HTTP 回调</text><text x="65" y="292" class="sub">工单状态 · 审批结果</text><text x="65" y="370" class="label">cron 定时任务</text><text x="65" y="402" class="sub">例行巡检 · 每周性能分析</text><text x="65" y="480" class="label">IM 人工消息</text><text x="65" y="512" class="sub">人直接提问也是事件</text><g fill="none" stroke="#64748b" stroke-width="4"><path d="M295 160h30M295 270h30M295 380h30M295 490h30M325 160v330M325 197h30"/><path d="m343 187 12 10-12 10"/></g><rect x="355" y="112" width="330" height="170" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/><text x="375" y="150" class="label">事件队列</text><text x="375" y="182" class="sub">统一结构：类型 / 优先级 / 负载</text><text x="375" y="206" class="sub">去重键合并状态型告警</text><text x="375" y="230" class="sub">事实型事件不丢，消费幂等</text><text x="375" y="254" class="sub">持久化 · ack · 重试上限</text><path d="M520 282v58" fill="none" stroke="#64748b" stroke-width="5"/><path d="m508 326 12 14 12-14" fill="none" stroke="#64748b" stroke-width="5"/><rect x="355" y="340" width="330" height="200" rx="14" fill="#ede9fe" stroke="#8b5cf6" stroke-width="3"/><text x="375" y="378" class="label">巡检 Agent 循环</text><text x="375" y="410" class="sub">取事件，定计划</text><text x="375" y="434" class="sub">按步骤执行，边界检查高优事件</text><text x="375" y="458" class="sub">每步完成写 checkpoint</text><text x="375" y="482" class="sub">处理完决定继续或切换</text><text x="375" y="506" class="sub">失败重试，超限转人工</text><g fill="none" stroke="#64748b" stroke-width="4"><path d="M685 420h20M705 177v288M705 177h40M705 316h40M705 465h40"/><path d="m733 167 12 10-12 10m0 139 12 10-12 10m0 139 12 10-12 10"/></g><rect x="745" y="112" width="410" height="130" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="3"/><text x="765" y="150" class="label">诊断工具（MCP 统一接入）</text><text x="765" y="178" class="sub">git 仓库 · 线上变更记录</text><text x="765" y="202" class="sub">日志 · trace · 指标平台</text><text x="765" y="226" class="sub">知识库检索历史预案</text><rect x="745" y="256" width="410" height="120" rx="14" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/><text x="765" y="294" class="label">自动处置（可逆动作）</text><text x="765" y="326" class="sub">重启实例 · 摘流 · 清缓存 · 临时限流</text><text x="765" y="350" class="sub">每个动作写审计日志</text><rect x="745" y="390" width="410" height="150" rx="14" fill="#fee2e2" stroke="#ef4444" stroke-width="3"/><text x="765" y="428" class="label">人工待办（高危动作）</text><text x="765" y="460" class="sub">回滚 · 改配置 · 写库 · 发版</text><text x="765" y="484" class="sub">附诊断结论与预案，等人放行</text><text x="765" y="508" class="sub">通知分级：即时告警 / 日报汇总</text><path d="M400 540v40" fill="none" stroke="#64748b" stroke-width="5"/><path d="m388 566 12 14 12-14" fill="none" stroke="#64748b" stroke-width="5"/><rect x="45" y="580" width="1110" height="100" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/><text x="75" y="622" class="label">状态外置</text><text x="75" y="652" class="sub">任务进度 · checkpoint · 事件存档 · 处置审计全部落库，进程无状态，实例可替换</text></svg>