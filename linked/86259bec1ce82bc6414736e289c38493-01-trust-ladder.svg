<svg xmlns="http://www.w3.org/2000/svg" width="800" height="384" viewBox="0 0 800 384" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- ascending trend arrow -->
  <line x1="90" y1="226" x2="716" y2="86" stroke="#b45309" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-amber)"/>
  <text x="400" y="118" font-size="12.5" fill="#b45309" text-anchor="middle">可信度递增 · 单页成本递增 · 覆盖的问题越接近用户实际看到的</text>

  <!-- baseline -->
  <line x1="30" y1="304" x2="770" y2="304" stroke="#a1a1aa" stroke-width="1.2"/>

  <!-- G2 -->
  <rect x="60" y="234" width="130" height="70" rx="8" fill="#f4f4f5"/>
  <text x="125" y="254" font-size="13.5" font-weight="600" fill="#18181b" text-anchor="middle">G2 静态</text>
  <text x="125" y="274" font-size="11.5" fill="#3f3f46" text-anchor="middle">代码静态上成立吗</text>
  <text x="125" y="293" font-size="11" fill="#71717a" text-anchor="middle">tsc · eslint · build</text>

  <!-- G3 -->
  <rect x="205" y="204" width="130" height="100" rx="8" fill="#ededf0"/>
  <text x="270" y="224" font-size="13.5" font-weight="600" fill="#18181b" text-anchor="middle">G3 结构对账</text>
  <text x="270" y="244" font-size="11.5" fill="#3f3f46" text-anchor="middle">与源仓对得上吗</text>
  <text x="270" y="263" font-size="11" fill="#71717a" text-anchor="middle">i18n · props · ref</text>
  <text x="270" y="281" font-size="11" fill="#71717a" text-anchor="middle">全量，非抽查</text>

  <!-- G4 -->
  <rect x="350" y="174" width="130" height="130" rx="8" fill="#e4e4e7"/>
  <text x="415" y="194" font-size="13.5" font-weight="600" fill="#18181b" text-anchor="middle">G4 覆盖</text>
  <text x="415" y="214" font-size="11.5" fill="#3f3f46" text-anchor="middle">每行有着落吗</text>
  <text x="415" y="233" font-size="11" fill="#71717a" text-anchor="middle">文件 100% 终态</text>
  <text x="415" y="251" font-size="11" fill="#71717a" text-anchor="middle">行 100% disposition</text>
  <text x="415" y="269" font-size="11" fill="#71717a" text-anchor="middle">高危 100% 对账/工单</text>

  <!-- G5 -->
  <rect x="495" y="144" width="130" height="160" rx="8" fill="#dcdce0"/>
  <text x="560" y="164" font-size="13.5" font-weight="600" fill="#18181b" text-anchor="middle">G5 双端 e2e</text>
  <text x="560" y="184" font-size="11.5" fill="#3f3f46" text-anchor="middle">行为与旧页一致吗</text>
  <text x="560" y="203" font-size="11" fill="#71717a" text-anchor="middle">CSI 驱动真实 Chrome</text>
  <text x="560" y="221" font-size="11" fill="#71717a" text-anchor="middle">确定性 differ</text>
  <text x="560" y="243" font-size="11" fill="#b45309" text-anchor="middle">半自动：需本机</text>
  <text x="560" y="261" font-size="11" fill="#b45309" text-anchor="middle">登录态，人在场</text>

  <!-- 人工验收：灰色缺口 -->
  <rect x="640" y="114" width="130" height="190" rx="8" fill="#ffffff" stroke="#71717a" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="705" y="134" font-size="13.5" font-weight="600" fill="#18181b" text-anchor="middle">人工验收</text>
  <text x="705" y="154" font-size="11.5" fill="#3f3f46" text-anchor="middle">看着对吗</text>
  <text x="705" y="173" font-size="11" fill="#71717a" text-anchor="middle">纯人工</text>
  <text x="705" y="199" font-size="11" fill="#71717a" text-anchor="middle">灰色缺口</text>
  <text x="705" y="217" font-size="11" fill="#71717a" text-anchor="middle">未覆盖（无数据源）</text>
  <text x="705" y="235" font-size="11" fill="#71717a" text-anchor="middle">缺口本身是信息</text>

  <!-- nature tags -->
  <rect x="60" y="318" width="14" height="14" rx="3" fill="#e4e4e7"/>
  <text x="82" y="330" font-size="12" fill="#3f3f46">机器判定（可无人值守）</text>
  <rect x="255" y="318" width="14" height="14" rx="3" fill="#dcdce0"/>
  <text x="277" y="330" font-size="12" fill="#3f3f46">半自动（需人在场条件）</text>
  <rect x="455" y="318" width="14" height="14" rx="3" fill="#ffffff" stroke="#71717a" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="477" y="330" font-size="12" fill="#3f3f46">人工（无数据源，灰色缺口如实显示，不隐藏）</text>

  <!-- bottom note -->
  <rect x="100" y="348" width="600" height="28" rx="8" fill="#fdf6ec" stroke="#b45309" stroke-width="1.2"/>
  <text x="400" y="366" font-size="12" fill="#3f3f46" text-anchor="middle">阶梯报告的是「信任到哪一层为止」，不是「是否可信」的布尔值</text>
</svg>
