<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc"><title id="title">自动化测试接入巡检闭环</title><desc id="desc">cron 定时拉起无头浏览器真实访问线上核心页面，采集截图、DOM、网络请求与性能指标，与基线做视觉对比和断言，检测到问题生成标准事件写回统一事件队列，复用现有定位、处置与归档闭环。</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#182230}.title{font-size:29px;font-weight:700}.label{font-size:21px;font-weight:700}.sub{font-size:17px;fill:#526176}.small{font-size:16px;fill:#526176}</style><rect width="1200" height="580" rx="20" fill="#f8fafc"/><text x="48" y="54" class="title">下一步：自动化测试接入巡检闭环</text><g stroke-width="3"><rect x="45" y="100" width="200" height="130" rx="14" fill="#e0f2fe" stroke="#38bdf8"/><rect x="275" y="100" width="200" height="130" rx="14" fill="#ede9fe" stroke="#8b5cf6"/><rect x="505" y="100" width="200" height="130" rx="14" fill="#ede9fe" stroke="#8b5cf6"/><rect x="735" y="100" width="200" height="130" rx="14" fill="#fef3c7" stroke="#f59e0b"/><rect x="965" y="100" width="200" height="130" rx="14" fill="#dcfce7" stroke="#22c55e"/></g><text x="65" y="136" class="label">定时触发</text><text x="65" y="164" class="sub">cron 每 30 分钟</text><text x="65" y="188" class="sub">例行跑核心路径</text><text x="295" y="136" class="label">拉起浏览器</text><text x="295" y="164" class="sub">真实访问线上页面</text><text x="295" y="188" class="sub">模拟核心交互</text><text x="525" y="136" class="label">采集证据</text><text x="525" y="164" class="sub">截图 · DOM 快照</text><text x="525" y="188" class="sub">网络请求 · 性能</text><text x="755" y="136" class="label">检测对比</text><text x="755" y="164" class="sub">截图基线视觉对比</text><text x="755" y="188" class="sub">白屏与关键元素断言</text><text x="985" y="136" class="label">生成标准事件</text><text x="985" y="164" class="sub">类型 · 优先级</text><text x="985" y="188" class="sub">去重键 · 负载</text><text x="985" y="212" class="sub">写回统一事件队列</text><g fill="none" stroke="#64748b" stroke-width="5"><path d="M245 165h30M475 165h30M705 165h30M935 165h30"/><path d="m257 155 18 10-18 10m212-10 18 10-18 10m212-10 18 10-18 10m212-10 18 10-18 10"/></g><path d="M1065 230v60" fill="none" stroke="#64748b" stroke-width="5"/><path d="m1053 276 12 14 12-14" fill="none" stroke="#64748b" stroke-width="5"/><rect x="45" y="290" width="1120" height="110" rx="16" fill="#ede9fe" stroke="#8b5cf6" stroke-width="3"/><text x="75" y="332" class="label">复用现有巡检闭环</text><text x="75" y="364" class="sub">事件队列 → 定位诊断 → 自动处置 / 人工待办 → 验证归档，全流程不重写</text><rect x="45" y="440" width="540" height="100" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/><text x="75" y="478" class="label">新成本</text><text x="75" y="508" class="sub">基线截图随发版更新，控制误报率</text><rect x="615" y="440" width="540" height="100" rx="16" fill="#e0f2fe" stroke="#38bdf8" stroke-width="3"/><text x="645" y="478" class="label">架构收益</text><text x="645" y="508" class="sub">新能力以事件源接入，循环与权限不动</text></svg>