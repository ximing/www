<svg xmlns="http://www.w3.org/2000/svg" width="940" height="720" viewBox="0 0 940 720" role="img" aria-labelledby="title"><title id="title">keydown 在输入管线中的处理顺序：归属判断、三层拦截与放行</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#182230}.t{font-size:14px;font-weight:700}.h{font-size:13px;font-weight:700}.b{font-size:12px;fill:#334155}.n{font-size:12px;fill:#526176}.o{font-size:11px;fill:#0891b2;font-weight:700}</style><rect width="940" height="720" rx="18" fill="#f8fafc"/><text x="40" y="34" class="t">keydown 的处理顺序：三层拦截，拦不住就放行给浏览器</text><g><rect x="320" y="56" width="300" height="52" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="336" y="78" class="h">keydown 到达 view.dom</text><text x="336" y="96" class="n">initInput 注册的包装函数是统一入口</text></g><line x1="470" y1="108" x2="470" y2="132" stroke="#94a3b8" stroke-width="2"/><path d="M470 132 L465 122 L475 122 Z" fill="#94a3b8"/><g><rect x="320" y="136" width="300" height="64" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="336" y="158" class="h">闸门 0：eventBelongsToView</text><text x="336" y="176" class="b">defaultPrevented · NodeView stopEvent</text><text x="336" y="192" class="n">冒泡链走出 view.dom 也不算自己的</text></g><line x1="470" y1="200" x2="470" y2="224" stroke="#94a3b8" stroke-width="2"/><path d="M470 224 L465 214 L475 214 Z" fill="#94a3b8"/><line x1="620" y1="168" x2="696" y2="168" stroke="#94a3b8" stroke-width="2"/><path d="M696 168 L686 163 L686 173 Z" fill="#94a3b8"/><g><rect x="700" y="136" width="200" height="64" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="716" y="162" class="h">不归编辑器处理</text><text x="716" y="182" class="n">事件留给 NodeView 或外部</text></g><g><rect x="320" y="228" width="300" height="64" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="336" y="250" class="h">闸门 1：runCustomHandler</text><text x="336" y="268" class="b">handleDOMEvents prop</text><text x="336" y="284" class="n">someProp 按插件顺序逐个询问</text></g><line x1="470" y1="292" x2="470" y2="316" stroke="#94a3b8" stroke-width="2"/><path d="M470 316 L465 306 L475 306 Z" fill="#94a3b8"/><line x1="620" y1="260" x2="696" y2="260" stroke="#94a3b8" stroke-width="2"/><path d="M696 260 L686 255 L686 265 Z" fill="#94a3b8"/><g><rect x="700" y="228" width="200" height="64" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="716" y="254" class="h">已处理</text><text x="716" y="274" class="n">handler 返回 true，或事件已被</text><text x="716" y="288" class="n">preventDefault</text></g><g><rect x="320" y="320" width="300" height="76" rx="8" fill="#e0f2fe" stroke="#0891b2" stroke-width="1.5"/><text x="336" y="342" class="h">editHandlers.keydown</text><text x="336" y="360" class="b">记 shiftKey / lastKeyCode，composition 特判</text><text x="336" y="376" class="b">keyCode ≠ 229 时先 forceFlush</text><text x="336" y="390" class="n">把积压的 DOM 变化读回，再处理按键</text></g><line x1="470" y1="396" x2="470" y2="420" stroke="#94a3b8" stroke-width="2"/><path d="M470 420 L465 410 L475 410 Z" fill="#94a3b8"/><g><rect x="320" y="424" width="300" height="64" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="336" y="446" class="h">闸门 2：handleKeyDown prop</text><text x="336" y="464" class="b">逐插件询问（keymap 挂在这里）</text><text x="336" y="480" class="n">全部返回 false 才继续向下</text></g><line x1="470" y1="488" x2="470" y2="512" stroke="#94a3b8" stroke-width="2"/><path d="M470 512 L465 502 L475 502 Z" fill="#94a3b8"/><g><rect x="320" y="516" width="300" height="64" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="336" y="538" class="h">闸门 3：captureKeyDown 兜底</text><text x="336" y="556" class="b">危险按键压制 · 光标移动接管</text><text x="336" y="572" class="n">Enter / Esc / Mod-biyz 无条件拦下</text></g><line x1="620" y1="456" x2="672" y2="492" stroke="#94a3b8" stroke-width="2"/><path d="M672 492 L660 489 L666 480 Z" fill="#94a3b8"/><line x1="620" y1="548" x2="672" y2="528" stroke="#94a3b8" stroke-width="2"/><path d="M672 528 L660 527 L665 518 Z" fill="#94a3b8"/><g><rect x="676" y="472" width="224" height="72" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="692" y="496" class="h">返回 true：preventDefault</text><text x="692" y="516" class="n">多个分支已 dispatch transaction</text><text x="692" y="532" class="n">true 只阻止浏览器再执行一次</text></g><line x1="470" y1="580" x2="470" y2="604" stroke="#94a3b8" stroke-width="2"/><path d="M470 604 L465 594 L475 594 Z" fill="#94a3b8"/><g><rect x="320" y="608" width="300" height="56" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="336" y="630" class="h">放行：浏览器默认行为改 DOM</text><text x="336" y="648" class="n">setSelectionOrigin 记下来源是键盘</text></g><line x1="620" y1="636" x2="696" y2="636" stroke="#94a3b8" stroke-width="2"/><path d="M696 636 L686 631 L686 641 Z" fill="#94a3b8"/><g><rect x="700" y="608" width="200" height="56" rx="8" fill="#e0f2fe" stroke="#0891b2" stroke-width="1.5"/><text x="716" y="632" class="h">DOMObserver 读回对齐</text><text x="716" y="650" class="n">上一篇的被动路径</text></g><text x="40" y="330" class="o">keydown 进语义层之前的记账</text><text x="40" y="350" class="n">shiftKey 给粘贴的纯文本判断用</text><text x="40" y="368" class="n">lastKeyCode / lastKeyCodeTime 给读回用：</text><text x="40" y="384" class="n">Android Chrome 上 100ms 内的 Enter 让读回</text><text x="40" y="400" class="n">改发 handleKeyDown；Backspace 定 diff 锚点</text><text x="40" y="540" class="o">iOS Enter 不拦截</text><text x="40" y="560" class="n">preventDefault 会打乱虚拟键盘，改为记</text><text x="40" y="576" class="n">lastIOSEnter，读回阶段看到新鲜时间戳就</text><text x="40" y="592" class="n">撤销 DOM 变化，改发 handleKeyDown</text></svg>
