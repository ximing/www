<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#52525b"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- LLM worker (outside the loop) -->
  <rect x="36" y="120" width="200" height="100" rx="8" fill="#f4f4f5"/>
  <text x="136" y="146" font-size="13.5" font-weight="600" fill="#18181b" text-anchor="middle">LLM 工人</text>
  <text x="136" y="168" font-size="12" fill="#3f3f46" text-anchor="middle">调查 · 转码 · 修复</text>
  <text x="136" y="188" font-size="12" fill="#3f3f46" text-anchor="middle">产出代码与声称</text>
  <text x="136" y="208" font-size="11.5" fill="#71717a" text-anchor="middle">判定环之外</text>

  <!-- boundary -->
  <line x1="282" y1="44" x2="282" y2="316" stroke="#52525b" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="282" y="34" font-size="12.5" font-weight="600" fill="#52525b" text-anchor="middle">判定边界</text>

  <!-- deterministic zone label -->
  <text x="530" y="66" font-size="12.5" fill="#71717a" text-anchor="middle">判定环内：只有确定性代码与可独立获取的事实</text>

  <!-- inputs -->
  <rect x="322" y="86" width="168" height="92" rx="8" fill="#e4e4e7"/>
  <text x="406" y="108" font-size="12.5" font-weight="600" fill="#18181b" text-anchor="middle">判定输入</text>
  <text x="406" y="130" font-size="11.5" fill="#3f3f46" text-anchor="middle">文件 · 命令输出</text>
  <text x="406" y="149" font-size="11.5" fill="#3f3f46" text-anchor="middle">浏览器采集</text>
  <text x="406" y="168" font-size="11" fill="#71717a" text-anchor="middle">不含 LLM 自述</text>

  <!-- gate code -->
  <rect x="536" y="86" width="200" height="92" rx="8" fill="#dcdce0"/>
  <text x="636" y="108" font-size="12.5" font-weight="600" fill="#18181b" text-anchor="middle">判定代码</text>
  <text x="636" y="130" font-size="11.5" fill="#3f3f46" text-anchor="middle">G2 静态 · G3 对账</text>
  <text x="636" y="149" font-size="11.5" fill="#3f3f46" text-anchor="middle">G4 覆盖 · G5 differ</text>
  <text x="636" y="168" font-size="11" fill="#71717a" text-anchor="middle">同输入同结论，可复跑</text>

  <line x1="490" y1="132" x2="530" y2="132" stroke="#52525b" stroke-width="1.8" marker-end="url(#arrow-gray)"/>

  <!-- verdict -->
  <rect x="536" y="216" width="200" height="66" rx="8" fill="#e4e4e7"/>
  <text x="636" y="240" font-size="12.5" font-weight="600" fill="#18181b" text-anchor="middle">判定结论</text>
  <text x="636" y="262" font-size="11.5" fill="#3f3f46" text-anchor="middle">布尔 + 结构化 issue</text>

  <line x1="636" y1="178" x2="636" y2="210" stroke="#52525b" stroke-width="1.8" marker-end="url(#arrow-gray)"/>

  <!-- code enters as judged object -->
  <line x1="236" y1="150" x2="530" y2="120" stroke="#b45309" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
  <text x="370" y="112" font-size="11.5" fill="#b45309" text-anchor="middle">产出代码：作为被判定对象进入</text>

  <!-- verdict returns as input only -->
  <path d="M 536 260 L 380 330 L 136 330 L 136 226" fill="none" stroke="#b45309" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
  <text x="330" y="346" font-size="11.5" fill="#b45309" text-anchor="middle">结论与 issue：作为下一轮修复的输入返回，仅此一个位置</text>

  <!-- bottom note -->
  <rect x="322" y="304" width="414" height="40" rx="8" fill="#fdf6ec" stroke="#b45309" stroke-width="1.2"/>
  <text x="529" y="328" font-size="12" fill="#3f3f46" text-anchor="middle">LLM 能看到结论，不能参与判定；判定权交给 LLM，门禁就退化成参考意见</text>
</svg>
