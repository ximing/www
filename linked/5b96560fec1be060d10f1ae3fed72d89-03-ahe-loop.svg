<svg viewBox="0 0 700 600" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono','Menlo','Monaco','Consolas',monospace" font-size="13">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="5" refY="4" orient="auto"><path d="M0,8 L5,0 L10,8" fill="#8b949e"/></marker>
    <marker id="arrowCurve" markerWidth="10" markerHeight="8" refX="5" refY="4" orient="auto"><path d="M0,8 L5,0 L10,8" fill="#fd7e14"/></marker>
  </defs>
  <rect width="700" height="600" fill="url(#bg)" rx="8"/>

  <text x="350" y="28" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="bold">AHE 元闭环</text>
  <text x="350" y="46" text-anchor="middle" fill="#8b949e" font-size="11">Agentic Harness Engineering 闭环</text>

  <!-- Step 1: Run Trace -->
  <rect x="225" y="65" width="250" height="44" rx="6" fill="#1a3a1a" stroke="#3fb950" stroke-width="1.5"/>
  <text x="350" y="83" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="bold">1. 运行轨迹</text>
  <text x="350" y="100" text-anchor="middle" fill="#8b949e" font-size="11">Run Trace</text>

  <!-- Arrow 1→2 -->
  <line x1="350" y1="109" x2="350" y2="135" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 2: Compress & Cluster -->
  <rect x="200" y="135" width="300" height="44" rx="6" fill="#1a2a3a" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="350" y="153" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">2. 经验压缩与失败聚类</text>
  <text x="350" y="170" text-anchor="middle" fill="#8b949e" font-size="11">Experience Compression &amp; Failure Clustering</text>

  <!-- Arrow 2→3 -->
  <line x1="350" y1="179" x2="350" y2="205" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 3: Hypothesis -->
  <rect x="200" y="205" width="300" height="44" rx="6" fill="#2a1a3a" stroke="#a371f7" stroke-width="1.5"/>
  <text x="350" y="223" text-anchor="middle" fill="#a371f7" font-size="13" font-weight="bold">3. 形成修改假设</text>
  <text x="350" y="240" text-anchor="middle" fill="#8b949e" font-size="11">Form Modification Hypothesis</text>

  <!-- Arrow 3→4 -->
  <line x1="350" y1="249" x2="350" y2="275" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 4: Modify -->
  <rect x="150" y="275" width="400" height="44" rx="6" fill="#3a2a1a" stroke="#d29922" stroke-width="1.5"/>
  <text x="350" y="293" text-anchor="middle" fill="#d29922" font-size="13" font-weight="bold">4. 修改 Harness 组件</text>
  <text x="350" y="310" text-anchor="middle" fill="#8b949e" font-size="11">Modify Prompt / Tool / Skill / Memory / Middleware / Policy</text>

  <!-- Arrow 4→5 -->
  <line x1="350" y1="319" x2="350" y2="345" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 5: Regression Eval -->
  <rect x="200" y="345" width="300" height="44" rx="6" fill="#3a1a1a" stroke="#f85149" stroke-width="1.5"/>
  <text x="350" y="363" text-anchor="middle" fill="#f85149" font-size="13" font-weight="bold">5. 回归评测</text>
  <text x="350" y="380" text-anchor="middle" fill="#8b949e" font-size="11">Regression Evaluation</text>

  <!-- Arrow 5→6 -->
  <line x1="350" y1="389" x2="350" y2="415" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 6: Decision -->
  <rect x="200" y="415" width="300" height="44" rx="6" fill="#1a3a2a" stroke="#56d4dd" stroke-width="1.5"/>
  <text x="350" y="433" text-anchor="middle" fill="#56d4dd" font-size="13" font-weight="bold">6. 确认收益 / 回滚 / 保留</text>
  <text x="350" y="450" text-anchor="middle" fill="#8b949e" font-size="11">Confirm Benefit / Rollback / Keep</text>

  <!-- Feedback loop back to 1 -->
  <path d="M 550 293 Q 620 293 620 400 Q 620 470 550 470 L 500 470" fill="none" stroke="#fd7e14" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowCurve)"/>
  <text x="630" y="380" fill="#fd7e14" font-size="10" transform="rotate(90,630,380)">迭代</text>

  <!-- Three pillars note -->
  <rect x="100" y="480" width="500" height="100" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="115" y="500" fill="#e6edf3" font-size="12" font-weight="bold">AHE 的三个可观测支柱</text>
  <text x="115" y="520" fill="#8b949e" font-size="11">1. 组件可观测：所有可编辑 Harness 组件有显式、可回滚的文件级表示</text>
  <text x="115" y="540" fill="#8b949e" font-size="11">2. 经验可观测：将海量轨迹压缩成可钻取的经验语料</text>
  <text x="115" y="560" fill="#8b949e" font-size="11">3. 决策可观测：每次修改先声明预期，再用下一轮结果验证</text>
</svg>