<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <!-- dispatch -->
  <rect x="30" y="20" width="300" height="46" fill="#e8eef7" stroke="#4a6fa5"/>
  <text x="180" y="40" text-anchor="middle" font-size="12" fill="#2c4a73">dispatch(rootTr)</text>
  <text x="180" y="57" text-anchor="middle" font-size="10" fill="#777">来自 view 的 dispatchTransaction 或命令</text>

  <line x1="180" y1="66" x2="180" y2="86" stroke="#666" stroke-width="1" marker-end="url(#arr)"/>

  <!-- stage 1: filter -->
  <rect x="30" y="88" width="300" height="64" fill="#e8eef7" stroke="#4a6fa5" stroke-width="2"/>
  <text x="180" y="110" text-anchor="middle" font-size="12" fill="#2c4a73">① filterTransaction(tr)</text>
  <text x="180" y="128" text-anchor="middle" font-size="10" fill="#555">所有插件依次否决，ignore = -1</text>
  <text x="180" y="144" text-anchor="middle" font-size="10" fill="#555">任一返回 false，整个事务作废</text>

  <!-- veto branch -->
  <line x1="330" y1="110" x2="415" y2="110" stroke="#a54a4a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="372" y="102" text-anchor="middle" font-size="10" fill="#a54a4a">否决</text>
  <rect x="420" y="88" width="310" height="64" fill="#f7e8e8" stroke="#a54a4a"/>
  <text x="432" y="110" font-size="11" fill="#7a3434">原样返回 {state: this, transactions: []}</text>
  <text x="432" y="130" font-size="10" fill="#777">state 不变，调用方拿到空事务列表</text>

  <line x1="180" y1="152" x2="180" y2="174" stroke="#666" stroke-width="1" marker-end="url(#arr)"/>

  <!-- stage 2: applyInner -->
  <rect x="30" y="176" width="300" height="52" fill="#e8eef7" stroke="#4a6fa5" stroke-width="2"/>
  <text x="180" y="198" text-anchor="middle" font-size="12" fill="#2c4a73">② applyInner(rootTr) → newState</text>
  <text x="180" y="216" text-anchor="middle" font-size="10" fill="#555">应用到 doc / selection / 各 StateField</text>

  <line x1="180" y1="228" x2="180" y2="248" stroke="#666" stroke-width="1" marker-end="url(#arr)"/>

  <!-- stage 3: append loop -->
  <rect x="30" y="250" width="300" height="110" fill="#e8eef7" stroke="#4a6fa5" stroke-width="2"/>
  <text x="180" y="272" text-anchor="middle" font-size="12" fill="#2c4a73">③ appendTransaction 循环</text>
  <text x="42" y="294" font-size="10" fill="#555">每个插件只收到没见过的 tr（seen 记账）</text>
  <text x="42" y="314" font-size="10" fill="#555">返回新 tr → 再过 filterTransaction(tr, i)</text>
  <text x="42" y="334" font-size="10" fill="#555">通过 → 打 appendedTransaction meta，入队并 applyInner</text>
  <text x="42" y="352" font-size="10" fill="#555">一整轮无新增 → 结束</text>

  <line x1="180" y1="360" x2="180" y2="382" stroke="#666" stroke-width="1" marker-end="url(#arr)"/>

  <!-- result -->
  <rect x="30" y="384" width="300" height="48" fill="#e8eef7" stroke="#4a6fa5"/>
  <text x="180" y="406" text-anchor="middle" font-size="12" fill="#2c4a73">{state, transactions}</text>
  <text x="180" y="424" text-anchor="middle" font-size="10" fill="#777">transactions 含 rootTr 与全部追加事务</text>

  <!-- plugins box -->
  <rect x="420" y="196" width="310" height="236" fill="#f3ecdf" stroke="#a5854a" stroke-width="2"/>
  <text x="575" y="220" text-anchor="middle" font-size="13" fill="#6b4c22">插件数组（按数组顺序）</text>
  <text x="575" y="238" text-anchor="middle" font-size="10" fill="#777">本篇的两个事务钩子</text>

  <rect x="436" y="252" width="278" height="48" fill="#fdfdfd" stroke="#a5854a"/>
  <text x="448" y="272" font-size="11" fill="#6b4c22">插件 A</text>
  <text x="448" y="290" font-size="10" fill="#777">filterTransaction / appendTransaction</text>

  <rect x="436" y="312" width="278" height="48" fill="#fdfdfd" stroke="#a5854a"/>
  <text x="448" y="332" font-size="11" fill="#6b4c22">插件 B</text>
  <text x="448" y="350" font-size="10" fill="#777">filterTransaction / appendTransaction</text>

  <rect x="436" y="372" width="278" height="48" fill="#fdfdfd" stroke="#a5854a"/>
  <text x="448" y="392" font-size="11" fill="#6b4c22">插件 C</text>
  <text x="448" y="410" font-size="10" fill="#777">filterTransaction / appendTransaction</text>

  <!-- filter consults plugins -->
  <polyline points="330,140 385,168 418,196" fill="none" stroke="#666" stroke-width="1" marker-end="url(#arr)"/>
  <text x="352" y="162" font-size="10" fill="#555">依次询问</text>

  <!-- append loop consults plugins -->
  <line x1="330" y1="290" x2="420" y2="290" stroke="#666" stroke-width="1" marker-end="url(#arr)"/>
  <text x="375" y="282" text-anchor="middle" font-size="10" fill="#555">轮询（只传新 tr）</text>
  <line x1="420" y1="330" x2="330" y2="330" stroke="#666" stroke-width="1" marker-end="url(#arr)"/>
  <text x="375" y="346" text-anchor="middle" font-size="10" fill="#555">返回新 tr 或 null</text>
</svg>
