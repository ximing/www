<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title"><title id="title">Node 辅助方法的分组：遍历、校验、定位、结构与序列化</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#182230}.t{font-size:14px;font-weight:700}.h{font-size:13px;font-weight:700}.b{font-size:12px;fill:#334155}.n{font-size:11px;fill:#526176}.o{font-size:11px;fill:#0891b2;font-weight:700}</style><rect width="900" height="540" rx="18" fill="#f8fafc"/><text x="40" y="34" class="t">Node 辅助方法的分组（src/node.ts、src/fragment.ts）</text><g><rect x="330" y="216" width="240" height="88" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="346" y="242" class="h">Node</text><text x="346" y="262" class="b">type · attrs · marks · content</text><text x="346" y="280" class="b">nodeSize · childCount · children</text></g><g><rect x="40" y="76" width="360" height="150" rx="8" fill="#e0f2fe" stroke="#0891b2" stroke-width="1.5"/><text x="56" y="100" class="h">遍历族</text><text x="56" y="122" class="b">forEach · nodesBetween · descendants</text><text x="56" y="140" class="b">textBetween · textContent · rangeHasMark</text><text x="56" y="164" class="n">回调返回 false：剪掉该节点的子树，兄弟照常</text><text x="56" y="182" class="n">文本节点不会被递归进入（content.size 为 0）</text><text x="56" y="206" class="o">区间参数：相对节点内容起点的扁平位置</text></g><g><rect x="500" y="76" width="360" height="150" rx="8" fill="#ecfccb" stroke="#65a30d" stroke-width="1.5"/><text x="516" y="100" class="h">校验族</text><text x="516" y="122" class="b">contentMatchAt · canReplace · canReplaceWith</text><text x="516" y="140" class="b">canAppend · check</text><text x="516" y="164" class="n">底层是内容表达式匹配机 + allowsMarks</text><text x="516" y="182" class="n">canSplit 不在这一层，在 transform 包</text><text x="516" y="206" class="o">区间参数：子节点下标，不是扁平位置</text></g><g><rect x="40" y="316" width="360" height="150" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="56" y="340" class="h">定位族</text><text x="56" y="362" class="b">findIndex · nodeAt</text><text x="56" y="380" class="b">childAfter · childBefore · resolve</text><text x="56" y="404" class="n">findIndex 返回值复用同一对象，不可留存</text><text x="56" y="422" class="n">resolve 走 WeakMap + 12 槽环形缓存</text><text x="56" y="446" class="o">参数：扁平位置；越界抛 RangeError</text></g><g><rect x="500" y="316" width="360" height="150" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/><text x="516" y="340" class="h">结构读写与序列化</text><text x="516" y="362" class="b">copy · mark · cut · slice · replace</text><text x="516" y="380" class="b">eq · sameMarkup · hasMarkup · toJSON · fromJSON</text><text x="516" y="404" class="n">全部返回新实例，旧节点保持不动</text><text x="516" y="422" class="n">slice / replace 内部先 resolve 两端点</text><text x="516" y="446" class="o">区间参数：扁平位置</text></g><line x1="400" y1="226" x2="332" y2="238" stroke="#94a3b8" stroke-width="2"/><line x1="500" y1="226" x2="568" y2="238" stroke="#94a3b8" stroke-width="2"/><line x1="400" y1="304" x2="332" y2="296" stroke="#94a3b8" stroke-width="2"/><line x1="500" y1="304" x2="568" y2="296" stroke="#94a3b8" stroke-width="2"/><text x="40" y="512" class="n">四族之外的分歧点：canReplace 系列的 from/to 是子节点下标，遍历与结构族的 from/to 是扁平位置，调用前先确认坐标单位。</text></svg>