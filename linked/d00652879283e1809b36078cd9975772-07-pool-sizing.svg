<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrGrn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="940" height="620" rx="8" fill="#f8fafc"/>
  <text x="30" y="34" font-size="16" font-weight="600" fill="#1f2937">连接数与吞吐的关系曲线</text>
  <text x="30" y="56" font-size="12" fill="#64748b">需求侧 Little's law：L = λ × W；供给侧上限是数据库有效并发度（CPU 核数 / 磁盘并行度）</text>

  <!-- 坐标轴 -->
  <line x1="90" y1="500" x2="880" y2="500" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="90" y1="500" x2="90" y2="90" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="888" y="516" font-size="12" fill="#475569">连接数</text>
  <text x="64" y="86" font-size="12" fill="#475569">吞吐</text>
  <text x="74" y="516" font-size="10" fill="#94a3b8">0</text>

  <!-- 三个区域底色 -->
  <rect x="90" y="90" width="380" height="410" fill="#eff6ff" opacity="0.55"/>
  <rect x="470" y="90" width="70" height="410" fill="#fef3c7" opacity="0.7"/>
  <rect x="540" y="90" width="340" height="410" fill="#fee2e2" opacity="0.45"/>

  <!-- 区域标签 -->
  <text x="120" y="112" font-size="12" font-weight="600" fill="#1d4ed8">线性上升区</text>
  <text x="120" y="130" font-size="11" fill="#3b5b8c">DB 有空闲资源</text>
  <text x="120" y="146" font-size="11" fill="#3b5b8c">吞吐随连接数增长</text>

  <text x="478" y="112" font-size="11" font-weight="600" fill="#92400e">拐点</text>

  <text x="700" y="112" font-size="12" font-weight="600" fill="#b91c1c">下降区</text>
  <text x="700" y="130" font-size="11" fill="#8c3b3b">连接数 &gt; DB 有效并发度</text>
  <text x="700" y="146" font-size="11" fill="#8c3b3b">吞吐随连接数增加而下降</text>

  <!-- 拐点垂直虚线 -->
  <line x1="490" y1="90" x2="490" y2="500" stroke="#ca8a04" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="430" y="530" font-size="11" font-weight="600" fill="#92400e">拐点：连接数 ≈ DB 有效并发度</text>
  <text x="430" y="546" font-size="10" fill="#a16207">（CPU 核数 / 磁盘并行度）</text>

  <!-- 吞吐曲线 -->
  <path d="M 90 500 C 220 500, 340 270, 490 180 C 540 180, 555 210, 580 250 C 660 330, 760 400, 860 430"
        fill="none" stroke="#1f2937" stroke-width="2.4"/>

  <!-- 拐点峰值标记 -->
  <circle cx="490" cy="180" r="5" fill="#ca8a04"/>
  <text x="500" y="172" font-size="11" font-weight="600" fill="#92400e">吞吐峰值</text>

  <!-- 线性区示意箭头 -->
  <line x1="220" y1="420" x2="380" y2="250" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arrGrn)" opacity="0.6"/>

  <!-- 下降区原因标注框 -->
  <rect x="560" y="370" width="300" height="110" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
  <text x="572" y="392" font-size="11" font-weight="600" fill="#b91c1c">过拐点后吞吐为什么下降</text>
  <text x="572" y="412" font-size="10" fill="#475569">· 连接数 &gt; CPU 核数：线程在 CPU 上</text>
  <text x="584" y="426" font-size="10" fill="#475569">  来回切换，单查询实际耗时变长</text>
  <text x="572" y="444" font-size="10" fill="#475569">· 锁竞争加剧：更多连接同时争同一</text>
  <text x="584" y="458" font-size="10" fill="#475569">  行/索引，等锁时间计入 W</text>
  <text x="572" y="472" font-size="10" fill="#475569">· W 膨胀 → L = λ×W 反推连接需求膨胀</text>

  <!-- 底部：池子取值结论 -->
  <rect x="24" y="566" width="892" height="42" rx="6" fill="#fffbeb" stroke="#ca8a04" stroke-width="1.2"/>
  <text x="40" y="588" font-size="11" font-weight="600" fill="#92400e">取值结论</text>
  <text x="120" y="588" font-size="11" fill="#475569">需求侧 L = λ × W 算下界；供给侧 DB 有效并发度封顶。池子配在两者较小值附近，留余量。</text>
  <text x="120" y="602" font-size="10" fill="#a16207">超过 DB 有效并发度的连接，只增加上下文切换与锁竞争，不增加吞吐。</text>
</svg>
