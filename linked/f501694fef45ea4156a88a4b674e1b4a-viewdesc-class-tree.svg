<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <!-- ViewDesc base -->
  <rect x="265" y="20" width="230" height="86" fill="#e8eef7" stroke="#4a6fa5" stroke-width="2"/>
  <text x="380" y="44" text-anchor="middle" font-size="13" fill="#2c4a73">ViewDesc（基类）</text>
  <text x="380" y="64" text-anchor="middle" font-size="10" fill="#555">parent / children / dom / contentDOM</text>
  <text x="380" y="80" text-anchor="middle" font-size="10" fill="#555">dirty 标记 / size / 位置换算</text>
  <text x="380" y="96" text-anchor="middle" font-size="10" fill="#555">matchesXXX 默认返回 false</text>

  <!-- Row 2 boxes -->
  <rect x="10" y="160" width="140" height="76" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="80" y="184" text-anchor="middle" font-size="12" fill="#2c4a73">NodeViewDesc</text>
  <text x="80" y="202" text-anchor="middle" font-size="10" fill="#555">对应文档节点</text>
  <text x="80" y="218" text-anchor="middle" font-size="10" fill="#555">node / nodeDOM</text>

  <rect x="160" y="160" width="140" height="76" fill="#ffffff" stroke="#4a8a5f" stroke-width="1.5"/>
  <text x="230" y="184" text-anchor="middle" font-size="12" fill="#2c5a3c">MarkViewDesc</text>
  <text x="230" y="202" text-anchor="middle" font-size="10" fill="#555">对应 mark</text>
  <text x="230" y="218" text-anchor="middle" font-size="10" fill="#555">mark / 固定嵌套顺序</text>

  <rect x="310" y="160" width="140" height="76" fill="#ffffff" stroke="#8a7a4a" stroke-width="1.5"/>
  <text x="380" y="184" text-anchor="middle" font-size="12" fill="#6b5d2e">WidgetViewDesc</text>
  <text x="380" y="202" text-anchor="middle" font-size="10" fill="#555">widget 装饰</text>
  <text x="380" y="218" text-anchor="middle" font-size="10" fill="#555">size 为 0</text>

  <rect x="460" y="160" width="140" height="76" fill="#ffffff" stroke="#8a7a4a" stroke-width="1.5"/>
  <text x="530" y="184" text-anchor="middle" font-size="12" fill="#6b5d2e">TrailingHackViewDesc</text>
  <text x="530" y="202" text-anchor="middle" font-size="10" fill="#555">结尾 BR / IMG 补丁</text>
  <text x="530" y="218" text-anchor="middle" font-size="10" fill="#555">size 为 0</text>

  <rect x="610" y="160" width="140" height="76" fill="#ffffff" stroke="#8a7a4a" stroke-width="1.5"/>
  <text x="680" y="184" text-anchor="middle" font-size="12" fill="#6b5d2e">CompositionViewDesc</text>
  <text x="680" y="202" text-anchor="middle" font-size="10" fill="#555">IME 组合期间</text>
  <text x="680" y="218" text-anchor="middle" font-size="10" fill="#555">保护焦点文本节点</text>

  <!-- Row 3 boxes under NodeViewDesc -->
  <rect x="10" y="300" width="140" height="76" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="80" y="324" text-anchor="middle" font-size="12" fill="#2c4a73">TextViewDesc</text>
  <text x="80" y="342" text-anchor="middle" font-size="10" fill="#555">文本节点</text>
  <text x="80" y="358" text-anchor="middle" font-size="10" fill="#555">contentDOM 为 null</text>

  <rect x="160" y="300" width="140" height="76" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="230" y="324" text-anchor="middle" font-size="12" fill="#2c4a73">CustomNodeViewDesc</text>
  <text x="230" y="342" text-anchor="middle" font-size="10" fill="#555">自定义 node view</text>
  <text x="230" y="358" text-anchor="middle" font-size="10" fill="#555">spec 方法优先</text>

  <!-- inheritance arrows: row2 -> base -->
  <line x1="80" y1="157" x2="330" y2="109" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="230" y1="157" x2="352" y2="109" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="380" y1="157" x2="380" y2="109" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="530" y1="157" x2="408" y2="109" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="680" y1="157" x2="430" y2="109" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- inheritance arrows: row3 -> NodeViewDesc -->
  <line x1="80" y1="297" x2="80" y2="239" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="230" y1="297" x2="140" y2="239" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>
</svg>
