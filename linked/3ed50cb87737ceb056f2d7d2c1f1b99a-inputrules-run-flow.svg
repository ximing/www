<svg xmlns="http://www.w3.org/2000/svg" width="940" height="620" viewBox="0 0 940 620" role="img" aria-labelledby="title"><title id="title">run 的匹配路径：一次文本输入从 handleTextInput 到 dispatch 的完整流程</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#182230}.t{font-size:14px;font-weight:700}.h{font-size:13px;font-weight:700}.b{font-size:12px;fill:#334155}.n{font-size:12px;fill:#526176}.o{font-size:11px;fill:#0891b2;font-weight:700}</style><rect width="940" height="620" rx="18" fill="#f8fafc"/><text x="40" y="34" class="t">run 的匹配路径：一次文本输入从 handleTextInput 到 dispatch</text><g><rect x="300" y="48" width="380" height="60" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="316" y="70" class="h">handleTextInput(view, from, to, text)</text><text x="316" y="88" class="n">keypress 与 DOM 读回两个入口，composing 中返回 false</text></g><line x1="490" y1="108" x2="490" y2="130" stroke="#94a3b8" stroke-width="2"/><path d="M490 130 L485 120 L495 120 Z" fill="#94a3b8"/><g><rect x="300" y="134" width="380" height="68" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="316" y="156" class="h">拼 textBefore</text><text x="316" y="174" class="b">textBetween 取光标前最多 500 字符，叶子节点记 ￼</text><text x="316" y="190" class="n">末尾拼接刚输入的 text，正则作用在这串文本上</text></g><line x1="490" y1="202" x2="490" y2="224" stroke="#94a3b8" stroke-width="2"/><path d="M490 224 L485 214 L495 214 Z" fill="#94a3b8"/><g><rect x="300" y="228" width="380" height="84" rx="8" fill="#e0f2fe" stroke="#0891b2" stroke-width="1.5"/><text x="316" y="250" class="h">逐条规则过闸（按数组顺序）</text><text x="316" y="268" class="b">inCodeMark / inCode 语境过滤，不合跳过</text><text x="316" y="284" class="b">match.exec(textBefore)，未命中跳下一条</text><text x="316" y="300" class="n">match[0] 必须覆盖刚输入的 text，否则同样跳过</text></g><line x1="490" y1="312" x2="490" y2="334" stroke="#94a3b8" stroke-width="2"/><path d="M490 334 L485 324 L495 324 Z" fill="#94a3b8"/><g><rect x="300" y="338" width="380" height="64" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="316" y="360" class="h">定位匹配区间</text><text x="316" y="378" class="b">startPos = from - (match[0].length - text.length)</text><text x="316" y="394" class="n">inCodeMark 关闭时 nodesBetween 再扫一遍 code mark</text></g><line x1="490" y1="402" x2="490" y2="424" stroke="#94a3b8" stroke-width="2"/><path d="M490 424 L485 414 L495 414 Z" fill="#94a3b8"/><g><rect x="300" y="428" width="380" height="56" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="316" y="450" class="h">handler(state, match, startPos, to)</text><text x="316" y="468" class="n">返回 null 继续下一条，返回 tr 进入落地</text></g><line x1="490" y1="484" x2="490" y2="506" stroke="#94a3b8" stroke-width="2"/><path d="M490 506 L485 496 L495 496 Z" fill="#94a3b8"/><g><rect x="300" y="510" width="380" height="76" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="316" y="532" class="h">落地</text><text x="316" y="550" class="b">undoable 时 tr.setMeta(plugin, {...}) 存 undo 信息</text><text x="316" y="566" class="b">view.dispatch(tr)，返回 true</text><text x="316" y="582" class="n">view 收到 true 后跳过默认的文本插入</text></g><text x="40" y="140" class="o">MAX_MATCH = 500</text><text x="40" y="160" class="n">匹配窗口封顶 500 字符，</text><text x="40" y="176" class="n">每次按键的正则成本是常数级</text><text x="40" y="260" class="o">覆盖检查</text><text x="40" y="280" class="n">match[0] 比 text 短说明命中</text><text x="40" y="296" class="n">的是旧文本，这条规则上次输入</text><text x="40" y="312" class="n">时就该触发，跳过防止误触发</text><text x="40" y="470" class="o">返回 true 的含义</text><text x="40" y="490" class="n">触发字符不进文档，规则的</text><text x="40" y="506" class="n">transaction 已完整描述结果，</text><text x="40" y="522" class="n">默认插入不再执行</text><text x="720" y="140" class="o">数组顺序即优先级</text><text x="720" y="160" class="n">先命中先执行，example-setup</text><text x="720" y="176" class="n">把 smartQuotes 排在最前</text></svg>
