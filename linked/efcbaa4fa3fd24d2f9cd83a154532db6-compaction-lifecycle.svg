<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc"><title id="title">Pi harness 与 Claude Code 的长会话压缩流程</title><desc id="desc">左侧为 Pi 的安全切点、摘要和 compaction entry，右侧为 Claude Code 的轻量变换、完整 compact 与环境重建。</desc><defs><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.h{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.b{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#34415a}.s{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#667085}.pi{fill:#eaf2ff;stroke:#6b9df5;stroke-width:2}.cc{fill:#fff2e7;stroke:#e99a58;stroke-width:2}.n{fill:#f7f8fa;stroke:#d0d5dd;stroke-width:1.5}.a{stroke:#98a2b3;stroke-width:2;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#98a2b3"/></marker></defs><rect width="1200" height="510" rx="24" fill="#fff"/><text x="48" y="52" class="t">长会话压缩：摘要替代历史，同时保留继续执行需要的信息</text><text x="48" y="96" class="h">Pi agent-core harness</text><rect x="48" y="120" width="510" height="342" rx="16" class="pi"/><rect x="78" y="155" width="120" height="60" rx="10" class="n"/><text x="94" y="190" class="b">历史路径</text><path d="M198 185H230" class="a"/><rect x="230" y="155" width="130" height="60" rx="10" class="n"/><text x="244" y="180" class="b">安全切点</text><text x="242" y="202" class="s">避开 toolResult</text><path d="M360 185H392" class="a"/><rect x="392" y="155" width="128" height="60" rx="10" class="n"/><text x="412" y="180" class="b">摘要请求</text><text x="407" y="202" class="s">独立 session</text><path d="M300 215V267" class="a"/><rect x="164" y="267" width="272" height="65" rx="10" class="n"/><text x="197" y="295" class="b">compaction entry 写回日志</text><text x="181" y="317" class="s">summary + 读写文件清单 + 保留尾部</text><path d="M300 332V374" class="a"/><rect x="180" y="374" width="240" height="55" rx="10" class="n"/><text x="208" y="407" class="b">后续 Context 投影</text><text x="78" y="448" class="s">原始 entry 保留；transform 用摘要替换早期路径。</text><text x="644" y="96" class="h">Claude Code</text><rect x="644" y="120" width="508" height="342" rx="16" class="cc"/><rect x="674" y="155" width="134" height="60" rx="10" class="n"/><text x="692" y="180" class="b">token 压力</text><text x="692" y="202" class="s">或 413</text><path d="M808 185H837" class="a"/><rect x="837" y="155" width="140" height="60" rx="10" class="n"/><text x="850" y="180" class="b">轻量变换</text><text x="855" y="202" class="s">snip / collapse</text><path d="M977 185H1006" class="a"/><rect x="1006" y="155" width="116" height="60" rx="10" class="n"/><text x="1022" y="190" class="b">compact</text><path d="M1064 215V267" class="a"/><rect x="815" y="267" width="270" height="65" rx="10" class="n"/><text x="846" y="295" class="b">forked agent 生成摘要</text><text x="835" y="317" class="s">prompt-too-long 时裁最旧 API rounds 重试</text><path d="M950 332V374" class="a"/><rect x="787" y="374" width="325" height="55" rx="10" class="n"/><text x="816" y="398" class="b">重建下一轮请求环境</text><text x="805" y="418" class="s">文件、plan、Skill、工具定义、MCP 等</text><text x="674" y="448" class="s">摘要与当前运行环境共同构成后续请求视图。</text></svg>