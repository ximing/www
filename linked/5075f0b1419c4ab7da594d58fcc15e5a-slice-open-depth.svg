<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title"><title id="title">Slice 的打开深度：从 doc(blockquote(p("foo"), p("bar")), p("baz")) 切出跨结构选区</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#182230}.t{font-size:14px;font-weight:700}.h{font-size:13px;font-weight:700}.b{font-size:12px;fill:#334155}.n{font-size:12px;fill:#526176}.o{font-size:11px;fill:#0891b2;font-weight:700}</style><rect width="900" height="500" rx="18" fill="#f8fafc"/><text x="40" y="34" class="t">Slice：切一块文档出来，记录两端各打开了几层</text><text x="40" y="62" class="h">原文档（选区从 "foo" 中部划到 "baz" 中部）</text><rect x="40" y="76" width="360" height="330" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="56" y="98" class="b">doc</text><rect x="60" y="112" width="320" height="164" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="76" y="134" class="b">blockquote</text><rect x="76" y="144" width="110" height="36" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><rect x="152" y="144" width="34" height="36" fill="#bae6fd"/><text x="86" y="167" class="b">p: "foo"</text><rect x="76" y="190" width="110" height="36" rx="6" fill="#bae6fd" stroke="#475569" stroke-width="1.5"/><text x="86" y="213" class="b">p: "bar"</text><rect x="60" y="292" width="110" height="36" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><rect x="60" y="292" width="42" height="36" fill="#bae6fd"/><text x="70" y="315" class="b">p: "baz"</text><text x="40" y="426" class="n">蓝色为选区覆盖的部分</text><line x1="410" y1="240" x2="478" y2="240" stroke="#94a3b8" stroke-width="2"/><path d="M478 240 L468 235 L468 245 Z" fill="#94a3b8"/><text x="444" y="222" class="o" text-anchor="middle">node.slice(from, to)</text><text x="490" y="62" class="h">切出的 Slice</text><rect x="490" y="76" width="370" height="330" rx="8" fill="#e0f2fe" stroke="#0891b2" stroke-width="1.5"/><text x="506" y="98" class="n">content 是一个 Fragment，虚线边缘表示该侧被切开</text><rect x="510" y="118" width="330" height="158" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="526" y="140" class="b">blockquote（左边缘打开）</text><line x1="510" y1="118" x2="510" y2="276" stroke="#0891b2" stroke-width="3" stroke-dasharray="6 4"/><rect x="526" y="150" width="110" height="36" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><line x1="526" y1="150" x2="526" y2="186" stroke="#0891b2" stroke-width="3" stroke-dasharray="6 4"/><text x="536" y="173" class="b">p: "o"</text><rect x="526" y="196" width="110" height="36" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="536" y="219" class="b">p: "bar"</text><rect x="510" y="292" width="110" height="36" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><line x1="620" y1="292" x2="620" y2="328" stroke="#0891b2" stroke-width="3" stroke-dasharray="6 4"/><text x="520" y="315" class="b">p: "b"（右边缘打开）</text><text x="700" y="170" class="o">openStart = 2</text><text x="700" y="188" class="n">左边缘打开两层</text><line x1="694" y1="172" x2="646" y2="168" stroke="#0891b2" stroke-width="1.5"/><text x="700" y="308" class="o">openEnd = 1</text><text x="700" y="326" class="n">右边缘打开一层</text><line x1="694" y1="310" x2="628" y2="310" stroke="#0891b2" stroke-width="1.5"/><text x="490" y="426" class="n">打开的含义：边界节点被切成两半，切片只带一半，另一半留在原文档</text><text x="40" y="456" class="n">node.slice(from, to) 取 depth = $from.sharedDepth(to)，从该层节点的内容里 cut 出 fragment</text><text x="40" y="478" class="n">openStart = $from.depth − depth，openEnd = $to.depth − depth；上例为 2 − 0 与 1 − 0</text></svg>
