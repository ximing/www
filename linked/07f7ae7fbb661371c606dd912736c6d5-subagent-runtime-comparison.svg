<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">Pi 示例 SubAgent 与 Claude Code SubAgent 的会话和上下文</title>
  <desc id="desc">左侧展示 Pi coding-agent 示例扩展启动无持久化子进程并将结果作为工具结果返回，右侧展示 Claude Code subagent 将记录写入 sidechain，完成后以任务通知回到主会话。</desc>
  <defs><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.h{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.b{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#34415a}.s{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#667085}.pi{fill:#eaf2ff;stroke:#6b9df5;stroke-width:2}.cc{fill:#fff2e7;stroke:#e99a58;stroke-width:2}.n{fill:#f7f8fa;stroke:#d0d5dd;stroke-width:1.5}.a{stroke:#98a2b3;stroke-width:2;fill:none;marker-end:url(#m)}.d{stroke:#98a2b3;stroke-width:2;stroke-dasharray:6 5;fill:none}</style><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#98a2b3"/></marker></defs>
  <rect width="1200" height="580" rx="24" fill="#fff"/><text x="48" y="52" class="t">SubAgent：Pi 示例扩展隔离进程，Claude Code 用 sidechain 保存子代理历史</text>
  <text x="48" y="94" class="h">Pi coding-agent 示例扩展（不是 agent-core harness 内建能力）</text><rect x="48" y="118" width="510" height="404" rx="16" class="pi"/>
  <rect x="78" y="155" width="146" height="66" rx="10" class="n"/><text x="96" y="184" class="b">父 agent</text><text x="91" y="205" class="s">调用 subagent 工具</text><path d="M224 188H260" class="a"/>
  <rect x="260" y="155" width="258" height="66" rx="10" class="n"/><text x="279" y="184" class="b">extension 启动 `pi` 子进程</text><text x="290" y="205" class="s">task + prompt + model/tools + cwd</text><path d="M389 221V260" class="a"/>
  <rect x="165" y="260" width="350" height="78" rx="10" class="n"/><text x="198" y="290" class="b">`--no-session`：内存 Session</text><text x="186" y="314" class="s">不传父历史；不创建 JSONL 子 Session</text><path d="M340 338V377" class="a"/>
  <rect x="136" y="377" width="408" height="68" rx="10" class="n"/><text x="164" y="406" class="b">JSON Lines stdout → 最终文本作为工具结果</text><text x="160" y="429" class="s">父 Session 保存父侧的 assistant / tool-result 消息</text><text x="78" y="487" class="s">完整子过程只临时收集在工具 details；示例未建立可恢复的父子 Session。</text>
  <text x="644" y="94" class="h">Claude Code 本地 Task / subagent</text><rect x="644" y="118" width="508" height="404" rx="16" class="cc"/>
  <rect x="674" y="155" width="190" height="66" rx="10" class="n"/><text x="695" y="184" class="b">普通 Task：任务 prompt</text><text x="700" y="205" class="s">默认不带主历史</text><rect x="932" y="155" width="190" height="66" rx="10" class="n"/><text x="952" y="184" class="b">fork subagent：父历史</text><text x="955" y="205" class="s">继承 prompt/tools 等</text><path d="M769 221V260 M1027 221V260" class="a"/>
  <rect x="742" y="260" width="312" height="78" rx="10" class="n"/><text x="770" y="289" class="b">独立 query loop + agentId</text><text x="756" y="314" class="s">可变状态隔离；各自执行工具调用</text><path d="M898 338V377" class="a"/>
  <rect x="704" y="377" width="388" height="68" rx="10" class="n"/><text x="735" y="405" class="b">sidechain：agent-&lt;agentId&gt;.jsonl</text><text x="724" y="429" class="s">保存子代理消息、替换记录与 metadata</text><path d="M704 411H665" class="a"/>
  <rect x="674" y="463" width="418" height="36" rx="10" class="n"/><text x="699" y="487" class="b">完成后：task notification 回主流程；完整过程仍留 sidechain</text>
</svg>