<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif">
  <!-- 左侧：browser.ts 探测常量 -->
  <rect x="30" y="30" width="230" height="390" rx="6" fill="#f7f7f8" stroke="#c8c8cc" stroke-width="1.5"/>
  <text x="145" y="56" font-size="14" fill="#4a4a4e" text-anchor="middle" font-weight="600">browser.ts</text>
  <text x="145" y="74" font-size="11" fill="#8a8a8e" text-anchor="middle">模块加载时探测一次，导出常量</text>
  <g font-size="12" fill="#4a4a4e">
    <text x="52" y="104">ie / ie_version</text>
    <text x="52" y="130">gecko / gecko_version</text>
    <text x="52" y="156">chrome / chrome_version</text>
    <text x="52" y="182">safari / ios / mac</text>
    <text x="52" y="208">webkit / webkit_version</text>
    <text x="52" y="234">android / windows</text>
  </g>
  <line x1="48" y1="254" x2="242" y2="254" stroke="#c8c8cc" stroke-width="1"/>
  <g font-size="11" fill="#8a8a8e">
    <text x="52" y="278">UA 嗅探为主</text>
    <text x="52" y="300">webkit 用能力探测</text>
    <text x="52" y="322">（webkitFontSmoothing）</text>
  </g>

  <!-- 中间箭头 -->
  <line x1="270" y1="190" x2="320" y2="190" stroke="#d64933" stroke-width="2"/>
  <polygon points="320,190 310,184 310,196" fill="#d64933"/>
  <text x="295" y="176" font-size="11" fill="#d64933" text-anchor="middle">分支消费</text>

  <!-- 右侧：各模块消费的 flag -->
  <g>
    <rect x="330" y="30" width="440" height="40" rx="6" fill="#ffffff" stroke="#c8c8cc" stroke-width="1.5"/>
    <text x="346" y="55" font-size="12" fill="#4a4a4e" font-weight="600">input.ts</text>
    <text x="415" y="55" font-size="10" fill="#8a8a8e">ios / android / safari / gecko / mac / ie / chrome / windows / webkit</text>

    <rect x="330" y="80" width="440" height="40" rx="6" fill="#ffffff" stroke="#c8c8cc" stroke-width="1.5"/>
    <text x="346" y="105" font-size="12" fill="#4a4a4e" font-weight="600">domobserver.ts</text>
    <text x="460" y="105" font-size="11" fill="#8a8a8e">ie / safari / gecko</text>

    <rect x="330" y="130" width="440" height="40" rx="6" fill="#ffffff" stroke="#c8c8cc" stroke-width="1.5"/>
    <text x="346" y="155" font-size="12" fill="#4a4a4e" font-weight="600">selection.ts / viewdesc.ts</text>
    <text x="510" y="155" font-size="11" fill="#8a8a8e">safari / chrome / gecko / ie / ios</text>

    <rect x="330" y="180" width="440" height="40" rx="6" fill="#ffffff" stroke="#c8c8cc" stroke-width="1.5"/>
    <text x="346" y="205" font-size="12" fill="#4a4a4e" font-weight="600">domcoords.ts</text>
    <text x="440" y="205" font-size="11" fill="#8a8a8e">safari / gecko / webkit</text>

    <rect x="330" y="230" width="440" height="40" rx="6" fill="#ffffff" stroke="#c8c8cc" stroke-width="1.5"/>
    <text x="346" y="255" font-size="12" fill="#4a4a4e" font-weight="600">clipboard.ts</text>
    <text x="436" y="255" font-size="11" fill="#8a8a8e">webkit / chrome</text>

    <rect x="330" y="280" width="440" height="40" rx="6" fill="#ffffff" stroke="#c8c8cc" stroke-width="1.5"/>
    <text x="346" y="305" font-size="12" fill="#4a4a4e" font-weight="600">capturekeys.ts</text>
    <text x="452" y="305" font-size="11" fill="#8a8a8e">mac / windows / chrome / gecko / safari / webkit</text>

    <rect x="330" y="330" width="440" height="40" rx="6" fill="#ffffff" stroke="#c8c8cc" stroke-width="1.5"/>
    <text x="346" y="355" font-size="12" fill="#4a4a4e" font-weight="600">index.ts</text>
    <text x="408" y="355" font-size="11" fill="#8a8a8e">ie / chrome / safari</text>

    <rect x="330" y="380" width="440" height="40" rx="6" fill="#ffffff" stroke="#c8c8cc" stroke-width="1.5"/>
    <text x="346" y="405" font-size="12" fill="#4a4a4e" font-weight="600">domchange.ts</text>
    <text x="442" y="405" font-size="11" fill="#8a8a8e">chrome / ie / ios / android / safari</text>
  </g>
</svg>
