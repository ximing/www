<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="title"><title id="title">serializeFragment 的 mark 合并：active 栈维护公共前缀，相同 mark 只包一层</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#182230}.t{font-size:14px;font-weight:700}.h{font-size:13px;font-weight:700}.b{font-size:12px;fill:#334155}.n{font-size:12px;fill:#526176}.o{font-size:11px;fill:#0891b2;font-weight:700}.w{font-size:11px;fill:#dc2626;font-weight:700}</style><rect width="900" height="600" rx="18" fill="#f8fafc"/><text x="40" y="34" class="t">serializeFragment 的 mark 合并：三个文本节点，active 栈维护公共前缀</text><text x="60" y="72" class="h">输入：paragraph 内容里的三个文本节点（marks 数组按 rank 排序）</text><g><rect x="60" y="86" width="240" height="80" rx="8" fill="#ecfccb" stroke="#65a30d" stroke-width="1.5"/><text x="76" y="112" class="h">TextNode · "ab"</text><text x="76" y="136" class="b">marks: [em]</text></g><g><rect x="330" y="86" width="240" height="80" rx="8" fill="#ecfccb" stroke="#65a30d" stroke-width="1.5"/><text x="346" y="112" class="h">TextNode · "c"</text><text x="346" y="136" class="b">marks: [em, strong]</text></g><g><rect x="600" y="86" width="240" height="80" rx="8" fill="#ecfccb" stroke="#65a30d" stroke-width="1.5"/><text x="616" y="112" class="h">TextNode · "de"</text><text x="616" y="136" class="b">marks: [strong]</text></g><text x="60" y="206" class="h">active 栈的推进（栈元素是 [mark, 父 DOM] 对）</text><g><rect x="60" y="220" width="780" height="120" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="80" y="248" class="b">处理 "ab"：栈空，压入 em，文本进 em</text><text x="80" y="278" class="b">处理 "c"：栈底 em 与节点首个 mark 相等，保留；strong 是新 mark，压入 em 内层，文本进 strong</text><text x="80" y="308" class="b">处理 "de"：节点首个 mark 是 strong，与栈底 em 不等，公共前缀为空；弹出 strong 和 em，重新压入 strong，文本进 strong</text></g><text x="60" y="380" class="h">产出的 DOM（DocumentFragment 内）</text><g><rect x="60" y="394" width="780" height="120" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><g><rect x="80" y="412" width="380" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="96" y="436" class="h">&lt;em&gt;</text><text x="120" y="464" class="b">"ab"</text><g><rect x="200" y="440" width="240" height="44" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="216" y="468" class="h">&lt;strong&gt; "c"</text></g></g><g><rect x="500" y="412" width="240" height="84" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="516" y="436" class="h">&lt;strong&gt;</text><text x="540" y="464" class="b">"de"</text></g></g><text x="60" y="548" class="n">em 跨越两个节点只出现一次；strong 在 em 边界断开，重新开了一个包装元素</text><text x="60" y="574" class="n">spanning: false 的 mark 不参与前缀合并，相邻相同也各自包一层；序列化表里没有的 mark 被跳过，内容照常输出</text></svg>
