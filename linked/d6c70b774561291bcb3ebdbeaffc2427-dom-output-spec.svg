<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title"><title id="title">数组形态 DOMOutputSpec 的解析：标签、属性、子元素与 0 号洞</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#182230}.t{font-size:14px;font-weight:700}.h{font-size:13px;font-weight:700}.b{font-size:12px;fill:#334155}.n{font-size:12px;fill:#526176}.o{font-size:11px;fill:#0891b2;font-weight:700}.w{font-size:11px;fill:#dc2626;font-weight:700}.c{font-size:13px;fill:#334155;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style><rect width="900" height="560" rx="18" fill="#f8fafc"/><text x="40" y="34" class="t">数组形态 DOMOutputSpec 的解析：以 schema-basic 的 preDOM = ["pre", ["code", 0]] 为例</text><g><rect x="60" y="60" width="400" height="230" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="80" y="88" class="h">规格数组</text><text x="80" y="118" class="c">["pre",</text><text x="100" y="148" class="c">["code",</text><text x="120" y="178" class="c">0</text><text x="100" y="208" class="c">]</text><text x="80" y="238" class="c">]</text><text x="160" y="118" class="o">0 号位：标签名，可带「命名空间 空格」前缀</text><text x="180" y="148" class="o">第二位的纯对象才是 attrs，这里是子规格</text><text x="150" y="178" class="w">数字 0 是洞：节点内容插到这里</text></g><g><rect x="500" y="60" width="340" height="230" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="520" y="88" class="h">renderSpec 产出的 DOM</text><g><rect x="520" y="102" width="300" height="168" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="536" y="128" class="h">&lt;pre&gt;　← 返回值里的 dom</text><g><rect x="540" y="142" width="260" height="108" rx="8" fill="#ecfccb" stroke="#65a30d" stroke-width="1.5"/><text x="556" y="168" class="h">&lt;code&gt;</text><rect x="556" y="184" width="228" height="50" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4"/><text x="570" y="206" class="w">洞：contentDOM 指向 &lt;code&gt;</text><text x="570" y="224" class="b">段落内容序列化进这里</text></g></g></g><text x="60" y="330" class="n">洞必须是父元素的唯一子元素，同一规格里最多一个洞，违反时 renderSpec 抛 RangeError</text><text x="60" y="360" class="n">叶节点的规格不允许带洞：serializeNodeInner 遇到叶节点配 contentDOM 直接抛错，叶节点没有内容可放</text><text x="60" y="390" class="n">attrs 中值为 null 的键跳过；style 键走 cssText；键名带空格按「命名空间 属性名」走 setAttributeNS</text><text x="60" y="420" class="n">字符串子元素变成文本节点；嵌套规格递归解析，内层的洞向上透传，命名空间沿递归继承</text><text x="60" y="450" class="n">另外两种形态只放行文本节点：文本节点或 {dom: 文本节点} 原样返回，元素形态会落到数组解析并抛 RangeError</text><text x="60" y="492" class="h">blockArraysIn 防护</text><text x="60" y="518" class="n">attrs 里「首元素是字符串」的数组会被 suspiciousAttributes 登记；renderSpec 发现手上的规格数组来自 attrs 就抛错，</text><text x="60" y="540" class="n">防止不可信 JSON 里的数组被当成 DOM 规格解析成真实元素（XSS 防护）</text></svg>
