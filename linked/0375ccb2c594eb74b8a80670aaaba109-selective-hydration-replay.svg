<svg xmlns="http://www.w3.org/2000/svg" width="1090" height="340" viewBox="0 0 1090 340" role="img" aria-labelledby="title"><title id="title">选择性注水：点击未注水边界后的事件挂起、提权与重放流程（2021-09-09 master，cb8a50619b）</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#182230}.t{font-size:14px;font-weight:700}.h{font-size:13px;font-weight:700}.c{font-size:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#475569}.n{font-size:11px;fill:#64748b}.w{font-size:12px;fill:#334155}</style><rect width="1090" height="340" rx="18" fill="#f8fafc"/><text x="40" y="32" class="t">点击落在未注水的 Suspense 边界上（2021-09-09 master，cb8a50619b）</text>
<g><rect x="40" y="56" width="180" height="96" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><text x="130" y="80" class="h" text-anchor="middle">1. 点击到达</text><text x="130" y="100" class="w" text-anchor="middle">边界 DOM 已在页面上</text><text x="130" y="118" class="w" text-anchor="middle">fiber 未认领节点</text><text x="130" y="140" class="c" text-anchor="middle">dispatchDiscreteEvent</text></g>
<g><rect x="260" y="56" width="200" height="96" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="360" y="80" class="h" text-anchor="middle">2. 找不到已挂载实例</text><text x="360" y="100" class="w" text-anchor="middle">最近挂载点是脱水的</text><text x="360" y="118" class="w" text-anchor="middle">Suspense 边界</text><text x="360" y="140" class="c" text-anchor="middle">attemptToDispatchEvent</text></g>
<g><rect x="500" y="56" width="200" height="96" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text x="600" y="80" class="h" text-anchor="middle">3. 事件入队并提权</text><text x="600" y="100" class="w" text-anchor="middle">入 queuedDiscreteEvents</text><text x="600" y="118" class="w" text-anchor="middle">边界提升到 SyncLane</text><text x="600" y="140" class="c" text-anchor="middle">attemptDiscreteHydration</text></g>
<g><rect x="740" y="56" width="160" height="96" rx="8" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/><text x="820" y="80" class="h" text-anchor="middle">4. 边界注水提交</text><text x="820" y="100" class="w" text-anchor="middle">认领 DOM、绑定</text><text x="820" y="118" class="w" text-anchor="middle">事件监听</text><text x="820" y="140" class="c" text-anchor="middle">commitHydratedSuspense</text></g>
<g><rect x="940" y="56" width="130" height="96" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="1005" y="80" class="h" text-anchor="middle">5. 按序重放</text><text x="1005" y="100" class="w" text-anchor="middle">解除 blockedOn</text><text x="1005" y="118" class="w" text-anchor="middle">重新分发事件</text><text x="1005" y="140" class="c" text-anchor="middle">retryIfBlockedOn</text></g>
<g stroke="#94a3b8" stroke-width="2" fill="#94a3b8"><line x1="222" y1="104" x2="252" y2="104"/><path d="M254 104 L244 99 L244 109 Z"/><line x1="462" y1="104" x2="492" y2="104"/><path d="M494 104 L484 99 L484 109 Z"/><line x1="702" y1="104" x2="732" y2="104"/><path d="M734 104 L724 99 L724 109 Z"/><line x1="902" y1="104" x2="932" y2="104"/><path d="M934 104 L924 99 L924 109 Z"/></g>
<g><rect x="40" y="180" width="500" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="60" y="206" class="h">入队时的两个特例</text><text x="60" y="230" class="w">首个离散事件：queueDiscreteEvent 立刻同步尝试</text><text x="60" y="248" class="w">attemptSynchronousHydration，争取当帧解阻，保住 preventDefault。</text><text x="60" y="272" class="w">连续事件（mouseover、focusin 等）：同类只留最后一个，</text><text x="60" y="290" class="w">提权用 SelectiveHydrationLane（attemptContinuousHydration）。</text></g>
<g><rect x="570" y="180" width="500" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="590" y="206" class="h">保序与再阻塞</text><text x="590" y="230" class="w">队列非空时，后续离散事件直接入队，保证重放顺序。</text><text x="590" y="254" class="w">重放时若被嵌套的内层边界再次阻塞，记录新的 blockedOn，</text><text x="590" y="272" class="w">对内层边界再执行一次提权，等它注水完成后继续重放。</text></g>
<g><line x1="290" y1="180" x2="290" y2="156" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="820" y1="180" x2="820" y2="156" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/></g>
</svg>
