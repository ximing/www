<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect width="780" height="560" rx="8" fill="#f8fafc"/>
  <text x="30" y="34" font-size="16" font-weight="600" fill="#1f2937">热点 key 失效瞬间：缓存没挡住的流量去了哪</text>

  <!-- 网格线 -->
  <g stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4">
    <line x1="100" y1="120" x2="720" y2="120"/>
    <line x1="100" y1="190" x2="720" y2="190"/>
    <line x1="100" y1="260" x2="720" y2="260"/>
    <line x1="100" y1="330" x2="720" y2="330"/>
    <line x1="100" y1="400" x2="720" y2="400"/>
  </g>

  <!-- 坐标轴 -->
  <line x1="100" y1="70" x2="100" y2="460" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="100" y1="460" x2="720" y2="460" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- 尖峰区域底色 -->
  <path d="M385,431 C392,430 397,300 402,190 C405,130 410,112 415,118 C422,128 428,260 438,330 C448,395 480,425 540,429 L540,432 L385,432 Z" fill="#fee2e2"/>

  <!-- 失效时刻竖线 -->
  <line x1="405" y1="96" x2="405" y2="460" stroke="#d97706" stroke-width="1.3" stroke-dasharray="5 4"/>
  <rect x="322" y="72" width="166" height="24" rx="5" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
  <text x="405" y="88" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">热点目录 key 到期失效</text>

  <!-- 总请求 QPS（蓝，基本平稳） -->
  <path d="M100,208 C220,202 330,212 440,206 C540,201 640,209 720,205" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <text x="625" y="192" font-size="11.5" font-weight="600" fill="#1d4ed8" text-anchor="middle">总请求 QPS（访问高峰，平稳）</text>

  <!-- 数据库 QPS（红，尖峰） -->
  <path d="M100,432 C220,432 300,432 385,431 C392,430 397,300 402,190 C405,130 410,112 415,118 C422,128 428,260 438,330 C448,395 480,425 540,429 C600,432 660,432 720,432" fill="none" stroke="#dc2626" stroke-width="2.5"/>

  <!-- 改造后：互斥重建（琥珀虚线，小鼓包） -->
  <path d="M385,431 C395,429 400,414 405,402 C410,392 416,392 422,404 C429,417 442,428 462,430" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- 尖峰标注 -->
  <circle cx="411" cy="122" r="4.5" fill="#dc2626"/>
  <line x1="416" y1="126" x2="500" y2="150" stroke="#dc2626" stroke-width="1"/>
  <text x="505" y="146" font-size="12" font-weight="600" fill="#b91c1c">同一目录的列表查询被并发回源</text>
  <text x="505" y="164" font-size="11" fill="#b91c1c">几十台机器同时 miss，数据库 QPS 打满</text>

  <!-- 平稳期标注 -->
  <text x="230" y="414" font-size="11.5" fill="#64748b" text-anchor="middle">失效前：缓存扛住，回源流量 ≈ 0</text>
  <text x="630" y="414" font-size="11.5" fill="#64748b" text-anchor="middle">重建完成：缓存恢复，流量回落</text>

  <!-- 互斥重建标注 -->
  <line x1="455" y1="424" x2="540" y2="368" stroke="#d97706" stroke-width="1"/>
  <text x="544" y="360" font-size="11.5" font-weight="600" fill="#b45309">改造后：互斥重建</text>
  <text x="544" y="377" font-size="11" fill="#b45309">只放一个请求回源，其余等待或吃旧值</text>

  <!-- 图例 -->
  <line x1="118" y1="112" x2="148" y2="112" stroke="#2563eb" stroke-width="2.5"/>
  <text x="156" y="116" font-size="11" fill="#1d4ed8">总请求 QPS</text>
  <line x1="118" y1="134" x2="148" y2="134" stroke="#dc2626" stroke-width="2.5"/>
  <text x="156" y="138" font-size="11" fill="#b91c1c">数据库 QPS</text>
  <line x1="118" y1="156" x2="148" y2="156" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="156" y="160" font-size="11" fill="#b45309">改造后（互斥重建）</text>

  <!-- 轴标签 -->
  <text x="410" y="508" font-size="11.5" fill="#64748b" text-anchor="middle">时间（晚间高峰，示意）</text>
  <text x="265" y="0" font-size="11.5" fill="#64748b" text-anchor="middle" transform="translate(42 265) rotate(-90) translate(-265 0)">QPS（相对刻度，已脱敏）</text>

  <!-- 底部结论 -->
  <text x="390" y="542" font-size="11.5" fill="#64748b" text-anchor="middle">失效瞬间缓存层等于不存在，尖峰的宽度由重建速度决定——互斥重建把「全场回源」压成「一个回源」。</text>
</svg>
