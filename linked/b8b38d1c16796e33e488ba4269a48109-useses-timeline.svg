<svg xmlns="http://www.w3.org/2000/svg" width="1090" height="300" viewBox="0 0 1090 300" role="img" aria-labelledby="title"><title id="title">useSyncExternalStore 替换 useMutableSource 的三周时间线（2021-08-28 至 09-21）</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#182230}.t{font-size:14px;font-weight:700}.d{font-size:12px;font-weight:700;fill:#0f172a}.h{font-size:11px;fill:#64748b}.b{font-size:11.5px;fill:#334155}.w{font-size:11.5px;fill:#b45309}</style><rect width="1090" height="300" rx="18" fill="#f8fafc"/><text x="40" y="30" class="t">useSyncExternalStore 替换 useMutableSource 的三周（2021-08-28 → 09-21）</text>
<line x1="70" y1="150" x2="1020" y2="150" stroke="#94a3b8" stroke-width="2"/>
<!-- 08-28 -->
<circle cx="110" cy="150" r="7" fill="#2563eb"/><text x="110" y="126" class="d" text-anchor="middle">08-28</text><text x="110" y="112" class="h" text-anchor="middle">46a0f050</text><text x="110" y="178" class="b" text-anchor="middle">搭建 use-sync-external-store 包</text><text x="110" y="194" class="b" text-anchor="middle">同日发布替换 RFC</text>
<!-- 09-01 -->
<circle cx="280" cy="150" r="7" fill="#2563eb"/><text x="280" y="126" class="d" text-anchor="middle">09-01</text><text x="280" y="112" class="h" text-anchor="middle">1314299c7f</text><text x="280" y="178" class="b" text-anchor="middle">用户态 shim 落地</text><text x="280" y="194" class="b" text-anchor="middle">兼容所有支持 Hooks 的 React</text>
<!-- 09-07 -->
<circle cx="450" cy="150" r="7" fill="#0891b2"/><text x="450" y="126" class="d" text-anchor="middle">09-07</text><text x="450" y="112" class="h" text-anchor="middle">77912d9a05 → 06f98c16</text><text x="450" y="178" class="b" text-anchor="middle">先接线（抛 Not yet implemented）</text><text x="450" y="194" class="b" text-anchor="middle">再在 Fiber 里真正实现</text>
<!-- 09-20 -->
<circle cx="660" cy="150" r="7" fill="#dc2626"/><text x="660" y="126" class="d" text-anchor="middle">09-20</text><text x="660" y="112" class="h" text-anchor="middle">8209de26</text><text x="660" y="178" class="b" text-anchor="middle">删除 useMutableSource 全部实现</text><text x="660" y="194" class="b" text-anchor="middle">3900 余行，含 2500 行测试</text>
<!-- 09-21 -->
<circle cx="870" cy="150" r="7" fill="#d97706"/><text x="870" y="126" class="d" text-anchor="middle">09-21</text><text x="870" y="112" class="h" text-anchor="middle">82c8fa90</text><text x="870" y="178" class="w" text-anchor="middle">临时加回 useMutableSource</text><text x="870" y="194" class="b" text-anchor="middle">Recoil 在少数并发 root 中仍在用</text>
<path d="M1000 150 L1020 150 M1020 150 L1010 144 M1020 150 L1010 156" stroke="#94a3b8" stroke-width="2" fill="none"/>
<text x="1020" y="178" class="h" text-anchor="end">09-23 快照：两个 API 并存</text>
<g><rect x="40" y="228" width="1010" height="52" rx="10" fill="#ffffff" stroke="#e2e8f0"/><circle cx="66" cy="248" r="5" fill="#2563eb"/><text x="80" y="252" class="b">新包与新 API</text><circle cx="220" cy="248" r="5" fill="#0891b2"/><text x="234" y="252" class="b"> reconciler 实现</text><circle cx="380" cy="248" r="5" fill="#dc2626"/><text x="394" y="252" class="b">删除旧 API</text><circle cx="520" cy="248" r="5" fill="#d97706"/><text x="534" y="252" class="b">回滚加回</text><text x="80" y="272" class="h">同期：09-20 服务端实现（86b3e2461d、79b8fc6670）、09-21 React Native 版本（4da03c9fbd）</text></g>
</svg>
