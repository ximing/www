<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono','Menlo','Monaco','Consolas',monospace" font-size="13">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="5" refY="4" orient="auto"><path d="M0,8 L5,0 L10,8" fill="#8b949e"/></marker>
    <marker id="arrowLeft" markerWidth="10" markerHeight="8" refX="5" refY="4" orient="auto"><path d="M0,4 L10,0 L10,8" fill="#fd7e14"/></marker>
  </defs>
  <rect width="700" height="420" fill="url(#bg)" rx="8"/>

  <text x="350" y="28" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="bold">三种性质的能力</text>

  <!-- Data Plane -->
  <rect x="40" y="48" width="620" height="100" rx="6" fill="#0d1a2d" stroke="#58a6ff" stroke-width="1.5" opacity="0.6"/>
  <rect x="40" y="48" width="620" height="28" rx="6" fill="#1a3a6a" opacity="0.5"/>
  <rect x="40" y="68" width="620" height="2" fill="#58a6ff" opacity="0.3"/>
  <text x="55" y="67" fill="#58a6ff" font-size="13" font-weight="bold">数据面：Agent 真正执行任务</text>

  <rect x="55" y="85" width="140" height="24" rx="4" fill="#1a365d" stroke="#2a4a7f" stroke-width="0.5"/>
  <text x="125" y="101" text-anchor="middle" fill="#8b949e" font-size="11">任务定义</text>
  <text x="200" y="101" fill="#8b949e" font-size="11">→</text>
  <rect x="215" y="85" width="140" height="24" rx="4" fill="#3a2a1a" stroke="#5c4228" stroke-width="0.5"/>
  <text x="285" y="101" text-anchor="middle" fill="#8b949e" font-size="11">Agent Runtime</text>
  <text x="360" y="101" fill="#8b949e" font-size="11">→</text>
  <rect x="375" y="85" width="120" height="24" rx="4" fill="#2a1a3a" stroke="#46285c" stroke-width="0.5"/>
  <text x="435" y="101" text-anchor="middle" fill="#8b949e" font-size="11">Context/Knowledge</text>
  <text x="500" y="101" fill="#8b949e" font-size="11">→</text>
  <rect x="515" y="85" width="120" height="24" rx="4" fill="#1a4731" stroke="#236b4a" stroke-width="0.5"/>
  <text x="575" y="101" text-anchor="middle" fill="#8b949e" font-size="11">Tools/Env</text>

  <rect x="55" y="115" width="580" height="24" rx="4" fill="#1a2a3a" stroke="#28425c" stroke-width="0.5"/>
  <text x="345" y="131" text-anchor="middle" fill="#8b949e" font-size="11">State / Memory / Artifacts</text>

  <!-- Arrow down -->
  <line x1="350" y1="150" x2="350" y2="170" stroke="#8b949e" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Control Plane -->
  <rect x="40" y="172" width="620" height="64" rx="6" fill="#2a1a00" stroke="#d29922" stroke-width="1.5" opacity="0.6"/>
  <rect x="40" y="172" width="620" height="28" rx="6" fill="#4a2a00" opacity="0.5"/>
  <rect x="40" y="192" width="620" height="2" fill="#d29922" opacity="0.3"/>
  <text x="55" y="191" fill="#d29922" font-size="13" font-weight="bold">控制面：约束和观察所有层</text>

  <rect x="55" y="206" width="280" height="24" rx="4" fill="#4a3000" stroke="#7a5000" stroke-width="0.5"/>
  <text x="195" y="222" text-anchor="middle" fill="#8b949e" font-size="11">Governance（安全、权限、审批、配额、审计）</text>
  <rect x="350" y="206" width="280" height="24" rx="4" fill="#3a1a1a" stroke="#5c2828" stroke-width="0.5"/>
  <text x="490" y="222" text-anchor="middle" fill="#8b949e" font-size="11">Observability（Trace、归因、快照）</text>

  <!-- Arrow down -->
  <line x1="350" y1="238" x2="350" y2="258" stroke="#8b949e" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Evolution Plane -->
  <rect x="40" y="260" width="620" height="64" rx="6" fill="#1a0a2a" stroke="#a371f7" stroke-width="1.5" opacity="0.6"/>
  <rect x="40" y="260" width="620" height="28" rx="6" fill="#2a0a4a" opacity="0.5"/>
  <rect x="40" y="282" width="620" height="2" fill="#a371f7" opacity="0.3"/>
  <text x="55" y="279" fill="#a371f7" font-size="13" font-weight="bold">演进面：根据运行结果改进整个 Harness</text>

  <rect x="55" y="294" width="180" height="24" rx="4" fill="#1a2a2a" stroke="#284a4a" stroke-width="0.5"/>
  <text x="145" y="310" text-anchor="middle" fill="#8b949e" font-size="11">Verification</text>
  <text x="240" y="310" fill="#8b949e" font-size="11">→</text>
  <rect x="255" y="294" width="140" height="24" rx="4" fill="#2a1a2a" stroke="#4a284a" stroke-width="0.5"/>
  <text x="325" y="310" text-anchor="middle" fill="#8b949e" font-size="11">Evaluation</text>
  <text x="400" y="310" fill="#8b949e" font-size="11">→</text>
  <rect x="415" y="294" width="220" height="24" rx="4" fill="#3a1a2a" stroke="#5c284a" stroke-width="0.5"/>
  <text x="525" y="310" text-anchor="middle" fill="#8b949e" font-size="11">Failure Attribution → AHE</text>

  <!-- Feedback arrow from evolution back up -->
  <path d="M 680 340 Q 730 340 730 200 Q 730 80 680 80" fill="none" stroke="#a371f7" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowLeft)"/>
  <text x="742" y="210" fill="#a371f7" font-size="10" transform="rotate(90,742,210)">反馈修改所有组件</text>

  <!-- Bottom: External Dependencies -->
  <rect x="100" y="350" width="500" height="50" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="350" y="372" text-anchor="middle" fill="#484f58" font-size="11">外部依赖：Model / Inference Runtime / Embedding / Reranker</text>
  <text x="350" y="390" text-anchor="middle" fill="#484f58" font-size="11">这些组件不在 Harness 内，但 Harness 假设它们可用</text>
</svg>