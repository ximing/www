<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9d174d"/>
      <stop offset="55%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.7">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- dot grid -->
  <g fill="#ffffff" opacity="0.10">
    <circle cx="60" cy="60" r="2"/><circle cx="140" cy="60" r="2"/><circle cx="220" cy="60" r="2"/><circle cx="300" cy="60" r="2"/><circle cx="380" cy="60" r="2"/><circle cx="460" cy="60" r="2"/><circle cx="540" cy="60" r="2"/><circle cx="620" cy="60" r="2"/><circle cx="700" cy="60" r="2"/>
    <circle cx="60" cy="390" r="2"/><circle cx="140" cy="390" r="2"/><circle cx="220" cy="390" r="2"/><circle cx="300" cy="390" r="2"/><circle cx="380" cy="390" r="2"/><circle cx="460" cy="390" r="2"/><circle cx="540" cy="390" r="2"/><circle cx="620" cy="390" r="2"/><circle cx="700" cy="390" r="2"/>
  </g>

  <!-- canvas photo placeholder -->
  <rect x="250" y="95" width="300" height="210" rx="10" fill="#fdf2f8" opacity="0.18"/>

  <!-- brush stroke -->
  <path d="M 280 260 C 330 180 380 250 430 170 C 460 120 500 160 520 130" stroke="#fbcfe8" stroke-width="9" fill="none" stroke-linecap="round" opacity="0.95"/>

  <!-- dashed selection -->
  <rect x="290" y="125" width="220" height="150" rx="6" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="12 9"/>

  <!-- selection handles -->
  <g fill="#ffffff">
    <rect x="283" y="118" width="14" height="14" rx="3"/>
    <rect x="503" y="118" width="14" height="14" rx="3"/>
    <rect x="283" y="268" width="14" height="14" rx="3"/>
    <rect x="503" y="268" width="14" height="14" rx="3"/>
  </g>

  <!-- mosaic hint -->
  <g fill="#fbcfe8" opacity="0.7">
    <rect x="590" y="120" width="18" height="18" rx="2"/>
    <rect x="612" y="120" width="18" height="18" rx="2" opacity="0.5"/>
    <rect x="590" y="142" width="18" height="18" rx="2" opacity="0.5"/>
    <rect x="612" y="142" width="18" height="18" rx="2"/>
  </g>

  <!-- title -->
  <text x="400" y="395" fill="#ffffff" font-family="Georgia, 'Noto Serif SC', serif" font-size="32" font-weight="700" text-anchor="middle" letter-spacing="1">Fabric Photo</text>
  <text x="400" y="425" fill="#fbcfe8" font-family="'Noto Sans SC', system-ui, sans-serif" font-size="15" text-anchor="middle" letter-spacing="4">Canvas 图片编辑器</text>
</svg>
