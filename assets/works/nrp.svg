<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="55%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.7">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- dot grid -->
  <g fill="#ffffff" opacity="0.10">
    <circle cx="60" cy="60" r="2"/><circle cx="140" cy="60" r="2"/><circle cx="220" cy="60" r="2"/><circle cx="300" cy="60" r="2"/><circle cx="380" cy="60" r="2"/><circle cx="460" cy="60" r="2"/><circle cx="540" cy="60" r="2"/><circle cx="620" cy="60" r="2"/><circle cx="700" cy="60" r="2"/>
    <circle cx="60" cy="390" r="2"/><circle cx="140" cy="390" r="2"/><circle cx="220" cy="390" r="2"/><circle cx="300" cy="390" r="2"/><circle cx="380" cy="390" r="2"/><circle cx="460" cy="390" r="2"/><circle cx="540" cy="390" r="2"/><circle cx="620" cy="390" r="2"/><circle cx="700" cy="390" r="2"/>
  </g>

  <!-- local server box -->
  <rect x="90" y="175" width="160" height="90" rx="14" fill="#f5f3ff"/>
  <text x="170" y="212" fill="#5b21b6" font-family="'Noto Sans SC', system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">本地服务</text>
  <text x="170" y="240" fill="#7c3aed" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" text-anchor="middle">:8080</text>

  <!-- NAT wall -->
  <g fill="#c4b5fd" opacity="0.8">
    <rect x="292" y="140" width="16" height="36" rx="2"/>
    <rect x="292" y="182" width="16" height="36" rx="2"/>
    <rect x="292" y="224" width="16" height="36" rx="2"/>
    <rect x="292" y="266" width="16" height="36" rx="2"/>
  </g>
  <text x="300" y="128" fill="#ddd6fe" font-family="'Noto Sans SC', system-ui, sans-serif" font-size="13" text-anchor="middle" opacity="0.8">NAT</text>

  <!-- proxy node -->
  <circle cx="400" cy="220" r="44" fill="#ffffff"/>
  <circle cx="400" cy="220" r="30" fill="#7c3aed"/>
  <path d="M 388 220 L 408 220 M 400 208 L 412 220 L 400 232" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- internet cloud -->
  <g fill="#f5f3ff">
    <circle cx="560" cy="200" r="34"/>
    <circle cx="600" cy="212" r="28"/>
    <circle cx="526" cy="216" r="24"/>
    <rect x="524" y="208" width="80" height="30" rx="15"/>
  </g>
  <text x="566" y="222" fill="#5b21b6" font-family="'Noto Sans SC', system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">公网</text>

  <!-- tunnels -->
  <path d="M 252 205 L 352 205" stroke="#fde047" stroke-width="4"/>
  <path d="M 340 196 L 356 205 L 340 214" stroke="#fde047" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 448 235 L 505 235" stroke="#fde047" stroke-width="4"/>
  <path d="M 492 226 L 508 235 L 492 244" stroke="#fde047" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 352 250 L 252 250" stroke="#ddd6fe" stroke-width="3" stroke-dasharray="7 6" opacity="0.8"/>

  <!-- title -->
  <text x="400" y="390" fill="#ffffff" font-family="Georgia, 'Noto Serif SC', serif" font-size="32" font-weight="700" text-anchor="middle" letter-spacing="1">NRP</text>
  <text x="400" y="420" fill="#ddd6fe" font-family="'Noto Sans SC', system-ui, sans-serif" font-size="15" text-anchor="middle" letter-spacing="4">内网穿透 · 反向代理</text>
</svg>
