<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="55%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.7">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- dot grid -->
  <g fill="#ffffff" opacity="0.10">
    <circle cx="60" cy="60" r="2"/><circle cx="140" cy="60" r="2"/><circle cx="220" cy="60" r="2"/><circle cx="300" cy="60" r="2"/><circle cx="380" cy="60" r="2"/><circle cx="460" cy="60" r="2"/><circle cx="540" cy="60" r="2"/><circle cx="620" cy="60" r="2"/><circle cx="700" cy="60" r="2"/>
    <circle cx="60" cy="390" r="2"/><circle cx="140" cy="390" r="2"/><circle cx="220" cy="390" r="2"/><circle cx="300" cy="390" r="2"/><circle cx="380" cy="390" r="2"/><circle cx="460" cy="390" r="2"/><circle cx="540" cy="390" r="2"/><circle cx="620" cy="390" r="2"/><circle cx="700" cy="390" r="2"/>
  </g>

  <!-- dependency edges -->
  <g stroke="#bfdbfe" stroke-width="3" fill="none" opacity="0.8">
    <path d="M 400 210 L 240 130"/>
    <path d="M 400 210 L 560 130"/>
    <path d="M 400 210 L 240 300"/>
    <path d="M 400 210 L 560 300"/>
    <path d="M 240 130 L 560 130" stroke-dasharray="6 8" opacity="0.5"/>
  </g>

  <!-- satellite nodes -->
  <g fill="#eff6ff">
    <circle cx="240" cy="130" r="20"/>
    <circle cx="560" cy="130" r="20"/>
    <circle cx="240" cy="300" r="20" opacity="0.9"/>
    <circle cx="560" cy="300" r="20" opacity="0.9"/>
  </g>
  <g fill="#3b82f6">
    <circle cx="240" cy="130" r="10"/>
    <circle cx="560" cy="130" r="10"/>
    <circle cx="240" cy="300" r="10"/>
    <circle cx="560" cy="300" r="10"/>
  </g>

  <!-- central observer node -->
  <circle cx="400" cy="210" r="38" fill="#ffffff"/>
  <circle cx="400" cy="210" r="24" fill="#1e3a8a"/>
  <circle cx="400" cy="210" r="10" fill="#93c5fd"/>

  <!-- title -->
  <text x="400" y="400" fill="#ffffff" font-family="Georgia, 'Noto Serif SC', serif" font-size="32" font-weight="700" text-anchor="middle" letter-spacing="1">RabJS</text>
  <text x="400" y="428" fill="#bfdbfe" font-family="'Noto Sans SC', system-ui, sans-serif" font-size="15" text-anchor="middle" letter-spacing="4">响应式状态管理</text>
</svg>
