<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="55%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.7">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- particles -->
  <g fill="#ffffff">
    <circle cx="90" cy="80" r="3" opacity="0.5"/>
    <circle cx="170" cy="330" r="2.5" opacity="0.4"/>
    <circle cx="700" cy="90" r="3" opacity="0.5"/>
    <circle cx="640" cy="340" r="2.5" opacity="0.4"/>
    <circle cx="740" cy="220" r="2" opacity="0.35"/>
    <circle cx="70" cy="230" r="2" opacity="0.35"/>
    <circle cx="250" cy="70" r="2" opacity="0.3"/>
    <circle cx="560" cy="60" r="2" opacity="0.3"/>
  </g>

  <!-- react atom -->
  <g transform="translate(400,215)" fill="none" stroke="#a5b4fc" stroke-width="5">
    <ellipse rx="150" ry="58" opacity="0.95"/>
    <ellipse rx="150" ry="58" transform="rotate(60)" opacity="0.75"/>
    <ellipse rx="150" ry="58" transform="rotate(120)" opacity="0.75"/>
  </g>
  <circle cx="400" cy="215" r="26" fill="#e0e7ff"/>
  <circle cx="400" cy="215" r="16" fill="#4f46e5"/>

  <!-- pixi sprite sparks on the rings -->
  <g fill="#fbbf24">
    <circle cx="530" cy="185" r="7"/>
    <circle cx="296" cy="148" r="6"/>
    <circle cx="330" cy="300" r="6"/>
  </g>

  <!-- title -->
  <text x="400" y="395" fill="#ffffff" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="34" font-weight="700" text-anchor="middle" letter-spacing="1">@pixi/react</text>
  <text x="400" y="428" fill="#c7d2fe" font-family="'Noto Sans SC', system-ui, sans-serif" font-size="16" text-anchor="middle" letter-spacing="4">PixiJS × React 声明式渲染</text>
</svg>
