<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="55%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#2bbc8a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.7">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#042f2e" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- dot grid -->
  <g fill="#ffffff" opacity="0.10">
    <circle cx="60" cy="60" r="2"/><circle cx="140" cy="60" r="2"/><circle cx="220" cy="60" r="2"/><circle cx="300" cy="60" r="2"/><circle cx="380" cy="60" r="2"/><circle cx="460" cy="60" r="2"/><circle cx="540" cy="60" r="2"/><circle cx="620" cy="60" r="2"/><circle cx="700" cy="60" r="2"/>
    <circle cx="60" cy="390" r="2"/><circle cx="140" cy="390" r="2"/><circle cx="220" cy="390" r="2"/><circle cx="300" cy="390" r="2"/><circle cx="380" cy="390" r="2"/><circle cx="460" cy="390" r="2"/><circle cx="540" cy="390" r="2"/><circle cx="620" cy="390" r="2"/><circle cx="700" cy="390" r="2"/>
  </g>

  <!-- mindmap branches -->
  <g stroke="#ccfbf1" stroke-width="3" fill="none" opacity="0.85">
    <path d="M 400 225 C 320 225 300 140 215 130"/>
    <path d="M 400 225 C 330 225 310 300 225 310"/>
    <path d="M 400 225 C 480 225 500 140 585 130"/>
    <path d="M 400 225 C 470 225 490 300 575 310"/>
    <path d="M 400 210 C 400 170 400 130 400 105"/>
  </g>

  <!-- child nodes -->
  <g filter="url(#soft)">
    <rect x="150" y="112" width="130" height="36" rx="18" fill="#f0fdfa"/>
    <rect x="160" y="292" width="130" height="36" rx="18" fill="#f0fdfa" opacity="0.92"/>
    <rect x="520" y="112" width="130" height="36" rx="18" fill="#f0fdfa"/>
    <rect x="510" y="292" width="130" height="36" rx="18" fill="#f0fdfa" opacity="0.92"/>
    <rect x="335" y="68" width="130" height="36" rx="18" fill="#f0fdfa" opacity="0.95"/>
  </g>
  <g fill="#0f766e" font-family="'Noto Sans SC', system-ui, sans-serif" font-size="15" text-anchor="middle">
    <text x="215" y="135">节点编辑</text>
    <text x="225" y="315">样式主题</text>
    <text x="585" y="135">多布局切换</text>
    <text x="575" y="315">导入导出</text>
    <text x="400" y="91">撤销重做</text>
  </g>

  <!-- root node -->
  <g filter="url(#soft)">
    <rect x="318" y="195" width="164" height="60" rx="30" fill="#ffffff"/>
  </g>
  <text x="400" y="232" fill="#0d9488" font-family="'Noto Sans SC', system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">脑图</text>

  <!-- title -->
  <text x="400" y="412" fill="#ffffff" font-family="Georgia, 'Noto Serif SC', serif" font-size="30" font-weight="700" text-anchor="middle" letter-spacing="1">KityMinder Editor</text>
</svg>
