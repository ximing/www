<svg xmlns="http://www.w3.org/2000/svg" width="1090" height="430" viewBox="0 0 1090 430" role="img" aria-labelledby="title"><title id="title">同一页面过 renderToString 与 pipeToNodeWritable 的输出时序（2021-09-01 master，1314299c7f）</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#182230}.t{font-size:14px;font-weight:700}.s{font-size:12px;font-weight:700;fill:#475569}.l{font-size:12px;fill:#334155}.n{font-size:11px;fill:#64748b}.m{font-size:11px;fill:#0f766e;font-weight:700}.ax{stroke:#94a3b8;stroke-width:2}.segA{fill:#eef2ff;stroke:#818cf8}.segB{fill:#ecfdf5;stroke:#34d399}.segW{fill:#fff7ed;stroke:#fb923c}.ph{fill:#f1f5f9;stroke:#94a3b8;stroke-dasharray:4 3}</style><rect width="1090" height="430" rx="18" fill="#f8fafc"/><text x="40" y="30" class="t">同一页面过两个 API 的输出时序（2021-09-01 master，1314299c7f）</text><text x="40" y="54" class="n">页面结构：外壳（头部、导航）+ Suspense 边界 A（数据 200ms 到）+ Suspense 边界 B（数据 800ms 到）</text><line x1="170" y1="70" x2="170" y2="390" class="ax"/><line x1="170" y1="392" x2="1050" y2="392" class="ax"/><path d="M1050 392 L1040 387 L1040 397 Z" fill="#94a3b8"/><text x="1010" y="412" class="n">时间 →</text><text x="182" y="90" class="n">t=0</text><text x="380" y="90" class="n">200ms</text><text x="760" y="90" class="n">800ms</text><line x1="395" y1="96" x2="395" y2="382" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/><line x1="775" y1="96" x2="775" y2="382" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/><text x="40" y="130" class="s">renderToString</text><text x="40" y="146" class="n">（旧实现 / Fizz 版都等全部）</text><rect x="180" y="112" width="86" height="30" rx="6" class="ph"/><text x="223" y="131" class="n" text-anchor="middle">渲染外壳</text><rect x="266" y="112" width="504" height="30" rx="6" class="segW"/><text x="518" y="126" class="l" text-anchor="middle">阻塞等待：数据 B 是整页的短板</text><text x="518" y="139" class="n" text-anchor="middle">挂起的边界要么等数据，要么 fallback 直接定稿</text><rect x="775" y="112" width="150" height="30" rx="6" class="segA"/><text x="850" y="126" class="m" text-anchor="middle">首字节 TTFB</text><text x="850" y="139" class="n" text-anchor="middle">一次性返回完整 HTML</text><text x="40" y="196" class="s">客户端可交互</text><text x="40" y="212" class="n">（renderToString 路径）</text><rect x="775" y="178" width="240" height="30" rx="6" class="ph"/><text x="895" y="192" class="n" text-anchor="middle">HTML 到齐后才开始整页 hydrate</text><text x="895" y="205" class="n" text-anchor="middle">任何一块都不能提前可交互</text><text x="40" y="272" class="s">pipeToNodeWritable</text><rect x="180" y="234" width="86" height="30" rx="6" class="ph"/><text x="223" y="253" class="n" text-anchor="middle">渲染外壳</text><rect x="266" y="234" width="124" height="30" rx="6" class="segA"/><text x="328" y="248" class="m" text-anchor="middle">首字节 TTFB</text><text x="328" y="261" class="n" text-anchor="middle">外壳 + 两个 &lt;!--$?--&gt; fallback</text><rect x="400" y="234" width="160" height="30" rx="6" class="segB"/><text x="480" y="248" class="l" text-anchor="middle">A 数据到：隐藏容器 + $RC 脚本</text><text x="480" y="261" class="n" text-anchor="middle">边界 A 原地替换为正式内容</text><rect x="780" y="234" width="160" height="30" rx="6" class="segB"/><text x="860" y="248" class="l" text-anchor="middle">B 数据到：同样补发一段</text><text x="860" y="261" class="n" text-anchor="middle">destination.end() 收尾</text><text x="40" y="330" class="s">客户端可交互</text><text x="40" y="346" class="n">（流式路径）</text><rect x="266" y="296" width="129" height="30" rx="6" class="segA"/><text x="330" y="310" class="m" text-anchor="middle">外壳先 hydrate</text><text x="330" y="323" class="n" text-anchor="middle">到得早的部分早可交互</text><rect x="400" y="296" width="160" height="30" rx="6" class="segB"/><text x="480" y="310" class="l" text-anchor="middle">边界 A 补发后即可注水</text><text x="480" y="323" class="n" text-anchor="middle">$RC 里留了 _reactRetry 钩子</text><rect x="780" y="296" width="160" height="30" rx="6" class="ph"/><text x="860" y="310" class="n" text-anchor="middle">B 的最后一块 hydrate</text><text x="860" y="323" class="n" text-anchor="middle">不必等整页</text><text x="40" y="376" class="n">renderToString 的首字节被最慢的数据源拖住；pipeToNodeWritable 的首字节只等外壳渲染，后续按边界就绪顺序补发</text></svg>
