<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="55%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#2bbc8a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.7">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#042f2e" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>

  <!-- dot grid -->
  <g fill="#ffffff" opacity="0.10">
    <circle cx="90" cy="72" r="2.5"/><circle cx="192" cy="72" r="2.5"/><circle cx="294" cy="72" r="2.5"/><circle cx="396" cy="72" r="2.5"/><circle cx="498" cy="72" r="2.5"/><circle cx="600" cy="72" r="2.5"/><circle cx="702" cy="72" r="2.5"/><circle cx="804" cy="72" r="2.5"/><circle cx="906" cy="72" r="2.5"/><circle cx="1008" cy="72" r="2.5"/><circle cx="1110" cy="72" r="2.5"/>
    <circle cx="90" cy="828" r="2.5"/><circle cx="192" cy="828" r="2.5"/><circle cx="294" cy="828" r="2.5"/><circle cx="396" cy="828" r="2.5"/><circle cx="498" cy="828" r="2.5"/><circle cx="600" cy="828" r="2.5"/><circle cx="702" cy="828" r="2.5"/><circle cx="804" cy="828" r="2.5"/><circle cx="906" cy="828" r="2.5"/><circle cx="1008" cy="828" r="2.5"/><circle cx="1110" cy="828" r="2.5"/>
  </g>

  <!-- mindmap diagram -->
  <!-- branches -->
  <g stroke="#ccfbf1" stroke-width="4" fill="none" opacity="0.85">
    <path d="M 600 380 C 600 330 600 280 600 226"/>
    <path d="M 490 392 C 440 392 440 285 465 285"/>
    <path d="M 490 448 C 440 448 440 555 465 555"/>
    <path d="M 710 392 C 760 392 760 285 735 285"/>
    <path d="M 710 448 C 760 448 760 555 735 555"/>
  </g>

  <!-- child nodes -->
  <g filter="url(#soft)">
    <rect x="505" y="174" width="190" height="52" rx="26" fill="#f0fdfa" opacity="0.95"/>
    <rect x="275" y="259" width="190" height="52" rx="26" fill="#f0fdfa"/>
    <rect x="275" y="529" width="190" height="52" rx="26" fill="#f0fdfa" opacity="0.92"/>
    <rect x="735" y="259" width="190" height="52" rx="26" fill="#f0fdfa"/>
    <rect x="735" y="529" width="190" height="52" rx="26" fill="#f0fdfa" opacity="0.92"/>
  </g>
  <g fill="#0f766e" font-family="'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="20" text-anchor="middle">
    <text x="600" y="207">撤销重做</text>
    <text x="370" y="292">节点编辑</text>
    <text x="370" y="562">样式主题</text>
    <text x="830" y="292">多布局切换</text>
    <text x="830" y="562">导入导出</text>
  </g>

  <!-- root node -->
  <g filter="url(#soft)">
    <rect x="490" y="380" width="220" height="80" rx="40" fill="#ffffff"/>
  </g>
  <text x="600" y="431" fill="#0d9488" font-family="'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="30" font-weight="700" text-anchor="middle">脑图</text>

  <!-- title -->
  <text x="600" y="752" fill="#ffffff" font-family="Georgia, 'Songti SC', 'Noto Serif SC', serif" font-size="60" font-weight="700" text-anchor="middle" letter-spacing="2">KityMinder Editor</text>
  <text x="600" y="808" fill="#99f6e4" font-family="'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="21" text-anchor="middle" letter-spacing="6">百度脑图 · 核心编辑器</text>
</svg>
