<svg xmlns="http://www.w3.org/2000/svg" width="800" height="392" viewBox="0 0 800 392" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b45309"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#71717a"/>
    </marker>
  </defs>

  <text x="140" y="24" font-size="12.5" font-weight="600" fill="#3f3f46" text-anchor="middle">四种活</text>
  <text x="590" y="24" font-size="12.5" font-weight="600" fill="#3f3f46" text-anchor="middle">三档模型 + 确定性代码</text>

  <!-- activities -->
  <rect x="30" y="40" width="220" height="66" rx="8" fill="#f4f4f5"/>
  <text x="140" y="62" font-size="13" font-weight="600" fill="#18181b" text-anchor="middle">调查分析</text>
  <text x="140" y="82" font-size="11" fill="#3f3f46" text-anchor="middle">读代码、提取事实</text>
  <text x="140" y="98" font-size="11" fill="#71717a" text-anchor="middle">高频 · 单次推理浅</text>

  <rect x="30" y="122" width="220" height="66" rx="8" fill="#ededf0"/>
  <text x="140" y="144" font-size="13" font-weight="600" fill="#18181b" text-anchor="middle">转码干活</text>
  <text x="140" y="164" font-size="11" fill="#3f3f46" text-anchor="middle">按计划逐文件写 React</text>
  <text x="140" y="180" font-size="11" fill="#71717a" text-anchor="middle">质量决定修复循环轮次</text>

  <rect x="30" y="204" width="220" height="66" rx="8" fill="#e4e4e7"/>
  <text x="140" y="226" font-size="13" font-weight="600" fill="#18181b" text-anchor="middle">复杂规划</text>
  <text x="140" y="246" font-size="11" fill="#3f3f46" text-anchor="middle">页面级迁移规划</text>
  <text x="140" y="262" font-size="11" fill="#71717a" text-anchor="middle">一页一次 · 计划错全部跟着错</text>

  <rect x="30" y="286" width="220" height="66" rx="8" fill="#f4f4f5"/>
  <text x="140" y="308" font-size="13" font-weight="600" fill="#18181b" text-anchor="middle">输出标准化</text>
  <text x="140" y="328" font-size="11" fill="#3f3f46" text-anchor="middle">格式归一与校验</text>
  <text x="140" y="344" font-size="11" fill="#71717a" text-anchor="middle">能用代码就不用模型</text>

  <!-- models -->
  <rect x="430" y="40" width="340" height="66" rx="8" fill="#f4f4f5"/>
  <text x="600" y="62" font-size="13" font-weight="600" fill="#18181b" text-anchor="middle">glm-5.3-flash · 成本档</text>
  <text x="600" y="82" font-size="11" fill="#3f3f46" text-anchor="middle">高频活的主力，量大不心疼</text>
  <text x="600" y="98" font-size="11" fill="#71717a" text-anchor="middle">兼作标准化的模型兜底</text>

  <rect x="430" y="122" width="340" height="66" rx="8" fill="#dcdce0"/>
  <text x="600" y="144" font-size="13" font-weight="600" fill="#18181b" text-anchor="middle">glm-5.3 · 质量档</text>
  <text x="600" y="164" font-size="11" fill="#3f3f46" text-anchor="middle">转码专用：这里省 token</text>
  <text x="600" y="180" font-size="11" fill="#71717a" text-anchor="middle">会在一轮轮修复里加倍还回去</text>

  <rect x="430" y="204" width="340" height="66" rx="8" fill="#dcdce0"/>
  <text x="600" y="226" font-size="13" font-weight="600" fill="#18181b" text-anchor="middle">kimi-3 · 推理档</text>
  <text x="600" y="246" font-size="11" fill="#3f3f46" text-anchor="middle">整批活里最重的一次推理</text>
  <text x="600" y="262" font-size="11" fill="#71717a" text-anchor="middle">返回草案后 pi 确定性代码标准化落库</text>

  <rect x="430" y="286" width="340" height="66" rx="8" fill="#fdf6ec"/>
  <text x="600" y="308" font-size="13" font-weight="600" fill="#b45309" text-anchor="middle">确定性代码优先</text>
  <text x="600" y="328" font-size="11" fill="#7c5a2e" text-anchor="middle">标准化的第一选择，无模型调用</text>
  <text x="600" y="344" font-size="11" fill="#7c5a2e" text-anchor="middle">兜不住才回落 flash</text>

  <!-- arrows: activity → model -->
  <line x1="250" y1="73" x2="424" y2="73" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrow-amber)"/>
  <line x1="250" y1="155" x2="424" y2="155" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrow-amber)"/>
  <line x1="250" y1="237" x2="424" y2="237" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrow-amber)"/>
  <line x1="250" y1="319" x2="424" y2="319" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrow-amber)"/>
  <path d="M 500 286 L 500 200 L 470 200 L 470 110" fill="none" stroke="#71717a" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arrow-gray)"/>
  <text x="492" y="196" font-size="10.5" fill="#71717a" text-anchor="middle">兜底</text>

  <!-- bottom note -->
  <rect x="30" y="364" width="740" height="20" rx="6" fill="#f4f4f5"/>
  <text x="400" y="378" font-size="11" fill="#3f3f46" text-anchor="middle">模型名经 argv --model · 端点与鉴权经 env 注入 · 配置只存环境变量名（token 不落盘） · spawn 黑名单剥 --model · result 帧 usage 按页累计，超阈值升级人工</text>
</svg>
