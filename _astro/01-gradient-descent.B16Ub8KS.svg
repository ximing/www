<svg viewBox="0 0 980 680" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono','Menlo','Monaco','Consolas',monospace" font-size="13">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <linearGradient id="panelL" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a2a3a"/><stop offset="100%" stop-color="#28425c"/></linearGradient>
    <linearGradient id="panelR" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2a1a3a"/><stop offset="100%" stop-color="#46285c"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrGray" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#8b949e"/></marker>
    <marker id="arrBlue" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#58a6ff"/></marker>
    <marker id="arrRed" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#f85149"/></marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#3fb950"/></marker>
    <marker id="arrPurple" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#a371f7"/></marker>
  </defs>

  <rect width="980" height="680" fill="url(#bg)" rx="8"/>

  <text x="490" y="34" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="bold" font-family="'Segoe UI','SF Pro',sans-serif">训练一个神经网络在做什么：梯度下降与反向传播</text>
  <text x="490" y="54" text-anchor="middle" fill="#8b949e" font-size="12">左：参数空间里沿负梯度一步步下坡；右：两层网络的一次前向与反向记账</text>

  <!-- ============ 左：损失曲面与梯度下降路径 ============ -->
  <rect x="30" y="80" width="440" height="430" rx="6" fill="url(#panelL)" filter="url(#glow)"/>
  <text x="250" y="104" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">损失 L 的等高线（参数空间：w, b）</text>
  <text x="250" y="121" text-anchor="middle" fill="#8b949e" font-size="10">每个点是一组参数取值，等高线越高损失越大</text>

  <!-- 等高线，中心最小值在 (250, 330) -->
  <ellipse cx="250" cy="330" rx="180" ry="130" fill="none" stroke="#28425c" stroke-width="1.5"/>
  <ellipse cx="250" cy="330" rx="145" ry="102" fill="none" stroke="#2f4d6b" stroke-width="1.5"/>
  <ellipse cx="250" cy="330" rx="110" ry="76" fill="none" stroke="#3a5f83" stroke-width="1.5"/>
  <ellipse cx="250" cy="330" rx="76" ry="51" fill="none" stroke="#48729c" stroke-width="1.5"/>
  <ellipse cx="250" cy="330" rx="44" ry="29" fill="none" stroke="#58a6ff" stroke-width="1.5"/>
  <ellipse cx="250" cy="330" rx="14" ry="9" fill="#58a6ff" opacity="0.25"/>
  <text x="250" y="334" text-anchor="middle" fill="#58a6ff" font-size="10">L 最小</text>

  <!-- 下降路径：随机初始化 -> 逐步收敛 -->
  <path d="M 415 158 C 385 190, 345 215, 322 240" fill="none" stroke="#3fb950" stroke-width="2" marker-end="url(#arrGreen)"/>
  <path d="M 322 240 C 305 262, 292 282, 284 300" fill="none" stroke="#3fb950" stroke-width="2" marker-end="url(#arrGreen)"/>
  <path d="M 284 300 C 276 312, 268 318, 261 323" fill="none" stroke="#3fb950" stroke-width="2" marker-end="url(#arrGreen)"/>

  <circle cx="415" cy="158" r="5" fill="#f85149"/>
  <text x="415" y="144" text-anchor="middle" fill="#f85149" font-size="10">随机初始化 (w₀, b₀)</text>
  <circle cx="322" cy="240" r="4" fill="#3fb950"/>
  <circle cx="284" cy="300" r="4" fill="#3fb950"/>
  <circle cx="261" cy="323" r="4" fill="#3fb950"/>

  <!-- 负梯度方向标注 -->
  <path d="M 348 205 C 340 214, 333 221, 328 228" fill="none" stroke="#a371f7" stroke-width="1.5" marker-end="url(#arrPurple)"/>
  <text x="352" y="216" fill="#a371f7" font-size="10">-∂L/∂w, -∂L/∂b</text>

  <!-- 坐标轴 -->
  <line x1="60" y1="470" x2="440" y2="470" stroke="#8b949e" stroke-width="1" marker-end="url(#arrGray)"/>
  <line x1="60" y1="470" x2="60" y2="140" stroke="#8b949e" stroke-width="1" marker-end="url(#arrGray)"/>
  <text x="444" y="486" fill="#8b949e" font-size="11">w</text>
  <text x="44" y="146" fill="#8b949e" font-size="11">b</text>

  <!-- 图注 -->
  <rect x="30" y="524" width="440" height="130" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="46" y="548" fill="#3fb950" font-size="11">● 每一步：w ← w − η·∂L/∂w，b ← b − η·∂L/∂b</text>
  <text x="46" y="570" fill="#8b949e" font-size="10">η 是学习率，控制每步走多远；步长太大可能越过谷底来回震荡</text>
  <text x="46" y="592" fill="#8b949e" font-size="10">∂L/∂w 是损失对参数的偏导：参数动一点，损失变多少</text>
  <text x="46" y="614" fill="#8b949e" font-size="10">训练循环 = 前向算损失 → 反向算梯度 → 更新参数，重复几千次</text>
  <text x="46" y="636" fill="#8b949e" font-size="10">真实模型参数有上亿个，这个二维图只是示意</text>

  <!-- ============ 右：两层网络的前向与反向 ============ -->
  <rect x="500" y="80" width="450" height="430" rx="6" fill="url(#panelR)" filter="url(#glow)"/>
  <text x="725" y="104" text-anchor="middle" fill="#a371f7" font-size="13" font-weight="bold">两层网络：一次迭代的数据流</text>
  <text x="725" y="121" text-anchor="middle" fill="#8b949e" font-size="10">蓝线前向算输出，红线反向把损失的责任分摊回每个参数</text>

  <!-- 前向连线（蓝） -->
  <g stroke="#58a6ff" stroke-width="1" opacity="0.65">
    <line x1="580" y1="235" x2="694" y2="185"/><line x1="580" y1="235" x2="694" y2="265"/><line x1="580" y1="235" x2="694" y2="345"/><line x1="580" y1="235" x2="694" y2="425"/>
    <line x1="580" y1="375" x2="694" y2="185"/><line x1="580" y1="375" x2="694" y2="265"/><line x1="580" y1="375" x2="694" y2="345"/><line x1="580" y1="375" x2="694" y2="425"/>
    <line x1="726" y1="185" x2="854" y2="300"/><line x1="726" y1="265" x2="854" y2="302"/><line x1="726" y1="345" x2="854" y2="308"/><line x1="726" y1="425" x2="854" y2="310"/>
  </g>

  <!-- 反向箭头（红） -->
  <path d="M 858 318 C 830 330, 790 338, 730 344" fill="none" stroke="#f85149" stroke-width="2" marker-end="url(#arrRed)"/>
  <path d="M 700 262 C 672 258, 636 252, 584 242" fill="none" stroke="#f85149" stroke-width="2" marker-end="url(#arrRed)"/>

  <!-- 输入节点 -->
  <circle cx="560" cy="235" r="20" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="560" y="240" text-anchor="middle" fill="#c9d1d9" font-size="11">x₁</text>
  <circle cx="560" cy="375" r="20" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="560" y="380" text-anchor="middle" fill="#c9d1d9" font-size="11">x₂</text>
  <text x="560" y="200" text-anchor="middle" fill="#8b949e" font-size="10">输入</text>

  <!-- 隐层节点 -->
  <g fill="#0d1117" stroke="#a371f7" stroke-width="1.5">
    <circle cx="710" cy="185" r="18"/><circle cx="710" cy="265" r="18"/><circle cx="710" cy="345" r="18"/><circle cx="710" cy="425" r="18"/>
  </g>
  <text x="710" y="190" text-anchor="middle" fill="#c9d1d9" font-size="10">σ</text>
  <text x="710" y="270" text-anchor="middle" fill="#c9d1d9" font-size="10">σ</text>
  <text x="710" y="350" text-anchor="middle" fill="#c9d1d9" font-size="10">σ</text>
  <text x="710" y="430" text-anchor="middle" fill="#c9d1d9" font-size="10">σ</text>
  <text x="710" y="152" text-anchor="middle" fill="#8b949e" font-size="10">隐层（W1, b1）</text>

  <!-- 输出节点 -->
  <circle cx="875" cy="305" r="20" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
  <text x="875" y="310" text-anchor="middle" fill="#c9d1d9" font-size="11">ŷ</text>
  <text x="875" y="270" text-anchor="middle" fill="#8b949e" font-size="10">输出（W2, b2）</text>

  <!-- 损失 -->
  <path d="M 895 305 L 918 305" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrGray)"/>
  <text x="925" y="300" fill="#f85149" font-size="11">L</text>
  <text x="925" y="316" fill="#8b949e" font-size="9">(ŷ−y)²</text>

  <!-- 反向记账标注 -->
  <text x="770" y="380" fill="#f85149" font-size="10">dz2 = 2(ŷ−y)·σ′，dW2 = a1ᵀ·dz2</text>
  <text x="600" y="460" fill="#f85149" font-size="10">dz1 = (dz2·W2ᵀ)·σ′，dW1 = xᵀ·dz1</text>
  <text x="560" y="490" fill="#8b949e" font-size="10">链式法则：每过一层，把误差项乘上该层的局部导数</text>

  <!-- 底部图注 -->
  <rect x="500" y="524" width="450" height="130" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="516" y="548" fill="#58a6ff" font-size="11">前向：z1 = x·W1 + b1，a1 = σ(z1)，z2 = a1·W2 + b2，ŷ = σ(z2)</text>
  <text x="516" y="570" fill="#f85149" font-size="11">反向：从 L 出发，按链式法则逐层求 dW2、db2、dW1、db1</text>
  <text x="516" y="592" fill="#8b949e" font-size="10">反向传播不是另一种算法，是同一次链式求导按从后往前的顺序记账</text>
  <text x="516" y="614" fill="#8b949e" font-size="10">中间结果 a1、z1 在前向时保存，反向直接取用，避免重复计算</text>
  <text x="516" y="636" fill="#8b949e" font-size="10">对应正文 numpy 代码中 forward / backward 两段</text>
</svg>
