<svg xmlns="http://www.w3.org/2000/svg" width="1090" height="360" viewBox="0 0 1090 360" role="img" aria-labelledby="title"><title id="title">Suspense 挂起与恢复链路（2021-07-22 master，c76e4dbb）</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#182230}.t{font-size:14px;font-weight:700}.s{font-size:12px;font-weight:700;fill:#475569}.l{font-size:12px;fill:#334155}.n{font-size:11px;fill:#64748b}.b1{fill:#ffffff;stroke:#94a3b8}.b2{fill:#eef2ff;stroke:#818cf8}.b3{fill:#ecfdf5;stroke:#34d399}</style><rect width="1090" height="360" rx="18" fill="#f8fafc"/><text x="40" y="30" class="t">Suspense 挂起与恢复链路（2021-07-22 master，c76e4dbb）</text><text x="40" y="56" class="s">挂起：throw 到 fallback 上屏</text><g><rect x="40" y="66" width="180" height="58" rx="8" class="b1"/><text x="130" y="90" class="l" text-anchor="middle">组件 render 中</text><text x="130" y="108" class="l" text-anchor="middle">throw wakeable</text><rect x="250" y="66" width="180" height="58" rx="8" class="b1"/><text x="340" y="90" class="l" text-anchor="middle">throwException</text><text x="340" y="108" class="n" text-anchor="middle">向上找 Suspense 边界</text><rect x="460" y="66" width="180" height="58" rx="8" class="b1"/><text x="550" y="90" class="l" text-anchor="middle">边界标 ShouldCapture</text><text x="550" y="108" class="n" text-anchor="middle">attachPingListener（pingCache）</text><rect x="670" y="66" width="180" height="58" rx="8" class="b1"/><text x="760" y="90" class="l" text-anchor="middle">unwind 转 DidCapture</text><text x="760" y="108" class="n" text-anchor="middle">第二遍渲染 fallback</text><rect x="880" y="66" width="180" height="58" rx="8" class="b1"/><text x="970" y="90" class="l" text-anchor="middle">markRootSuspended</text><text x="970" y="108" class="n" text-anchor="middle">lanes 进 suspendedLanes</text><line x1="220" y1="95" x2="246" y2="95" stroke="#94a3b8" stroke-width="2"/><path d="M246 95 L236 90 L236 100 Z" fill="#94a3b8"/><line x1="430" y1="95" x2="456" y2="95" stroke="#94a3b8" stroke-width="2"/><path d="M456 95 L446 90 L446 100 Z" fill="#94a3b8"/><line x1="640" y1="95" x2="666" y2="95" stroke="#94a3b8" stroke-width="2"/><path d="M666 95 L656 90 L656 100 Z" fill="#94a3b8"/><line x1="850" y1="95" x2="876" y2="95" stroke="#94a3b8" stroke-width="2"/><path d="M876 95 L866 90 L866 100 Z" fill="#94a3b8"/></g><text x="40" y="216" class="s">恢复：promise 兑现到重新渲染</text><g><rect x="130" y="226" width="180" height="58" rx="8" class="b2"/><text x="220" y="250" class="l" text-anchor="middle">wakeable resolve</text><text x="220" y="268" class="n" text-anchor="middle">then 回调触发</text><rect x="345" y="226" width="180" height="58" rx="8" class="b2"/><text x="435" y="250" class="l" text-anchor="middle">ping / retry 回调</text><text x="435" y="268" class="n" text-anchor="middle">retryCache 按 wakeable 去重</text><rect x="560" y="226" width="180" height="58" rx="8" class="b2"/><text x="650" y="250" class="l" text-anchor="middle">retryTimedOutBoundary</text><text x="650" y="268" class="n" text-anchor="middle">claimNextRetryLane 领车道</text><rect x="775" y="226" width="180" height="58" rx="8" class="b3"/><text x="865" y="250" class="l" text-anchor="middle">getNextLanes 选中</text><text x="865" y="268" class="n" text-anchor="middle">重渲染边界，显示内容</text><line x1="310" y1="255" x2="341" y2="255" stroke="#818cf8" stroke-width="2"/><path d="M341 255 L331 250 L331 260 Z" fill="#818cf8"/><line x1="525" y1="255" x2="556" y2="255" stroke="#818cf8" stroke-width="2"/><path d="M556 255 L546 250 L546 260 Z" fill="#818cf8"/><line x1="740" y1="255" x2="771" y2="255" stroke="#818cf8" stroke-width="2"/><path d="M771 255 L761 250 L761 260 Z" fill="#818cf8"/></g><path d="M550 124 C 550 175, 480 190, 448 222" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="5 4"/><path d="M448 222 L444 210 L455 214 Z" fill="#818cf8"/><text x="585" y="180" class="n">渲染期挂的 ping 与 commit 后挂的 retry 在兑现时汇合</text><text x="40" y="330" class="n">挂起时 attachPingListener 在渲染中注册 ping（pingCache 按 wakeable + lanes 去重）；fallback 提交时 attachSuspenseRetryListeners 注册 retry（retryCache 按 wakeable 去重）</text></svg>
