<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 720" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrBlu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrGrn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrAmb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ca8a04"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="1040" height="720" rx="8" fill="#f8fafc"/>
  <text x="28" y="34" font-size="16" font-weight="600" fill="#1f2937">三种分布式调度架构的协调方式对照</text>
  <text x="28" y="55" font-size="12" fill="#64748b">Quartz 用 DB 行锁选执行节点；XXL-JOB 用调度中心派发；ElasticJob 用 ZK 选主并分配分片</text>

  <!-- 三列分栏标题 -->
  <rect x="24" y="76" width="330" height="26" rx="4" fill="#eef2ff" stroke="#475569" stroke-width="0.8"/>
  <text x="189" y="94" font-size="13" font-weight="600" fill="#1f2937" text-anchor="middle">Quartz 集群模式</text>

  <rect x="362" y="76" width="330" height="26" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="0.8"/>
  <text x="527" y="94" font-size="13" font-weight="600" fill="#1f2937" text-anchor="middle">XXL-JOB 中心化架构</text>

  <rect x="700" y="76" width="316" height="26" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="0.8"/>
  <text x="858" y="94" font-size="13" font-weight="600" fill="#1f2937" text-anchor="middle">ElasticJob 去中心化架构</text>

  <!-- ============ 列1：Quartz ============ -->
  <!-- 三个调度节点 -->
  <rect x="44" y="120" width="130" height="34" rx="4" fill="#ffffff" stroke="#475569" stroke-width="1"/>
  <text x="109" y="141" font-size="11" fill="#1f2937" text-anchor="middle">调度节点 A</text>
  <rect x="44" y="162" width="130" height="34" rx="4" fill="#ffffff" stroke="#475569" stroke-width="1"/>
  <text x="109" y="183" font-size="11" fill="#1f2937" text-anchor="middle">调度节点 B</text>
  <rect x="44" y="204" width="130" height="34" rx="4" fill="#ffffff" stroke="#475569" stroke-width="1"/>
  <text x="109" y="225" font-size="11" fill="#1f2937" text-anchor="middle">调度节点 C</text>

  <!-- 竞争 DB 行锁 -->
  <line x1="174" y1="137" x2="238" y2="262" stroke="#475569" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="174" y1="179" x2="238" y2="266" stroke="#475569" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="174" y1="221" x2="238" y2="270" stroke="#475569" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="184" y="158" font-size="10" fill="#64748b">竞争行锁</text>

  <!-- DB -->
  <rect x="200" y="250" width="150" height="76" rx="5" fill="#fef3c7" stroke="#ca8a04" stroke-width="1.2"/>
  <text x="275" y="272" font-size="11" font-weight="600" fill="#92400e" text-anchor="middle">共享数据库</text>
  <text x="275" y="290" font-size="10" fill="#475569" text-anchor="middle">QRTZ_LOCKS 表</text>
  <text x="275" y="306" font-size="9" fill="#64748b" text-anchor="middle">TRIGGER_ACCESS</text>
  <text x="275" y="320" font-size="9" fill="#64748b" text-anchor="middle">STATE_ACCESS（行锁）</text>

  <!-- 只有 A 拿到锁执行 -->
  <rect x="44" y="348" width="306" height="24" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="197" y="365" font-size="10" fill="#15803d" text-anchor="middle">同一 trigger 行锁只被一个节点拿到 → 该节点执行任务</text>

  <!-- 竞争代价 -->
  <rect x="44" y="386" width="306" height="58" rx="5" fill="#fffbeb" stroke="#ca8a04" stroke-width="1"/>
  <text x="56" y="404" font-size="10" font-weight="600" fill="#92400e">代价：锁竞争随节点数线性上升</text>
  <text x="56" y="420" font-size="9" fill="#475569">· 节点增多 → 同一行锁竞争者变多，DB 压力上升</text>
  <text x="56" y="434" font-size="9" fill="#475569">· 集群规模受 DB 锁吞吐限制，通常个位数节点</text>

  <!-- 分片能力 -->
  <rect x="44" y="456" width="306" height="40" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="56" y="474" font-size="10" font-weight="600" fill="#1f2937">分片：不原生支持</text>
  <text x="56" y="488" font-size="9" fill="#64748b">防重为主；任务拆分需业务自行实现</text>

  <!-- ============ 列2：XXL-JOB ============ -->
  <!-- 调度中心集群 -->
  <rect x="382" y="120" width="130" height="34" rx="4" fill="#ffffff" stroke="#1d4ed8" stroke-width="1"/>
  <text x="447" y="141" font-size="11" fill="#1f2937" text-anchor="middle">调度中心 A</text>
  <rect x="522" y="120" width="130" height="34" rx="4" fill="#ffffff" stroke="#1d4ed8" stroke-width="1"/>
  <text x="587" y="141" font-size="11" fill="#1f2937" text-anchor="middle">调度中心 B</text>

  <!-- DB 选主 -->
  <line x1="447" y1="154" x2="517" y2="186" stroke="#1d4ed8" stroke-width="1.3" marker-end="url(#arrBlu)"/>
  <line x1="587" y1="154" x2="517" y2="186" stroke="#1d4ed8" stroke-width="1.3" marker-end="url(#arrBlu)"/>
  <rect x="450" y="186" width="134" height="44" rx="5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="517" y="205" font-size="10" font-weight="600" fill="#1d4ed8" text-anchor="middle">DB 行锁选主</text>
  <text x="517" y="221" font-size="9" fill="#64748b" text-anchor="middle">同一时刻只有一个调度节点触发</text>

  <!-- 派发给执行器 -->
  <line x1="517" y1="230" x2="447" y2="266" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrBlu)"/>
  <line x1="517" y1="230" x2="587" y2="266" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrBlu)"/>
  <text x="466" y="252" font-size="9" fill="#1d4ed8">HTTP 派发</text>

  <rect x="382" y="266" width="130" height="34" rx="4" fill="#ffffff" stroke="#475569" stroke-width="1"/>
  <text x="447" y="287" font-size="11" fill="#1f2937" text-anchor="middle">执行器 1</text>
  <rect x="522" y="266" width="130" height="34" rx="4" fill="#ffffff" stroke="#475569" stroke-width="1"/>
  <text x="587" y="287" font-size="11" fill="#1f2937" text-anchor="middle">执行器 2</text>

  <!-- 回调 -->
  <line x1="447" y1="300" x2="517" y2="328" stroke="#475569" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <line x1="587" y1="300" x2="517" y2="328" stroke="#475569" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="600" y="318" font-size="9" fill="#64748b">回调结果</text>

  <rect x="382" y="328" width="290" height="24" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="527" y="345" font-size="10" fill="#15803d" text-anchor="middle">调度中心统一决定谁跑、跑哪个分片，执行器被动接收</text>

  <!-- 代价 -->
  <rect x="382" y="386" width="290" height="58" rx="5" fill="#fffbeb" stroke="#ca8a04" stroke-width="1"/>
  <text x="394" y="404" font-size="10" font-weight="600" fill="#92400e">代价：调度中心是高可用要点</text>
  <text x="394" y="420" font-size="9" fill="#475569">· 调度中心宕机 → 全部任务停摆，执行器无自主触发</text>
  <text x="394" y="434" font-size="9" fill="#475569">· 多调度节点靠 DB 行锁去重，本身仍是中心化依赖</text>

  <!-- 分片能力 -->
  <rect x="382" y="456" width="290" height="40" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="394" y="474" font-size="10" font-weight="600" fill="#1f2937">分片：分片广播</text>
  <text x="394" y="488" font-size="9" fill="#64748b">调度中心向所有执行器广播，各拿 shardIndex/shardTotal</text>

  <!-- ============ 列3：ElasticJob ============ -->
  <!-- ZK 集群 -->
  <rect x="720" y="120" width="130" height="34" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <text x="785" y="141" font-size="11" fill="#1f2937" text-anchor="middle">ZK 节点 1</text>
  <rect x="858" y="120" width="130" height="34" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <text x="923" y="141" font-size="11" fill="#1f2937" text-anchor="middle">ZK 节点 2/3</text>

  <!-- 选主 -->
  <line x1="785" y1="154" x2="850" y2="186" stroke="#16a34a" stroke-width="1.3" marker-end="url(#arrGrn)"/>
  <line x1="923" y1="154" x2="850" y2="186" stroke="#16a34a" stroke-width="1.3" marker-end="url(#arrGrn)"/>
  <rect x="786" y="186" width="128" height="44" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
  <text x="850" y="205" font-size="10" font-weight="600" fill="#15803d" text-anchor="middle">ZK 临时节点选主</text>
  <text x="850" y="221" font-size="9" fill="#64748b" text-anchor="middle">选出一个主实例</text>

  <!-- 主节点分片 -->
  <line x1="850" y1="230" x2="785" y2="266" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrGrn)"/>
  <line x1="850" y1="230" x2="923" y2="266" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrGrn)"/>
  <text x="760" y="252" font-size="9" fill="#16a34a">分片分配</text>

  <rect x="720" y="266" width="130" height="34" rx="4" fill="#ffffff" stroke="#475569" stroke-width="1"/>
  <text x="785" y="283" font-size="10" fill="#1f2937" text-anchor="middle">实例 1（主）</text>
  <text x="785" y="296" font-size="9" fill="#64748b" text-anchor="middle">分片 0,2</text>
  <rect x="858" y="266" width="130" height="34" rx="4" fill="#ffffff" stroke="#475569" stroke-width="1"/>
  <text x="923" y="283" font-size="10" fill="#1f2937" text-anchor="middle">实例 2</text>
  <text x="923" y="296" font-size="9" fill="#64748b" text-anchor="middle">分片 1,3</text>

  <!-- failover -->
  <line x1="923" y1="300" x2="785" y2="328" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrRed)"/>
  <text x="820" y="318" font-size="9" fill="#dc2626">failover 重分配</text>

  <rect x="720" y="328" width="280" height="24" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="860" y="345" font-size="10" fill="#15803d" text-anchor="middle">主节点定分片，各实例自跑分片；宕机由 ZK 会话失效触发转移</text>

  <!-- 代价 -->
  <rect x="720" y="386" width="280" height="58" rx="5" fill="#fffbeb" stroke="#ca8a04" stroke-width="1"/>
  <text x="732" y="404" font-size="10" font-weight="600" fill="#92400e">代价：依赖 ZK，运维与一致性复杂</text>
  <text x="732" y="420" font-size="9" fill="#475569">· ZK 会话超时 → 实例被判定离线，分片重分配</text>
  <text x="732" y="434" font-size="9" fill="#475569">· 选主抖动 / 分片调整窗口期内任务可能重复或漏跑</text>

  <!-- 分片能力 -->
  <rect x="720" y="456" width="280" height="40" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="732" y="474" font-size="10" font-weight="600" fill="#1f2937">分片：原生支持 + failover</text>
  <text x="732" y="488" font-size="9" fill="#64748b">主节点按分片项分配，实例宕机自动转移其分片</text>

  <!-- ============ 底部小结 ============ -->
  <rect x="24" y="516" width="992" height="180" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="538" font-size="12" font-weight="600" fill="#1f2937">三种架构的协调点与代价对照</text>

  <text x="40" y="562" font-size="10" font-weight="600" fill="#92400e">Quartz</text>
  <text x="100" y="562" font-size="10" fill="#475569">协调点 = 共享 DB 行锁（QRTZ_LOCKS）。防重靠锁，不分片。节点增多锁竞争加剧，规模受限。</text>

  <text x="40" y="588" font-size="10" font-weight="600" fill="#1d4ed8">XXL-JOB</text>
  <text x="100" y="588" font-size="10" fill="#475569">协调点 = 调度中心（自身靠 DB 行锁去重多实例）。执行器被动接收，调度中心是高可用要点。</text>

  <text x="40" y="614" font-size="10" font-weight="600" fill="#15803d">ElasticJob</text>
  <text x="100" y="614" font-size="10" fill="#475569">协调点 = ZK 集群（选主 + 分片项分配 + 会话失效转移）。去中心化，但引入 ZK 运维与一致性复杂度。</text>

  <line x1="40" y1="634" x2="1000" y2="634" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="654" font-size="10" font-weight="600" fill="#1f2937">共同边界</text>
  <text x="40" y="672" font-size="9" fill="#475569">· 三者都不保证恰好一次：时钟偏差、重复触发、failover 重跑都可能导致任务被执行多次，任务本身必须幂等（见本系列第 11 篇）。</text>
  <text x="40" y="686" font-size="9" fill="#475569">· misfire（错过执行）策略需在业务层确认：补跑还是放弃，取决于任务对时效与重复的容忍度。</text>
</svg>
