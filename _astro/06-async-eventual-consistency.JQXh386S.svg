<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="780" height="560" rx="8" fill="#f8fafc"/>
  <text x="30" y="34" font-size="16" font-weight="600" fill="#1f2937">同步链路 vs 关键路径 + Kafka 异步链路：上传完成之后的对照</text>

  <!-- 左：改造前 -->
  <rect x="30" y="55" width="340" height="300" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="200" y="82" font-size="14" font-weight="600" fill="#1f2937" text-anchor="middle">改造前：全同步链路</text>
  <text x="200" y="100" font-size="11" fill="#64748b" text-anchor="middle">（非关键路径全挂在请求线程上）</text>

  <rect x="55" y="115" width="130" height="26" rx="4" fill="#e2e8f0" stroke="#475569" stroke-width="1"/>
  <text x="120" y="132" font-size="11" fill="#334155" text-anchor="middle">客户端请求</text>
  <line x1="120" y1="141" x2="120" y2="152" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="55" y="154" width="130" height="26" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="120" y="171" font-size="11" fill="#1d4ed8" text-anchor="middle">写文件元数据</text>
  <text x="195" y="171" font-size="10.5" fill="#2563eb">关键路径</text>
  <line x1="120" y1="180" x2="120" y2="191" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="55" y="193" width="130" height="26" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="120" y="210" font-size="11" fill="#b91c1c" text-anchor="middle">同步通知 PC 端</text>
  <text x="195" y="210" font-size="10.5" fill="#b91c1c">非关键，越接越长</text>
  <line x1="120" y1="219" x2="120" y2="230" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="55" y="232" width="130" height="26" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="120" y="249" font-size="11" fill="#b91c1c" text-anchor="middle">同步通知移动/Web 端</text>
  <text x="195" y="249" font-size="10.5" fill="#b91c1c">一环抖动，接口跟着抖</text>
  <line x1="120" y1="258" x2="120" y2="269" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="55" y="271" width="130" height="26" rx="4" fill="#e2e8f0" stroke="#475569" stroke-width="1"/>
  <text x="120" y="288" font-size="11" fill="#334155" text-anchor="middle">返回响应</text>

  <text x="55" y="318" font-size="11" fill="#b91c1c">RT = 全链之和；任一环节失败 = 接口失败</text>
  <text x="55" y="338" font-size="10.5" fill="#64748b">注：热点上报是独立接口（同步写库），不在上传链路内</text>

  <!-- 右：改造后 -->
  <rect x="410" y="55" width="340" height="300" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="580" y="82" font-size="14" font-weight="600" fill="#1f2937" text-anchor="middle">改造后：关键路径 + 异步链路</text>
  <text x="580" y="100" font-size="11" fill="#64748b" text-anchor="middle">（接口只保关键路径，其余走 Kafka 最终一致）</text>

  <rect x="430" y="115" width="120" height="26" rx="4" fill="#e2e8f0" stroke="#475569" stroke-width="1"/>
  <text x="490" y="132" font-size="11" fill="#334155" text-anchor="middle">客户端请求</text>
  <line x1="490" y1="141" x2="490" y2="152" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="430" y="154" width="120" height="26" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="490" y="171" font-size="11" fill="#1d4ed8" text-anchor="middle">写文件元数据</text>
  <line x1="490" y1="180" x2="490" y2="191" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="430" y="193" width="120" height="26" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="490" y="210" font-size="11" fill="#1d4ed8" text-anchor="middle">投递消息 + 返回</text>
  <text x="430" y="239" font-size="10.5" fill="#15803d">关键路径到此结束，RT 与非关键环节脱钩</text>

  <line x1="550" y1="206" x2="592" y2="206" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrBlue)"/>

  <rect x="594" y="186" width="76" height="40" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="632" y="203" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">Kafka</text>
  <text x="632" y="218" font-size="10" fill="#b45309" text-anchor="middle">削峰缓冲</text>

  <line x1="632" y1="226" x2="632" y2="248" stroke="#d97706" stroke-width="1.4" marker-end="url(#arrAmber)"/>

  <rect x="560" y="250" width="180" height="26" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
  <text x="650" y="267" font-size="11" fill="#b45309" text-anchor="middle">消费者：热点数据分钟级入库</text>
  <rect x="560" y="284" width="180" height="26" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
  <text x="650" y="301" font-size="11" fill="#b45309" text-anchor="middle">消费者：多端同步通知</text>
  <rect x="560" y="318" width="180" height="26" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="650" y="335" font-size="11" fill="#b45309" text-anchor="middle">新订阅方直接挂载（解耦）</text>

  <text x="430" y="290" font-size="10.5" fill="#475569">消费失败：重试 N 次</text>
  <text x="430" y="308" font-size="10.5" fill="#475569">重复消费：幂等去重</text>
  <text x="430" y="326" font-size="10.5" fill="#475569">兜底：定时对账补偿</text>

  <!-- 底：要点 -->
  <rect x="30" y="378" width="720" height="160" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="50" y="403" font-size="13" font-weight="600" fill="#475569">要点</text>
  <text x="50" y="427" font-size="12" fill="#475569">· MQ 的三个收益：削峰（洪峰堆积在队列而非数据库）、异步（接口只保关键路径）、解耦（生产方不感知订阅方增减）；</text>
  <text x="50" y="449" font-size="12" fill="#475569">· 对应的三个代价：有延迟、可能乱序、可能丢消息或重复投递——只适合「能容忍短暂不一致」的操作；</text>
  <text x="50" y="471" font-size="12" fill="#475569">· 最终一致四件套：本地状态标记 + 消息重试 + 消费幂等 + 定时对账，用工程手段代替分布式事务；</text>
  <text x="50" y="493" font-size="12" fill="#475569">· 接口语义从「全部做完才返回」变为「关键路径成功即返回，其余稍后一致」，需与产品对齐这个承诺；</text>
  <text x="50" y="515" font-size="12" fill="#475569">· 消费侧务必幂等：Kafka 0.8/0.9 只保证至少投递一次，重复消息由业务唯一键挡掉。</text>
</svg>
