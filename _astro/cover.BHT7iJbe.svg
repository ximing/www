    <g stroke="#059669" stroke-width="8" stroke-linecap="round" opacity="0.85">
      <line x1="205" y1="380" x2="330" y2="380"/>
      <line x1="205" y1="412" x2="370" y2="412"/>
      <line x1="205" y1="444" x2="300" y2="444"/>
    </g>
  </g>

  <!-- agent loop arrows -->
  <g stroke="#ffffff" stroke-width="6" fill="none" opacity="0.95">
    <path d="M 448 362 C 512 326, 688 326, 752 362" marker-end="url(#arrow)"/>
    <path d="M 752 428 C 688 464, 512 464, 448 428" marker-end="url(#arrow)"/>
  </g>
  <circle cx="600" cy="395" r="30" fill="#ffffff"/>
  <path d="M 588 384 a 16 16 0 1 1 -4 14" stroke="#0f766e" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M 584 392 l -2 14 l 14 -4" stroke="#0f766e" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- target file card: React -->
  <g>
    <rect x="790" y="300" width="240" height="190" rx="16" fill="#eff6ff"/>
    <rect x="790" y="300" width="240" height="40" rx="16" fill="#bfdbfe"/>
    <rect x="790" y="322" width="240" height="18" fill="#bfdbfe"/>
    <text x="910" y="328" fill="#1d4ed8" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="3">REACT</text>
    <g fill="none" stroke="#3b82f6" stroke-width="7" opacity="0.9">
      <ellipse cx="910" cy="415" rx="62" ry="24"/>
      <ellipse cx="910" cy="415" rx="62" ry="24" transform="rotate(60 910 415)"/>
      <ellipse cx="910" cy="415" rx="62" ry="24" transform="rotate(120 910 415)"/>
    </g>
    <circle cx="910" cy="415" r="11" fill="#1d4ed8"/>
  </g>

  <!-- title -->
  <text x="600" y="732" fill="#ffffff" font-family="Georgia, 'Songti SC', 'Noto Serif SC', serif" font-size="60" font-weight="700" text-anchor="middle" letter-spacing="2">v2r-agent</text>
  <text x="600" y="792" fill="#a5f3fc" font-family="'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="21" text-anchor="middle" letter-spacing="4">Vue 2 → React 自动迁移</text>
