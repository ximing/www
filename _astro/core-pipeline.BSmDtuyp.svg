<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" role="img" aria-labelledby="title"><title id="title">按键到 DOM 的全链路：Mod-B 走主动路径，输入删除走被动读回路径，两条路径在 dispatchTransaction 汇合</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#182230}.t{font-size:14px;font-weight:700}.h{font-size:13px;font-weight:700}.b{font-size:12px;fill:#334155}.n{font-size:12px;fill:#526176}.o{font-size:11px;fill:#0891b2;font-weight:700}</style><rect width="940" height="560" rx="18" fill="#f8fafc"/><text x="40" y="34" class="t">按键到 DOM 的全链路：主动路径直接造 transaction，被动路径先改 DOM 再读回</text><g><rect x="40" y="56" width="260" height="64" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="56" y="80" class="h">1. 按键 keydown</text><text x="56" y="98" class="n">浏览器派发，目标是 view.dom</text></g><line x1="300" y1="88" x2="338" y2="88" stroke="#94a3b8" stroke-width="2"/><path d="M338 88 L328 83 L328 93 Z" fill="#94a3b8"/><g><rect x="340" y="56" width="260" height="64" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="356" y="78" class="h">2. 事件管线 input.ts</text><text x="356" y="95" class="b">editHandlers.keydown → handleKeyDown</text><text x="356" y="110" class="n">someProp 先查直接 props（第 29 篇）</text></g><line x1="600" y1="88" x2="638" y2="88" stroke="#94a3b8" stroke-width="2"/><path d="M638 88 L628 83 L628 93 Z" fill="#94a3b8"/><g><rect x="640" y="56" width="260" height="64" rx="8" fill="#e0f2fe" stroke="#0891b2" stroke-width="1.5"/><text x="656" y="78" class="h">3. 构造 Transaction</text><text x="656" y="95" class="b">state.tr.addMark(from, to, bold)</text><text x="656" y="110" class="n">Transform 攒 step（第 18、21 篇）</text></g><line x1="770" y1="120" x2="770" y2="148" stroke="#94a3b8" stroke-width="2"/><path d="M770 148 L765 138 L775 138 Z" fill="#94a3b8"/><g><rect x="640" y="150" width="260" height="64" rx="8" fill="#e0f2fe" stroke="#0891b2" stroke-width="1.5"/><text x="656" y="172" class="h">4. 应用出新 state</text><text x="656" y="189" class="b">dispatchTransaction → state.apply(tr)</text><text x="656" y="204" class="n">不可变替换（第 19、25 篇）</text></g><line x1="640" y1="182" x2="602" y2="182" stroke="#94a3b8" stroke-width="2"/><path d="M602 182 L612 177 L612 187 Z" fill="#94a3b8"/><g><rect x="340" y="150" width="260" height="64" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="356" y="172" class="h">5. ViewDesc 增量更新</text><text x="356" y="189" class="b">matchesNode 复用 · dirty 子树重绘</text><text x="356" y="204" class="n">只动变化的段落（第 26、27 篇）</text></g><line x1="340" y1="182" x2="302" y2="182" stroke="#94a3b8" stroke-width="2"/><path d="M302 182 L312 177 L312 187 Z" fill="#94a3b8"/><g><rect x="40" y="150" width="260" height="64" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="56" y="172" class="h">6. DOM 补丁与选区回写</text><text x="56" y="189" class="b">contentDOM 打上 strong 标签</text><text x="56" y="204" class="n">selectionToDOM 对齐光标（第 30 篇）</text></g><text x="40" y="258" class="o">被动路径：编辑器没拦截时，浏览器先动手</text><g><rect x="40" y="280" width="260" height="64" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/><text x="56" y="302" class="h">浏览器默认行为改 DOM</text><text x="56" y="319" class="b">打字 · 删除</text><text x="56" y="334" class="n">handleKeyDown 返回 false 时发生</text></g><line x1="300" y1="312" x2="338" y2="312" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/><path d="M338 312 L328 307 L328 317 Z" fill="#94a3b8"/><g><rect x="340" y="280" width="260" height="64" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/><text x="356" y="302" class="h">DOMObserver 收变更</text><text x="356" y="319" class="b">MutationObserver flush 时机</text><text x="356" y="334" class="n">composition 期间抑制（第 31 篇）</text></g><line x1="600" y1="312" x2="638" y2="312" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/><path d="M638 312 L628 307 L628 317 Z" fill="#94a3b8"/><g><rect x="640" y="280" width="260" height="64" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/><text x="656" y="302" class="h">readDOMChange 读回</text><text x="656" y="319" class="b">findDiffStart/End 对齐（第 11 篇）</text><text x="656" y="334" class="n">解析成 Slice 再生成 tr（第 28 篇）</text></g><line x1="770" y1="280" x2="770" y2="216" stroke="#0891b2" stroke-width="2" stroke-dasharray="5 4"/><path d="M770 216 L765 226 L775 226 Z" fill="#0891b2"/><text x="468" y="252" class="o">生成的 transaction 汇入同一条 dispatch</text><text x="40" y="396" class="o">两条路径的分工</text><text x="40" y="420" class="n">主动路径（实线）：handleKeyDown 拦下按键，命令直接构造 transaction，DOM 是输出。</text><text x="40" y="440" class="n">被动路径（虚线）：浏览器先改 DOM，DOMObserver 读回对齐成 transaction，DOM 是输入。</text><text x="40" y="460" class="n">两条路径在 dispatchTransaction 汇合，之后共用 state → ViewDesc → DOM 这一段。</text><text x="40" y="504" class="o">本篇的最小编辑器：输入、删除走被动路径，Mod-B 与 Enter 走主动路径</text></svg>
