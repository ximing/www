<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="55%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.7">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="102" height="102" patternUnits="userSpaceOnUse">
      <circle cx="51" cy="51" r="2.5" fill="#ffffff"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>
  <rect width="1200" height="900" fill="url(#dots)" opacity="0.08"/>

  <!-- particles -->
  <g fill="#ffffff">
    <circle cx="300" cy="170" r="4" opacity="0.5"/>
    <circle cx="920" cy="150" r="4" opacity="0.5"/>
    <circle cx="890" cy="560" r="3.5" opacity="0.4"/>
    <circle cx="290" cy="540" r="3.5" opacity="0.4"/>
    <circle cx="980" cy="380" r="3" opacity="0.35"/>
    <circle cx="220" cy="350" r="3" opacity="0.35"/>
    <circle cx="480" cy="120" r="3" opacity="0.3"/>
    <circle cx="760" cy="610" r="3" opacity="0.3"/>
  </g>

  <!-- react atom diagram -->
  <g transform="translate(600,380)" fill="none" stroke="#61dafb" stroke-width="7">
    <ellipse rx="220" ry="84" opacity="0.95"/>
    <ellipse rx="220" ry="84" transform="rotate(60)" opacity="0.7"/>
    <ellipse rx="220" ry="84" transform="rotate(120)" opacity="0.7"/>
  </g>
  <circle cx="600" cy="380" r="38" fill="#e0e7ff"/>
  <circle cx="600" cy="380" r="23" fill="#4f46e5"/>

  <!-- pixi sprite sparks on the rings -->
  <g fill="#fbbf24">
    <circle cx="790" cy="342" r="11"/>
    <circle cx="424" cy="306" r="9"/>
    <circle cx="468" cy="506" r="9"/>
  </g>

  <!-- mono footnote above title -->
  <text x="600" y="620" fill="#a5b4fc" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="16" text-anchor="middle" letter-spacing="3" opacity="0.9">&lt;Stage&gt; · &lt;Sprite /&gt; · react-reconciler</text>

  <!-- title -->
  <text x="600" y="732" fill="#ffffff" font-family="Georgia, 'Songti SC', 'Noto Serif SC', serif" font-size="60" font-weight="700" text-anchor="middle" letter-spacing="2">@pixi/react</text>
  <text x="600" y="792" fill="#c7d2fe" font-family="'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="21" text-anchor="middle" letter-spacing="4">PixiJS 官方 React 渲染器</text>
</svg>
