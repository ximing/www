<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="55%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.35" cy="0.4" r="0.75">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="600" fill="url(#bg)"/>
  <rect width="1600" height="600" fill="url(#glow)"/>

  <!-- dot grid -->
  <g fill="#ffffff" opacity="0.12">
    <circle cx="110" cy="520" r="2.5"/><circle cx="170" cy="520" r="2.5"/><circle cx="230" cy="520" r="2.5"/><circle cx="290" cy="520" r="2.5"/><circle cx="350" cy="520" r="2.5"/><circle cx="410" cy="520" r="2.5"/><circle cx="470" cy="520" r="2.5"/><circle cx="530" cy="520" r="2.5"/>
    <circle cx="110" cy="556" r="2.5"/><circle cx="170" cy="556" r="2.5"/><circle cx="230" cy="556" r="2.5"/><circle cx="290" cy="556" r="2.5"/><circle cx="350" cy="556" r="2.5"/><circle cx="410" cy="556" r="2.5"/><circle cx="470" cy="556" r="2.5"/><circle cx="530" cy="556" r="2.5"/>
  </g>

  <!-- left typography block -->
  <text x="108" y="178" fill="#bbf7d0" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="16" letter-spacing="6">BROWSER SPREADSHEET · FORMULA ENGINE</text>
  <text x="104" y="292" fill="#ffffff" font-family="Georgia, 'Songti SC', 'Noto Serif SC', serif" font-size="96" font-weight="700" letter-spacing="2">XExcel</text>
  <text x="110" y="352" fill="#dcfce7" font-family="'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="24" letter-spacing="3">State + Transaction + Plugin 架构</text>
  <path d="M 110 396 L 340 396" stroke="#bbf7d0" stroke-width="2" opacity="0.6"/>
  <text x="110" y="436" fill="#bbf7d0" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" letter-spacing="2" opacity="0.9">Konva render · xlsx / CSV interop</text>

  <!-- right spreadsheet panel -->
  <rect x="900" y="80" width="580" height="440" rx="14" fill="#f0fdf4"/>
  <!-- formula bar -->
  <rect x="900" y="80" width="580" height="52" rx="14" fill="#dcfce7"/>
  <rect x="900" y="106" width="580" height="26" fill="#dcfce7"/>
  <text x="926" y="114" fill="#15803d" font-family="Georgia, 'Songti SC', serif" font-size="22" font-style="italic" font-weight="700">fx</text>
  <text x="972" y="113" fill="#14532d" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="18">=SUM(B2:B8) * rate</text>
  <!-- column header row -->
  <rect x="900" y="132" width="580" height="40" fill="#bbf7d0"/>
  <g fill="#15803d" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" text-anchor="middle" opacity="0.85">
    <text x="972" y="158">A</text>
    <text x="1117" y="158">B</text>
    <text x="1262" y="158">C</text>
    <text x="1407" y="158">D</text>
  </g>
  <!-- grid lines -->
  <g stroke="#86efac" stroke-width="2">
    <path d="M 900 172 L 1480 172 M 900 223 L 1480 223 M 900 274 L 1480 274 M 900 325 L 1480 325 M 900 376 L 1480 376 M 900 427 L 1480 427 M 900 478 L 1480 478"/>
    <path d="M 1045 132 L 1045 520 M 1190 132 L 1190 520 M 1335 132 L 1335 520"/>
  </g>
  <!-- cell values -->
  <g fill="#166534" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" opacity="0.65">
    <text x="1060" y="207">128</text>
    <text x="1060" y="258">256</text>
    <text x="1060" y="360">512</text>
    <text x="1205" y="207">0.87</text>
    <text x="1205" y="309">0.92</text>
    <text x="1350" y="258">ok</text>
  </g>
  <!-- active cell -->
  <rect x="1045" y="223" width="145" height="51" fill="#dcfce7" opacity="0.85"/>
  <rect x="1045" y="223" width="145" height="51" fill="none" stroke="#15803d" stroke-width="4"/>
  <rect x="1180" y="264" width="10" height="10" fill="#15803d"/>

  <!-- transaction hint chip -->
  <rect x="900" y="548" width="232" height="34" rx="17" fill="none" stroke="#bbf7d0" stroke-width="2" opacity="0.85"/>
  <text x="1016" y="571" fill="#bbf7d0" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" text-anchor="middle" letter-spacing="1">tr.apply(plugin)</text>
</svg>
