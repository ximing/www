<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="system-ui, -apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#a16207"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#71717a"/>
    </marker>
  </defs>

  <text x="30" y="42" font-size="21" font-weight="650" fill="#18181b">pi-tui 行数组差分算法</text>
  <text x="30" y="68" font-size="13" fill="#52525b">比较 previousLines 与 newLines，确定连续重绘区间</text>

  <rect x="30" y="98" width="230" height="120" rx="12" fill="#f4f4f5"/>
  <text x="50" y="130" font-size="16" font-weight="600" fill="#18181b">输入</text>
  <text x="50" y="157" font-size="13" fill="#3f3f46">previousLines：上一帧</text>
  <text x="50" y="181" font-size="13" fill="#3f3f46">newLines：本帧</text>
  <text x="50" y="205" font-size="12" fill="#71717a">maxLines = max(两者长度)</text>

  <rect x="335" y="98" width="230" height="120" rx="12" fill="#f4f4f5"/>
  <text x="355" y="130" font-size="16" font-weight="600" fill="#18181b">逐行扫描</text>
  <text x="355" y="157" font-size="13" fill="#3f3f46">i = 0 到 maxLines - 1</text>
  <text x="355" y="181" font-size="13" fill="#3f3f46">越界的一侧按空字符串处理</text>
  <text x="355" y="205" font-size="12" fill="#71717a">新增和删除行无需单独算法</text>

  <rect x="640" y="98" width="230" height="120" rx="12" fill="#f4f4f5"/>
  <text x="660" y="130" font-size="16" font-weight="600" fill="#18181b">比较并记录边界</text>
  <text x="660" y="157" font-size="13" fill="#3f3f46">首次不同：firstChanged = i</text>
  <text x="660" y="181" font-size="13" fill="#3f3f46">每次不同：lastChanged = i</text>
  <text x="660" y="205" font-size="12" fill="#71717a">继续扫描，不提前结束</text>

  <line x1="263" y1="158" x2="331" y2="158" stroke="#a16207" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="568" y1="158" x2="636" y2="158" stroke="#a16207" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M 755 221 L 755 254" fill="none" stroke="#a16207" stroke-width="2" marker-end="url(#arrow)"/>
  <polygon points="755,260 865,315 755,370 645,315" fill="#fef3c7"/>
  <text x="716" y="311" font-size="15" font-weight="600" fill="#713f12">发现差异？</text>
  <text x="688" y="334" font-size="12" fill="#854d0e">firstChanged 是否为 -1</text>

  <path d="M 645 315 L 555 315" fill="none" stroke="#71717a" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <text x="588" y="302" font-size="12" fill="#52525b">否</text>
  <rect x="300" y="270" width="250" height="90" rx="12" fill="#f4f4f5"/>
  <text x="320" y="302" font-size="16" font-weight="600" fill="#18181b">不重写文本</text>
  <text x="320" y="329" font-size="13" fill="#3f3f46">仅按 CURSOR_MARKER 更新硬件光标</text>

  <path d="M 755 370 L 755 405" fill="none" stroke="#a16207" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="768" y="391" font-size="12" fill="#854d0e">是</text>
  <rect x="610" y="410" width="260" height="104" rx="12" fill="#f4f4f5"/>
  <text x="630" y="442" font-size="16" font-weight="600" fill="#18181b">提交变化区间</text>
  <text x="630" y="469" font-size="13" fill="#3f3f46">移动到 firstChanged</text>
  <text x="630" y="491" font-size="13" fill="#3f3f46">每行：清除整行，再写入 newLines[i]</text>

  <text x="30" y="410" font-size="16" font-weight="600" fill="#18181b">示例</text>
  <text x="30" y="438" font-size="13" fill="#52525b">行号</text>
  <text x="100" y="438" font-size="13" fill="#52525b">previousLines</text>
  <text x="320" y="438" font-size="13" fill="#52525b">newLines</text>
  <line x1="30" y1="450" x2="560" y2="450" stroke="#d4d4d8"/>

  <rect x="30" y="460" width="530" height="28" fill="#fafafa"/>
  <text x="48" y="480" font-size="13" fill="#3f3f46">0</text>
  <text x="100" y="480" font-size="13" fill="#3f3f46">用户：解释 diff</text>
  <text x="320" y="480" font-size="13" fill="#3f3f46">用户：解释 diff</text>

  <rect x="30" y="490" width="530" height="28" fill="#fef3c7"/>
  <text x="48" y="510" font-size="13" fill="#713f12">1</text>
  <text x="100" y="510" font-size="13" fill="#713f12">处理中 ⠋</text>
  <text x="320" y="510" font-size="13" fill="#713f12">处理中 ⠙</text>

  <rect x="30" y="520" width="530" height="28" fill="#fef3c7"/>
  <text x="48" y="540" font-size="13" fill="#713f12">2</text>
  <text x="100" y="540" font-size="13" fill="#713f12">空字符串</text>
  <text x="320" y="540" font-size="13" fill="#713f12">回答：逐行比较</text>

  <path d="M 562 504 L 600 504" fill="none" stroke="#a16207" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="30" y="580" font-size="13" fill="#52525b">第 1、2 行不同，因此 firstChanged = 1，lastChanged = 2；写回区间为 [1, 2]。</text>
</svg>
