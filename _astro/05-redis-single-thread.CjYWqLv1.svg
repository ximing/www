<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 820" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="940" height="820" rx="8" fill="#f8fafc"/>
  <text x="30" y="34" font-size="16" font-weight="600" fill="#1f2937">单线程事件循环：正常处理与慢命令阻塞对照</text>

  <!-- ============ Band 1: 正常处理 ============ -->
  <rect x="24" y="58" width="892" height="300" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="40" y="82" font-size="13" font-weight="600" fill="#16a34a">正常情况：命令依次执行，每个都很快</text>

  <!-- 客户端连接 -->
  <g font-size="11" fill="#1f2937" text-anchor="middle">
    <circle cx="80" cy="130" r="14" fill="#ffffff" stroke="#94a3b8"/><text x="80" y="134">C1</text>
    <circle cx="80" cy="170" r="14" fill="#ffffff" stroke="#94a3b8"/><text x="80" y="174">C2</text>
    <circle cx="80" cy="210" r="14" fill="#ffffff" stroke="#94a3b8"/><text x="80" y="214">C3</text>
    <circle cx="80" cy="250" r="14" fill="#ffffff" stroke="#94a3b8"/><text x="80" y="254">…</text>
    <text x="80" y="288" font-size="10" fill="#64748b">大量客户端连接</text>
  </g>

  <!-- epoll 多路复用 -->
  <rect x="170" y="110" width="170" height="170" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
  <text x="255" y="134" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle">IO 多路复用（epoll）</text>
  <text x="255" y="154" font-size="10" fill="#64748b" text-anchor="middle">单线程轮询所有连接</text>
  <text x="255" y="172" font-size="10" fill="#64748b" text-anchor="middle">的就绪事件</text>
  <text x="255" y="200" font-size="10" fill="#16a34a" text-anchor="middle">哪个连接有数据可读</text>
  <text x="255" y="216" font-size="10" fill="#16a34a" text-anchor="middle">就通知事件循环</text>
  <text x="255" y="252" font-size="10" fill="#64748b" text-anchor="middle">不阻塞等待单个连接</text>
  <g stroke="#475569" stroke-width="1.4" marker-end="url(#arr)">
    <line x1="96" y1="130" x2="168" y2="150"/>
    <line x1="96" y1="170" x2="168" y2="170"/>
    <line x1="96" y1="210" x2="168" y2="190"/>
    <line x1="96" y1="250" x2="168" y2="230"/>
  </g>

  <!-- 事件循环 -->
  <rect x="400" y="110" width="180" height="170" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="490" y="134" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle">单线程事件循环</text>
  <text x="490" y="154" font-size="10" fill="#64748b" text-anchor="middle">串行处理命令</text>
  <g font-size="10" fill="#1f2937" text-anchor="middle">
    <rect x="416" y="170" width="148" height="22" rx="4" fill="#ffffff" stroke="#16a34a"/><text x="490" y="185">CMD1 (O(1))</text>
    <rect x="416" y="196" width="148" height="22" rx="4" fill="#ffffff" stroke="#16a34a"/><text x="490" y="211">CMD2 (O(1))</text>
    <rect x="416" y="222" width="148" height="22" rx="4" fill="#ffffff" stroke="#16a34a"/><text x="490" y="237">CMD3 (O(1))</text>
    <rect x="416" y="248" width="148" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1"/><text x="490" y="263" fill="#64748b">…</text>
  </g>
  <line x1="340" y1="195" x2="398" y2="195" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- 正常 notes -->
  <rect x="640" y="110" width="260" height="170" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="656" y="134" font-size="12" font-weight="600" fill="#1f2937">特征</text>
  <text x="656" y="156" font-size="11" fill="#475569">· 每条命令 O(1)/O(log N)，微秒级完成</text>
  <text x="656" y="178" font-size="11" fill="#475569">· 命令间无锁、无上下文切换</text>
  <text x="656" y="200" font-size="11" fill="#475569">· 瓶颈在内存与网络带宽</text>
  <text x="656" y="222" font-size="11" fill="#475569">· CPU 很少是瓶颈</text>
  <text x="656" y="250" font-size="11" fill="#16a34a">· 单线程 = 无锁 = 快的前提</text>
  <line x1="580" y1="195" x2="638" y2="195" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- ============ Band 2: 慢命令阻塞 ============ -->
  <rect x="24" y="378" width="892" height="340" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="40" y="402" font-size="13" font-weight="600" fill="#dc2626">慢命令情况：一条 O(N) 命令阻塞整个实例</text>

  <!-- 客户端连接 -->
  <g font-size="11" fill="#1f2937" text-anchor="middle">
    <circle cx="80" cy="450" r="14" fill="#ffffff" stroke="#94a3b8"/><text x="80" y="454">C1</text>
    <circle cx="80" cy="490" r="14" fill="#ffffff" stroke="#94a3b8"/><text x="80" y="494">C2</text>
    <circle cx="80" cy="530" r="14" fill="#ffffff" stroke="#94a3b8"/><text x="80" y="534">C3</text>
    <circle cx="80" cy="570" r="14" fill="#ffffff" stroke="#94a3b8"/><text x="80" y="574">…</text>
    <text x="80" y="608" font-size="10" fill="#64748b">大量客户端连接</text>
  </g>

  <!-- epoll -->
  <rect x="170" y="430" width="170" height="170" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.4"/>
  <text x="255" y="454" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle">IO 多路复用（epoll）</text>
  <text x="255" y="476" font-size="10" fill="#64748b" text-anchor="middle">连接就绪事件照常</text>
  <text x="255" y="492" font-size="10" fill="#64748b" text-anchor="middle">被收集</text>
  <text x="255" y="528" font-size="10" fill="#dc2626" text-anchor="middle">但事件循环被占住</text>
  <text x="255" y="544" font-size="10" fill="#dc2626" text-anchor="middle">无法取下一批事件</text>
  <text x="255" y="580" font-size="10" fill="#64748b" text-anchor="middle">epoll 也得等</text>
  <g stroke="#475569" stroke-width="1.4" marker-end="url(#arr)">
    <line x1="96" y1="450" x2="168" y2="470"/>
    <line x1="96" y1="490" x2="168" y2="490"/>
    <line x1="96" y1="530" x2="168" y2="510"/>
    <line x1="96" y1="570" x2="168" y2="550"/>
  </g>

  <!-- 事件循环 with blocked command -->
  <rect x="400" y="430" width="180" height="170" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="490" y="454" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle">单线程事件循环</text>
  <g font-size="10" fill="#1f2937" text-anchor="middle">
    <rect x="416" y="466" width="148" height="40" rx="4" fill="#dc2626" stroke="#dc2626"/>
    <text x="490" y="481" fill="#ffffff" font-weight="600">HGETALL big_hash</text>
    <text x="490" y="497" fill="#ffffff">O(N)，N 很大</text>
    <rect x="416" y="512" width="148" height="22" rx="4" fill="#fef3c7" stroke="#ca8a04"/><text x="490" y="527" fill="#92400e">CMD2 等待中…</text>
    <rect x="416" y="538" width="148" height="22" rx="4" fill="#fef3c7" stroke="#ca8a04"/><text x="490" y="553" fill="#92400e">CMD3 等待中…</text>
    <rect x="416" y="564" width="148" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1"/><text x="490" y="579" fill="#64748b">…全部排队</text>
  </g>
  <line x1="340" y1="515" x2="398" y2="515" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arrRed)"/>

  <!-- 慢命令 notes -->
  <rect x="640" y="430" width="260" height="170" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="656" y="454" font-size="12" font-weight="600" fill="#1f2937">后果</text>
  <text x="656" y="476" font-size="11" fill="#475569">· 慢命令执行期间，整个实例不响应</text>
  <text x="656" y="498" font-size="11" fill="#475569">· 后续命令全部排队，RT 骤升</text>
  <text x="656" y="520" font-size="11" fill="#475569">· 其他连接的命令也受影响</text>
  <text x="656" y="542" font-size="11" fill="#dc2626">· 单线程无锁的代价在此</text>
  <text x="656" y="566" font-size="11" fill="#dc2626">· KEYS / 大 key HGETALL /</text>
  <text x="656" y="584" font-size="11" fill="#dc2626">  大 key DEL 都会触发</text>
  <line x1="580" y1="515" x2="638" y2="515" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- ============ Legend ============ -->
  <rect x="24" y="738" width="892" height="64" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="40" y="760" font-size="11" fill="#475569">单线程事件循环用「无锁、无上下文切换」换来高吞吐，代价是任何一条 O(N) 命令都会独占这个唯一线程。</text>
  <text x="40" y="780" font-size="11" fill="#475569">慢命令不是拖慢一个连接，而是拖慢整个实例上所有连接的命令处理。epoll 照常收集就绪事件，但事件循环取不到下一批。</text>
  <text x="40" y="798" font-size="11" fill="#9a3412">线上缓存整体变慢，相当一部分根源是某条慢命令——这是单线程模型的主要使用纪律。</text>
</svg>
