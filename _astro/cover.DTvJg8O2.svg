<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="55%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.7">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>

  <!-- dot grid -->
  <g fill="#ffffff" opacity="0.10">
    <circle cx="90" cy="72" r="2.5"/><circle cx="192" cy="72" r="2.5"/><circle cx="294" cy="72" r="2.5"/><circle cx="396" cy="72" r="2.5"/><circle cx="498" cy="72" r="2.5"/><circle cx="600" cy="72" r="2.5"/><circle cx="702" cy="72" r="2.5"/><circle cx="804" cy="72" r="2.5"/><circle cx="906" cy="72" r="2.5"/><circle cx="1008" cy="72" r="2.5"/><circle cx="1110" cy="72" r="2.5"/>
    <circle cx="90" cy="828" r="2.5"/><circle cx="192" cy="828" r="2.5"/><circle cx="294" cy="828" r="2.5"/><circle cx="396" cy="828" r="2.5"/><circle cx="498" cy="828" r="2.5"/><circle cx="600" cy="828" r="2.5"/><circle cx="702" cy="828" r="2.5"/><circle cx="804" cy="828" r="2.5"/><circle cx="906" cy="828" r="2.5"/><circle cx="1008" cy="828" r="2.5"/><circle cx="1110" cy="828" r="2.5"/>
  </g>

  <!-- compile source -->
  <text x="600" y="200" fill="#ffedd5" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="22" text-anchor="middle" opacity="0.9">a + b</text>
  <path d="M 600 216 L 600 262" stroke="#ffedd5" stroke-width="4" opacity="0.8"/>
  <path d="M 590 250 L 600 266 L 610 250" stroke="#ffedd5" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8"/>

  <!-- bytecode flow line -->
  <path d="M 140 330 L 1060 330" stroke="#ffedd5" stroke-width="4" opacity="0.55"/>
  <path d="M 1044 318 L 1064 330 L 1044 342" stroke="#ffedd5" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.85"/>

  <!-- instruction chips -->
  <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="22" font-weight="700" text-anchor="middle">
    <rect x="165" y="285" width="150" height="90" rx="14" fill="#fff7ed"/>
    <text x="240" y="341" fill="#c2410c">PUSH</text>
    <rect x="345" y="285" width="150" height="90" rx="14" fill="#ffedd5"/>
    <text x="420" y="341" fill="#c2410c">LOAD</text>
    <rect x="525" y="285" width="150" height="90" rx="14" fill="#ffffff"/>
    <text x="600" y="341" fill="#9a3412">ADD</text>
    <rect x="705" y="285" width="150" height="90" rx="14" fill="#ffedd5"/>
    <text x="780" y="341" fill="#c2410c">CALL</text>
    <rect x="885" y="285" width="150" height="90" rx="14" fill="#fff7ed"/>
    <text x="960" y="341" fill="#c2410c">RET</text>
  </g>

  <!-- hex bytes under chips -->
  <g fill="#fed7aa" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="16" text-anchor="middle" opacity="0.85">
    <text x="240" y="430">0x01</text>
    <text x="420" y="430">0x1A</text>
    <text x="600" y="430">0x2F</text>
    <text x="780" y="430">0x40</text>
    <text x="960" y="430">0xFF</text>
  </g>

  <!-- registers hint -->
  <text x="600" y="520" fill="#ffedd5" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="16" text-anchor="middle" opacity="0.85">sp: 0x1F · pc: 0x2F · acc: 0x03</text>

  <!-- title -->
  <text x="600" y="752" fill="#ffffff" font-family="Georgia, 'Songti SC', 'Noto Serif SC', serif" font-size="60" font-weight="700" text-anchor="middle" letter-spacing="2">JSVM3</text>
  <text x="600" y="808" fill="#fed7aa" font-family="'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="21" text-anchor="middle" letter-spacing="6">自定义字节码与指令集 VM</text>
</svg>
