<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img" aria-labelledby="title"><title id="title">嵌套列表的文档树结构：list_item 首子是段落，嵌套列表挂在 block* 位置</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#182230}.t{font-size:14px;font-weight:700}.h{font-size:13px;font-weight:700}.b{font-size:12px;fill:#334155}.n{font-size:12px;fill:#526176}.o{font-size:11px;fill:#0891b2;font-weight:700}.c{font-size:12px;fill:#334155;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style><rect width="900" height="640" rx="18" fill="#f8fafc"/><text x="40" y="34" class="t">嵌套列表的文档树：list_item 的首子是段落，嵌套列表挂在第二及以后的块位置</text><g><rect x="40" y="56" width="470" height="522" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="62" y="84" class="h">doc</text><g><rect x="62" y="94" width="426" height="466" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="80" y="120" class="b">bullet_list</text><text x="170" y="120" class="c">content: "list_item+"</text><g><rect x="84" y="132" width="382" height="66" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><text x="100" y="154" class="b">list_item</text><rect x="100" y="162" width="350" height="26" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><text x="112" y="180" class="c">paragraph　第一项</text></g><g><rect x="84" y="210" width="382" height="234" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><text x="100" y="232" class="b">list_item</text><rect x="100" y="240" width="350" height="26" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><text x="112" y="258" class="c">paragraph　第二项</text><g><rect x="104" y="278" width="342" height="154" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.2"/><text x="120" y="300" class="b">bullet_list</text><text x="200" y="300" class="o">嵌套列表</text><g><rect x="124" y="310" width="306" height="52" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><text x="138" y="326" class="b">list_item</text><rect x="138" y="332" width="280" height="22" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><text x="148" y="347" class="c">paragraph　嵌套一</text></g><g><rect x="124" y="368" width="306" height="52" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><text x="138" y="384" class="b">list_item</text><rect x="138" y="390" width="280" height="22" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><text x="148" y="405" class="c">paragraph　嵌套二</text></g></g></g><g><rect x="84" y="456" width="382" height="66" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><text x="100" y="478" class="b">list_item</text><rect x="100" y="486" width="350" height="26" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><text x="112" y="504" class="c">paragraph　第三项</text></g></g></g><line x1="556" y1="182" x2="460" y2="330" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/><g><rect x="540" y="56" width="320" height="126" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="556" y="82" class="h">list_item 的内容表达式</text><text x="556" y="106" class="c">"paragraph block*"</text><text x="556" y="128" class="n">首子必须是段落，提供打字落点</text><text x="556" y="148" class="n">block* 位置才允许出现嵌套列表</text><text x="556" y="168" class="o">splitListItem 按位置 0 取新项首块类型</text></g><g><rect x="540" y="196" width="320" height="104" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="556" y="222" class="h">orderedList 的 order attr</text><text x="556" y="246" class="n">parseDOM 读取 ol 元素的 start 属性</text><text x="556" y="266" class="n">order 为 1 时 toDOM 返回共享常量 olDOM，</text><text x="556" y="286" class="n">不输出 start，序列化与默认值对齐</text></g><g><rect x="540" y="314" width="320" height="84" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="556" y="340" class="h">listItem 的 defining: true</text><text x="556" y="364" class="n">DOMParser 解析与切片跨越 li 边界时，</text><text x="556" y="384" class="n">把列表项当作整体对待</text></g><g><rect x="540" y="412" width="320" height="104" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="556" y="438" class="h">addListNodes 装配</text><text x="556" y="460" class="c">addListNodes(nodes, itemContent, listGroup)</text><text x="556" y="482" class="n">ordered_list、bullet_list 的 content 固定</text><text x="556" y="502" class="n">补成 "list_item+"，list_item 用传入值</text></g><text x="40" y="614" class="n">另一种建议形状 "paragraph (ordered_list | bullet_list)*"：第二及以后的位置只允许列表，限制更严</text></svg>
