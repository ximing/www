<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title"><title id="title">liftTarget 的逐层查找：把 range 内容从 blockquote 提到 doc 层</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#182230}.t{font-size:14px;font-weight:700}.h{font-size:13px;font-weight:700}.b{font-size:12px;fill:#334155}.n{font-size:12px;fill:#526176}.o{font-size:11px;fill:#0891b2;font-weight:700}</style><rect width="900" height="620" rx="18" fill="#f8fafc"/><text x="40" y="34" class="t">liftTarget：逐层向上试，找到能容纳被提内容的深度</text><text x="40" y="56" class="n">场景：range 覆盖 blockquote 里的第一个段落，content = [p "a"]，range.depth = 1，从 depth = 1 向上查找</text><text x="40" y="88" class="h">lift 前的文档</text><rect x="40" y="98" width="230" height="240" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="54" y="120" class="b">doc（depth 0，顶层）</text><rect x="56" y="132" width="198" height="186" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="70" y="154" class="b">blockquote（range.parent）</text><rect x="72" y="166" width="166" height="52" rx="6" fill="#bae6fd" stroke="#0891b2" stroke-width="1.5"/><text x="82" y="188" class="b">p: "a"</text><text x="82" y="206" class="o">range 覆盖，startIndex 0</text><rect x="72" y="230" width="166" height="36" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="82" y="253" class="b">p: "b"</text><rect x="72" y="276" width="166" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><text x="82" y="296" class="n">endIndex 1，后面还有兄弟</text><line x1="276" y1="218" x2="336" y2="218" stroke="#94a3b8" stroke-width="2"/><path d="M336 218 L326 213 L326 223 Z" fill="#94a3b8"/><text x="344" y="88" class="h">循环：每轮两个检查</text><rect x="344" y="98" width="250" height="104" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="358" y="120" class="b">d = 1：能不能切开 blockquote</text><text x="358" y="142" class="n">canCut(blockquote, 0, 1)</text><text x="358" y="162" class="n">切后剩 [p "b"]，对该类型合法，继续向上</text><text x="358" y="182" class="n">contentAfter = 1（p "a" 后面有兄弟）</text><rect x="344" y="214" width="250" height="124" rx="8" fill="#e0f2fe" stroke="#0891b2" stroke-width="1.5"/><text x="358" y="236" class="b">d = 0：doc 容得下 content 吗</text><text x="358" y="258" class="n">index = 0 + contentBefore = 0</text><text x="358" y="278" class="n">endIndex = 1 - contentAfter = 0</text><text x="358" y="298" class="n">doc.canReplace(0, 0, [p "a"]) 成立</text><text x="358" y="318" class="o">命中，返回 target = 0</text><line x1="600" y1="218" x2="656" y2="218" stroke="#94a3b8" stroke-width="2"/><path d="M656 218 L646 213 L646 223 Z" fill="#94a3b8"/><text x="664" y="88" class="h">lift 后的文档</text><rect x="664" y="98" width="196" height="240" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="678" y="120" class="b">doc</text><rect x="680" y="132" width="164" height="40" rx="6" fill="#bae6fd" stroke="#0891b2" stroke-width="1.5"/><text x="690" y="157" class="b">p: "a"（提上来了）</text><rect x="680" y="184" width="164" height="92" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="694" y="206" class="b">blockquote</text><rect x="694" y="216" width="136" height="36" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="704" y="239" class="b">p: "b"</text><text x="678" y="306" class="n">blockquote 前半是空壳，</text><text x="678" y="324" class="n">lift 时直接被吃掉</text><line x1="40" y1="368" x2="860" y2="368" stroke="#e2e8f0" stroke-width="1.5"/><text x="40" y="396" class="h">查找循环的三个中止条件（任一命中即返回 null）</text><rect x="40" y="412" width="258" height="76" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="54" y="438" class="b">depth == 0</text><text x="54" y="460" class="n">已经到文档顶层，无处可提</text><rect x="322" y="412" width="258" height="76" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="336" y="438" class="b">node.type.spec.isolating</text><text x="336" y="460" class="n">隔离节点不许内容穿越边界</text><rect x="604" y="412" width="256" height="76" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="618" y="438" class="b">canCut 失败</text><text x="618" y="460" class="n">切开这一层后剩余内容不合法</text><text x="40" y="524" class="n">canCut(node, start, end)：start 处能切（start == 0 或 canReplace(start, childCount)），且 end 处能切（end == childCount 或 canReplace(0, end)）</text><text x="40" y="548" class="n">contentBefore / contentAfter 记录上一层区间的偏移：当前层在切点前还有内容，上一层的 index 要多算一个壳的位置，endIndex 同理减一</text><text x="40" y="572" class="n">命中的检查是 node.canReplace(index, endIndex, content)：用被提内容替换掉包住它的那一层节点，等价于「content 能否立在这一层」</text></svg>
