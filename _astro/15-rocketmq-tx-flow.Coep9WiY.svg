<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 760" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrBlu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrGrn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrAmb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ca8a04"/>
    </marker>
  </defs>

  <rect width="980" height="760" rx="8" fill="#f8fafc"/>
  <text x="28" y="34" font-size="16" font-weight="600" fill="#1f2937">RocketMQ 事务消息时序：半消息、本地事务、二次确认与回查</text>
  <text x="28" y="55" font-size="12" fill="#64748b">半消息在中间态对消费方不可见；二次确认丢失时由 broker 回查业务方补救</text>

  <!-- 三条生命线 -->
  <text x="180" y="92" font-size="13" font-weight="600" fill="#1f2937" text-anchor="middle">生产者</text>
  <text x="520" y="92" font-size="13" font-weight="600" fill="#1f2937" text-anchor="middle">Broker</text>
  <text x="820" y="92" font-size="13" font-weight="600" fill="#1f2937" text-anchor="middle">消费方</text>
  <line x1="180" y1="104" x2="180" y2="700" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="520" y1="104" x2="520" y2="700" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="820" y1="104" x2="820" y2="700" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- 半消息 topic 标注 -->
  <rect x="376" y="118" width="288" height="22" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="0.8"/>
  <text x="520" y="133" font-size="10" fill="#1d4ed8" text-anchor="middle">RMQ_SYS_TRANS_HALF_TOPIC（消费方不可见）</text>

  <!-- ① 半消息发送 -->
  <line x1="184" y1="170" x2="514" y2="170" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arrBlu)"/>
  <text x="350" y="162" font-size="11" font-weight="600" fill="#1d4ed8">① 发送半消息（half message）</text>

  <!-- ② 本地事务执行（self loop） -->
  <path d="M180,200 C120,210 120,235 180,245" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="40" y="228" font-size="11" font-weight="600" fill="#475569">② 执行本地事务</text>
  <text x="40" y="244" font-size="10" fill="#64748b">扣库存 / 写订单等</text>

  <!-- ③ 二次确认 commit -->
  <line x1="184" y1="288" x2="514" y2="288" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrGrn)"/>
  <text x="350" y="280" font-size="11" font-weight="600" fill="#16a34a">③ 二次确认 commit</text>

  <!-- rollback 备选 -->
  <line x1="184" y1="318" x2="514" y2="318" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arrRed)"/>
  <text x="350" y="312" font-size="10" fill="#dc2626">rollback（备选）：标记删除，消费方永远看不到</text>

  <!-- ④ commit 后转投业务 topic -->
  <line x1="526" y1="360" x2="814" y2="360" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrGrn)"/>
  <text x="670" y="352" font-size="11" font-weight="600" fill="#16a34a">④ 转投业务 topic，消费方可见</text>

  <!-- 正常路径收束标注 -->
  <rect x="40" y="385" width="340" height="34" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="52" y="403" font-size="10" font-weight="600" fill="#15803d">正常路径：本地事务提交 → 消息最终可见</text>
  <text x="52" y="416" font-size="9" fill="#475569">不一致窗口 = 半消息发送到二次确认之间的时间</text>

  <!-- 分隔：回查路径 -->
  <line x1="24" y1="440" x2="956" y2="440" stroke="#e2e8f0" stroke-width="1"/>
  <text x="28" y="460" font-size="12" font-weight="600" fill="#92400e">二次确认丢失时的回查路径</text>
  <text x="28" y="476" font-size="10" fill="#64748b">生产者发完本地事务后崩溃 / 网络中断 → broker 收不到 commit/rollback</text>

  <!-- ⑤ broker 扫描超时半消息，回查 -->
  <line x1="514" y1="512" x2="186" y2="512" stroke="#ca8a04" stroke-width="1.6" marker-end="url(#arrAmb)"/>
  <text x="350" y="504" font-size="11" font-weight="600" fill="#ca8a04">⑤ 回查 checkLocalTransaction（超时未确认）</text>

  <!-- 业务方查本地事务状态 -->
  <path d="M180,528 C120,538 120,562 180,572" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="40" y="556" font-size="10" fill="#475569">查本地事务是否已提交</text>

  <!-- ⑥ 返回 commit / rollback / unknown -->
  <line x1="184" y1="600" x2="514" y2="600" stroke="#ca8a04" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arrAmb)"/>
  <text x="350" y="592" font-size="10" fill="#ca8a04">⑥ 返回 commit / rollback / unknown</text>

  <!-- 回查次数上限说明 -->
  <rect x="376" y="624" width="560" height="56" rx="5" fill="#fffbeb" stroke="#ca8a04" stroke-width="1"/>
  <text x="388" y="644" font-size="10" font-weight="600" fill="#92400e">回查不是无限重试</text>
  <text x="388" y="660" font-size="10" fill="#475569">· transactionCheckMax 默认 15 次，超限后默认按 rollback 丢弃该消息</text>
  <text x="388" y="674" font-size="10" fill="#dc2626">· 回查持续失败到上限 → 已提交的本地事务对应消息可能丢失，需业务对账兜底</text>

  <!-- 底部对照 -->
  <rect x="24" y="690" width="936" height="56" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="710" font-size="10" font-weight="600" fill="#1f2937">与本地事件表方案对照</text>
  <text x="40" y="726" font-size="9" fill="#475569">本地事件表：协调在业务侧扫描任务，broker 只做普通投递，不一致窗口 = 扫描间隔</text>
  <text x="40" y="740" font-size="9" fill="#475569">事务消息：协调在 broker，半消息中间态对消费方不可见，不一致窗口 = 回查上限之内，超限仍可能丢</text>
</svg>
