<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 700" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="780" height="700" rx="8" fill="#f8fafc"/>
  <text x="30" y="34" font-size="16" font-weight="600" fill="#1f2937">Full GC 排查决策树：从监控告警到定位原因</text>

  <!-- 起点：告警现场 -->
  <rect x="60" y="55" width="380" height="48" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="250" y="76" font-size="12" font-weight="600" fill="#b91c1c" text-anchor="middle">告警现场：RT 周期性尖刺（秒级）</text>
  <text x="250" y="93" font-size="10.5" fill="#b91c1c" text-anchor="middle">无发版 · 流量平稳 · 多机同时 · 整点后几分钟</text>

  <line x1="250" y1="103" x2="250" y2="122" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- 第一步 -->
  <rect x="60" y="124" width="380" height="52" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="250" y="145" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">第一步｜看监控定方向</text>
  <text x="250" y="162" font-size="10.5" fill="#1d4ed8" text-anchor="middle">CPU / 下游 RT / 数据库慢查询 / 网络</text>

  <line x1="440" y1="150" x2="478" y2="150" stroke="#d97706" stroke-width="1.3" marker-end="url(#arrAmber)"/>
  <rect x="480" y="124" width="270" height="52" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
  <text x="615" y="145" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">外部依赖异常 → 去查下游/网络</text>
  <text x="615" y="162" font-size="10" fill="#b45309" text-anchor="middle">（本篇的弯路，耗了半天）</text>

  <line x1="250" y1="176" x2="250" y2="205" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="262" y="196" font-size="10.5" fill="#64748b">均正常 → 多机同时卡顿，问题在进程自身</text>

  <!-- 第二步 -->
  <rect x="60" y="207" width="380" height="52" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="250" y="228" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">第二步｜看 GC 日志定类型</text>
  <text x="250" y="245" font-size="10.5" fill="#1d4ed8" text-anchor="middle">Young GC 频繁？还是 Full GC（concurrent mode failure）？</text>

  <line x1="440" y1="233" x2="478" y2="233" stroke="#d97706" stroke-width="1.3" marker-end="url(#arrAmber)"/>
  <rect x="480" y="207" width="270" height="52" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
  <text x="615" y="228" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">Young GC 频繁 → 新生代偏小</text>
  <text x="615" y="245" font-size="10" fill="#b45309" text-anchor="middle">或对象分配速率过高（非本篇情况）</text>

  <line x1="250" y1="259" x2="250" y2="288" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="262" y="279" font-size="10.5" fill="#64748b">Full GC 且老年代回收后仍占 95% → 有收不掉的对象</text>

  <!-- 第三步 -->
  <rect x="60" y="290" width="380" height="52" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="250" y="311" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">第三步｜jstat -gcutil 在线验证</text>
  <text x="250" y="328" font-size="10.5" fill="#1d4ed8" text-anchor="middle">老年代占用周期性打满，FGC 时刻与尖刺逐一对齐</text>

  <line x1="250" y1="342" x2="250" y2="371" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- 第四步 -->
  <rect x="60" y="373" width="380" height="52" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
  <text x="250" y="394" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">第四步｜jmap dump + MAT 定位</text>
  <text x="250" y="411" font-size="10.5" fill="#b45309" text-anchor="middle">直方图 → Dominator Tree → 引用链（dump 前先摘流量）</text>

  <line x1="250" y1="425" x2="250" y2="454" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- 根因 -->
  <rect x="60" y="456" width="690" height="58" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="405" y="479" font-size="12" font-weight="600" fill="#b91c1c" text-anchor="middle">根因：快照整点全量重建 → 海量对象集中晋升 + 顶层大数组直接进老年代，新旧两份并存</text>
  <text x="405" y="498" font-size="11" fill="#b91c1c" text-anchor="middle">CMS 并发回收追不上 → concurrent mode failure → 串行 Full GC，STW 数秒 = RT 尖刺</text>

  <!-- 底：要点 -->
  <rect x="30" y="538" width="720" height="140" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="50" y="563" font-size="13" font-weight="600" fill="#475569">要点</text>
  <text x="50" y="587" font-size="12" fill="#475569">· 排查顺序：监控定方向 → GC 日志定类型 → jstat 验证 → jmap 定位，顺序比工具重要；</text>
  <text x="50" y="609" font-size="12" fill="#475569">· 「多机同时、周期精确」指向进程自身而非外部依赖——先怀疑网络是本案最大的弯路；</text>
  <text x="50" y="631" font-size="12" fill="#475569">· GC 日志重点看两处：real 停顿时长（= RT 尖刺）、回收后老年代占用（收不掉才是病）；</text>
  <text x="50" y="653" font-size="12" fill="#475569">· jstat 开销小可常跑；jmap dump 会 STW，生产环境摘流量、挑低峰再执行。</text>
</svg>
