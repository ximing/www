<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="55%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.35" cy="0.4" r="0.75">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="600" fill="url(#bg)"/>
  <rect width="1600" height="600" fill="url(#glow)"/>

  <!-- dot grid -->
  <g fill="#ffffff" opacity="0.12">
    <circle cx="110" cy="520" r="2.5"/><circle cx="170" cy="520" r="2.5"/><circle cx="230" cy="520" r="2.5"/><circle cx="290" cy="520" r="2.5"/><circle cx="350" cy="520" r="2.5"/><circle cx="410" cy="520" r="2.5"/><circle cx="470" cy="520" r="2.5"/><circle cx="530" cy="520" r="2.5"/>
    <circle cx="110" cy="556" r="2.5"/><circle cx="170" cy="556" r="2.5"/><circle cx="230" cy="556" r="2.5"/><circle cx="290" cy="556" r="2.5"/><circle cx="350" cy="556" r="2.5"/><circle cx="410" cy="556" r="2.5"/><circle cx="470" cy="556" r="2.5"/><circle cx="530" cy="556" r="2.5"/>
  </g>

  <!-- left typography block -->
  <text x="108" y="178" fill="#fed7aa" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="16" letter-spacing="6">FAMILY TIMELINE · SHARED CHAIN</text>
  <text x="104" y="292" fill="#ffffff" font-family="Georgia, 'Songti SC', 'Noto Serif SC', serif" font-size="96" font-weight="700" letter-spacing="2">Moment</text>
  <text x="110" y="352" fill="#ffedd5" font-family="'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="24" letter-spacing="3">把此刻记成 moment,收进可分享的时光链</text>
  <path d="M 110 396 L 340 396" stroke="#fed7aa" stroke-width="2" opacity="0.6"/>
  <text x="110" y="436" fill="#fed7aa" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" letter-spacing="2" opacity="0.9">Expo · Express · Drizzle · MySQL</text>

  <!-- right chain of moments -->
  <path d="M 880 300 L 1500 300" stroke="#ffedd5" stroke-width="4" opacity="0.7"/>
  <!-- node 1: photo moment -->
  <g>
    <circle cx="960" cy="300" r="14" fill="#fff7ed"/>
    <rect x="902" y="160" width="116" height="96" rx="12" fill="#fff7ed"/>
    <rect x="914" y="172" width="92" height="52" rx="6" fill="#fdba74"/>
    <circle cx="938" cy="192" r="8" fill="#fff7ed"/>
    <path d="M 914 224 l 26 -20 l 20 14 l 22 -18 l 24 24 z" fill="#f97316"/>
    <text x="960" y="376" fill="#ffedd5" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" text-anchor="middle" opacity="0.9">2026.03</text>
  </g>
  <!-- node 2: text moment -->
  <g>
    <circle cx="1130" cy="300" r="14" fill="#fff7ed"/>
    <rect x="1072" y="352" width="116" height="96" rx="12" fill="#fff7ed"/>
    <g stroke="#fb923c" stroke-width="8" stroke-linecap="round">
      <line x1="1088" y1="378" x2="1172" y2="378"/>
      <line x1="1088" y1="400" x2="1172" y2="400"/>
      <line x1="1088" y1="422" x2="1140" y2="422"/>
    </g>
    <text x="1130" y="256" fill="#ffedd5" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" text-anchor="middle" opacity="0.9">2026.05</text>
  </g>
  <!-- node 3: milestone with heart -->
  <g>
    <circle cx="1300" cy="300" r="18" fill="#ffffff"/>
    <rect x="1242" y="160" width="116" height="96" rx="12" fill="#fff7ed"/>
    <path d="M 1300 230 c -12 -20 -42 -15 -42 7 c 0 20 25 32 42 47 c 17 -15 42 -27 42 -47 c 0 -22 -30 -27 -42 -7 z" fill="#e11d48"/>
    <text x="1300" y="376" fill="#ffedd5" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" text-anchor="middle" opacity="0.9">第一次走路</text>
  </g>
  <!-- node 4: video moment -->
  <g>
    <circle cx="1470" cy="300" r="14" fill="#fff7ed"/>
    <rect x="1412" y="352" width="116" height="96" rx="12" fill="#fff7ed"/>
    <circle cx="1470" cy="400" r="24" fill="#fdba74"/>
    <path d="M 1462 388 l 22 12 l -22 12 z" fill="#fff7ed"/>
    <text x="1470" y="256" fill="#ffedd5" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" text-anchor="middle" opacity="0.9">2026.08</text>
  </g>

  <!-- share chip -->
  <rect x="880" y="470" width="212" height="34" rx="17" fill="none" stroke="#fed7aa" stroke-width="2" opacity="0.85"/>
  <text x="986" y="493" fill="#fed7aa" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" text-anchor="middle" letter-spacing="1">share link · no signup</text>
</svg>
