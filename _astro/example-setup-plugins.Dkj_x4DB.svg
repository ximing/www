<svg xmlns="http://www.w3.org/2000/svg" width="940" height="620" viewBox="0 0 940 620" role="img" aria-labelledby="title"><title id="title">exampleSetup 返回的插件数组：顺序即优先级，以及 Backspace 与输入规则的两次分发过程</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#182230}.t{font-size:14px;font-weight:700}.h{font-size:13px;font-weight:700}.b{font-size:12px;fill:#334155}.n{font-size:12px;fill:#526176}.o{font-size:12px;fill:#0891b2;font-weight:700}.v{font-size:13px;font-weight:700;fill:#182230}.i{font-size:11px;fill:#94a3b8;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style><rect width="940" height="620" rx="18" fill="#f8fafc"/><text x="40" y="34" class="t">exampleSetup 返回的插件数组：someProp 从上到下查，先返回真值的插件截获事件</text><g><rect x="40" y="56" width="400" height="520" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="62" y="84" class="h">plugins 数组（index.ts 的拼装顺序）</text><rect x="60" y="98" width="360" height="46" rx="4" fill="#cffafe" stroke="#0891b2" stroke-width="1.2"/><text x="72" y="118" class="v">1 inputrules(buildInputRules)</text><text x="72" y="136" class="n">handleTextInput：智能引号、markdown 快捷</text><rect x="60" y="158" width="360" height="46" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="72" y="178" class="v">2 keymap(buildKeymap)</text><text x="72" y="196" class="n">按 schema 绑定的快捷键，含 undoInputRule</text><rect x="60" y="218" width="360" height="46" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="72" y="238" class="v">3 keymap(baseKeymap)</text><text x="72" y="256" class="n">commands 包的通用编辑按键</text><rect x="60" y="278" width="360" height="46" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/><text x="72" y="298" class="v">4 dropCursor()</text><text x="72" y="316" class="n">拖拽落点指示线</text><rect x="60" y="338" width="360" height="46" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/><text x="72" y="358" class="v">5 gapCursor()</text><text x="72" y="376" class="n">块节点之间的伪光标</text><rect x="60" y="398" width="360" height="46" rx="4" fill="#fef9c3" stroke="#a16207" stroke-width="1.2"/><text x="72" y="418" class="v">6 menuBar(...)（menuBar: false 可关）</text><text x="72" y="436" class="n">pluginView 渲染菜单栏，floating 默认开</text><rect x="60" y="458" width="360" height="46" rx="4" fill="#fef9c3" stroke="#a16207" stroke-width="1.2"/><text x="72" y="478" class="v">7 history()（history: false 可关）</text><text x="72" y="496" class="n">StateField 存撤销栈，与顺序无关</text><rect x="60" y="518" width="360" height="46" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/><text x="72" y="538" class="v">8 匿名插件：attributes class</text><text x="72" y="556" class="n">挂 ProseMirror-example-setup-style 样式</text></g><g><rect x="470" y="56" width="430" height="520" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="492" y="84" class="h">两个按键事件的分发过程</text><text x="492" y="116" class="o">例 1：按下 Backspace</text><rect x="492" y="128" width="386" height="44" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="504" y="147" class="v">先问插件 2：undoInputRule</text><text x="504" y="164" class="n">上次操作不是输入规则，返回 false</text><line x1="685" y1="176" x2="685" y2="200" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/><text x="700" y="194" class="n">未处理，继续向下</text><rect x="492" y="204" width="386" height="44" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="504" y="223" class="v">再问插件 3：baseKeymap 的命令链</text><text x="504" y="240" class="n">deleteSelection → joinBackward → selectNodeBackward</text><line x1="685" y1="252" x2="685" y2="276" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/><text x="700" y="270" class="n">某条命令返回 true</text><rect x="492" y="280" width="386" height="40" rx="4" fill="#cffafe" stroke="#0891b2" stroke-width="1.2"/><text x="504" y="305" class="v">dispatch：删选区或向前合并</text><text x="492" y="356" class="o">例 2：文本块开头输入「&gt; 」</text><rect x="492" y="368" width="386" height="44" rx="4" fill="#cffafe" stroke="#0891b2" stroke-width="1.2"/><text x="504" y="387" class="v">先问插件 1：handleTextInput</text><text x="504" y="404" class="n">blockQuoteRule 的正则 /^\s*&gt;\s$/ 命中</text><line x1="685" y1="416" x2="685" y2="440" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/><text x="700" y="434" class="n">规则命中</text><rect x="492" y="444" width="386" height="40" rx="4" fill="#cffafe" stroke="#0891b2" stroke-width="1.2"/><text x="504" y="469" class="v">dispatch：当前段落包进 blockquote</text><text x="492" y="510" class="n">handleTextInput 返回 true，这次输入到此为止，</text><text x="492" y="530" class="n">后面的 keymap 和浏览器默认行为都不再参与</text></g><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs><text x="40" y="600" class="n">结论：按键与文本输入按数组顺序逐插件询问，命令返回 false 表示「不归我管」，控制权继续下传</text></svg>