<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">智能巡检的三次演进</title><desc id="desc">阶段一：人发现问题后把现象发给 Agent，Agent 检索知识库定位并给出建议，人执行处理。阶段二：告警 webhook 与定时任务进入消息队列，Agent 自动定位与处理，高危动作转人工审批。阶段三：定时拉起自动化测试运行线上页面并截图，新问题写回事件队列，复用阶段二的闭环。</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#182230}.title{font-size:29px;font-weight:700}.label{font-size:21px;font-weight:700}.sub{font-size:17px;fill:#526176}.small{font-size:16px;fill:#526176}</style><rect width="1200" height="640" rx="20" fill="#f8fafc"/><text x="48" y="54" class="title">智能巡检的三次演进：从人发问题到主动验证</text><rect x="30" y="92" width="340" height="476" rx="18" fill="#f1f5f9" stroke="#94a3b8" stroke-width="3"/><text x="60" y="136" class="label">阶段一 · 过去</text><text x="60" y="163" class="sub">同步问答</text><g fill="#ffffff" stroke="#94a3b8" stroke-width="2"><rect x="50" y="186" width="300" height="60" rx="12"/><rect x="50" y="276" width="300" height="60" rx="12"/><rect x="50" y="366" width="300" height="60" rx="12"/><rect x="50" y="456" width="300" height="60" rx="12"/></g><text x="68" y="223" class="sub">用户或监控发现异常</text><text x="68" y="313" class="sub">人把问题现象发给 Agent</text><text x="68" y="403" class="sub">Agent 检索知识库并定位</text><text x="68" y="493" class="sub">人执行处理动作</text><g fill="none" stroke="#64748b" stroke-width="3"><path d="M200 246v30M200 336v30M200 426v30"/><path d="m192 266 8 10 8-10m-16 60 8 10 8-10m-16 60 8 10 8-10"/></g><text x="60" y="548" class="sub">触发与执行靠人，定位靠 Agent</text><rect x="430" y="92" width="340" height="476" rx="18" fill="#e0f2fe" stroke="#38bdf8" stroke-width="3"/><text x="460" y="136" class="label">阶段二 · 现在</text><text x="460" y="163" class="sub">事件驱动</text><g fill="#ffffff" stroke="#38bdf8" stroke-width="2"><rect x="450" y="186" width="300" height="60" rx="12"/><rect x="450" y="276" width="300" height="60" rx="12"/><rect x="450" y="366" width="300" height="60" rx="12"/><rect x="450" y="456" width="300" height="60" rx="12"/></g><text x="468" y="223" class="sub">告警 webhook / cron 定时触发</text><text x="468" y="313" class="sub">消息队列：去重、分级、持久化</text><text x="468" y="403" class="sub">Agent 自动定位与处理</text><text x="468" y="493" class="sub">高危动作转人工审批</text><g fill="none" stroke="#64748b" stroke-width="3"><path d="M600 246v30M600 336v30M600 426v30"/><path d="m592 266 8 10 8-10m-16 60 8 10 8-10m-16 60 8 10 8-10"/></g><text x="460" y="548" class="sub">自动发现、定位、处理</text><rect x="830" y="92" width="340" height="476" rx="18" fill="#ede9fe" stroke="#8b5cf6" stroke-width="3"/><text x="860" y="136" class="label">阶段三 · 未来</text><text x="860" y="163" class="sub">主动验证</text><g fill="#ffffff" stroke="#8b5cf6" stroke-width="2"><rect x="850" y="186" width="300" height="60" rx="12"/><rect x="850" y="276" width="300" height="60" rx="12"/><rect x="850" y="366" width="300" height="60" rx="12"/><rect x="850" y="456" width="300" height="60" rx="12"/></g><text x="868" y="223" class="sub">定时拉起自动化测试</text><text x="868" y="313" class="sub">真实运行线上页面并截图</text><text x="868" y="403" class="sub">视觉对比与交互断言</text><text x="868" y="493" class="sub">新问题写回事件队列</text><g fill="none" stroke="#64748b" stroke-width="3"><path d="M1000 246v30M1000 336v30M1000 426v30"/><path d="m992 266 8 10 8-10m-16 60 8 10 8-10m-16 60 8 10 8-10"/></g><text x="860" y="548" class="sub">复用阶段二的处理闭环</text><g fill="none" stroke="#64748b" stroke-width="5"><path d="M372 324h56M772 324h56"/><path d="m404 312 20 12-20 12m380-24 20 12-20 12"/></g></svg>