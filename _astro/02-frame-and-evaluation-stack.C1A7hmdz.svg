<svg viewBox="0 0 980 720" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono','Menlo','Monaco','Consolas',monospace" font-size="13">
  <defs>
    <linearGradient id="stageFiber" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a2a3a"/><stop offset="100%" stop-color="#28425c"/></linearGradient>
    <linearGradient id="stageFrame" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3a1a1a"/><stop offset="100%" stop-color="#5c2828"/></linearGradient>
    <linearGradient id="stageScope" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a4731"/><stop offset="100%" stop-color="#236b4a"/></linearGradient>
    <linearGradient id="stageStack" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2a1a3a"/><stop offset="100%" stop-color="#46285c"/></linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#8b949e"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#3fb950"/></marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#a371f7"/></marker>
  </defs>

  <rect width="980" height="720" fill="url(#bg)" rx="8"/>

  <text x="490" y="34" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="bold" font-family="'Segoe UI','SF Pro',sans-serif">JSVM3 运行时结构：Fiber、Frame、Scope 与求值栈</text>
  <text x="490" y="54" text-anchor="middle" fill="#8b949e" font-size="12">JSVM.exec(script) 之后，运行时各对象如何分工与连接</text>

  <!-- Fiber -->
  <rect x="30" y="80" width="310" height="290" rx="6" fill="url(#stageFiber)" filter="url(#glow)"/>
  <text x="185" y="104" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">Fiber（vm/fiber.ts）</text>
  <text x="185" y="122" text-anchor="middle" fill="#8b949e" font-size="10">一次 exec() 对应一个 Fiber</text>
  <line x1="50" y1="132" x2="320" y2="132" stroke="#28425c" stroke-width="1"/>
  <text x="50" y="150" fill="#c9d1d9" font-size="11">callStack: Frame[]   depth</text>
  <!-- call stack mini diagram -->
  <rect x="60" y="160" width="120" height="26" rx="4" fill="#0d1117" stroke="#f85149" stroke-width="1"/>
  <text x="120" y="177" text-anchor="middle" fill="#f85149" font-size="10">Frame f()  ← 栈顶</text>
  <rect x="60" y="192" width="120" height="26" rx="4" fill="#0d1117" stroke="#8b949e" stroke-width="1"/>
  <text x="120" y="209" text-anchor="middle" fill="#8b949e" font-size="10">Frame 模块顶层</text>
  <text x="196" y="177" fill="#8b949e" font-size="10">depth = 1</text>
  <text x="196" y="209" fill="#8b949e" font-size="10">depth = 0</text>
  <line x1="50" y1="228" x2="320" y2="228" stroke="#28425c" stroke-width="1"/>
  <text x="50" y="246" fill="#c9d1d9" font-size="11">r1 / r2 / r3    临时寄存器</text>
  <text x="50" y="263" fill="#c9d1d9" font-size="11">rexp            表达式语句结果</text>
  <text x="50" y="280" fill="#c9d1d9" font-size="11">rv              函数返回值</text>
  <text x="50" y="297" fill="#c9d1d9" font-size="11">timeout         指令预算（-1 不限）</text>
  <text x="50" y="314" fill="#c9d1d9" font-size="11">maxDepth = 1000 调用栈上限</text>
  <line x1="50" y1="326" x2="320" y2="326" stroke="#28425c" stroke-width="1"/>
  <text x="50" y="344" fill="#8b949e" font-size="10">run() 循环驱动栈顶 Frame；unwind() 处理异常</text>
  <text x="50" y="360" fill="#8b949e" font-size="10">pushFrame() / popFrame() 维护调用栈</text>

  <!-- Frame -->
  <rect x="380" y="80" width="300" height="290" rx="6" fill="url(#stageFrame)" filter="url(#glow)"/>
  <text x="530" y="104" text-anchor="middle" fill="#f85149" font-size="13" font-weight="bold">Frame（vm/frame.ts）</text>
  <text x="530" y="122" text-anchor="middle" fill="#8b949e" font-size="10">一次函数调用对应一个 Frame</text>
  <line x1="400" y1="132" x2="660" y2="132" stroke="#5c2828" stroke-width="1"/>
  <text x="400" y="150" fill="#c9d1d9" font-size="11">ip / exitIp     指令指针与出口</text>
  <text x="400" y="167" fill="#c9d1d9" font-size="11">script          执行的 Script</text>
  <text x="400" y="184" fill="#c9d1d9" font-size="11">evalStack       求值栈 →</text>
  <text x="400" y="201" fill="#c9d1d9" font-size="11">_scope          作用域 →</text>
  <text x="400" y="218" fill="#c9d1d9" font-size="11">lref: any[]     左值引用栈</text>
  <text x="400" y="235" fill="#c9d1d9" font-size="11">guards          try/catch 保护区间</text>
  <text x="400" y="252" fill="#c9d1d9" font-size="11">line / column   行列号（栈回溯用）</text>
  <line x1="400" y1="264" x2="660" y2="264" stroke="#5c2828" stroke-width="1"/>
  <text x="400" y="282" fill="#8b949e" font-size="10">run() 主循环：</text>
  <text x="400" y="299" fill="#8b949e" font-size="10">while (ip !== exitIp &amp;&amp; !suspended</text>
  <text x="400" y="315" fill="#8b949e" font-size="10">       &amp;&amp; fiber.timeout !== 0)</text>
  <text x="400" y="331" fill="#8b949e" font-size="10">  ins = instructions[ip++]</text>
  <text x="400" y="347" fill="#8b949e" font-size="10">  ins.run(frame, evalStack, scope, realm, args)</text>
  <text x="400" y="363" fill="#8b949e" font-size="10">帧正常结束时断言求值栈已清空</text>

  <!-- Fiber -> Frame arrow -->
  <path d="M 340 160 C 355 160, 360 160, 375 160" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="357" y="148" text-anchor="middle" fill="#8b949e" font-size="9">pushFrame</text>

  <!-- EvaluationStack: step through of return 1 + a * 3 -->
  <rect x="30" y="400" width="560" height="220" rx="6" fill="url(#stageStack)" filter="url(#glow)"/>
  <text x="310" y="424" text-anchor="middle" fill="#a371f7" font-size="13" font-weight="bold">EvaluationStack（vm/stack.ts）：return 1 + a * 3（a = 2）</text>
  <text x="310" y="441" text-anchor="middle" fill="#8b949e" font-size="10">定长数组 + idx 指针；编译期 stackSize 决定容量；push 越界即报错</text>

  <!-- stack snapshots, bottom-aligned at y=560, cell 56x22 -->
  <!-- step1: LITERAL [1] -> [1] -->
  <rect x="60" y="538" width="56" height="22" rx="3" fill="#0d1117" stroke="#a371f7" stroke-width="1"/>
  <text x="88" y="553" text-anchor="middle" fill="#c9d1d9" font-size="11">1</text>
  <text x="88" y="578" text-anchor="middle" fill="#8b949e" font-size="10">LITERAL 1</text>
  <!-- step2: GETL a -> [1,2] -->
  <rect x="150" y="538" width="56" height="22" rx="3" fill="#0d1117" stroke="#a371f7" stroke-width="1"/>
  <text x="178" y="553" text-anchor="middle" fill="#c9d1d9" font-size="11">1</text>
  <rect x="150" y="514" width="56" height="22" rx="3" fill="#0d1117" stroke="#a371f7" stroke-width="1"/>
  <text x="178" y="529" text-anchor="middle" fill="#c9d1d9" font-size="11">2</text>
  <text x="178" y="578" text-anchor="middle" fill="#8b949e" font-size="10">GETL a</text>
  <!-- step3: LITERAL 3 -> [1,2,3] -->
  <rect x="240" y="538" width="56" height="22" rx="3" fill="#0d1117" stroke="#a371f7" stroke-width="1"/>
  <text x="268" y="553" text-anchor="middle" fill="#c9d1d9" font-size="11">1</text>
  <rect x="240" y="514" width="56" height="22" rx="3" fill="#0d1117" stroke="#a371f7" stroke-width="1"/>
  <text x="268" y="529" text-anchor="middle" fill="#c9d1d9" font-size="11">2</text>
  <rect x="240" y="490" width="56" height="22" rx="3" fill="#0d1117" stroke="#a371f7" stroke-width="1"/>
  <text x="268" y="505" text-anchor="middle" fill="#c9d1d9" font-size="11">3</text>
  <text x="268" y="578" text-anchor="middle" fill="#8b949e" font-size="10">LITERAL 3</text>
  <!-- step4: MUL -> [1,6] -->
  <rect x="330" y="538" width="56" height="22" rx="3" fill="#0d1117" stroke="#a371f7" stroke-width="1"/>
  <text x="358" y="553" text-anchor="middle" fill="#c9d1d9" font-size="11">1</text>
  <rect x="330" y="514" width="56" height="22" rx="3" fill="#0d1117" stroke="#a371f7" stroke-width="1"/>
  <text x="358" y="529" text-anchor="middle" fill="#c9d1d9" font-size="11">6</text>
  <text x="358" y="578" text-anchor="middle" fill="#8b949e" font-size="10">MUL</text>
  <!-- step5: ADD -> [7] -->
  <rect x="420" y="538" width="56" height="22" rx="3" fill="#0d1117" stroke="#a371f7" stroke-width="1"/>
  <text x="448" y="553" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="bold">7</text>
  <text x="448" y="578" text-anchor="middle" fill="#8b949e" font-size="10">ADD</text>
  <!-- step6: RETV -> rv -->
  <rect x="510" y="538" width="56" height="22" rx="3" fill="#0d1117" stroke="#30363d" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="538" y="553" text-anchor="middle" fill="#8b949e" font-size="10">空</text>
  <text x="538" y="578" text-anchor="middle" fill="#8b949e" font-size="10">RETV → rv=7</text>

  <text x="60" y="605" fill="#8b949e" font-size="10">二元运算指令统一用 tail(2) 取栈顶两个值，结果压回栈顶；运算符优先级体现在指令的发射顺序上（先 MUL 后 ADD）</text>

  <!-- Scope -->
  <rect x="620" y="400" width="330" height="220" rx="6" fill="url(#stageScope)" filter="url(#glow)"/>
  <text x="785" y="424" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="bold">Scope（vm/scope.ts）：f 的局部作用域</text>
  <text x="785" y="441" text-anchor="middle" fill="#8b949e" font-size="10">data: 定长数组，变量在编译期分配为整数索引</text>
  <!-- data slots -->
  <rect x="650" y="456" width="70" height="24" rx="3" fill="#0d1117" stroke="#3fb950" stroke-width="1"/>
  <text x="685" y="472" text-anchor="middle" fill="#c9d1d9" font-size="10">0: this</text>
  <rect x="728" y="456" width="90" height="24" rx="3" fill="#0d1117" stroke="#3fb950" stroke-width="1"/>
  <text x="773" y="472" text-anchor="middle" fill="#c9d1d9" font-size="10">1: arguments</text>
  <rect x="826" y="456" width="60" height="24" rx="3" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="856" y="472" text-anchor="middle" fill="#8b949e" font-size="10">2: fn</text>
  <rect x="894" y="456" width="46" height="24" rx="3" fill="#0d1117" stroke="#3fb950" stroke-width="1"/>
  <text x="917" y="472" text-anchor="middle" fill="#c9d1d9" font-size="10">3: a</text>
  <text x="650" y="502" fill="#8b949e" font-size="10">GETL [0, 3]：沿 parentScope 走 0 层，取 data[3]</text>
  <text x="650" y="519" fill="#8b949e" font-size="10">SETL [0, 3]：写回 data[3]，运行期不做名字哈希查找</text>
  <!-- parentScope chain -->
  <line x1="720" y1="536" x2="720" y2="556" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="730" y="550" fill="#3fb950" font-size="10">parentScope</text>
  <rect x="650" y="560" width="270" height="40" rx="4" fill="#0d1117" stroke="#3fb950" stroke-width="1"/>
  <text x="785" y="577" text-anchor="middle" fill="#c9d1d9" font-size="10">外层 Scope（模块顶层 / 全局）</text>
  <text x="785" y="592" text-anchor="middle" fill="#8b949e" font-size="10">data[0] = globalObj（pushFrame 时写入）</text>

  <!-- Frame -> Scope arrow -->
  <path d="M 530 370 C 530 385, 700 385, 760 395" fill="none" stroke="#3fb950" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrowGreen)"/>
  <!-- Frame -> evalStack arrow -->
  <path d="M 450 370 C 450 382, 420 388, 400 396" fill="none" stroke="#a371f7" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrowPurple)"/>

  <!-- Legend -->
  <rect x="30" y="640" width="920" height="60" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="45" y="652" width="12" height="12" rx="2" fill="#58a6ff"/>
  <text x="62" y="663" fill="#8b949e" font-size="11">Fiber：调用栈、寄存器、返回值与执行预算（跨 Frame 共享）</text>
  <rect x="45" y="672" width="12" height="12" rx="2" fill="#f85149"/>
  <text x="62" y="683" fill="#8b949e" font-size="11">Frame：单次调用的执行上下文，持有 ip 与求值栈</text>
  <rect x="500" y="652" width="12" height="12" rx="2" fill="#a371f7"/>
  <text x="517" y="663" fill="#8b949e" font-size="11">EvaluationStack：保存表达式中间结果</text>
  <rect x="500" y="672" width="12" height="12" rx="2" fill="#3fb950"/>
  <text x="517" y="683" fill="#8b949e" font-size="11">Scope：按索引存取局部变量，parentScope 连成作用域链</text>
</svg>
