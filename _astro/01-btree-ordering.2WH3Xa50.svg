<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="820" height="600" rx="8" fill="#f8fafc"/>
  <text x="30" y="34" font-size="16" font-weight="600" fill="#1f2937">B+ 树矮胖结构 与 (uid, name) 联合索引字典序</text>

  <!-- 根节点 -->
  <rect x="300" y="58" width="220" height="46" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="410" y="86" font-size="13" fill="#1f2937" text-anchor="middle">100 &#160;|&#160; 300</text>
  <text x="410" y="50" font-size="11" fill="#64748b" text-anchor="middle">根节点（非叶子，只存路由键）</text>

  <!-- 中间层 -->
  <rect x="120" y="160" width="170" height="46" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.3"/>
  <text x="205" y="188" font-size="12.5" fill="#1f2937" text-anchor="middle">10 &#160;|&#160; 50 &#160;|&#160; 90</text>

  <rect x="325" y="160" width="170" height="46" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.3"/>
  <text x="410" y="188" font-size="12.5" fill="#1f2937" text-anchor="middle">100 &#160;|&#160; 250 &#160;|&#160; 290</text>

  <rect x="530" y="160" width="170" height="46" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.3"/>
  <text x="615" y="188" font-size="12.5" fill="#1f2937" text-anchor="middle">300 &#160;|&#160; 450 &#160;|&#160; 500</text>

  <!-- 根到中间层连线 -->
  <line x1="360" y1="104" x2="205" y2="160" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="410" y1="104" x2="410" y2="160" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="460" y1="104" x2="615" y2="160" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- 叶子节点：每片存 (uid, name) 字典序 -->
  <rect x="40" y="280" width="230" height="86" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="155" y="300" font-size="11" fill="#64748b" text-anchor="middle">叶子页 1（含整行数据）</text>
  <text x="52" y="320" font-size="12" fill="#1f2937">(10, &quot;doc&quot;)</text>
  <text x="52" y="338" font-size="12" fill="#1f2937">(50, &quot;img&quot;)</text>
  <text x="52" y="356" font-size="12" fill="#1f2937">(90, &quot;zip&quot;)</text>

  <rect x="295" y="280" width="230" height="86" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="410" y="300" font-size="11" fill="#64748b" text-anchor="middle">叶子页 2</text>
  <text x="307" y="320" font-size="12" fill="#1f2937">(100, &quot;mp4&quot;)</text>
  <text x="307" y="338" font-size="12" fill="#1f2937">(250, &quot;pdf&quot;)</text>
  <text x="307" y="356" font-size="12" fill="#1f2937">(290, &quot;txt&quot;)</text>

  <rect x="550" y="280" width="230" height="86" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="665" y="300" font-size="11" fill="#64748b" text-anchor="middle">叶子页 3</text>
  <text x="562" y="320" font-size="12" fill="#1f2937">(300, &quot;apk&quot;)</text>
  <text x="562" y="338" font-size="12" fill="#1f2937">(450, &quot;csv&quot;)</text>
  <text x="562" y="356" font-size="12" fill="#1f2937">(500, &quot;mov&quot;)</text>

  <!-- 中间层到叶子连线 -->
  <line x1="205" y1="206" x2="155" y2="280" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="410" y1="206" x2="410" y2="280" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="615" y1="206" x2="665" y2="280" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- 叶子双向链表 -->
  <line x1="270" y1="323" x2="295" y2="323" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrBlue)"/>
  <line x1="295" y1="343" x2="270" y2="343" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrBlue)"/>
  <line x1="525" y1="323" x2="550" y2="323" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrBlue)"/>
  <line x1="550" y1="343" x2="525" y2="343" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrBlue)"/>
  <text x="282" y="313" font-size="10" fill="#2563eb" text-anchor="middle">链表</text>
  <text x="537" y="313" font-size="10" fill="#2563eb" text-anchor="middle">链表</text>

  <!-- 注解区 -->
  <rect x="40" y="400" width="740" height="180" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="56" y="424" font-size="13" font-weight="600" fill="#1f2937">矮胖的来源：磁盘以页（InnoDB 默认 16KB）为单位读取</text>
  <text x="56" y="446" font-size="12" fill="#475569">· 非叶子节点只存键 + 指针，一个 16KB 页可放数百个键，扇出高</text>
  <text x="56" y="466" font-size="12" fill="#475569">· 三层即可覆盖千万级行数：每层一次页读取，IO 次数 = 树高</text>
  <text x="56" y="486" font-size="12" fill="#475569">· 数据只在叶子节点；叶子按 (uid, name) 字典序排列，双向链表串联</text>

  <text x="56" y="516" font-size="13" font-weight="600" fill="#1f2937">字典序模型：联合索引 (uid, name)</text>
  <text x="56" y="538" font-size="12" fill="#475569">· 先按 uid 排序，uid 相同再按 name 排序——与字符串字典序同构</text>
  <text x="56" y="558" font-size="12" fill="#475569">· 由此推出：最左前缀（跳过 uid 则 name 无序）、range 后列失效、</text>
  <text x="56" y="576" font-size="12" fill="#475569">&#160;&#160;order by 与索引序一致可免 filesort；失效场景的共同原因是有序性被破坏</text>
</svg>
