<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" role="img" aria-labelledby="title"><title id="title">含合并单元格的表格与对应 TableMap：map 数组按格网记录覆盖每个格子的单元格起始位置</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#182230}.t{font-size:14px;font-weight:700}.h{font-size:13px;font-weight:700}.b{font-size:12px;fill:#334155}.n{font-size:12px;fill:#526176}.o{font-size:11px;fill:#0891b2;font-weight:700}.c{font-size:12px;fill:#334155;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.v{font-size:15px;font-weight:700;fill:#182230;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.i{font-size:10px;fill:#94a3b8;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style><rect width="940" height="560" rx="18" fill="#f8fafc"/><text x="40" y="34" class="t">含合并单元格的表格（左）与对应的 TableMap.map（右）：每个格子存的是覆盖它的单元格在表格内的起始位置</text><g><rect x="40" y="56" width="500" height="420" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="62" y="84" class="h">文档中的 table 节点（每个单元格 nodeSize 按 6 计）</text><text x="160" y="108" class="i">col 0</text><text x="310" y="108" class="i">col 1</text><text x="460" y="108" class="i">col 2</text><text x="56" y="160" class="i">row 0</text><text x="56" y="250" class="i">row 1</text><text x="56" y="340" class="i">row 2</text><rect x="90" y="118" width="140" height="170" rx="4" fill="#cffafe" stroke="#475569" stroke-width="1.2"/><text x="104" y="146" class="v">A</text><text x="104" y="166" class="n">pos 1</text><text x="104" y="186" class="o">rowspan: 2</text><rect x="230" y="118" width="140" height="85" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/><text x="244" y="146" class="v">B</text><text x="244" y="166" class="n">pos 7</text><rect x="370" y="118" width="140" height="85" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/><text x="384" y="146" class="v">C</text><text x="384" y="166" class="n">pos 13</text><rect x="230" y="203" width="140" height="85" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/><text x="244" y="231" class="v">D</text><text x="244" y="251" class="n">pos 21</text><rect x="370" y="203" width="140" height="85" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/><text x="384" y="231" class="v">E</text><text x="384" y="251" class="n">pos 27</text><rect x="90" y="288" width="280" height="85" rx="4" fill="#fef3c7" stroke="#475569" stroke-width="1.2"/><text x="104" y="316" class="v">F</text><text x="104" y="336" class="n">pos 35</text><text x="104" y="356" class="o">colspan: 2</text><rect x="370" y="288" width="140" height="85" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/><text x="384" y="316" class="v">G</text><text x="384" y="336" class="n">pos 41</text><text x="62" y="416" class="n">rowspan 让 A 占满 (0,0) 与 (1,0) 两格，</text><text x="62" y="436" class="n">colspan 让 F 占满 (2,0) 与 (2,1) 两格，</text><text x="62" y="456" class="n">「第几行第几列是哪个单元格」无法从下标直接读出</text></g><g><rect x="580" y="56" width="330" height="420" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="602" y="84" class="h">TableMap：width 3 · height 3</text><g><rect x="612" y="100" width="88" height="60" rx="4" fill="#cffafe" stroke="#475569" stroke-width="1.2"/><text x="618" y="114" class="i">0</text><text x="648" y="142" class="v">1</text></g><g><rect x="706" y="100" width="88" height="60" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/><text x="712" y="114" class="i">1</text><text x="742" y="142" class="v">7</text></g><g><rect x="800" y="100" width="88" height="60" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/><text x="806" y="114" class="i">2</text><text x="830" y="142" class="v">13</text></g><g><rect x="612" y="166" width="88" height="60" rx="4" fill="#cffafe" stroke="#475569" stroke-width="1.2"/><text x="618" y="180" class="i">3</text><text x="648" y="208" class="v">1</text></g><g><rect x="706" y="166" width="88" height="60" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/><text x="712" y="180" class="i">4</text><text x="736" y="208" class="v">21</text></g><g><rect x="800" y="166" width="88" height="60" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/><text x="806" y="180" class="i">5</text><text x="830" y="208" class="v">27</text></g><g><rect x="612" y="232" width="88" height="60" rx="4" fill="#fef3c7" stroke="#475569" stroke-width="1.2"/><text x="618" y="246" class="i">6</text><text x="642" y="274" class="v">35</text></g><g><rect x="706" y="232" width="88" height="60" rx="4" fill="#fef3c7" stroke="#475569" stroke-width="1.2"/><text x="712" y="246" class="i">7</text><text x="736" y="274" class="v">35</text></g><g><rect x="800" y="232" width="88" height="60" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/><text x="806" y="246" class="i">8</text><text x="830" y="274" class="v">41</text></g><text x="602" y="322" class="c">map[row * width + col]</text><text x="602" y="342" class="n">同一个值出现多次，就是合并单元格占的多格</text><text x="602" y="376" class="o">findCell(35) 的过程</text><text x="602" y="398" class="n">首个命中下标 6：left = 6 % 3 = 0，top = 2</text><text x="602" y="418" class="n">向右 map[7] 同为 35，扩到 right = 2 停止</text><text x="602" y="438" class="n">向下越出 height，bottom = 3</text><text x="602" y="460" class="c">→ Rect {left:0, top:2, right:2, bottom:3}</text></g><text x="40" y="510" class="n">map 里存的是表格相对位置：表格内容起点记为 0，每个 table_row 的开闭各占 1 个位置。换成文档坐标要加上表格起点，命令层用 $pos.start(-1) 取这个偏移。</text><text x="40" y="534" class="n">颜色对应关系：青色两格都被 A 覆盖，黄色两格都被 F 覆盖。</text></svg>