<svg xmlns="http://www.w3.org/2000/svg" width="800" height="545" viewBox="0 0 800 545" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b45309"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#52525b"/>
    </marker>
  </defs>

  <!-- A: page gate -->
  <rect x="240" y="28" width="320" height="46" rx="8" fill="#e4e4e7"/>
  <text x="400" y="56" font-size="13.5" font-weight="600" fill="#18181b" text-anchor="middle">页级门禁节点：G2 静态 → G3 对账 → G4 覆盖</text>

  <line x1="400" y1="76" x2="400" y2="94" stroke="#52525b" stroke-width="2" marker-end="url(#arrow-gray)"/>

  <!-- B: gate green? -->
  <rect x="310" y="96" width="180" height="40" rx="8" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.2"/>
  <text x="400" y="121" font-size="13" fill="#18181b" text-anchor="middle">门禁绿？</text>

  <!-- yes -> commit -->
  <line x1="490" y1="116" x2="556" y2="116" stroke="#b45309" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="523" y="106" font-size="12" fill="#b45309" text-anchor="middle">绿</text>
  <rect x="560" y="84" width="220" height="64" rx="8" fill="#fdf6ec" stroke="#b45309" stroke-width="1.2"/>
  <text x="670" y="110" font-size="12.5" font-weight="600" fill="#18181b" text-anchor="middle">绿即提交</text>
  <text x="670" y="132" font-size="12" fill="#3f3f46" text-anchor="middle">页级分支 commit，哈希记入账本</text>

  <!-- no -> extract -->
  <line x1="400" y1="138" x2="400" y2="156" stroke="#52525b" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text x="444" y="152" font-size="12" fill="#52525b" text-anchor="middle">失败</text>
  <rect x="250" y="160" width="300" height="46" rx="8" fill="#f4f4f5"/>
  <text x="400" y="180" font-size="12.5" fill="#18181b" text-anchor="middle">错误结构化提取</text>
  <text x="400" y="199" font-size="12" fill="#3f3f46" text-anchor="middle">错误码 · 文件 · 行号 · 消息</text>

  <line x1="400" y1="208" x2="400" y2="226" stroke="#52525b" stroke-width="2" marker-end="url(#arrow-gray)"/>

  <!-- D: repeat check -->
  <rect x="280" y="230" width="240" height="40" rx="8" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.2"/>
  <text x="400" y="255" font-size="13" fill="#18181b" text-anchor="middle">同错误连续 2 轮逐字节相同？</text>

  <!-- yes -> escalate left -->
  <line x1="280" y1="250" x2="246" y2="250" stroke="#b45309" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="263" y="240" font-size="12" fill="#b45309" text-anchor="middle">是</text>
  <rect x="26" y="222" width="216" height="56" rx="8" fill="#fdf6ec" stroke="#b45309" stroke-width="1.2"/>
  <text x="134" y="246" font-size="12.5" font-weight="600" fill="#18181b" text-anchor="middle">升级人工（判重触发）</text>
  <text x="134" y="266" font-size="12" fill="#3f3f46" text-anchor="middle">escalation 工单进 inbox</text>

  <!-- no -> guardrails -->
  <line x1="400" y1="272" x2="400" y2="290" stroke="#52525b" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text x="418" y="286" font-size="12" fill="#52525b" text-anchor="middle">否</text>
  <rect x="280" y="294" width="240" height="40" rx="8" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.2"/>
  <text x="400" y="319" font-size="13" fill="#18181b" text-anchor="middle">达 5 轮上限 / token 超阈值？</text>

  <!-- yes -> escalate right -->
  <line x1="520" y1="314" x2="556" y2="314" stroke="#b45309" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="538" y="304" font-size="12" fill="#b45309" text-anchor="middle">是</text>
  <rect x="560" y="286" width="220" height="56" rx="8" fill="#fdf6ec" stroke="#b45309" stroke-width="1.2"/>
  <text x="670" y="310" font-size="12.5" font-weight="600" fill="#18181b" text-anchor="middle">升级人工（双护栏触发）</text>
  <text x="670" y="330" font-size="12" fill="#3f3f46" text-anchor="middle">同样生成 escalation 工单</text>

  <!-- no -> feed back to CC -->
  <line x1="400" y1="336" x2="400" y2="354" stroke="#52525b" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text x="418" y="350" font-size="12" fill="#52525b" text-anchor="middle">否</text>
  <rect x="250" y="358" width="300" height="46" rx="8" fill="#f4f4f5"/>
  <text x="400" y="378" font-size="12.5" fill="#18181b" text-anchor="middle">结构化错误列表喂回 CC（glm-5.3）</text>
  <text x="400" y="397" font-size="12" fill="#3f3f46" text-anchor="middle">修复后回到页级门禁重新评估</text>

  <!-- loop back -->
  <path d="M 400 404 L 400 448 L 60 448 L 60 51 L 234 51" fill="none" stroke="#52525b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-gray)"/>
  <text x="80" y="440" font-size="12" fill="#52525b">下一轮</text>

  <!-- bottom note -->
  <rect x="100" y="470" width="600" height="56" rx="8" fill="#fdf6ec" stroke="#b45309" stroke-width="1.2"/>
  <text x="400" y="494" font-size="12.5" fill="#3f3f46" text-anchor="middle">轮次与成本两道闸并列，谁先触发都停；判重是机械字符串比较（码点序排序）</text>
  <text x="400" y="514" font-size="12.5" fill="#3f3f46" text-anchor="middle">修复轮次不落盘，崩溃最多丢一个文件的进度；人工处置后 v2r resume 续跑</text>
</svg>
