<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" role="img" aria-labelledby="title"><title id="title">addColumn 在 col=1 处插入新列：被新列穿过的 colspan 单元格加 span，其余行插入新单元格</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#182230}.t{font-size:14px;font-weight:700}.h{font-size:13px;font-weight:700}.b{font-size:12px;fill:#334155}.n{font-size:12px;fill:#526176}.o{font-size:12px;fill:#0891b2;font-weight:700}.v{font-size:15px;font-weight:700;fill:#182230;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.i{font-size:10px;fill:#94a3b8;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style><rect width="940" height="560" rx="18" fill="#f8fafc"/><text x="40" y="34" class="t">addColumn(tr, rect, col = 1)：被新列穿过的 colspan 单元格加 span，其余位置插入新单元格</text><g><rect x="40" y="56" width="420" height="388" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="62" y="84" class="h">操作前：3 列 × 3 行，D 是 colspan: 2</text><rect x="70" y="104" width="120" height="80" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/><text x="82" y="132" class="v">A</text><text x="82" y="152" class="n">pos 1</text><rect x="194" y="104" width="120" height="80" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/><text x="206" y="132" class="v">B</text><text x="206" y="152" class="n">pos 7</text><rect x="318" y="104" width="120" height="80" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/><text x="330" y="132" class="v">C</text><text x="330" y="152" class="n">pos 13</text><rect x="70" y="188" width="244" height="80" rx="4" fill="#cffafe" stroke="#475569" stroke-width="1.2"/><text x="82" y="216" class="v">D</text><text x="82" y="236" class="n">pos 19</text><text x="82" y="256" class="o">colspan: 2</text><rect x="318" y="188" width="120" height="80" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/><text x="330" y="216" class="v">E</text><text x="330" y="236" class="n">pos 25</text><rect x="70" y="272" width="120" height="80" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/><text x="82" y="300" class="v">F</text><text x="82" y="320" class="n">pos 31</text><rect x="194" y="272" width="120" height="80" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/><text x="206" y="300" class="v">G</text><text x="206" y="320" class="n">pos 37</text><rect x="318" y="272" width="120" height="80" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/><text x="330" y="300" class="v">H</text><text x="330" y="320" class="n">pos 43</text><line x1="191" y1="98" x2="191" y2="358" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/><text x="92" y="392" class="o">在 col = 1 处插入（红色虚线）</text><text x="92" y="414" class="n">新列穿过 D 的跨度范围</text></g><g><rect x="500" y="56" width="400" height="388" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="522" y="84" class="h">操作后：4 列，D 变成 colspan: 3</text><rect x="522" y="104" width="88" height="80" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/><text x="532" y="132" class="v">A</text><rect x="614" y="104" width="88" height="80" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="624" y="132" class="v">新</text><text x="624" y="152" class="n">insert</text><rect x="706" y="104" width="88" height="80" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/><text x="716" y="132" class="v">B</text><rect x="798" y="104" width="88" height="80" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/><text x="808" y="132" class="v">C</text><rect x="522" y="188" width="272" height="80" rx="4" fill="#cffafe" stroke="#475569" stroke-width="1.2"/><text x="534" y="216" class="v">D</text><text x="534" y="236" class="o">colspan: 3</text><text x="534" y="256" class="n">addColSpan</text><rect x="798" y="188" width="88" height="80" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/><text x="808" y="216" class="v">E</text><rect x="522" y="272" width="88" height="80" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/><text x="532" y="300" class="v">F</text><rect x="614" y="272" width="88" height="80" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="624" y="300" class="v">新</text><text x="624" y="320" class="n">insert</text><rect x="706" y="272" width="88" height="80" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/><text x="716" y="300" class="v">G</text><rect x="798" y="272" width="88" height="80" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/><text x="808" y="300" class="v">H</text><text x="522" y="392" class="n">绿色是 insert 的新单元格，</text><text x="522" y="414" class="n">D 只改 attrs，不增节点</text></g><text x="40" y="472" class="o">row 1：map[3] 与 map[4] 同为 D 的起点，新列落在 colspan 内部</text><text x="40" y="494" class="n">→ 分支一：不插新格，setNodeMarkup + addColSpan 把 D 的 colspan 改为 3，colwidth 数组对应位置补 0</text><text x="40" y="520" class="o">row 0 / row 2：map 中相邻两格属于不同单元格</text><text x="40" y="542" class="n">→ 分支二：positionAt(row, col, table) 算出插入点，insert 一个新单元格，插入位置过 tr.mapping.map</text></svg>
