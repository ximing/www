<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="980" height="620" fill="#ffffff"/>

  <!-- 顶部三步：更新到达时 -->
  <g font-size="13" text-anchor="middle">
    <rect x="20" y="24" width="290" height="56" rx="8" fill="#eef4ff" stroke="#4a7ddb" stroke-width="1.5"/>
    <text x="165" y="46" fill="#1f3a6e" font-weight="600">渲染进行中触发更新</text>
    <text x="165" y="64" fill="#5b6b8c" font-size="11">workInProgressRoot 非空，判定为交错更新</text>

    <rect x="345" y="24" width="290" height="56" rx="8" fill="#fff7e6" stroke="#d99a2b" stroke-width="1.5"/>
    <text x="490" y="46" fill="#7a5410" font-weight="600">挂进 queue.interleaved 环形链表</text>
    <text x="490" y="64" fill="#8a6d33" font-size="11">enqueueUpdate / dispatchAction 的分支</text>

    <rect x="670" y="24" width="290" height="56" rx="8" fill="#fff7e6" stroke="#d99a2b" stroke-width="1.5"/>
    <text x="815" y="46" fill="#7a5410" font-weight="600">queue 对象记入模块级数组</text>
    <text x="815" y="64" fill="#8a6d33" font-size="11">pushInterleavedQueue → interleavedQueues</text>

    <line x1="310" y1="52" x2="343" y2="52" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="635" y1="52" x2="668" y2="52" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- 中部：shared queue 的两条链表 -->
  <g font-size="12.5">
    <rect x="20" y="116" width="600" height="252" rx="10" fill="#fafbfd" stroke="#c9d2e0" stroke-width="1.5"/>
    <text x="320" y="142" text-anchor="middle" fill="#37455e" font-size="13" font-weight="700">某个组件的 shared queue（本轮渲染进行中）</text>

    <!-- pending 环形链表 -->
    <text x="60" y="180" fill="#1f3a6e" font-size="12">shared.pending</text>
    <line x1="150" y1="176" x2="188" y2="196" stroke="#4a7ddb" stroke-width="1.5" marker-end="url(#arrow)"/>
    <circle cx="220" cy="210" r="22" fill="#eef4ff" stroke="#4a7ddb" stroke-width="1.5"/>
    <text x="220" y="215" text-anchor="middle" fill="#1f3a6e" font-weight="600">U1</text>
    <circle cx="320" cy="210" r="22" fill="#eef4ff" stroke="#4a7ddb" stroke-width="1.5"/>
    <text x="320" y="215" text-anchor="middle" fill="#1f3a6e" font-weight="600">U2</text>
    <path d="M 242 200 L 296 200" fill="none" stroke="#4a7ddb" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M 296 226 C 270 244, 250 244, 244 228" fill="none" stroke="#4a7ddb" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="270" y="276" text-anchor="middle" fill="#5b6b8c" font-size="11">pending：本轮渲染正在处理的更新</text>

    <!-- interleaved 环形链表 -->
    <text x="380" y="180" fill="#7a5410" font-size="12">shared.interleaved</text>
    <line x1="482" y1="176" x2="488" y2="192" stroke="#d99a2b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <circle cx="470" cy="210" r="22" fill="#fff7e6" stroke="#d99a2b" stroke-width="1.5"/>
    <text x="470" y="215" text-anchor="middle" fill="#7a5410" font-weight="600">U3</text>
    <circle cx="560" cy="210" r="22" fill="#fff7e6" stroke="#d99a2b" stroke-width="1.5"/>
    <text x="560" y="215" text-anchor="middle" fill="#7a5410" font-weight="600">U4</text>
    <path d="M 492 200 L 536 200" fill="none" stroke="#d99a2b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M 536 226 C 515 244, 500 244, 494 228" fill="none" stroke="#d99a2b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="515" y="276" text-anchor="middle" fill="#8a6d33" font-size="11">interleaved：渲染中收到的更新，本轮不处理</text>

    <line x1="368" y1="160" x2="368" y2="290" stroke="#c9d2e0" stroke-width="1" stroke-dasharray="4 4"/>

    <text x="320" y="316" text-anchor="middle" fill="#8a93a6" font-size="11">渲染侧只把 interleaved 的 lane 记为剩余（markSkippedUpdateLanes），不消费链表内容</text>
    <text x="320" y="336" text-anchor="middle" fill="#8a93a6" font-size="11">保证本轮结束后这些 lane 仍留在 pendingLanes 里</text>
  </g>

  <!-- 右：模块级数组 -->
  <g font-size="12.5" text-anchor="middle">
    <rect x="660" y="116" width="300" height="252" rx="10" fill="#fafbfd" stroke="#c9d2e0" stroke-width="1.5"/>
    <text x="810" y="142" fill="#37455e" font-size="13" font-weight="700">模块级 interleavedQueues 数组</text>

    <rect x="690" y="162" width="240" height="40" rx="6" fill="#fff7e6" stroke="#d99a2b" stroke-width="1.5"/>
    <text x="810" y="186" fill="#7a5410">queue（组件 A）</text>
    <rect x="690" y="212" width="240" height="40" rx="6" fill="#fff7e6" stroke="#d99a2b" stroke-width="1.5"/>
    <text x="810" y="236" fill="#7a5410">queue（组件 B）</text>

    <text x="810" y="282" fill="#8a93a6" font-size="11">每个 queue 只入组一次</text>
    <text x="810" y="302" fill="#8a93a6" font-size="11">（interleaved 从 null 变非空时 push）</text>
    <text x="810" y="336" fill="#8a93a6" font-size="11">prepareFreshStack 时统一转移，数组清空</text>
  </g>

  <!-- 底部：转移 -->
  <g font-size="12.5" text-anchor="middle">
    <rect x="20" y="400" width="940" height="64" rx="10" fill="#eaf6ee" stroke="#3f9d63" stroke-width="1.5"/>
    <text x="490" y="426" fill="#1e5233" font-weight="600" font-size="13">下一轮渲染开始：renderRoot 开头 lanes 变化触发 prepareFreshStack</text>
    <text x="490" y="448" fill="#4e7a5e" font-size="11">prepareFreshStack 调 enqueueInterleavedUpdates，把每个 queue 的 interleaved 链表拼到 pending 尾部</text>

    <!-- 拼接后的线性链表 -->
    <circle cx="350" cy="520" r="20" fill="#eef4ff" stroke="#4a7ddb" stroke-width="1.5"/>
    <text x="350" y="525" fill="#1f3a6e" font-weight="600">U1</text>
    <circle cx="430" cy="520" r="20" fill="#eef4ff" stroke="#4a7ddb" stroke-width="1.5"/>
    <text x="430" y="525" fill="#1f3a6e" font-weight="600">U2</text>
    <circle cx="510" cy="520" r="20" fill="#fff7e6" stroke="#d99a2b" stroke-width="1.5"/>
    <text x="510" y="525" fill="#7a5410" font-weight="600">U3</text>
    <circle cx="590" cy="520" r="20" fill="#fff7e6" stroke="#d99a2b" stroke-width="1.5"/>
    <text x="590" y="525" fill="#7a5410" font-weight="600">U4</text>
    <line x1="370" y1="520" x2="408" y2="520" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="450" y1="520" x2="488" y2="520" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="530" y1="520" x2="568" y2="520" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

    <text x="240" y="516" fill="#4e7a5e" font-size="11" text-anchor="end">lastPending.next = firstInterleaved</text>
    <text x="240" y="534" fill="#4e7a5e" font-size="11" text-anchor="end">lastInterleaved.next = firstPending</text>
    <text x="700" y="525" fill="#4e7a5e" font-size="11">拼成一条环，interleaved 置空</text>

    <line x1="490" y1="464" x2="470" y2="498" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <text x="490" y="596" text-anchor="middle" fill="#888" font-size="12">交错更新的入队与转移（master @ 2021-07-15，ReactFiberInterleavedUpdates.new.js）</text>
</svg>
