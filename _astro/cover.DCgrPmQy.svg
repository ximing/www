<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1000" viewBox="0 0 2000 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.35" cy="0.4" r="0.75">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="2000" height="1000" fill="url(#bg)"/>
  <rect width="2000" height="1000" fill="url(#glow)"/>

  <!-- dot grid -->
  <g fill="#ffffff" opacity="0.12">
    <circle cx="140" cy="860" r="3"/><circle cx="215" cy="860" r="3"/><circle cx="290" cy="860" r="3"/><circle cx="365" cy="860" r="3"/><circle cx="440" cy="860" r="3"/><circle cx="515" cy="860" r="3"/><circle cx="590" cy="860" r="3"/><circle cx="665" cy="860" r="3"/>
    <circle cx="140" cy="905" r="3"/><circle cx="215" cy="905" r="3"/><circle cx="290" cy="905" r="3"/><circle cx="365" cy="905" r="3"/><circle cx="440" cy="905" r="3"/><circle cx="515" cy="905" r="3"/><circle cx="590" cy="905" r="3"/><circle cx="665" cy="905" r="3"/>
  </g>

  <!-- left typography block -->
  <text x="136" y="300" fill="#fde047" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="26" letter-spacing="10">REAL CHROME · CDP · MCP</text>
  <text x="128" y="530" fill="#ffffff" font-family="Georgia, 'Songti SC', 'Noto Serif SC', serif" font-size="190" font-weight="700" letter-spacing="12">CSI</text>
  <text x="140" y="620" fill="#e2e8f0" font-family="'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="38" letter-spacing="5">AI × 真实浏览器</text>
  <path d="M 140 690 L 560 690" stroke="#fde047" stroke-width="3" opacity="0.6"/>
  <text x="140" y="752" fill="#fde047" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="24" letter-spacing="3" opacity="0.9">Go daemon + MV3 extension · 17 tools</text>

  <!-- right browser window -->
  <g>
    <rect x="1130" y="200" width="720" height="560" rx="26" fill="#f8fafc"/>
    <rect x="1130" y="200" width="720" height="84" rx="26" fill="#cbd5e1"/>
    <rect x="1130" y="242" width="720" height="42" fill="#cbd5e1"/>
    <circle cx="1192" cy="242" r="15" fill="#f87171"/>
    <circle cx="1248" cy="242" r="15" fill="#fbbf24"/>
    <circle cx="1304" cy="242" r="15" fill="#34d399"/>
    <rect x="1360" y="220" width="380" height="44" rx="22" fill="#f1f5f9"/>
    <!-- page content lines -->
    <g stroke="#94a3b8" stroke-width="16" stroke-linecap="round" opacity="0.8">
      <line x1="1210" y1="380" x2="1550" y2="380"/>
      <line x1="1210" y1="442" x2="1640" y2="442"/>
      <line x1="1210" y1="504" x2="1480" y2="504"/>
    </g>
    <rect x="1210" y="570" width="220" height="76" rx="16" fill="#facc15"/>
  </g>

  <!-- cursor arrow -->
  <path d="M 1620 560 L 1620 750 L 1672 698 L 1704 778 L 1740 764 L 1708 684 L 1780 684 z" fill="#facc15" stroke="#0f172a" stroke-width="8" stroke-linejoin="round"/>

  <!-- magnifier -->
  <g>
    <circle cx="1360" cy="470" r="180" fill="#facc15" opacity="0.10"/>
    <circle cx="1360" cy="470" r="180" fill="none" stroke="#facc15" stroke-width="26"/>
    <line x1="1490" y1="600" x2="1615" y2="725" stroke="#facc15" stroke-width="38" stroke-linecap="round"/>
  </g>
</svg>
