<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 600" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="780" height="600" rx="8" fill="#f8fafc"/>
  <text x="30" y="34" font-size="16" font-weight="600" fill="#1f2937">四件兵器卡在请求链路的什么位置</text>
  <text x="30" y="58" font-size="11.5" fill="#64748b">单跳 99.99% × 4 跳 ≈ 99.96% —— 超时、重试、限流、降级各自消掉一类失败，把成功率一项一项乘回去。</text>

  <!-- 主链路 -->
  <rect x="35" y="140" width="100" height="44" rx="5" fill="#e2e8f0" stroke="#475569" stroke-width="1"/>
  <text x="85" y="166" font-size="11.5" fill="#334155" text-anchor="middle">客户端</text>
  <line x1="135" y1="162" x2="166" y2="162" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="170" y="140" width="120" height="44" rx="5" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="230" y="158" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">入口限流</text>
  <text x="230" y="174" font-size="10.5" fill="#b45309" text-anchor="middle">计数窗口，超阈值即拒</text>
  <line x1="290" y1="162" x2="321" y2="162" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="325" y="140" width="130" height="44" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="390" y="158" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">业务线程池</text>
  <text x="390" y="174" font-size="10.5" fill="#1d4ed8" text-anchor="middle">有界队列 + 拒绝兜底</text>
  <line x1="455" y1="162" x2="486" y2="162" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="490" y="140" width="120" height="44" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="550" y="158" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">调用下游</text>
  <text x="550" y="174" font-size="10.5" fill="#1d4ed8" text-anchor="middle">connect / read 超时</text>
  <line x1="610" y1="162" x2="641" y2="162" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="645" y="140" width="110" height="44" rx="5" fill="#e2e8f0" stroke="#475569" stroke-width="1"/>
  <text x="700" y="158" font-size="11.5" fill="#334155" text-anchor="middle">下游资源</text>
  <text x="700" y="174" font-size="10.5" fill="#475569" text-anchor="middle">DB / tair / 服务</text>

  <!-- 超时标注 -->
  <rect x="505" y="102" width="90" height="22" rx="11" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
  <text x="550" y="117" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">超时</text>
  <line x1="550" y1="124" x2="550" y2="136" stroke="#d97706" stroke-width="1.2" marker-end="url(#arrAmber)"/>

  <!-- 重试回路（顶部弧线） -->
  <path d="M498,138 C488,86 612,86 602,138" fill="none" stroke="#d97706" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrAmber)"/>
  <text x="550" y="82" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">重试：次数上限 + 退避，只对幂等操作</text>

  <!-- 限流拒绝 -->
  <line x1="230" y1="184" x2="230" y2="220" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arrRed)"/>
  <rect x="150" y="224" width="160" height="32" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="230" y="244" font-size="11" fill="#b91c1c" text-anchor="middle">快速失败：返回「系统繁忙」</text>

  <!-- 线程池拒绝 -->
  <line x1="390" y1="184" x2="390" y2="220" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arrRed)"/>
  <rect x="330" y="224" width="150" height="32" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="405" y="244" font-size="11" fill="#b91c1c" text-anchor="middle">AbortPolicy 拒绝即失败</text>

  <!-- 降级路径 -->
  <line x1="560" y1="184" x2="560" y2="296" stroke="#d97706" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrAmber)"/>
  <rect x="400" y="300" width="320" height="40" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="560" y="318" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">降级返回</text>
  <text x="560" y="334" font-size="10.5" fill="#b45309" text-anchor="middle">字段空值 / 缓存旧值 / 关闭非关键功能</text>
  <text x="560" y="362" font-size="10.5" fill="#64748b" text-anchor="middle">开关做成运维动作：可热改、提前演练</text>

  <!-- 底部要点 -->
  <rect x="30" y="386" width="720" height="194" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="50" y="412" font-size="13" font-weight="600" fill="#475569">四件兵器各自消掉哪一类失败</text>
  <text x="50" y="436" font-size="12" fill="#475569">· 超时 → 治「等死」：任何跨进程调用都有 connect/read 上限；Future.get 超时只是等待方先走，socket 超时才是防线；</text>
  <text x="50" y="458" font-size="12" fill="#475569">· 重试 → 治「抖动」：瞬时失败值得一搏；次数上限 + 间隔退避，且只对幂等操作，否则重试就是制造重复；</text>
  <text x="50" y="480" font-size="12" fill="#475569">· 限流 → 治「过载」：入口计数限流 + 线程池有界队列拒绝兜底，两层都要在，阈值按压测拐点打折；</text>
  <text x="50" y="502" font-size="12" fill="#475569">· 降级 → 治「牵连」：非关键路径可关、可旧、可丢；判断标准是「晚一点、乱一点，天不会塌」；</text>
  <text x="50" y="524" font-size="12" fill="#475569">· 每一件都便宜，难的是「所有」——漏掉任何一个点，它就是乘法关系里的那个 0.99。</text>
  <text x="390" y="560" font-size="11" fill="#64748b" text-anchor="middle">超时与重试作用在调用点上，限流作用在入口与资源边界上，降级作用在返回内容上。</text>
</svg>
