<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">长任务代码迁移的受控闭环</title><desc id="desc">源端 Vue 代码经过提取成为行为规格、测试基线和任务图。主循环读取 checkpoint，将工作包交给子任务，通过测试与人工验收更新 checkpoint。未通过时返回修改，跨包验收通过后进入灰度与回退决策。</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#182230}.title{font-size:29px;font-weight:700}.label{font-size:21px;font-weight:700}.sub{font-size:17px;fill:#526176}.small{font-size:16px;fill:#526176}.tag{font-size:14px;font-weight:700;fill:#334155}</style><rect width="1200" height="720" rx="20" fill="#f8fafc"/><text x="48" y="54" class="title">长任务代码迁移的受控闭环</text><rect x="45" y="82" width="1110" height="100" rx="18" fill="#e0f2fe" stroke="#38bdf8" stroke-width="3"/><text x="75" y="124" class="label">输入：源端事实</text><text x="75" y="155" class="sub">Vue 源码 · 路由 · store · 接口 · 权限 · 埋点 · 现有测试</text><path d="M600 183v38" stroke="#64748b" stroke-width="5"/><path d="m588 211 12 20 12-20" fill="none" stroke="#64748b" stroke-width="5"/><rect x="50" y="230" width="330" height="160" rx="18" fill="#ede9fe" stroke="#8b5cf6" stroke-width="3"/><text x="80" y="275" class="label">1. 提取行为规格</text><text x="80" y="307" class="sub">接口 · 状态与逻辑 · 视图</text><text x="80" y="332" class="sub">测试资料 · 源码证据</text><rect x="435" y="230" width="330" height="160" rx="18" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/><text x="465" y="275" class="label">2. 建立验收基线</text><text x="465" y="307" class="sub">特征测试 · Mock · 截图</text><text x="465" y="332" class="sub">按用户链路冻结行为</text><rect x="820" y="230" width="330" height="160" rx="18" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/><text x="850" y="275" class="label">3. 拆分任务图</text><text x="850" y="307" class="sub">工作包 · 状态读写</text><text x="850" y="332" class="sub">依赖关系 · 验收项</text><g fill="none" stroke="#64748b" stroke-width="5"><path d="M380 310h55M765 310h55"/></g><g fill="none" stroke="#64748b" stroke-width="5"><path d="m423 298 20 12-20 12m330-24 20 12-20 12"/></g><path d="M600 391v37" stroke="#64748b" stroke-width="5"/><path d="m588 418 12 20 12-20" fill="none" stroke="#64748b" stroke-width="5"/><rect x="45" y="438" width="1110" height="172" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/><text x="75" y="480" class="label">4. 工作包执行循环</text><rect x="75" y="505" width="185" height="72" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="94" y="534" class="label">读取 checkpoint</text><text x="94" y="559" class="small">事实 · 决策 · 风险</text><rect x="300" y="505" width="185" height="72" rx="14" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/><text x="322" y="534" class="label">子任务执行</text><text x="320" y="559" class="small">检索 · 实现 · 对比</text><rect x="525" y="505" width="185" height="72" rx="14" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/><text x="555" y="534" class="label">自动与人工验收</text><text x="546" y="559" class="small">测试 · 断言 · 截图</text><rect x="750" y="505" width="185" height="72" rx="14" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/><text x="778" y="534" class="label">更新 checkpoint</text><text x="770" y="559" class="small">证据 · 状态 · 下一步</text><rect x="975" y="505" width="140" height="72" rx="14" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/><text x="1010" y="534" class="label">压缩</text><text x="998" y="559" class="small">摘要与上下文</text><g fill="none" stroke="#64748b" stroke-width="4"><path d="M260 541h40M485 541h40M710 541h40M935 541h40"/></g><g fill="none" stroke="#64748b" stroke-width="4"><path d="m288 529 20 12-20 12m213-24 20 12-20 12m213-24 20 12-20 12m213-24 20 12-20 12"/></g><path d="M1045 579v42c0 45-830 45-830 0v-42" fill="none" stroke="#ef4444" stroke-width="4" stroke-dasharray="10 8"/><path d="m203 590 12-24 12 24" fill="none" stroke="#ef4444" stroke-width="4"/><text x="420" y="666" class="label" fill="#b91c1c">验收未通过：携带证据回到当前工作包</text><path d="M600 612v43" stroke="#64748b" stroke-width="5"/><path d="m588 645 12 20 12-20" fill="none" stroke="#64748b" stroke-width="5"/><rect x="790" y="632" width="360" height="64" rx="16" fill="#e0f2fe" stroke="#38bdf8" stroke-width="3"/><text x="828" y="670" class="label">跨包回归通过后：灰度与回退决策</text></svg>
