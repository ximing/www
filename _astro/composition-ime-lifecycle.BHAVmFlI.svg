<svg xmlns="http://www.w3.org/2000/svg" width="940" height="700" viewBox="0 0 940 700" role="img" aria-labelledby="title"><title id="title">一次 IME 组合的生命周期：进场、写入保护、收尾读回与撤销分组</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#182230}.t{font-size:14px;font-weight:700}.h{font-size:13px;font-weight:700}.b{font-size:12px;fill:#334155}.n{font-size:12px;fill:#526176}.o{font-size:11px;fill:#0891b2;font-weight:700}</style><rect width="940" height="700" rx="18" fill="#f8fafc"/><text x="40" y="34" class="t">一次 IME 组合的生命周期：读回方向始终畅通，写入方向绕开组合节点</text><g><rect x="300" y="56" width="340" height="84" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="316" y="78" class="h">compositionstart / compositionupdate 首次</text><text x="316" y="96" class="b">domObserver.flush() 先读回积压，对齐 state 与 DOM</text><text x="316" y="112" class="b">storedMarks 时 markCursor 包光标，重绘后再交权</text><text x="316" y="128" class="n">composing = true，Android 起 5 秒兜底定时器</text></g><line x1="470" y1="140" x2="470" y2="164" stroke="#94a3b8" stroke-width="2"/><path d="M470 164 L465 154 L475 154 Z" fill="#94a3b8"/><g><rect x="300" y="168" width="340" height="76" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="316" y="190" class="h">组合进行中：浏览器直接改写文本节点</text><text x="316" y="208" class="b">读回方向：MutationObserver 照常 flush，拼音实时进 state</text><text x="316" y="224" class="n">读回产生的 transaction 带 composition meta</text></g><line x1="470" y1="244" x2="470" y2="268" stroke="#94a3b8" stroke-width="2"/><path d="M470 268 L465 258 L475 258 Z" fill="#94a3b8"/><g><rect x="300" y="272" width="340" height="92" rx="8" fill="#e0f2fe" stroke="#0891b2" stroke-width="1.5"/><text x="316" y="294" class="h">写入方向的保护：state 到 DOM 的更新</text><text x="316" y="312" class="b">findCompositionNode 定位正在被组合的 Text</text><text x="316" y="328" class="b">protectLocalComposition 包 CompositionViewDesc</text><text x="316" y="344" class="n">renderDescs 重排时组合节点原地保留，输入法不受打扰</text></g><line x1="470" y1="364" x2="470" y2="388" stroke="#94a3b8" stroke-width="2"/><path d="M470 388 L465 378 L475 378 Z" fill="#94a3b8"/><g><rect x="300" y="392" width="340" height="92" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="316" y="414" class="h">compositionend：收尾</text><text x="316" y="432" class="b">记 compositionEndedAt；积压 mutation 记入</text><text x="316" y="448" class="b">compositionPendingChanges，flush 推到 microtask</text><text x="316" y="464" class="n">compositionID++，20ms 后再兜底跑一次 endComposition</text></g><line x1="470" y1="484" x2="470" y2="508" stroke="#94a3b8" stroke-width="2"/><path d="M470 508 L465 498 L475 498 Z" fill="#94a3b8"/><g><rect x="300" y="512" width="340" height="84" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="316" y="534" class="h">readDOMChange 读回与撤销分组</text><text x="316" y="552" class="b">同一次会话的读回带同一个 compositionID</text><text x="316" y="568" class="b">history 按编号分 undo 组：一次上屏是一组</text><text x="316" y="584" class="n">编号变化强制开新组，编号相同并入当前组</text></g><line x1="640" y1="98" x2="716" y2="98" stroke="#94a3b8" stroke-width="2"/><path d="M716 98 L706 93 L706 103 Z" fill="#94a3b8"/><g><rect x="720" y="56" width="180" height="84" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="736" y="80" class="h">组合外的强制收尾</text><text x="736" y="98" class="n">mousedown / touchstart /</text><text x="736" y="114" class="n">contextmenu 先调 endComposition</text><text x="736" y="130" class="n">再处理本次事件</text></g><line x1="300" y1="206" x2="224" y2="206" stroke="#94a3b8" stroke-width="2"/><path d="M224 206 L234 201 L234 211 Z" fill="#94a3b8"/><g><rect x="40" y="168" width="180" height="76" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="56" y="192" class="h">keydown 的 229</text><text x="56" y="210" class="n">IME 占用键盘的虚拟键码</text><text x="56" y="226" class="n">跳过 forceFlush 抢先读回</text></g><line x1="300" y1="438" x2="224" y2="438" stroke="#94a3b8" stroke-width="2"/><path d="M224 438 L234 433 L234 443 Z" fill="#94a3b8"/><g><rect x="40" y="392" width="180" height="92" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="56" y="416" class="h">Safari 两个补丁</text><text x="56" y="434" class="n">500ms 内的确认回车吞一次</text><text x="56" y="450" class="n">表格 TR 乱插节点记</text><text x="56" y="466" class="n">badSafariComposition 再修复</text></g><line x1="640" y1="318" x2="716" y2="318" stroke="#94a3b8" stroke-width="2"/><path d="M716 318 L706 313 L706 323 Z" fill="#94a3b8"/><g><rect x="720" y="272" width="180" height="92" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="736" y="296" class="h">清理路径</text><text x="736" y="314" class="n">clearComposition 弹出</text><text x="736" y="330" class="n">compositionNodes 标脏父链</text><text x="736" y="346" class="n">下次更新按文档重绘该区域</text></g><text x="40" y="560" class="o">Android 的差异</text><text x="40" y="580" class="n">Enter 的 keydown 直接忽略，等组合事件序列落定</text><text x="40" y="596" class="n">5 秒无组合事件强制 endComposition</text><text x="40" y="612" class="n">粘贴照常拦截：移动端几乎永远在组合状态</text><text x="40" y="640" class="o">iOS 的差异</text><text x="40" y="660" class="n">Enter 不 preventDefault，记 lastIOSEnter 时间戳</text><text x="40" y="676" class="n">读回阶段识别到就撤销 DOM 变化，改发 handleKeyDown</text></svg>
