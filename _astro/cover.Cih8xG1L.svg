<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="55%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.7">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="102" height="102" patternUnits="userSpaceOnUse">
      <circle cx="51" cy="51" r="2.5" fill="#ffffff"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>
  <rect width="1200" height="900" fill="url(#dots)" opacity="0.08"/>

  <!-- pageless document panel -->
  <rect x="300" y="96" width="600" height="560" rx="16" fill="#eff6ff"/>
  <!-- text lines -->
  <g stroke="#93c5fd" stroke-width="14" stroke-linecap="round">
    <line x1="348" y1="160" x2="852" y2="160"/>
    <line x1="348" y1="212" x2="800" y2="212"/>
    <line x1="348" y1="264" x2="852" y2="264"/>
    <line x1="348" y1="368" x2="852" y2="368"/>
    <line x1="348" y1="420" x2="776" y2="420"/>
    <line x1="348" y1="472" x2="852" y2="472"/>
    <line x1="348" y1="524" x2="700" y2="524"/>
    <line x1="348" y1="576" x2="824" y2="576"/>
  </g>
  <!-- commented range highlight -->
  <rect x="340" y="296" width="520" height="40" rx="8" fill="#fde68a" opacity="0.9"/>
  <line x1="348" y1="316" x2="700" y2="316" stroke="#1e3a8a" stroke-width="14" stroke-linecap="round"/>
  <!-- comment bubble -->
  <g>
    <rect x="700" y="238" width="196" height="46" rx="12" fill="#1e40af"/>
    <path d="M 724 284 L 714 306 L 744 284 z" fill="#1e40af"/>
    <circle cx="730" cy="261" r="10" fill="#93c5fd"/>
    <line x1="752" y1="261" x2="872" y2="261" stroke="#bfdbfe" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- collab carets -->
  <g>
    <line x1="812" y1="196" x2="812" y2="228" stroke="#f472b6" stroke-width="6" stroke-linecap="round"/>
    <path d="M 812 196 l 22 10 l -22 10 z" fill="#f472b6"/>
    <rect x="838" y="192" width="74" height="26" rx="13" fill="#f472b6"/>
    <text x="875" y="210" fill="#ffffff" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" text-anchor="middle">guest</text>
  </g>
  <g>
    <line x1="716" y1="508" x2="716" y2="540" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
    <path d="M 716 508 l 22 10 l -22 10 z" fill="#34d399"/>
    <rect x="742" y="504" width="60" height="26" rx="13" fill="#34d399"/>
    <text x="772" y="522" fill="#064e3b" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" text-anchor="middle">you</text>
  </g>

  <!-- title -->
  <text x="600" y="772" fill="#ffffff" font-family="Georgia, 'Songti SC', 'Noto Serif SC', serif" font-size="60" font-weight="700" text-anchor="middle" letter-spacing="2">Deditor</text>
  <text x="600" y="830" fill="#bfdbfe" font-family="'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="21" text-anchor="middle" letter-spacing="4">无分页文档编辑器 SDK · OT 协同</text>
</svg>
