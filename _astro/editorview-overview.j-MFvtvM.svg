<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <!-- EditorState -->
  <rect x="30" y="20" width="230" height="90" fill="#e8eef7" stroke="#4a6fa5" stroke-width="2"/>
  <text x="145" y="44" text-anchor="middle" font-size="13" fill="#2c4a73">EditorState</text>
  <text x="145" y="64" text-anchor="middle" font-size="10" fill="#555">doc / selection / plugins</text>
  <text x="145" y="82" text-anchor="middle" font-size="10" fill="#555">storedMarks / scrollToSelection</text>

  <!-- DOM -->
  <rect x="30" y="390" width="230" height="90" fill="#e8f7ee" stroke="#4a8a5f" stroke-width="2"/>
  <text x="145" y="414" text-anchor="middle" font-size="13" fill="#2c5a3c">DOM</text>
  <text x="145" y="434" text-anchor="middle" font-size="10" fill="#555">contenteditable 元素与文档子树</text>
  <text x="145" y="452" text-anchor="middle" font-size="10" fill="#555">DOM 选区 / 浏览器事件</text>

  <!-- EditorView container -->
  <rect x="330" y="20" width="400" height="460" fill="#fafaf5" stroke="#8a7a4a" stroke-width="2"/>
  <text x="530" y="44" text-anchor="middle" font-size="13" fill="#6b5d2e">EditorView</text>

  <!-- docView -->
  <rect x="355" y="60" width="350" height="56" fill="#ffffff" stroke="#8a7a4a"/>
  <text x="530" y="82" text-anchor="middle" font-size="11" fill="#555">docView：ViewDesc 描述树</text>
  <text x="530" y="100" text-anchor="middle" font-size="10" fill="#777">持有并增量更新文档对应的 DOM</text>

  <!-- input + domObserver -->
  <rect x="355" y="132" width="350" height="56" fill="#ffffff" stroke="#8a7a4a"/>
  <text x="530" y="154" text-anchor="middle" font-size="11" fill="#555">input 事件处理器 + DOMObserver</text>
  <text x="530" y="172" text-anchor="middle" font-size="10" fill="#777">把浏览器事件与 DOM 变更读回成 Transaction</text>

  <!-- dispatch -->
  <rect x="355" y="204" width="350" height="70" fill="#ffffff" stroke="#8a7a4a"/>
  <text x="530" y="226" text-anchor="middle" font-size="11" fill="#555">dispatch(tr)</text>
  <text x="530" y="244" text-anchor="middle" font-size="10" fill="#777">默认：updateState(state.apply(tr))</text>
  <text x="530" y="262" text-anchor="middle" font-size="10" fill="#777">或交给 props.dispatchTransaction 处理</text>

  <!-- updateStateInner -->
  <rect x="355" y="290" width="350" height="100" fill="#ffffff" stroke="#8a7a4a"/>
  <text x="530" y="312" text-anchor="middle" font-size="11" fill="#555">updateStateInner(newState)</text>
  <text x="530" y="332" text-anchor="middle" font-size="10" fill="#777">docView.update 增量改 DOM</text>
  <text x="530" y="350" text-anchor="middle" font-size="10" fill="#777">selectionToDOM 同步选区</text>
  <text x="530" y="368" text-anchor="middle" font-size="10" fill="#777">滚动处理（reset / to selection / preserve）</text>

  <!-- pluginViews -->
  <rect x="355" y="406" width="350" height="56" fill="#ffffff" stroke="#8a7a4a"/>
  <text x="530" y="428" text-anchor="middle" font-size="11" fill="#555">pluginViews</text>
  <text x="530" y="446" text-anchor="middle" font-size="10" fill="#777">插件的 spec.view 实例，随 state 更新或重建</text>

  <!-- arrows: state -> docView -->
  <line x1="260" y1="65" x2="352" y2="82" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="305" y="62" text-anchor="middle" font-size="10" fill="#555">①渲染</text>

  <!-- arrows: DOM events -> input -->
  <line x1="260" y1="415" x2="352" y2="170" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="292" y="300" text-anchor="middle" font-size="10" fill="#555">②事件与变更</text>

  <!-- input -> dispatch -->
  <line x1="530" y1="188" x2="530" y2="201" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="545" y="198" font-size="10" fill="#555">③tr</text>

  <!-- dispatch -> back to state (loop, left side) -->
  <path d="M 355 239 L 300 239 L 300 110 L 262 110" fill="none" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="303" y="170" text-anchor="middle" font-size="10" fill="#555">④apply 出新 state</text>

  <!-- state -> updateStateInner -->
  <path d="M 145 110 L 145 340 L 352 340" fill="none" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="148" y="230" font-size="10" fill="#555">⑤updateState</text>

  <!-- updateStateInner -> DOM -->
  <path d="M 530 390 L 530 480 L 262 480" fill="none" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="400" y="494" text-anchor="middle" font-size="10" fill="#555">⑥写回 DOM 与选区</text>
</svg>
