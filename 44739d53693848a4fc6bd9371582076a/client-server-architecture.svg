<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" font-family="system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#78716c"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#a8a29e"/>
    </marker>
  </defs>

  <rect width="960" height="530" rx="16" fill="#fafaf9"/>
  <text x="42" y="48" font-size="20" font-weight="700" fill="#292524">实验性客户端/服务端会话架构</text>
  <text x="42" y="74" font-size="13" fill="#78716c">实线表示新增会话协议；虚线表示迁移期间仍保留的子进程路径</text>

  <rect x="42" y="112" width="190" height="230" rx="12" fill="#f5f5f4"/>
  <text x="62" y="142" font-size="14" font-weight="650" fill="#44403c">调用方</text>
  <rect x="62" y="164" width="150" height="42" rx="8" fill="#e7e5e4"/>
  <text x="137" y="190" font-size="13" text-anchor="middle" fill="#44403c">TUI / Web / IDE</text>
  <rect x="62" y="222" width="150" height="42" rx="8" fill="#e7e5e4"/>
  <text x="137" y="248" font-size="13" text-anchor="middle" fill="#44403c">PiClient / RemoteSession</text>
  <text x="62" y="293" font-size="12" fill="#78716c">connect · attach · prompt</text>
  <text x="62" y="315" font-size="12" fill="#78716c">订阅会话快照</text>

  <rect x="294" y="112" width="184" height="230" rx="12" fill="#f5f5f4"/>
  <text x="314" y="142" font-size="14" font-weight="650" fill="#44403c">协议包</text>
  <rect x="314" y="164" width="144" height="82" rx="8" fill="#ede9fe"/>
  <text x="386" y="190" font-size="13" font-weight="650" text-anchor="middle" fill="#5b21b6">pi-protocol</text>
  <text x="386" y="213" font-size="12" text-anchor="middle" fill="#6d28d9">长度前缀帧 + CBOR</text>
  <text x="386" y="233" font-size="12" text-anchor="middle" fill="#6d28d9">TypeBox 消息校验</text>
  <text x="314" y="293" font-size="12" fill="#78716c">不绑定具体传输</text>
  <text x="314" y="315" font-size="12" fill="#78716c">内建 Unix socket</text>

  <rect x="540" y="112" width="190" height="230" rx="12" fill="#f5f5f4"/>
  <text x="560" y="142" font-size="14" font-weight="650" fill="#44403c">会话服务</text>
  <rect x="560" y="164" width="150" height="82" rx="8" fill="#ffedd5"/>
  <text x="635" y="190" font-size="13" font-weight="650" text-anchor="middle" fill="#9a3412">PiServer</text>
  <text x="635" y="213" font-size="12" text-anchor="middle" fill="#c2410c">认证、attach 与命令分发</text>
  <text x="635" y="233" font-size="12" text-anchor="middle" fill="#c2410c">快照与 progress 事件</text>
  <text x="560" y="293" font-size="12" fill="#78716c">通过 PiSessionBackend 打开会话</text>
  <text x="560" y="315" font-size="12" fill="#a16207">当前仅有测试 backend</text>

  <rect x="792" y="112" width="126" height="230" rx="12" fill="#f5f5f4"/>
  <text x="812" y="142" font-size="14" font-weight="650" fill="#44403c">存储</text>
  <rect x="812" y="164" width="86" height="82" rx="8" fill="#dcfce7"/>
  <text x="855" y="190" font-size="12" font-weight="650" text-anchor="middle" fill="#166534">SessionRepository</text>
  <text x="855" y="213" font-size="11" text-anchor="middle" fill="#15803d">JSONL</text>
  <text x="855" y="233" font-size="11" text-anchor="middle" fill="#15803d">SQLite / FTS5</text>
  <text x="812" y="293" font-size="12" fill="#78716c">持久化会话数据</text>

  <line x1="232" y1="243" x2="292" y2="243" stroke="#78716c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="478" y1="205" x2="538" y2="205" stroke="#78716c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="730" y1="205" x2="790" y2="205" stroke="#78716c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="264" y="230" font-size="11" text-anchor="middle" fill="#78716c">字节流</text>
  <text x="508" y="192" font-size="11" text-anchor="middle" fill="#78716c">请求 / 事件</text>
  <text x="760" y="192" font-size="11" text-anchor="middle" fill="#78716c">open / create</text>

  <rect x="42" y="388" width="876" height="96" rx="12" fill="#f5f5f4"/>
  <text x="62" y="420" font-size="14" font-weight="650" fill="#57534e">仍在保留的旧路径</text>
  <rect x="294" y="402" width="182" height="48" rx="8" fill="#e7e5e4"/>
  <text x="385" y="431" font-size="13" text-anchor="middle" fill="#57534e">legacy supervisor</text>
  <rect x="578" y="402" width="182" height="48" rx="8" fill="#e7e5e4"/>
  <text x="669" y="431" font-size="13" text-anchor="middle" fill="#57534e">pi --mode rpc 子进程</text>
  <line x1="212" y1="426" x2="292" y2="426" stroke="#a8a29e" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-muted)"/>
  <line x1="476" y1="426" x2="576" y2="426" stroke="#a8a29e" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-muted)"/>
  <text x="512" y="415" font-size="11" text-anchor="middle" fill="#78716c">JSONL over stdin/stdout</text>
  <text x="782" y="432" font-size="12" fill="#78716c">未被新服务替代</text>
</svg>
