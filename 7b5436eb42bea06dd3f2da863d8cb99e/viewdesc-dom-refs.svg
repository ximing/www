<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b3543e"/>
    </marker>
  </defs>

  <!-- column headers -->
  <text x="110" y="30" text-anchor="middle" font-size="13" fill="#2c4a73">文档树</text>
  <text x="390" y="30" text-anchor="middle" font-size="13" fill="#2c4a73">ViewDesc 树</text>
  <text x="670" y="30" text-anchor="middle" font-size="13" fill="#2c5a3c">DOM</text>

  <!-- document tree column -->
  <rect x="50" y="55" width="120" height="40" fill="#e8eef7" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="110" y="80" text-anchor="middle" font-size="12" fill="#2c4a73">doc</text>

  <rect x="50" y="150" width="120" height="40" fill="#e8eef7" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="110" y="175" text-anchor="middle" font-size="12" fill="#2c4a73">paragraph</text>

  <text x="110" y="265" text-anchor="middle" font-size="10" fill="#777">mark 不进文档树</text>
  <text x="110" y="281" text-anchor="middle" font-size="10" fill="#777">挂在 inline 节点上</text>

  <rect x="20" y="330" width="180" height="46" fill="#e8eef7" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="110" y="350" text-anchor="middle" font-size="11" fill="#2c4a73">text("hello")</text>
  <text x="110" y="366" text-anchor="middle" font-size="10" fill="#555">marks: [strong]</text>

  <!-- ViewDesc column -->
  <rect x="290" y="55" width="200" height="40" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="390" y="80" text-anchor="middle" font-size="12" fill="#2c4a73">NodeViewDesc(doc)</text>

  <rect x="290" y="150" width="200" height="40" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="390" y="175" text-anchor="middle" font-size="12" fill="#2c4a73">NodeViewDesc(paragraph)</text>

  <rect x="290" y="245" width="200" height="40" fill="#ffffff" stroke="#4a8a5f" stroke-width="1.5"/>
  <text x="390" y="270" text-anchor="middle" font-size="12" fill="#2c5a3c">MarkViewDesc(strong)</text>

  <rect x="290" y="330" width="200" height="46" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="390" y="358" text-anchor="middle" font-size="12" fill="#2c4a73">TextViewDesc</text>

  <!-- DOM column -->
  <rect x="570" y="55" width="200" height="40" fill="#e8f7ee" stroke="#4a8a5f" stroke-width="1.5"/>
  <text x="670" y="80" text-anchor="middle" font-size="12" fill="#2c5a3c">div.ProseMirror</text>

  <rect x="570" y="150" width="200" height="40" fill="#e8f7ee" stroke="#4a8a5f" stroke-width="1.5"/>
  <text x="670" y="175" text-anchor="middle" font-size="12" fill="#2c5a3c">p</text>

  <rect x="570" y="245" width="200" height="40" fill="#e8f7ee" stroke="#4a8a5f" stroke-width="1.5"/>
  <text x="670" y="270" text-anchor="middle" font-size="12" fill="#2c5a3c">strong</text>

  <rect x="570" y="330" width="200" height="46" fill="#e8f7ee" stroke="#4a8a5f" stroke-width="1.5"/>
  <text x="670" y="358" text-anchor="middle" font-size="12" fill="#2c5a3c">#text "hello"</text>

  <!-- tree edges: document column -->
  <line x1="110" y1="95" x2="110" y2="147" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="110" y1="190" x2="110" y2="327" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- tree edges: ViewDesc column -->
  <line x1="390" y1="95" x2="390" y2="147" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="390" y1="190" x2="390" y2="242" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="390" y1="285" x2="390" y2="327" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- tree edges: DOM column -->
  <line x1="670" y1="95" x2="670" y2="147" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="670" y1="190" x2="670" y2="242" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="670" y1="285" x2="670" y2="327" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- reference arrows: ViewDesc -> DOM -->
  <line x1="492" y1="75" x2="567" y2="75" stroke="#b3543e" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrR)"/>
  <text x="530" y="68" text-anchor="middle" font-size="9" fill="#b3543e">dom / contentDOM</text>

  <line x1="492" y1="170" x2="567" y2="170" stroke="#b3543e" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrR)"/>
  <text x="530" y="163" text-anchor="middle" font-size="9" fill="#b3543e">dom / nodeDOM</text>
  <text x="530" y="186" text-anchor="middle" font-size="9" fill="#b3543e">/ contentDOM</text>

  <line x1="492" y1="265" x2="567" y2="265" stroke="#b3543e" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrR)"/>
  <text x="530" y="258" text-anchor="middle" font-size="9" fill="#b3543e">dom / contentDOM</text>

  <line x1="492" y1="353" x2="567" y2="353" stroke="#b3543e" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrR)"/>
  <text x="530" y="346" text-anchor="middle" font-size="9" fill="#b3543e">dom / nodeDOM</text>

  <!-- footnote -->
  <rect x="50" y="405" width="720" height="50" fill="#fafaf5" stroke="#8a7a4a"/>
  <text x="65" y="426" font-size="10" fill="#555">无装饰时 NodeViewDesc 的 dom、nodeDOM、contentDOM 指向同一元素；node 类型装饰（nodeName / attrs）</text>
  <text x="65" y="444" font-size="10" fill="#555">会在 nodeDOM 外包一层包裹元素（pmIsDeco 标记），此时 desc.dom 指向最外层包裹，nodeDOM 不变。</text>
</svg>
