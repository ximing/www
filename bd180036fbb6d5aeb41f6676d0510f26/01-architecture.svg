<svg viewBox="0 0 960 820" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono','Menlo','Monaco','Consolas',monospace" font-size="13">
  <defs>
    <linearGradient id="layer1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a365d"/><stop offset="100%" stop-color="#2a4a7f"/></linearGradient>
    <linearGradient id="layer2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a4731"/><stop offset="100%" stop-color="#236b4a"/></linearGradient>
    <linearGradient id="layer3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3a2a1a"/><stop offset="100%" stop-color="#5c4228"/></linearGradient>
    <linearGradient id="layer4" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2a1a3a"/><stop offset="100%" stop-color="#46285c"/></linearGradient>
    <linearGradient id="layer5" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a2a3a"/><stop offset="100%" stop-color="#28425c"/></linearGradient>
    <linearGradient id="layer6" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3a1a1a"/><stop offset="100%" stop-color="#5c2828"/></linearGradient>
    <linearGradient id="layer7" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a2a2a"/><stop offset="100%" stop-color="#284a4a"/></linearGradient>
    <linearGradient id="layer8" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2a1a2a"/><stop offset="100%" stop-color="#4a284a"/></linearGradient>
    <linearGradient id="gov" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#5a3a00"/><stop offset="50%" stop-color="#7a5000"/><stop offset="100%" stop-color="#5a3a00"/></linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="820" fill="url(#bg)" rx="8"/>

  <!-- Title -->
  <text x="480" y="32" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="bold" font-family="'Segoe UI','SF Pro',sans-serif">Harness Agent 组成要素</text>

  <!-- Layer 1 – Task Specification -->
  <rect x="40" y="50" width="700" height="40" rx="4" fill="url(#layer1)" filter="url(#glow)"/>
  <text x="55" y="75" fill="#58a6ff" font-size="13" font-weight="bold">① 任务规格与完成契约</text>
  <text x="280" y="75" fill="#8b949e" font-size="11">Task Specification &amp; Contract</text>
  <text x="720" y="75" text-anchor="end" fill="#8b949e" font-size="11">数据面</text>
  <text x="55" y="100" fill="#8b949e" font-size="11">Goal / Scope / Constraints / Acceptance Criteria / Definition of Done / 可执行验证器 / 输出 Schema</text>

  <!-- Layer 2 – Execution Environment & Tools -->
  <rect x="40" y="115" width="700" height="40" rx="4" fill="url(#layer2)" filter="url(#glow)"/>
  <text x="55" y="140" fill="#3fb950" font-size="13" font-weight="bold">② 执行环境与工具</text>
  <text x="280" y="140" fill="#8b949e" font-size="11">Execution Environment &amp; Tools</text>
  <text x="55" y="165" fill="#8b949e" font-size="11">Tool Registry / MCP / CLI / Browser / Filesystem / Sandbox / Workspace / Hooks / Middleware / Tool Gateway</text>

  <!-- Layer 3 – Agent Runtime & Orchestration -->
  <rect x="40" y="180" width="700" height="40" rx="4" fill="url(#layer3)" filter="url(#glow)"/>
  <text x="55" y="205" fill="#d29922" font-size="13" font-weight="bold">③ Agent 运行时与编排</text>
  <text x="280" y="205" fill="#8b949e" font-size="11">Runtime &amp; Orchestration</text>
  <text x="55" y="230" fill="#8b949e" font-size="11">Single Agent / Workflow / Multi-Agent / Handoff / Planner / Worker / Validator / Model Routing / Retry / Resume</text>

  <!-- Layer 4 – Context, Knowledge & Skills -->
  <rect x="40" y="245" width="700" height="40" rx="4" fill="url(#layer4)" filter="url(#glow)"/>
  <text x="55" y="270" fill="#a371f7" font-size="13" font-weight="bold">④ 上下文、知识与技能</text>
  <text x="280" y="270" fill="#8b949e" font-size="11">Context, Knowledge &amp; Skills</text>
  <text x="55" y="295" fill="#8b949e" font-size="11">Retrieval / Selection / Compression / Cache / Provenance / AGENTS.md / Skills / Rules / Docs / Dynamic Injection</text>

  <!-- Layer 5 – State, Memory & Artifacts -->
  <rect x="40" y="310" width="700" height="40" rx="4" fill="url(#layer5)" filter="url(#glow)"/>
  <text x="55" y="335" fill="#58a6ff" font-size="13" font-weight="bold">⑤ 状态、记忆与产物</text>
  <text x="280" y="335" fill="#8b949e" font-size="11">State, Memory &amp; Artifacts</text>
  <text x="55" y="360" fill="#8b949e" font-size="11">Task State / Checkpoint / Project Memory / Experience Memory / Diff / Report / Screenshot / Build / Versioning</text>

  <!-- Layer 6 – Observability & Attribution -->
  <rect x="40" y="375" width="700" height="40" rx="4" fill="url(#layer6)" filter="url(#glow)"/>
  <text x="55" y="400" fill="#f85149" font-size="13" font-weight="bold">⑥ 可观测与归因</text>
  <text x="280" y="400" fill="#8b949e" font-size="11">Observability &amp; Attribution</text>
  <text x="55" y="425" fill="#8b949e" font-size="11">Trace / Event Graph / Context Snapshot / Token / Cost / Latency / Failure Attribution</text>

  <!-- Layer 7 – Verification & Quality -->
  <rect x="40" y="440" width="700" height="40" rx="4" fill="url(#layer7)" filter="url(#glow)"/>
  <text x="55" y="465" fill="#56d4dd" font-size="13" font-weight="bold">⑦ 验证与质量闭环</text>
  <text x="280" y="465" fill="#8b949e" font-size="11">Verification &amp; Quality Loop</text>
  <text x="55" y="490" fill="#8b949e" font-size="11">Compile / Test / Lint / Architecture Rules / LLM Judge / Completion Check / Stop Condition</text>

  <!-- Layer 8 – Evaluation & Evolution -->
  <rect x="40" y="505" width="700" height="40" rx="4" fill="url(#layer8)" filter="url(#glow)"/>
  <text x="55" y="530" fill="#bc8cff" font-size="13" font-weight="bold">⑧ 评测与演进控制面</text>
  <text x="280" y="530" fill="#8b949e" font-size="11">Evaluation &amp; Evolution</text>
  <text x="55" y="555" fill="#8b949e" font-size="11">Benchmark / 回归套件 / 领域评分卡 / 多 Trial / 失败聚类 / 归因 / 修改假设 / AHE / 灰度 / 回滚</text>

  <!-- External Dependencies -->
  <rect x="40" y="570" width="700" height="36" rx="4" fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="55" y="593" fill="#484f58" font-size="11">外部依赖：Model / Inference Runtime / Embedding / Reranker</text>

  <!-- Cross-cutting: Governance -->
  <rect x="760" y="50" width="180" height="558" rx="4" fill="url(#gov)" opacity="0.85" filter="url(#glow)"/>
  <text x="850" y="75" text-anchor="middle" fill="#ffa657" font-size="13" font-weight="bold">横切控制面</text>
  <text x="850" y="95" text-anchor="middle" fill="#e6edf3" font-size="12">安全、权限与治理</text>
  <text x="850" y="115" text-anchor="middle" fill="#8b949e" font-size="11">Security &amp; Governance</text>
  <line x1="780" y1="125" x2="920" y2="125" stroke="#7a5000" stroke-width="0.5"/>
  <text x="850" y="145" text-anchor="middle" fill="#8b949e" font-size="11">IAM / Policy</text>
  <text x="850" y="165" text-anchor="middle" fill="#8b949e" font-size="11">Approval / YOLO</text>
  <text x="850" y="185" text-anchor="middle" fill="#8b949e" font-size="11">Classifier</text>
  <text x="850" y="205" text-anchor="middle" fill="#8b949e" font-size="11">Secrets Mgmt</text>
  <text x="850" y="225" text-anchor="middle" fill="#8b949e" font-size="11">Data Boundary</text>
  <text x="850" y="245" text-anchor="middle" fill="#8b949e" font-size="11">Token Budget</text>
  <text x="850" y="265" text-anchor="middle" fill="#8b949e" font-size="11">Audit Log</text>
  <text x="850" y="285" text-anchor="middle" fill="#8b949e" font-size="11">HITL · Rollback</text>

  <!-- Feedback arrows (left side) -->
  <defs>
    <marker id="arrowUp" markerWidth="10" markerHeight="8" refX="5" refY="4" orient="auto"><path d="M0,8 L5,0 L10,8" fill="#fd7e14"/></marker>
  </defs>
  <line x1="28" y1="540" x2="28" y2="60" stroke="#fd7e14" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowUp)"/>
  <text x="12" y="320" fill="#fd7e14" font-size="10" transform="rotate(-90,12,320)" text-anchor="middle">反馈修改（AHE 回路）</text>

  <!-- Legend: Three natures -->
  <rect x="40" y="620" width="700" height="80" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="55" y="642" fill="#e6edf3" font-size="12" font-weight="bold">三种性质的能力</text>

  <rect x="55" y="652" width="12" height="12" rx="2" fill="#58a6ff"/>
  <text x="72" y="663" fill="#8b949e" font-size="11">数据面（①~⑤）：Agent 执行任务的主链路</text>

  <rect x="55" y="670" width="12" height="12" rx="2" fill="#ffa657"/>
  <text x="72" y="681" fill="#8b949e" font-size="11">控制面（⑥ + 治理）：约束和观察所有层</text>

  <rect x="55" y="688" width="12" height="12" rx="2" fill="#bc8cff"/>
  <text x="72" y="699" fill="#8b949e" font-size="11">演进面（⑦⑧）：根据运行结果改进整个 Harness</text>
</svg>