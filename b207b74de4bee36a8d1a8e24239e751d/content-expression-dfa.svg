<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title"><title id="title">content expression 的编译管线与 "paragraph block*" 生成的 DFA</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#182230}.t{font-size:14px;font-weight:700}.h{font-size:13px;font-weight:700}.b{font-size:12px;fill:#334155}.n{font-size:12px;fill:#526176}.o{font-size:11px;fill:#0891b2;font-weight:700}.s{font-size:14px;font-weight:700;fill:#0e7490}</style><rect width="900" height="520" rx="18" fill="#f8fafc"/><text x="40" y="34" class="t">content expression 的编译：从字符串到 ContentMatch 自动机</text><g><rect x="40" y="56" width="185" height="76" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="54" y="80" class="h">表达式字符串</text><text x="54" y="100" class="b">"paragraph block*"</text><text x="54" y="118" class="n">NodeSpec.content</text></g><line x1="225" y1="94" x2="249" y2="94" stroke="#94a3b8" stroke-width="2"/><path d="M249 94 L239 89 L239 99 Z" fill="#94a3b8"/><text x="237" y="82" class="o" text-anchor="middle">parseExpr</text><g><rect x="255" y="56" width="185" height="76" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="269" y="80" class="h">Expr 树</text><text x="269" y="100" class="b">seq(name, star(name))</text><text x="269" y="118" class="n">choice · seq · plus · star · opt · range</text></g><line x1="440" y1="94" x2="464" y2="94" stroke="#94a3b8" stroke-width="2"/><path d="M464 94 L454 89 L454 99 Z" fill="#94a3b8"/><text x="452" y="82" class="o" text-anchor="middle">nfa()</text><g><rect x="470" y="56" width="185" height="76" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="484" y="80" class="h">NFA</text><text x="484" y="100" class="b">Edge[][] 状态数组</text><text x="484" y="118" class="n">边 {term, to}，空边 term 为空</text></g><line x1="655" y1="94" x2="679" y2="94" stroke="#94a3b8" stroke-width="2"/><path d="M679 94 L669 89 L669 99 Z" fill="#94a3b8"/><text x="667" y="82" class="o" text-anchor="middle">dfa()</text><g><rect x="685" y="56" width="175" height="76" rx="8" fill="#e0f2fe" stroke="#0891b2" stroke-width="1.5"/><text x="699" y="80" class="h">DFA</text><text x="699" y="100" class="b">ContentMatch 对象图</text><text x="699" y="118" class="n">validEnd + next 边数组</text></g><text x="40" y="172" class="h">dfa() 的产物："paragraph block*" 的自动机（paragraph 在 block 组里）</text><circle cx="290" cy="300" r="38" fill="#e0f2fe" stroke="#0891b2" stroke-width="1.5"/><text x="290" y="305" class="s" text-anchor="middle">S0</text><circle cx="600" cy="300" r="38" fill="#e0f2fe" stroke="#0891b2" stroke-width="1.5"/><circle cx="600" cy="300" r="45" fill="none" stroke="#0891b2" stroke-width="1.5"/><text x="600" y="305" class="s" text-anchor="middle">S1</text><line x1="328" y1="300" x2="548" y2="300" stroke="#94a3b8" stroke-width="2"/><path d="M548 300 L538 295 L538 305 Z" fill="#94a3b8"/><text x="440" y="286" class="o" text-anchor="middle">paragraph</text><path d="M585 256 C 560 198 640 198 615 256" fill="none" stroke="#94a3b8" stroke-width="2"/><path d="M615 256 L609 244 L622 245 Z" fill="#94a3b8"/><text x="600" y="192" class="o" text-anchor="middle">block 组（组内每个类型各一条边）</text><text x="290" y="366" class="b" text-anchor="middle">validEnd = false</text><text x="290" y="384" class="n" text-anchor="middle">next: [paragraph → S1]</text><text x="600" y="372" class="b" text-anchor="middle">validEnd = true（双圈表示合法结束）</text><text x="600" y="390" class="n" text-anchor="middle">next: [paragraph → S1, heading → S1, …]</text><text x="40" y="440" class="n">ContentMatch 就是 DFA 的一个状态：matchType(t) 沿 {type, next} 边走一步，matchFragment 连续走</text><text x="40" y="462" class="n">dfa() 的 labeled 表按 NFA 状态集去重，相同集合共享同一个 ContentMatch；Schema 构造器再按表达式字符串缓存起始状态</text><text x="40" y="484" class="n">NFA 的边序保留表达式的书写顺序，defaultType 与 fillBefore 按这个顺序优先生成补全节点</text></svg>
